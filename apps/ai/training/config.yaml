# =============================================================================
#  ApexMail AI — Training Configuration
# =============================================================================
#  Config for Qwen3-Next-80B-A3B-Instruct (MoE, 80B total, 3B active params)
#  QLoRA fine-tuning on 8× NVIDIA B200 (183GB each).
#
#  Used by:
#    - eval.py  (golden-set evaluation — model path, quant, eval settings)
#
#  NOTE: train_r15_8gpu.py and train_r15_fsdp_v2.py have their own inline
#        configs. This file is authoritative only for eval.py settings.
# =============================================================================

# ── Model ────────────────────────────────────────────────────────────────────
model:
  base: "/workspace/models/Qwen3-Next-80B-A3B-Instruct"
  revision: "main"
  torch_dtype: "bfloat16"
  attn_implementation: "eager"   # MoE model — eager attention for compatibility
  trust_remote_code: true

# ── LoRA ─────────────────────────────────────────────────────────────────────
lora:
  r: 128
  alpha: 256
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkvz       # MoE gating
    - in_proj_ba          # MoE routing
    - out_proj            # MoE output
    - shared_expert.gate_proj
    - shared_expert.up_proj
    - shared_expert.down_proj

# ── Quantisation (QLoRA) ────────────────────────────────────────────────────
quantisation:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

# ── Training hyper-parameters (reference — actual values in train scripts) ────
# NOTE: train_r15_8gpu.py uses: batch=4, grad_accum=1, 3 epochs, lr=2e-4
#       train_r15_fsdp_v2.py uses: batch=4, grad_accum=2, 5 epochs, lr=1.5e-4
training:
  num_train_epochs: 3                     # train_r15_8gpu.py default
  per_device_train_batch_size: 4          # both scripts
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 1          # 8gpu script; fsdp_v2 uses 2
  learning_rate: 2.0e-4                   # 8gpu script; fsdp_v2 uses 1.5e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03                      # 8gpu script; fsdp_v2 uses 0.05
  weight_decay: 0.01
  max_seq_length: 4096
  packing: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  optim: "paged_adamw_8bit"
  bf16: true
  tf32: true
  logging_steps: 5
  eval_strategy: "no"                     # no eval dataset in current setup
  save_strategy: "no"                     # 8gpu script; fsdp_v2 uses "epoch"
  save_total_limit: 3
  report_to: "none"                       # tensorboard disabled for speed
  seed: 42
  dataloader_num_workers: 8
  dataloader_pin_memory: true

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  data_dir: "/workspace"
  output_dir: "/workspace/output_agent_r15"
  output_dir_v2: "/workspace/output_agent_r15_v2"
  merged_dir: "output-merged"
  gguf_dir: "gguf_model"
  logs_dir: "logs"
  eval_results: "eval_results"

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  train_file: "/workspace/train_agent_r15.jsonl"
  val_file: null                          # no eval split in current setup
  test_file: null
  val_split: 0.0
  test_split: 0.0

# ── Export ────────────────────────────────────────────────────────────────────
# Primary: GGUF for llama.cpp CPU inference (much faster than ONNX for 80B-A3B)
# Fallback: ONNX INT8 for onnxruntime
export:
  format: "gguf"                  # "gguf" or "onnx"
  gguf:
    quantisation: "Q4_K_M"       # excellent quality/speed for CPU (4.87 bpw)
    # Also export Q5_K_M (5.69 bpw) and Q8_0 (8.50 bpw) for comparison
    extra_quants:
      - "Q5_K_M"
      - "Q8_0"
  onnx:
    opset: 17
    optimisation_level: 3
    quantise_to: "int8"
    provider: "CPUExecutionProvider"

# ── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  temperature: 0.1
  top_p: 0.9
  max_new_tokens: 512
  golden_set: "data/golden_qa.jsonl"
  pass_threshold: 0.95            # 95 % A-grade on golden set to ship
