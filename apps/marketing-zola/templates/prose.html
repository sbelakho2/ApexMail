{# Prose page template — for legal/policy pages #}
{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-6 py-24">
  <h1 class="text-4xl font-bold mb-4">{{ page.title }}</h1>
  {% if page.extra.last_updated %}
  <p class="text-surface-500 mb-8">Last updated: {{ page.extra.last_updated }}</p>
  {% endif %}
  <div class="prose prose-neutral max-w-none space-y-6 text-[15px] leading-relaxed">
    {{ page.content | safe }}
  </div>
</div>
{% endblock content %}
