# ──────────────────────────────────────────────────────────────
# ApexMail Marketing Site — Zola Configuration
# ──────────────────────────────────────────────────────────────

base_url = "https://apexmail.ee"
title = "ApexMail - Enterprise Email API for Developers"
description = "Enterprise email API with compliance workflow support, delivery tracking, and developer-first APIs. EU/EEA-oriented deployment configurations and contract-reviewed Enterprise options."
default_language = "en"
# theme = ""  # No external theme; templates are in ./templates/

# ── Build Options ────────────────────────────────────────────

compile_sass = false          # We use Tailwind CLI instead
build_search_index = false    # Marketing site doesn't need search
minify_html = true
generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]

# ── Taxonomy (not used yet but ready) ────────────────────────

taxonomies = []

# ── Markdown Rendering ───────────────────────────────────────

[markdown]
smart_punctuation = true

[markdown.highlighting]
style = "class"
theme = "github-light"
extra_grammars = []
extra_themes = []

# ── Sitemap Configuration ─────────────────────────────────
# Zola generates sitemap.xml automatically at build time.
# To add <lastmod> and <changefreq>, create templates/sitemap.xml.
# See: https://www.getzola.org/documentation/templates/sitemap/
# For now, the default sitemap includes all pages.

# ── Slugify ──────────────────────────────────────────────────

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

# ── Extra Site Variables ─────────────────────────────────────

[extra]
site_name = "ApexMail"
author = "Bel Consulting OÜ"
og_image = "/images/og-image.svg"
twitter_handle = "@apexmail"
twitter_url = "https://twitter.com/apexmail"
linkedin_url = "https://linkedin.com/company/apexmail"
github_url = "https://github.com/Bel-Consulting-OU/ApexMail"
docs_url = "https://apexmail.ee/docs"
app_url = "https://app.apexmail.ee"
api_url = "https://api.apexmail.ee"
status_url = "https://status.apexmail.ee"
# Public status JSON endpoint (served by the main site, not the status vhost).
# Used by the footer status indicator. Kept under [extra] so templates can
# route it through config.extra.* instead of hardcoding (audit 2.4).
status_api_url = "https://apexmail.ee/api/status-data"
pricing_as_of = "2026-07-30"
build_id = "2026-07-29-prod-1"
asset_cdn_base_url = "https://cdn.apexmail.ee"

# ── Analytics (Plausible-compatible) ─────────────────────────
analytics_enabled = false         # Toggle: true in production, false in dev
analytics_host = "analytics.apexmail.ee"
analytics_domain = "apexmail.ee"
analytics_pixel_url = ""          # Legacy pixel URL (kept for backward compat)

support_email = "support@apexmail.ee"
cookie_consent_cookie_name = "apexmail_cookie_consent"
cookie_consent_policy_path = "/cookies/"
cookie_consent_policy_label = "Cookie Policy"

[[extra.cookie_consent_choices]]
value = "necessary"
analytics = false
primary = false

[[extra.cookie_consent_choices]]
value = "dismiss"
analytics = false
primary = false

[[extra.cookie_consent_choices]]
value = "all"
analytics = true
primary = true



# ── Internationalization ──────────────────────────────────────
# i18n .po files are in ./i18n/{lang}.po
# The trans() macro in templates uses these translations.
# Each language section below configures the language metadata.

[languages.fr]
title = "ApexMail - API d'email professionnelle pour développeurs"
description = "API d'email professionnelle avec support de conformité, suivi de livraison et API orientées développeur. Configurations de déploiement orientées UE/EEE et options Enterprise soumises à contrat."

[languages.de]
title = "ApexMail - E-Mail-API für Entwickler"
description = "Enterprise-E-Mail-API mit Compliance-Workflow-Unterstützung, Zustellungsverfolgung und entwicklerfreundlichen APIs. EU/EWR-orientierte Bereitstellungskonfigurationen und vertraglich geprüfte Enterprise-Optionen."

[languages.es]
title = "ApexMail - API de correo electrónico empresarial para desarrolladores"
description = "API de correo electrónico empresarial con soporte de flujos de cumplimiento normativo, seguimiento de entrega y APIs orientadas a desarrolladores. Configuraciones de implementación orientadas a la UE/EEE y opciones Enterprise sujetas a contrato."

