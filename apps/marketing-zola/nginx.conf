# ApexMail marketing container — static Zola site server.
#
# ── Cookie-consent banner state without JavaScript ─────────────────────
# The site is static zola output: every page carries the cookie banner
# and no script may hide it (CSP script-src 'self', and the site ships
# no scripts at all). The only server-visible signal is the Cookie
# header, so the banner's visibility is selected per request:
#
#   1. `map $cookie_apexmail_consent` (below, http context — this file
#      is installed as /etc/nginx/conf.d/default.conf) picks the
#      internal upstream from the presence of the consent cookie that
#      the api-server's /consent endpoint sets with Domain=.apexmail.ee.
#   2. No cookie  -> 127.0.0.1:8081, the raw static file server
#      (banner visible, data-consent-state="pending").
#   3. Cookie set -> 127.0.0.1:8082, which proxies 8081 through
#      sub_filter and flips data-consent-state="pending" to "recorded".
#      A CSS rule in no-js.css (#cookie-consent-banner[data-consent-state="recorded"]
#      { display: none !important; }) collapses the banner.
#
# sub_filter cannot run on plain static files (it only processes proxied
# response bodies), hence the internal self-proxy hop on 8082. gzip is
# disabled on both internal servers so the filter always sees identity
# encoding; the public listener compresses after filtering. Both quote
# styles of the marker are replaced because zola's minify_html emits
# unquoted attribute values (data-consent-state=pending) while
# unminified/dev builds emit quoted ones.
#
# The api-server makes the identical attribute flip when it serves these
# same pages itself (it embeds the zola build output), so the banner
# behaves the same on both serving paths.

map $cookie_apexmail_consent $marketing_upstream {
    default "127.0.0.1:8081";
    ~.+     "127.0.0.1:8082";
}

# ── Public listener ────────────────────────────────────────────────────
server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # ── Content-Security-Policy ────────────────────────────────────────
    # This vhost previously shipped NO CSP at all — an inline-style or
    # injected-markup regression would have gone unblocked here while
    # the static hosts (Netlify/Cloudflare Pages) enforced the policy.
    # The directive list is kept byte-identical to the canonical edge
    # policy in apps/marketing-zola/static/_headers — INCLUDING the
    # form-action exception for https://api.apexmail.ee (the contact
    # forms × 4 locales and the pricing calculator POST cross-origin
    # there; 'self' alone makes every submission dead). When you change
    # one of these three copies, change them all:
    #   1. apps/marketing-zola/static/_headers   (Netlify / CF Pages)
    #   2. apps/marketing-zola/nginx.conf        (this marketing container)
    #   3. deploy/nginx/nginx.conf               (edge marketing vhost)
    # The site ships zero scripts, so script-src stays 'none' — the
    # strongest policy; style-src keeps 'unsafe-inline' because Tera
    # templates emit inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://apexmail.ee; font-src 'self' data:; connect-src 'self' https://api.apexmail.ee https://status.apexmail.ee; frame-src 'none'; form-action 'self' https://api.apexmail.ee; upgrade-insecure-requests" always;
    # ── Branded error pages ────────────────────────────────────────────
    # The Zola build emits a branded 404.html (templates/404.html) and this
    # repo ships a minimal 50x.html (static/50x.html) — without error_page,
    # nginx answers with its stock built-in error bodies instead. The pages
    # are served from the same root as the static assets and are marked
    # `internal` so they only render via the error_page redirect (a direct
    # request to /404.html returns 404 and is then rendered by the error
    # handler, which is the standard nginx pattern). Proxied 404s from the
    # upstreams keep their upstream-generated body (proxy_intercept_errors
    # is off), so the consent-cookie sub_filter state survives on 404s.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/atom+xml application/wasm image/svg+xml font/ttf font/otf;
    # Immutable static assets — served straight from disk, no banner logic.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
        access_log off;
    }
    location = /pgp-key.asc {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Content-Type "text/plain" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files /pgp-key.asc =404;
        access_log off;
    }
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
    # API Console was renamed to API Explorer (2026-08-09): permanent
    # redirects so bookmarked/linked /api-console URLs keep working.
    location = /api-console {
        return 301 /api-explorer/;
    }
    location = /api-console/ {
        return 301 /api-explorer/;
    }
    # Use Cases were consolidated into /solutions/ (2026-09-08 review §18):
    # the old /case-studies/ pages carried stale-generation claims and
    # duplicated the solutions content. Locale variants map to their
    # locale-prefixed solutions pages.
    location = /case-studies {
        return 301 /solutions/;
    }
    location = /case-studies/ {
        return 301 /solutions/;
    }
    location ~ ^/(de|fr|es)/case-studies/?$ {
        return 301 /$1/solutions/;
    }
    location = /cache-reset-20260515 {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Clear-Site-Data '"cache"' always;
        return 204;
    }
    # HTML pages: the banner-state map picks the upstream. proxy_pass with
    # a variable and no URI forwards the original request URI unchanged.
    location / {
        add_header Cache-Control "no-store" always;
        proxy_pass http://$marketing_upstream;
        proxy_set_header Host $host;
    }
}

# ── Internal: raw static file server (banner visible) ─────────────────
server {
    listen 127.0.0.1:8081;
    server_name marketing-static-internal;
    root /usr/share/nginx/html;
    gzip off;
    absolute_redirect off;
    port_in_redirect off;
    # 404s are generated HERE (try_files ... =404 below), so the branded
    # error page must be wired in this server — the public listener never
    # sees them as its own errors (proxy_intercept_errors is off). The
    # error_page redirect re-enters location matching and hits the exact
    # locations below, bypassing try_files.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html {
        internal;
        access_log off;
    }
    location = /50x.html {
        internal;
        access_log off;
    }
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri.html $uri/index.html $uri $uri/ =404;
    }
}

# ── Internal: banner-hidden variant (consent cookie present) ──────────
server {
    listen 127.0.0.1:8082;
    server_name marketing-consent-recorded-internal;
    gzip off;
    absolute_redirect off;
    port_in_redirect off;
    sub_filter_once on;
    sub_filter 'data-consent-state="pending"' 'data-consent-state="recorded"';
    sub_filter 'data-consent-state=pending' 'data-consent-state=recorded';
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
