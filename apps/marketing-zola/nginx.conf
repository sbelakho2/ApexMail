server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/atom+xml application/wasm image/svg+xml font/ttf font/otf;
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
        access_log off;
    }
    location = /pgp-key.asc {
        default_type text/plain;
        add_header Content-Type "text/plain" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files /pgp-key.asc =404;
        access_log off;
    }
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
    # API Console was renamed to API Explorer (2026-08-09): permanent
    # redirects so bookmarked/linked /api-console URLs keep working.
    location = /api-console {
        return 301 /api-explorer/;
    }
    location = /api-console/ {
        return 301 /api-explorer/;
    }
    location = /cache-reset-20260515 {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Clear-Site-Data '"cache"' always;
        return 204;
    }
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location / {
        try_files $uri.html $uri/index.html $uri $uri/ =404;
    }
}
