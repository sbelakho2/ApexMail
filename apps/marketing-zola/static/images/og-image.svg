<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ApexMail — transactional email infrastructure</title>
  <desc id="desc">Near-black card with the ApexMail wordmark in red and neutral zinc, the headline "Email infrastructure built for control.", and three capability chips: 99.9% uptime target, per-message timeline, EU/EEA-oriented.</desc>
  <defs>
    <radialGradient id="glow" cx="12%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Near-black canvas (zinc-950) with the brand red glow, matching the site. -->
  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Wordmark: "Apex" in brand red, "Mail" in foreground zinc. -->
  <text x="80" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.02em">
    <tspan fill="#ef4444">Apex</tspan><tspan fill="#f4f4f5">Mail</tspan>
  </text>

  <!-- Eyebrow in the mono technical voice. -->
  <text x="80" y="196" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="0.18em" fill="#a1a1aa">TRANSACTIONAL EMAIL INFRASTRUCTURE</text>

  <!-- Headline, wrapped to two safe lines (max ~1040px at 64px). -->
  <text x="80" y="322" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-0.03em" fill="#fafafa">Email infrastructure</text>
  <text x="80" y="398" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-0.03em" fill="#fafafa">built for <tspan fill="#ef4444">control.</tspan></text>

  <!-- One supporting line, bounded inside the safe area. -->
  <text x="80" y="452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#a1a1aa">Delivery diagnostics, isolation, and enterprise controls.</text>

  <!-- Capability chips: arch-crowned boxes, text kept inside each box. -->
  <g transform="translate(80 512)">
    <path d="M0 26 A 12 12 0 0 1 12 14 H 308 A 12 12 0 0 1 320 26 V 78 H 0 Z" fill="#18181b" stroke="#3f3f46" />
    <text x="24" y="52" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" font-weight="700" fill="#f4f4f5">99.9% uptime target</text>
  </g>
  <g transform="translate(440 512)">
    <path d="M0 26 A 12 12 0 0 1 12 14 H 308 A 12 12 0 0 1 320 26 V 78 H 0 Z" fill="#18181b" stroke="#3f3f46" />
    <text x="24" y="52" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" font-weight="700" fill="#f4f4f5">Per-message timeline</text>
  </g>
  <g transform="translate(800 512)">
    <path d="M0 26 A 12 12 0 0 1 12 14 H 308 A 12 12 0 0 1 320 26 V 78 H 0 Z" fill="#18181b" stroke="#3f3f46" />
    <text x="24" y="52" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" font-weight="700" fill="#f4f4f5">EU/EEA-oriented</text>
  </g>
</svg>
