  <text x="128" y="266" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">Enterprise Email API</text>
  <text x="128" y="334" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Compliance-first delivery, tracking, and private-cloud readiness.</text>
  <g transform="translate(128 404)">
