<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ApexMail Open Graph Image</title>
  <desc id="desc">ApexMail enterprise email API branding card.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1020" cy="120" r="120" fill="#bfdbfe" opacity="0.65" />
  <circle cx="150" cy="560" r="160" fill="#c7d2fe" opacity="0.55" />
  <rect x="84" y="84" width="1032" height="462" rx="36" fill="url(#panel)" />
  <rect x="128" y="128" width="260" height="44" rx="22" fill="#1d4ed8" opacity="0.95" />
