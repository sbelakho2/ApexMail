[package]
name = "kiwicaptcha-wasm"
version = "0.1.0"
edition = "2021"
description = "KiwiCaptcha WASM solvers (SHA-256 + Argon2id proof-of-work)"
license = "MIT"

[workspace]
members = ["tools/embed"]
[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
argon2 = "0.5"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
