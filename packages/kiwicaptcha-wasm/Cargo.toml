[package]
name = "kiwicaptcha-wasm"
# Family lockstep version (audit SM15 F10): tracks the canonical Rust core
# crate `kiwicaptcha` — see ../VERSIONING.md. Do not version this port
# independently.
version = "1.7.0"
edition = "2021"
description = "KiwiCaptcha WASM solvers (SHA-256 + Argon2id proof-of-work)"
license = "MIT"
repository = "https://github.com/Bel-Consulting-OU/kiwicaptcha"

[workspace]
members = ["tools/embed", "tools/embed-worker"]
[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
argon2 = "0.5"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
