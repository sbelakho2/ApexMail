[package]
name = "kiwicaptcha"
description = "KiwiCaptcha: a privacy-first, self-contained proof-of-work CAPTCHA engine (SHA-256 + Argon2id)"
version = "1.1.0"
edition = "2021"
authors = ["Bel Consulting OÜ <hello@bel.ee>"]
license = "MIT"
repository = "https://github.com/Bel-Consulting-OU/kiwicaptcha"
keywords = ["captcha", "proof-of-work", "sha256", "argon2", "security", "privacy"]
categories = ["web-programming", "cryptography", "authentication"]

[dependencies]
sha2 = "0.10"
argon2 = "0.5"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
