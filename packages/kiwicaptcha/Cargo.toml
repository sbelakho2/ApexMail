[package]
name = "kiwicaptcha"
description = "KiwiCaptcha: a privacy-first, self-contained proof-of-work CAPTCHA engine (SHA-256 + Argon2id)"
version = "1.1.0"
edition = "2021"
authors = ["Bel Consulting OÜ <hello@bel.ee>"]
license = "MIT"
repository = "https://github.com/Bel-Consulting-OU/kiwicaptcha"
keywords = ["captcha", "proof-of-work", "anti-abuse", "security", "privacy"]
categories = ["web-programming", "cryptography", "authentication"]

[features]
default = []
redis = ["dep:redis", "dep:r2d2"]

[dependencies]
sha2 = "0.10"
argon2 = "0.5"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.22"
rand = "0.8"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
redis = { version = "0.27", optional = true }
r2d2 = { version = "0.8", optional = true }

[dev-dependencies]
redis = "0.27"
