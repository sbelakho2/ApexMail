[package]
name = "kiwicaptcha"
description = "KiwiCaptcha — a native Rust, zero-dependency proof-of-work CAPTCHA engine."
version = "0.1.0"
edition = "2021"
authors = ["Bel Consulting OÜ <hello@apexmail.ee>"]
license = "MIT"
repository = "https://github.com/sbelakho2/apexmail"
documentation = "https://github.com/sbelakho2/apexmail/tree/main/packages/kiwicaptcha"
keywords = ["captcha", "proof-of-work", "pbkdf2", "security", "anti-bot"]
categories = ["web-programming", "cryptography", "authentication"]

[dependencies]
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
