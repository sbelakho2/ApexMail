[package]
name = "kiwicaptcha"
description = "KiwiCaptcha: a privacy-first, self-contained proof-of-work CAPTCHA engine (SHA-256 + Argon2id)"
# 1.7.0 aligns the crate version with the repository's release tag
# series (v1.0.0 .. v1.6.31) ahead of the first crates.io publication.
# The previous 1.1.0 field was stale through the whole v1.x tag series;
# the crate has never been published to crates.io (verified — the
# registry reports the name unknown), so no semver continuity is owed:
# 1.7.0 freezes the CURRENT public API (the identity-bearing verify
# signature, the replay-gated VerifyOutcome::Valid fields, the fused
# Redis store) as the pre-publication baseline, with no compatibility
# wrappers for the earlier unpublished shapes.
version = "1.7.0"
edition = "2021"
authors = ["Bel Consulting OÜ <hello@bel.ee>"]
license = "MIT"
repository = "https://github.com/Bel-Consulting-OU/kiwicaptcha"
keywords = ["captcha", "proof-of-work", "anti-abuse", "security", "privacy"]
categories = ["web-programming", "cryptography", "authentication"]

[features]
default = []
redis = ["dep:redis", "dep:r2d2"]
# TEST-ONLY: gates the `execution::fixtures` module (the
# browser-equivalent executed-trace synthesizer the test suites and
# cross-language fixtures use). Never enabled for production builds:
# only the self dev-dependency below turns it on for test targets.
test-fixtures = []

[dependencies]
sha2 = "0.10"
argon2 = "0.5"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.22"
rand = "0.8"
getrandom = "0.2"
hex = "0.4"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
redis = { version = "0.27", optional = true }
r2d2 = { version = "0.8", optional = true }

[dev-dependencies]
# The cyclic self dev-dependency enables the TEST-ONLY `test-fixtures`
# feature for every test target (unit + integration), while production
# and consumer builds stay feature-clean.
kiwicaptcha = { path = ".", features = ["test-fixtures"] }
redis = "0.27"
