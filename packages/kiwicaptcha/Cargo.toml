[package]
name = "kiwicaptcha"
description = "A quantum-safe SHA-256 proof-of-work CAPTCHA engine"
version = "0.1.0"
edition = "2021"
authors = ["KiwiCaptcha Contributors"]
license = "MIT"
repository = "https://github.com/sbelakho2/kiwicaptcha"
keywords = ["captcha", "proof-of-work", "sha256", "security", "anti-bot"]
categories = ["web-programming", "cryptography", "authentication"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
