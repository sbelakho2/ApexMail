[package]
name = "pdf-native"
version = "0.1.0"
edition = "2021"
description = "napi-rs wrapper around Typst PDF compiler for Node.js"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4", "async", "error_anyhow"] }
napi-derive = "2"
typst = "0.12"
typst-pdf = "0.12"
typst-syntax = "0.12"
typst-library = "0.12"
comemo = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
panic = "abort"
strip = true
codegen-units = 1
