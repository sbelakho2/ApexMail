[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apexmail"
version = "1.0.0"
description = "Official Python SDK for ApexMail - Transactional Email API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ApexMail", email = "contact@apexmail.ee" }
]
keywords = [
    "email",
    "transactional",
    "api",
    "apexmail",
    "smtp",
    "mail"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://apexmail.ee"
Documentation = "https://docs.apexmail.ee/sdks/python"
Repository = "https://github.com/apexmail/apexmail-python"
Changelog = "https://github.com/apexmail/apexmail-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/apexmail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
