[package]
name = "validator-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Node.js bindings for ApexMail email validation (RFC 5321/6531, MX checks)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "2", default-features = false, features = ["napi4", "async", "error_anyhow"] }
napi-derive = "2"
anyhow      = "1"
regex       = "1.10"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
trust-dns-resolver = "0.23"
tokio       = { version = "1.44", features = ["full"] }
idna        = "1.0"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
panic       = "abort"
strip       = true
