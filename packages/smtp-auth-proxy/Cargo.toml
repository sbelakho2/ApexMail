[package]
name = "smtp-auth-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "smtp-auth-proxy"

# Intentionally NO [dependencies]: this package is a packaging stub whose
# binary only prints a pointer to the real implementation and exits. The
# production SMTP AUTH proxy lives in the mail-server workspace at
# `services/mail-server/crates/mta` (bin `mta-server`); keeping this stub
# dependency-free decouples packages/ from the services tree.
