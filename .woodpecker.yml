# =============================================================================
# .woodpecker.yml — Woodpecker CI (https://woodpecker-ci.org)
# =============================================================================
# Woodpecker is free, self-hosted and open source (Apache-2.0): it runs on your
# own agent (a container on the deploy host, a spare box, a workstation) and
# needs no GitHub Actions minutes, no hosted runners and no paid plan. Point a
# Woodpecker server at this repository, start one agent, and every push runs
# the pipeline below.
#
# This file is a THIN ADAPTER, not a second implementation of the gates. Each
# step calls `ci/woodpecker/stage.sh <stage>`, which runs the same
# `ci/stages/<stage>.sh` the host pipeline (ci/pipeline.sh) runs — so the
# executor and the deploy host cannot drift, and a gate added to `ci/` is
# picked up here with no YAML change.
#
# HERMETIC EXECUTOR: every step runs in the apexmail-ci image
# (ci/ci-image/Dockerfile) which contains EVERY tool the stages require, at
# the deploy host's versions. CI_MISSING_TOOLS=fail is set on every step so
# `ci_have_tool` fails closed instead of warn-and-skipping security gates on
# a non-deploy-host executor, and the first step asserts the exact toolchain
# (ci/woodpecker/toolchain.sh — it also runs at image build time, so a broken
# image cannot be pushed). Bump the image tag whenever a pinned version
# changes.
#
# Scope: validate → test → security. The host-only stages (fetch/migrate/
# deploy/verify/notify) are deliberately NOT here: they act on the deploy host
# and require its docker/compose and secrets. CI never deploys.
#
# Databases: postgres + redis are provided as Woodpecker `services`, and the
# stages run in `service` mode (CI_TEST_DB=service / CI_TEST_REDIS=service), so
# the DB-gated test suites RUN instead of self-skipping. The canonical
# migration chain is applied to the provided database by the stage itself.
# =============================================================================

when:
  - event: [push, pull_request, manual]

# Full history: the secret scan inspects every commit (clone depth 0).
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apexmail_ci
      POSTGRES_DB: apexmail_ci
  # A second, NEVER-MIGRATED database: the migrator binary's fresh-database
  # regression test (applied_count == 0 before any chain is applied) needs a
  # truly empty database, which the canonical one cannot be. Its soft skip is
  # a release-mode failure (audit CI-2), so the fixture is provided here.
  - name: postgres-fresh
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apexmail_ci
      POSTGRES_DB: apexmail_fresh
  - name: redis
    image: redis:7-alpine
  # The analytics and tracking-service suites are gated on a live ClickHouse
  # (they were `#[ignore]`d before 2026-09-14 and CI never ran them).
  - name: clickhouse
    image: clickhouse/clickhouse-server:24.8-alpine

# OPTIONAL secret for the SHA-bound commit status (external audit item 6 —
# ci/README.md §12). required: false: without the secret the notify-github
# steps SKIP LOUDLY instead of failing, so local/manual/secret-less runs stay
# green. Branch protection on main requires the "woodpecker" status context;
# the token needs only the classic `repo:status` (or fine-grained
# "commit statuses: read & write") permission.
secrets:
  - source: github_token
    target: GITHUB_TOKEN
    required: false

steps:
  # --- first-stage assertion: print and check the exact toolchain ----------
  - name: toolchain
    image: ghcr.io/sbelakho2/apexmail-ci:1
    environment:
      CI_MISSING_TOOLS: fail
    commands:
      - apexmail-ci-toolchain --assert

  # --- static validation gates (env-file/compose sanity, repo gates, migration lint) ---
  - name: validate
    image: ghcr.io/sbelakho2/apexmail-ci:1
    environment:
      CI_MISSING_TOOLS: fail
    commands:
      - ./ci/woodpecker/stage.sh validate

  # --- UI/UX gates over the exported visual fixtures (flash copy, form
  #     hygiene, a11y, dead links, terminology, strings-catalog drift) ---
  # All six gates are REQUIRED by default since the 2026-09-27 baseline went
  # green (see the CI_UI_* block in ci/pipeline.conf); fixtures are exported
  # into the run dir, never the working tree.
  - name: ui
    image: ghcr.io/sbelakho2/apexmail-ci:1
    environment:
      CI_MISSING_TOOLS: fail
      # Release-mode soft-skip contract (audit CI-2): a REQUIRES-INFRASTRUCTURE
      # test whose fixture variable is missing must hard-panic, never degrade
      # into a green no-op. Kept on every stage that can execute tests.
      APEXMAIL_RELEASE_TEST_MODE: "1"
    commands:
      - ./ci/woodpecker/stage.sh ui

  # --- build, lint and test everything (fmt, clippy -D warnings, machete,
  #     deny, cargo test --workspace against the postgres service, coverage
  #     ratchet, PHP/SDK/satellite lanes when their toolchains are present) ---
  - name: test
    image: ghcr.io/sbelakho2/apexmail-ci:1
    environment:
      CI_MISSING_TOOLS: fail
      CI_TEST_DB: service
      CI_TEST_REDIS: service
      # Release-mode soft-skip contract (audit CI-2): with the fixtures below
      # provided, any test still trying to soft-skip on a missing variable is
      # a broken fixture — panic naming the variable instead of passing as a
      # no-op. ci/stages/test.sh additionally fails the stage if a known
      # "skipping:" marker ever reaches the run log.
      APEXMAIL_RELEASE_TEST_MODE: "1"
      TEST_DATABASE_URL: postgresql://postgres:apexmail_ci@postgres:5432/apexmail_ci
      # The DML-only-role release test provisions a role, so it needs a
      # CREATEROLE connection; the postgres service user IS the superuser.
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:apexmail_ci@postgres:5432/apexmail_ci
      TEST_REDIS_URL: redis://redis:6379
      REDIS_TEST_URL: redis://redis:6379
      CLICKHOUSE_TEST_URL: http://clickhouse:8123
      CLICKHOUSE_TEST_USER: default
      # The HA bootstrap/PITR round-trip tests bootstrap their own ha_* tables
      # (idempotent) and seed their own rows, so the provided canonical
      # database is a valid target; wired because their soft skip is now a
      # release-mode failure.
      HA_TEST_DATABASE_URL: postgresql://postgres:apexmail_ci@postgres:5432/apexmail_ci
      # Truly EMPTY database (second postgres service, never migrated) for
      # the migrator fresh-database regression test.
      TEST_FRESH_DATABASE_URL: postgresql://postgres:apexmail_ci@postgres-fresh:5432/apexmail_fresh
    commands:
      # Apply the canonical ClickHouse schema (the same file the compose stack
      # mounts) before the tests that read it.
      - |
        for i in $(seq 1 30); do
          if curl -fsS "http://clickhouse:8123/ping" >/dev/null 2>&1; then break; fi
          sleep 2
        done
      - >
        curl -fsS "http://clickhouse:8123/?multiquery"
        --data-binary @deploy/clickhouse/initdb/001_schema.sql >/dev/null
      - ./ci/woodpecker/stage.sh test

  # --- security + supply chain (gitleaks, cargo audit/vet, semgrep,
  #     fresh-database migration validation, trivy) ---
  - name: security
    image: ghcr.io/sbelakho2/apexmail-ci:1
    environment:
      CI_MISSING_TOOLS: fail
      CI_TEST_DB: service
      CI_TEST_REDIS: service
      # Release-mode soft-skip contract (audit CI-2) — same as the test step.
      APEXMAIL_RELEASE_TEST_MODE: "1"
      TEST_DATABASE_URL: postgresql://postgres:apexmail_ci@postgres:5432/apexmail_ci
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:apexmail_ci@postgres:5432/apexmail_ci
      TEST_REDIS_URL: redis://redis:6379
      REDIS_TEST_URL: redis://redis:6379
      CLICKHOUSE_TEST_URL: http://clickhouse:8123
    commands:
      - ./ci/woodpecker/stage.sh security

  # --- SHA-bound GitHub commit status (external audit item 6) --------------
  # Branch protection on main requires the commit-status context
  # "woodpecker" (exact string — see ci/README.md §12); Woodpecker's own
  # built-in status may be absent or configured under a different name, so
  # the required context is posted EXPLICITLY via tools/post_github_status.sh
  # (curl-only). Two steps so the state is explicit and doesn't depend on
  # executor-internal status variables; `failure: ignore` keeps a GitHub API
  # outage from flipping a green pipeline red (the missing status then blocks
  # the branch VISIBLY instead of lying about a red gate). Without the
  # GITHUB_TOKEN secret (required: false above) the script skips loudly.
  - name: notify-github-success
    image: ghcr.io/sbelakho2/apexmail-ci:1
    failure: ignore
    when:
      - status: [success]
    commands:
      # Stage results + check counts come from the per-stage logs the
      # ci/woodpecker/stage.sh wrapper wrote under ci/runs/ (shared workspace).
      - |
        _p=$(grep -h 'PASS: ' ci/runs/*/stages/*.log 2>/dev/null | wc -l | tr -d ' ')
        _f=$(grep -h 'FAIL:' ci/runs/*/stages/*.log 2>/dev/null | wc -l | tr -d ' ')
        GITHUB_STATUS_STATE=success \
        GITHUB_STATUS_CONTEXT=woodpecker \
        STATUS_TARGET_URL="${CI_PIPELINE_URL:-${CI_PIPELINE_LINK:-}}" \
        STATUS_DESCRIPTION="woodpecker release gates GREEN (${CI_REPO:-repo} ${CI_COMMIT_SHA:-${CI_SHA:-unknown}}): $_p checks passed, $_f failed" \
        tools/post_github_status.sh

  - name: notify-github-failure
    image: ghcr.io/sbelakho2/apexmail-ci:1
    failure: ignore
    when:
      - status: [failure]
    commands:
      - |
        _f=$(grep -h 'FAIL:' ci/runs/*/stages/*.log 2>/dev/null | wc -l | tr -d ' ')
        GITHUB_STATUS_STATE=failure \
        GITHUB_STATUS_CONTEXT=woodpecker \
        STATUS_TARGET_URL="${CI_PIPELINE_URL:-${CI_PIPELINE_LINK:-}}" \
        STATUS_DESCRIPTION="woodpecker release gates RED: $_f failing checks in validate/ui/test/security — open the run log" \
        tools/post_github_status.sh
