worker_processes auto;
worker_rlimit_nofile 4096;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; multi_accept on; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # ── Access-log redaction (audit F65) ──────────────────────────────────
    # Email-verification tokens travel in the request PATH (F5), so the raw
    # `$request` wrote them into access.log in cleartext. Token-bearing
    # routes are normalized to their route shape BEFORE anything is logged
    # (both the browser page `/verify-email/{token}` and the JSON API twin
    # `/v1/auth/verify-email/{token}`, plus the deprecated `?token=`
    # query forms, plus the RFC 8058 unsubscribe links `/sales-api/u/{t}`).
    # The Referer is dropped from the log entirely (it re-leaks the same
    # URLs); request correlation rides the api-server's response header
    # instead (`x-correlation-id`, minted by its request-logger middleware).
    map $request_uri $sanitized_request {
        default                                   "$request";
        ~^/verify-email/[^/?]+                    "$request_method /verify-email/{redacted} $server_protocol";
        ~^/verify-email(\?|$)                     "$request_method /verify-email?token={redacted} $server_protocol";
        ~^/v1/auth/verify-email/[^/?]+            "$request_method /v1/auth/verify-email/{redacted} $server_protocol";
        ~^/v1/auth/verify-email(\?|$)             "$request_method /v1/auth/verify-email?token={redacted} $server_protocol";
        ~^/sales-api/u/[^/?]+                     "$request_method /sales-api/u/{redacted} $server_protocol";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$sanitized_request" $status $body_bytes_sent "$http_user_agent" rt=$request_time cid=$sent_http_x_correlation_id';
    access_log /var/log/nginx/access.log main;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    server_tokens off;
    resolver 127.0.0.11 valid=30s; resolver_timeout 5s;

    # ── Compression (gzip only) ────────────────────────────────────────────
    # nginx:1.27-alpine ships no brotli module (verified: `nginx -V` lists
    # only --with-http_gzip_static_module / --with-http_v2_module among the
    # compression-related builds), so gzip is the whole story. JSON (API
    # responses) and the common text/* types are compressed; anything below
    # 256 bytes is sent raw (compression overhead outweighs the savings).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── TLS hardening (audit F) ────────────────────────────────────────────
    # TLS 1.2 kept for older MTAs/clients; 1.3 preferred. Modern ECDHE-only
    # cipher list for the 1.2 path (1.3 ciphers are built-in and unaffected
    # by ssl_ciphers). Let the CLIENT pick its best cipher (modern guidance,
    # and required for forward-secret 1.3-style negotiation).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling: nginx staples the cert's OCSP response so clients do not
    # need to contact the CA (privacy + one less failure mode). ca-chain.pem
    # is produced by the TLS bootstrap (deploy-hetzner.yml) and refreshed by
    # the certbot deploy-hook.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/ca-chain.pem;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Aligned with the application's own documented body limit (F48): the
    # api-server applies axum DefaultBodyLimit::max(40 MiB)
    # (crates/api-server/src/app.rs), sized for the advertised 25 MiB decoded
    # aggregate attachment contract + ~33% base64 overhead + the JSON
    # envelope. The proxy accepts exactly what the app accepts — no
    # oversized-body 413 surprise from nginx after passing a valid 25 MiB
    # attachment payload through. Per-attachment 10 MiB and aggregate 25 MiB
    # DECODED limits are enforced by the API validation layer
    # (crates/api-server/src/routes/messages.rs); this is the single wire
    # ceiling (mirrored in packages/contract/send-contract.json).
    client_max_body_size 40m;

    # ── Upstream keepalive pool for the API server (audit) ────────────────
    # The app/api/admin vhosts all proxy to api-server. Routing them through
    # an upstream block with a keepalive pool reuses backend connections
    # instead of opening a fresh TCP connection per request (the
    # `Connection: ""` mapping below + proxy_http_version 1.1 make the
    # hop-by-hop header disappear so the pool actually engages).
    upstream apexmail_api {
        server api-server:3000;
        keepalive 32;
    }

    # ── SSE / WebSocket-safe proxying (audit F) ────────────────────────────
    # Upgrade/Connection mapped so Upgrade requests (SSE/WS) are passed to
    # the upstream with `Connection: upgrade`, while plain HTTP/1.1 keepalive
    # requests carry NO Connection header at all (empty string = header
    # omitted) — required for the upstream keepalive pool above.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }
    proxy_http_version 1.1;

    # Shared proxy headers live in the mounted snippet
    # (deploy/nginx/proxy-headers.conf) so every proxied location gets
    # Host/X-Forwarded-*/Upgrade/Connection consistently.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;
    # Admin control plane gets its own, tighter zone (audit F).
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

    # Health check — bound to the container loopback only (audit fix): the
    # compose files never publish 8080 to the host, and the in-container
    # healthcheck (wget http://127.0.0.1:8080/nginx-health) and the certbot
    # sentinel watcher need nothing more. Loopback binding removes the
    # unauthenticated status surface from the frontend/backend container
    # networks.
    server {
        listen 127.0.0.1:8080;
        location /health { return 200; }
        location /nginx-health { return 200; }
    }

    # ═══════════════════════════════════════════════════════════════════
    # HTTP (port 80) — single catch-all server for ALL domains.
    # Serves ACME challenges for cert issuance/renewal, autoconfig XML,
    # and redirects everything else to HTTPS.
    # ═══════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge — certbot writes files here during issuance/renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Thunderbird / Apple Mail autoconfig (well-known path)
        location /.well-known/autoconfig/ {
            root /var/www/certbot;
            default_type text/xml;
        }

        # Thunderbird autoconfig (direct URL)
        location /mail/config-v1.1.xml {
            root /var/www/certbot;
            default_type text/xml;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════════════
    # HTTPS (port 443) — per-domain servers
    # ═══════════════════════════════════════════════════════════════════

    # Unknown Host catch-all (audit: unknown-Host requests used to fall
    # through to the FIRST 443 server — the marketing vhost — and were
    # served marketing content under arbitrary hostnames). 421 Misdirected
    # Request is the RFC 7540 answer for a request aimed at a server that
    # cannot produce a response; it applies both to unknown SNI names and
    # to handshakes whose Host header matches no vhost. The certificate
    # comes from the http-level ssl_certificate directives.
    server {
        listen 443 ssl default_server;
        server_name _;
        return 421;
    }

    # Marketing site
    server {
        listen 443 ssl;
        http2 on;
        server_name apexmail.ee www.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # F15 — CSP aligned byte-for-byte with the marketing origin policy
        # (canonical copy: apps/marketing-zola/static/_headers; the marketing
        # container's nginx.conf mirrors it too — keep all three in
        # lockstep). The site ships ZERO scripts, so script-src is 'none'
        # (the old edge drift to 'self' was strictly weaker); connect-src
        # covers the status widget + API; form-action allows the cross-origin
        # contact-form/pricing-calculator POSTs to the API host.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://apexmail.ee; font-src 'self' data:; connect-src 'self' https://api.apexmail.ee https://status.apexmail.ee; frame-src 'none'; form-action 'self' https://api.apexmail.ee; upgrade-insecure-requests" always;
        # Application CSP for the app/admin/API vhosts is intentionally NOT
        # set here: the api-server owns and emits its own CSP.
        # ── Branded error pages (F15) ────────────────────────────────────────
        # Served from the edge-mounted /var/www/apexmail-error-pages, fully
        # self-contained (no upstream dependency): a down marketing
        # container still gets a branded 50x instead of the default nginx
        # page. proxy_intercept_errors makes backend 404s use the branded
        # page too (the marketing container has no error_page of its own).
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /404.html {
            internal;
            root /var/www/apexmail-error-pages;
        }
        location = /50x.html {
            internal;
            root /var/www/apexmail-error-pages;
        }
        # Live status data consumed by the marketing footer status widget
        # (proxied to the dedicated status backend, auth-server /status/api).
        # ^~ because the trailing-slash regex below WOULD otherwise match
        # /api/status-data (two extensionless segments) and win over a
        # plain prefix location.
        location ^~ /api/status-data {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000/status/api;
            include /etc/nginx/proxy-headers.conf;
        }
        # ── Trailing-slash canonicalisation ───────────────────────────────────
        # Internal links point at the directory form (/privacy/); the bare
        # form (/privacy) used to render the SAME page under a second URL
        # (duplicate content, split analytics — audit "mixed trailing-slash
        # duplicates without 301s"). 301 bare → slash for extensionless
        # paths (single- or multi-segment: /privacy, /docs/api/…). Dotted
        # files (/robots.txt, /sitemap.xml, /favicon.ico), the root, and
        # the /api/status-data prefix above keep their exact form; the
        # query string is preserved ($is_args$args — campaign UTM tags).
        # Regex locations win over the plain `location /` prefix below but
        # never over the exact/prefix matches declared above this block.
        location ~ ^/[a-z0-9-]+(/[a-z0-9-]+)*$ {
            return 301 $uri/$is_args$args;
        }
        location / {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://marketing:8080;
            include /etc/nginx/proxy-headers.conf;
            proxy_intercept_errors on;
        }
    }

    # App Console
    server { # nosemgrep: generic.nginx.security.missing-ssl-version.missing-ssl-version generic.nginx.security.insecure-ssl-version.insecure-ssl-version — protocols are pinned once, modern-only, at http scope; this block inherits them
        listen 443 ssl;
        http2 on;
        server_name app.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/ { limit_req zone=global burst=50 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
    }

    # API server (REST + control-plane UI)
    server { # nosemgrep: generic.nginx.security.missing-ssl-version.missing-ssl-version generic.nginx.security.insecure-ssl-version.insecure-ssl-version — protocols are pinned once, modern-only, at http scope; this block inherits them
        listen 443 ssl;
        http2 on;
        server_name api.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/ { limit_req zone=global burst=50 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        # ── Sales autopilot public surface ─────────────────────────────────
        # ONLY the CAN-SPAM / RFC 8058 unsubscribe endpoint is public: the
        # links embedded in campaign mail point at
        # {SALES_PUBLIC_BASE_URL}/u/{token} with SALES_PUBLIC_BASE_URL =
        # https://api.apexmail.ee/sales-api. Everything else on the service
        # is internal — the control plane calls it server-side over the
        # compose network (sales-autopilot:3010) — so any other /sales-api/
        # path is refused at the proxy and never reaches the backend.
        # NOTE: the /sales-api/ prefix is deliberate; a bare /sales/ prefix
        # would collide with the control-plane "sales" page routes.
        location /sales-api/u/ {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://sales-autopilot:3010/u/;
            include /etc/nginx/proxy-headers.conf;
        }
        location /sales-api/ { return 404; }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
    }

    # Admin CP
    # Audit F — every admin-vhost location additionally enforces the tighter
    # `admin` zone (10 r/s, burst 20) on top of the per-route auth limits.
    server { # nosemgrep: generic.nginx.security.missing-ssl-version.missing-ssl-version generic.nginx.security.insecure-ssl-version.insecure-ssl-version — protocols are pinned once, modern-only, at http scope; this block inherits them
        listen 443 ssl;
        http2 on;
        server_name admin.apexmail.ee control.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition — intentional per-location/per-server header set: nginx add_header never inherits past a location that defines its own (surrounding comments document the choice)
        add_header X-Content-Type-Options "nosniff" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition — intentional per-location/per-server header set: nginx add_header never inherits past a location that defines its own (surrounding comments document the choice)
        add_header X-Frame-Options "DENY" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition — intentional per-location/per-server header set: nginx add_header never inherits past a location that defines its own (surrounding comments document the choice)
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition — intentional per-location/per-server header set: nginx add_header never inherits past a location that defines its own (surrounding comments document the choice)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition — intentional per-location/per-server header set: nginx add_header never inherits past a location that defines its own (surrounding comments document the choice)
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location /v1/ { limit_req zone=admin burst=20 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
        location / { limit_req zone=admin burst=20 nodelay; proxy_pass http://apexmail_api; include /etc/nginx/proxy-headers.conf; }
    }

    # Tracking service (open/click pixels) — app-level rate limiting only,
    # nginx-level global limit would throttle legitimate pixel traffic.
    server {
        listen 443 ssl;
        http2 on;
        server_name track.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location / {
            proxy_pass http://tracking:3001;
            include /etc/nginx/proxy-headers.conf;
        }
    }

    # Enterprise features
    # The enterprise-server crate (crates/enterprise/src/routes.rs) exposes
    # /health, /readiness, /sso/*, /api/enterprise/*, /compliance/*,
    # /log-streams/*, /deployments/*, /ips/*, /sub-accounts/*, /support/*,
    # /templates/*, /whitelabel/*, /qbr/* and /dpa/* — this hostname is
    # dedicated to the enterprise service, so every path proxies to it.
    server {
        listen 443 ssl;
        http2 on;
        server_name enterprise.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # ── SSE: enterprise log streaming (/log-streams/*) ────────────────
        # Server-Sent Events MUST NOT be buffered by the proxy (buffering
        # coalesces events into latency spikes) and the connection has to
        # outlive the default 60s proxy timeouts — dashboards legitimately
        # hold a stream open for an entire session.
        location /log-streams/ {
            proxy_pass http://enterprise:3008;
            include /etc/nginx/proxy-headers.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://enterprise:3008; include /etc/nginx/proxy-headers.conf; }
    }

    # Status page — served by the dedicated status backend (auth-server):
    # /status (HTML page), /status/api (JSON), /status/history (JSON).
    # The marketing footer fetches /api/status-data, mapped to /status/api.
    server { # nosemgrep: generic.nginx.security.missing-ssl-version.missing-ssl-version generic.nginx.security.insecure-ssl-version.insecure-ssl-version — protocols are pinned once, modern-only, at http scope; this block inherits them
        listen 443 ssl;
        http2 on;
        server_name status.apexmail.ee;
        location = / { return 301 /status; }
        location = /status/ { return 301 /status; }
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HARDENING: only the status/health endpoints are proxied to the
        # status backend (exact matches). Everything else — including the
        # former auth/billing/admin surface of this binary — is refused at
        # the proxy with a 404 and never reaches the backend.
        location = /api/status-data {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000/status/api;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /status {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /status/api {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /status/history {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /v1/health {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location / { return 404; }
    }

    # Mail autoconfig over HTTPS (Thunderbird tries HTTPS first)
    server { # nosemgrep: generic.nginx.security.missing-ssl-version.missing-ssl-version generic.nginx.security.insecure-ssl-version.insecure-ssl-version — protocols are pinned once, modern-only, at http scope; this block inherits them
        listen 443 ssl;
        http2 on;
        server_name autoconfig.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location /mail/config-v1.1.xml { root /var/www/certbot; default_type text/xml; }
        location /.well-known/autoconfig/ { root /var/www/certbot; default_type text/xml; }
        location / { return 404; }
    }
}
