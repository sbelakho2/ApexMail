worker_processes auto;
worker_rlimit_nofile 4096;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; multi_accept on; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    server_tokens off;
    resolver 127.0.0.11 valid=30s; resolver_timeout 5s;

    # ── TLS hardening (audit F) ────────────────────────────────────────────
    # TLS 1.2 kept for older MTAs/clients; 1.3 preferred. Modern ECDHE-only
    # cipher list for the 1.2 path (1.3 ciphers are built-in and unaffected
    # by ssl_ciphers). Let the CLIENT pick its best cipher (modern guidance,
    # and required for forward-secret 1.3-style negotiation).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling: nginx staples the cert's OCSP response so clients do not
    # need to contact the CA (privacy + one less failure mode). ca-chain.pem
    # is produced by the TLS bootstrap (deploy-hetzner.yml) and refreshed by
    # the certbot deploy-hook.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/ca-chain.pem;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Aligned with the application's own upload limits.
    client_max_body_size 25m;

    # ── SSE / WebSocket-safe proxying (audit F) ────────────────────────────
    # Upgrade/Connection mapped so plain HTTP/1.1 keepalive requests get
    # "Connection: close" while Upgrade requests (SSE/WS) are passed through.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    proxy_http_version 1.1;

    # Shared proxy headers live in the mounted snippet
    # (deploy/nginx/proxy-headers.conf) so every proxied location gets
    # Host/X-Forwarded-*/Upgrade/Connection consistently.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;
    # Admin control plane gets its own, tighter zone (audit F).
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

    # Health check
    server {
        listen 8080;
        location /health { return 200; }
        location /nginx-health { return 200; }
    }

    # ═══════════════════════════════════════════════════════════════════
    # HTTP (port 80) — single catch-all server for ALL domains.
    # Serves ACME challenges for cert issuance/renewal, autoconfig XML,
    # and redirects everything else to HTTPS.
    # ═══════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge — certbot writes files here during issuance/renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Thunderbird / Apple Mail autoconfig (well-known path)
        location /.well-known/autoconfig/ {
            root /var/www/certbot;
            default_type text/xml;
        }

        # Thunderbird autoconfig (direct URL)
        location /mail/config-v1.1.xml {
            root /var/www/certbot;
            default_type text/xml;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════════════
    # HTTPS (port 443)
    # ═══════════════════════════════════════════════════════════════════

    # Marketing site
    server {
        listen 443 ssl;
        http2 on;
        server_name apexmail.ee www.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Audit F — CSP for the static marketing vhost. script-src 'self'
        # only: the site's inline scripts are being converted to hashed
        # nonces/hashes by the marketing workstream; if any inline script
        # remains AFTER that conversion, append its 'sha256-...' hash to
        # script-src rather than adding 'unsafe-inline'. style-src keeps
        # 'unsafe-inline' until the stylesheets are fully externalized.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        # Live status data consumed by the marketing footer status widget
        # (proxied to the dedicated status backend, auth-server /status/api).
        location /api/status-data {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000/status/api;
            include /etc/nginx/proxy-headers.conf;
        }
        location / {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://marketing:8080;
            include /etc/nginx/proxy-headers.conf;
        }
    }

    # App Console
    server {
        listen 443 ssl;
        http2 on;
        server_name app.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/ { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
    }

    # API server (REST + control-plane UI)
    server {
        listen 443 ssl;
        http2 on;
        server_name api.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/ { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        # ── Sales autopilot public surface ─────────────────────────────────
        # ONLY the CAN-SPAM / RFC 8058 unsubscribe endpoint is public: the
        # links embedded in campaign mail point at
        # {SALES_PUBLIC_BASE_URL}/u/{token} with SALES_PUBLIC_BASE_URL =
        # https://api.apexmail.ee/sales-api. Everything else on the service
        # is internal — the control plane calls it server-side over the
        # compose network (sales-autopilot:3010) — so any other /sales-api/
        # path is refused at the proxy and never reaches the backend.
        # NOTE: the /sales-api/ prefix is deliberate; a bare /sales/ prefix
        # would collide with the control-plane "sales" page routes.
        location /sales-api/u/ {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://sales-autopilot:3010/u/;
            include /etc/nginx/proxy-headers.conf;
        }
        location /sales-api/ { return 404; }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
    }

    # Admin CP
    # Audit F — every admin-vhost location additionally enforces the tighter
    # `admin` zone (10 r/s, burst 20) on top of the per-route auth limits.
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.apexmail.ee control.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; limit_req zone=admin burst=20 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location /v1/ { limit_req zone=admin burst=20 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
        location / { limit_req zone=admin burst=20 nodelay; proxy_pass http://api-server:3000; include /etc/nginx/proxy-headers.conf; }
    }

    # Tracking service (open/click pixels) — app-level rate limiting only,
    # nginx-level global limit would throttle legitimate pixel traffic.
    server {
        listen 443 ssl;
        http2 on;
        server_name track.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        location / {
            proxy_pass http://tracking:3001;
            include /etc/nginx/proxy-headers.conf;
        }
    }

    # Enterprise features
    # The enterprise-server crate (crates/enterprise/src/routes.rs) exposes
    # /health, /readiness, /sso/*, /api/enterprise/*, /compliance/*,
    # /log-streams/*, /deployments/*, /ips/*, /sub-accounts/*, /support/*,
    # /templates/*, /whitelabel/*, /qbr/* and /dpa/* — this hostname is
    # dedicated to the enterprise service, so every path proxies to it.
    server {
        listen 443 ssl;
        http2 on;
        server_name enterprise.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://enterprise:3008; include /etc/nginx/proxy-headers.conf; }
    }

    # Status page — served by the dedicated status backend (auth-server):
    # /status (HTML page), /status/api (JSON), /status/history (JSON).
    # The marketing footer fetches /api/status-data, mapped to /status/api.
    server {
        listen 443 ssl;
        http2 on;
        server_name status.apexmail.ee;
        location = / { return 301 /status; }
        location = /status/ { return 301 /status; }
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HARDENING: only the status/health endpoints are proxied to the
        # status backend (exact matches). Everything else — including the
        # former auth/billing/admin surface of this binary — is refused at
        # the proxy with a 404 and never reaches the backend.
        location = /api/status-data {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000/status/api;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /status {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /status/api {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /status/history {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location = /v1/health {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            include /etc/nginx/proxy-headers.conf;
        }
        location / { return 404; }
    }

    # Mail autoconfig over HTTPS (Thunderbird tries HTTPS first)
    server {
        listen 443 ssl;
        http2 on;
        server_name autoconfig.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        location /mail/config-v1.1.xml { root /var/www/certbot; default_type text/xml; }
        location /.well-known/autoconfig/ { root /var/www/certbot; default_type text/xml; }
        location / { return 404; }
    }
}
