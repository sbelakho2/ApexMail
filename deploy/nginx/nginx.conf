worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; multi_accept on; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    server_tokens off;
    resolver 127.0.0.11 valid=30s; resolver_timeout 5s;
    ssl_session_cache shared:SSL:10m; ssl_session_tickets off;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;

    server { listen 8080;
        location /health { return 200; }
        location /nginx-health { return 200; }
    }

    # Marketing site
    server {
        listen 80;
        server_name apexmail.ee www.apexmail.ee;
        location /.well-known/autoconfig/ { root /var/www/certbot; default_type text/xml; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl http2;
        server_name apexmail.ee www.apexmail.ee;
        location / { proxy_pass http://marketing:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # App Console
    server {
        listen 80; server_name app.apexmail.ee; return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl http2; server_name app.apexmail.ee;
        location /v1/ { proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /api/kcaptcha/ { proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location / { proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # Admin CP
    server {
        listen 80; server_name admin.apexmail.ee control.apexmail.ee; return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl http2; server_name admin.apexmail.ee control.apexmail.ee;
        location /v1/ { proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location / { proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # Status
    server {
        listen 80; server_name status.apexmail.ee; return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl http2; server_name status.apexmail.ee;
        location / { proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # Mail autoconfig HTTP redirect
    server {
        listen 80; server_name autoconfig.apexmail.ee;
        location /mail/config-v1.1.xml { root /var/www/certbot; default_type text/xml; }
        location / { return 404; }
    }
}
