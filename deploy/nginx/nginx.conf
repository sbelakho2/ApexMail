worker_processes auto;
worker_rlimit_nofile 4096;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; multi_accept on; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    server_tokens off;
    resolver 127.0.0.11 valid=30s; resolver_timeout 5s;
    ssl_session_cache shared:SSL:10m; ssl_session_tickets off;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;

    # Health check
    server {
        listen 8080;
        location /health { return 200; }
        location /nginx-health { return 200; }
    }

    # ═══════════════════════════════════════════════════════════════════
    # HTTP (port 80) — single catch-all server for ALL domains.
    # Serves ACME challenges for cert issuance/renewal, autoconfig XML,
    # and redirects everything else to HTTPS.
    # ═══════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge — certbot writes files here during issuance/renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Thunderbird / Apple Mail autoconfig (well-known path)
        location /.well-known/autoconfig/ {
            root /var/www/certbot;
            default_type text/xml;
        }

        # Thunderbird autoconfig (direct URL)
        location /mail/config-v1.1.xml {
            root /var/www/certbot;
            default_type text/xml;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════════════
    # HTTPS (port 443)
    # ═══════════════════════════════════════════════════════════════════

    # Marketing site
    server {
        listen 443 ssl;
        http2 on;
        server_name apexmail.ee www.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Live status data consumed by the marketing footer status widget
        # (proxied to the dedicated status backend, auth-server /status/api).
        location /api/status-data {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000/status/api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://marketing:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # App Console
    server {
        listen 443 ssl;
        http2 on;
        server_name app.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/ { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # API server (REST + control-plane UI)
    server {
        listen 443 ssl;
        http2 on;
        server_name api.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/ { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # Admin CP
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.apexmail.ee control.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location /v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/auth/signup { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/auth/register { limit_req zone=signup burst=5 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /api/kcaptcha/ { limit_req zone=login burst=10 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location /v1/ { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://api-server:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # Tracking service (open/click pixels) — app-level rate limiting only,
    # nginx-level global limit would throttle legitimate pixel traffic.
    server {
        listen 443 ssl;
        http2 on;
        server_name track.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        location / {
            proxy_pass http://tracking:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Enterprise features
    # The enterprise-server crate (crates/enterprise/src/routes.rs) exposes
    # /health, /readiness, /sso/*, /api/enterprise/*, /compliance/*,
    # /log-streams/*, /deployments/*, /ips/*, /sub-accounts/*, /support/*,
    # /templates/*, /whitelabel/*, /qbr/* and /dpa/* — this hostname is
    # dedicated to the enterprise service, so every path proxies to it.
    server {
        listen 443 ssl;
        http2 on;
        server_name enterprise.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location / { limit_req zone=global burst=50 nodelay; proxy_pass http://enterprise:3008; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    }

    # Status page — served by the dedicated status backend (auth-server):
    # /status (HTML page), /status/api (JSON), /status/history (JSON).
    # The marketing footer fetches /api/status-data, mapped to /status/api.
    server {
        listen 443 ssl;
        http2 on;
        server_name status.apexmail.ee;
        location = / { return 301 /status; }
        location = /status/ { return 301 /status; }
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HARDENING: only the status/health endpoints are proxied to the
        # status backend (exact matches). Everything else — including the
        # former auth/billing/admin surface of this binary — is refused at
        # the proxy with a 404 and never reaches the backend.
        location = /api/status-data {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000/status/api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /status {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /status/api {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /status/history {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /v1/health {
            limit_req zone=global burst=50 nodelay;
            proxy_pass http://status-server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 404; }
    }

    # Mail autoconfig over HTTPS (Thunderbird tries HTTPS first)
    server {
        listen 443 ssl;
        http2 on;
        server_name autoconfig.apexmail.ee;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        location /mail/config-v1.1.xml { root /var/www/certbot; default_type text/xml; }
        location /.well-known/autoconfig/ { root /var/www/certbot; default_type text/xml; }
        location / { return 404; }
    }
}
