# ApexMail — canonical nginx configuration
# Maintained in deploy/nginx/apexmail.conf → deployed to /etc/nginx/sites-enabled/apexmail.conf
# Deploy with: make deploy-nginx

# ── Marketing site: apexmail.ee ──
server {
    listen 80;
    server_name apexmail.ee www.apexmail.ee;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name apexmail.ee www.apexmail.ee;

    ssl_certificate     /etc/letsencrypt/live/apexmail.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexmail.ee/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/apexmail.ee;
    index index.html;

    # ── Status API — proxy to auth-server (returns live DB/Redis/SMTP/IMAP checks) ──
    location /api/status-data {
        proxy_pass http://127.0.0.1:3000/status/api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=60" always;
    }

    location /api/status-history {
        proxy_pass http://127.0.0.1:3000/status/history;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        add_header Access-Control-Allow-Origin * always;
    }

    # ── Prometheus metrics (scraped by monitoring stack) ──
    location /metrics {
        proxy_pass http://127.0.0.1:3000/metrics;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 95.216.226.51;
        deny all;
    }

    # ── Security headers ──
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip static assets ──
    gzip_static on;
    gzip_vary on;

    # ── SPA fallback (all unknown paths → index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
    }
}

# ── App: app.apexmail.ee ──
server {
    listen 80;
    server_name app.apexmail.ee;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.apexmail.ee;

    ssl_certificate     /etc/letsencrypt/live/apexmail.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexmail.ee/privkey.pem;

    root /var/www/apexmail.ee;
    index index.html;

    location / {
        try_files $uri $uri/ /login/index.html;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header X-Content-Type-Options      "nosniff" always;
}

# ── Admin: admin.apexmail.ee / control.apexmail.ee ──
server {
    listen 80;
    server_name admin.apexmail.ee control.apexmail.ee;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name admin.apexmail.ee control.apexmail.ee;

    ssl_certificate     /etc/letsencrypt/live/apexmail.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexmail.ee/privkey.pem;

    root /var/www/apexmail.ee/admin;
    index login.html index.html;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-ApexMail-Surface "control-plane";
    }

    location / {
        try_files $uri $uri/ /login.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
