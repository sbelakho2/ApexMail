# ApexMail — shared proxy headers (audit F).
# Included by every proxied location in deploy/nginx/nginx.conf.
# Upgrade/Connection come from the $connection_upgrade map defined in the
# http block: plain requests keep HTTP/1.1 keepalive ("close" hop-by-hop),
# while SSE / WebSocket upgrades are passed to the upstream untouched.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
