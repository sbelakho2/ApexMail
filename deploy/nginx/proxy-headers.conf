# ApexMail — shared proxy headers (audit F).
# Included by every proxied location in deploy/nginx/nginx.conf.
# Upgrade/Connection come from the $connection_upgrade map defined in the
# http block: SSE / WebSocket upgrades are passed to the upstream with
# `Connection: upgrade`, while plain HTTP/1.1 requests carry NO Connection
# header (empty map result = header omitted) so upstream keepalive pools
# (see the `upstream apexmail_api` block) can reuse backend connections.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
