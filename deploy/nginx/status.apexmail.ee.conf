# status.apexmail.ee — proxied to auth-server /status on port 3000
# NOTE: DNS A record for status.apexmail.ee → 95.216.226.51 must be created.
# Currently using self-signed cert (temp). Replace with Let's Encrypt after DNS is configured.

server {
    listen 80;
    server_name status.apexmail.ee;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name status.apexmail.ee;
    ssl_certificate /etc/nginx/ssl/status.apexmail.ee.crt;
    ssl_certificate_key /etc/nginx/ssl/status.apexmail.ee.key;

    # Proxy to auth-server /status endpoint on the api-server (port 3000).
    # The api-server uses ui-foundation which routes /status to the live status page.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host apexmail.ee;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_buffering on;
    }

    # Proxy status JSON API requests to the api-server health endpoint
    location /api/ {
        proxy_pass http://127.0.0.1:3000/v1/;
        proxy_set_header Host api.apexmail.ee;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }
}
