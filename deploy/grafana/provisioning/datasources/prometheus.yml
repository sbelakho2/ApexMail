apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: ClickHouse
    uid: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    # F9 — the ClickHouse container serves PLAIN HTTP on :8123 (see
    # deploy/clickhouse + CLICKHOUSE_URL: http://clickhouse:8123 everywhere
    # else); there is no TLS listener on 8443, so the old https://clickhouse:8443
    # datasource could never connect.
    url: http://clickhouse:8123
    jsonData:
      defaultDatabase: apexmail
      username: apexmail
      protocol: http
      port: 8123
      server: clickhouse
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
    editable: false
  - name: PostgreSQL
    uid: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: apexmail
    user: apexmail
    jsonData:
      # The Postgres containers run ssl=off (no TLS listener) — sslmode
      # 'require' can never handshake (same root cause as F3).
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    editable: false
  - name: Tempo
    uid: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
