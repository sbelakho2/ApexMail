{{/*
Pod Disruption Budgets for HA-critical services.
Supports both minAvailable and maxUnavailable strategies.
*/}}

{{- define "apexmail.pdb.spec" -}}
{{- if hasKey . "maxUnavailable" }}
  maxUnavailable: {{ .maxUnavailable }}
{{- else }}
  minAvailable: {{ .minAvailable }}
{{- end }}
{{- end }}

{{- if and .Values.apiServer.enabled .Values.apiServer.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "apexmail.fullname" . }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apexmail.labels" . | nindent 4 }}
    {{- include "apexmail.selectorLabels" (dict "name" "api-server" "context" .) | nindent 4 }}
spec:
  {{- include "apexmail.pdb.spec" .Values.apiServer.podDisruptionBudget }}
  selector:
    matchLabels:
      {{- include "apexmail.selectorLabels" (dict "name" "api-server" "context" .) | nindent 6 }}
{{- end }}
---
