{{- if .Values.trackingService.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexmail.fullname" . }}-tracking-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apexmail.labels" . | nindent 4 }}
    {{- include "apexmail.selectorLabels" (dict "name" "tracking-service" "context" .) | nindent 4 }}
    app.kubernetes.io/component: tracking-service
spec:
  {{- if not .Values.trackingService.autoscaling.enabled }}
  replicas: {{ .Values.trackingService.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "apexmail.selectorLabels" (dict "name" "tracking-service" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "apexmail.labels" . | nindent 8 }}
        {{- include "apexmail.selectorLabels" (dict "name" "tracking-service" "context" .) | nindent 8 }}
        app.kubernetes.io/component: tracking-service
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "apexmail.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "apexmail.podSecurityContext" . | nindent 6 }}
      {{- include "apexmail.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: tracking-service
          image: {{ include "apexmail.image" (dict "image" .Values.trackingService.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.trackingService.port }}
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: TRACKING_HOST
              value: "0.0.0.0"
            - name: TRACKING_PORT
              value: {{ .Values.trackingService.port | quote }}
            - name: METRICS_PORT
              value: "9092"
            - name: METRICS_ENABLED
              value: "true"
            - name: RUST_LOG
              value: "info"
            - name: TRACKING_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: tracking-secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: database-url
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: redis-password
            {{- if .Values.clickhouse.enabled }}
            - name: CLICKHOUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: clickhouse-url
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: clickhouse-database
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: clickhouse-password
            {{- end }}
            - name: TRACKING_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: tracking-base-url
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: trusted-proxies
            {{- with .Values.trackingService.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.trackingService.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.trackingService.resources | nindent 12 }}
          {{- include "apexmail.containerSecurityContext" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.trackingService.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.trackingService.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.trackingService.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.trackingService.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.trackingService.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.trackingService.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.trackingService.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.trackingService.probes.liveness.failureThreshold }}
          startupProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.trackingService.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.trackingService.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.trackingService.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.trackingService.probes.startup.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          # 🟡7: Added size limit to prevent disk exhaustion
          emptyDir:
            sizeLimit: {{ .Values.trackingService.tmpEmptyDirSizeLimit | default "256Mi" }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "apexmail.selectorLabels" (dict "name" "tracking-service" "context" $) | nindent 14 }}
        {{- end }}
      {{- end }}
{{- end }}
