# =============================================================================
# ApexMail Helm Chart — Default Values
#
# This chart deploys the full ApexMail stack for private/dedicated cloud
# environments.  Override values per cloud provider using:
#   helm install apexmail ./deploy/helm/apexmail -f values-aws.yaml
# =============================================================================

# ── Global settings ──────────────────────────────────────────────────────────

global:
  # Container image registry — set to your own registry before deploying.
  # Example: your-registry.example.com/apexmail
  imageRegistry: "apexmail"
  # Optional global tag for helper/toolbox images; service images can still override per workload.
  imageTag: ""
  # SECURITY: Always pull the latest image in production to ensure security patches
  # are applied. For development, override to IfNotPresent.
  imagePullPolicy: Always
  # Image pull secrets (for private registries)
  imagePullSecrets: []
  # Storage class for persistent volumes (override per cloud provider)
  storageClass: ""

# ── Cache Warming ───────────────────────────────────────────────────────────

cacheWarming:
  enabled: false
  timeout: 30
  dns: true
  rateLimiter: true
  dbQueryCache: true
  scriptPath: /usr/local/bin/cache-warm.sh
  job:
    enabled: false
    ttlSecondsAfterFinished: 3600

# ── Optional Custom Metrics Autoscaling ─────────────────────────────────────

customMetrics:
  enabled: false
  services: []

# ── Namespace ────────────────────────────────────────────────────────────────

namespace: apexmail

# ── API Server ───────────────────────────────────────────────────────────────

apiServer:
  enabled: true
  # PERF-105: 3 replicas for production availability (N+2 redundancy)
  replicaCount: 3
  image:
    repository: api-server
    tag: ""  # defaults to Chart.AppVersion
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  port: 3000
  metricsPort: 9090
  service:
    type: ClusterIP
    port: 3000
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    maxUnavailable: 1
  # 🟡7: Size limit for /tmp emptyDir to prevent disk exhaustion
  tmpEmptyDirSizeLimit: 256Mi
  # 🟢4: Configurable probe timeouts
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 4
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12
  env: {}
  envFrom: []

# ── Tracking Service ─────────────────────────────────────────────────────────

trackingService:
  enabled: true
  replicaCount: 2
  image:
    repository: tracking-service
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  port: 3001
  metricsPort: 9091
  service:
    type: ClusterIP
    port: 3001
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    maxUnavailable: 1
  # 🟡7: Size limit for /tmp emptyDir to prevent disk exhaustion
  tmpEmptyDirSizeLimit: 256Mi
  # 🟢4: Configurable probe timeouts
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 4
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12
  env: {}
  envFrom: []

# ── MTA Service ──────────────────────────────────────────────────────────────

mta:
  enabled: true
  replicaCount: 3
  image:
    repository: mta-service
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ports:
    smtp: 25
    submission: 587
    smtps: 465
    metrics: 9090
  service:
    type: ClusterIP
    annotations: {}
  healthPort: 9090
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    maxUnavailable: 1
  # 🟡7: Size limit for /tmp emptyDir to prevent disk exhaustion
  tmpEmptyDirSizeLimit: 256Mi
  # 🟢4: Configurable probe timeouts
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 4
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12
  env: {}
  envFrom: []

# ── Worker Service ───────────────────────────────────────────────────────────

worker:
  enabled: true
  # PERF-105: 3 replicas for production availability (N+2 redundancy)
  replicaCount: 3
  image:
    repository: worker-service
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  healthPort: 9090
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    maxUnavailable: 1
  # 🟡7: Size limit for /tmp emptyDir to prevent disk exhaustion
  tmpEmptyDirSizeLimit: 256Mi
  # 🟢4: Configurable probe timeouts
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 4
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12
  env: {}
  envFrom: []

# ── Enterprise Service ──────────────────────────────────────────────────────

enterprise:
  enabled: true
  replicaCount: 2
  image:
    repository: enterprise-server
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  port: 3002
  service:
    type: ClusterIP
    port: 3002
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    maxUnavailable: 0
  # 🟡7: Size limit for /tmp emptyDir to prevent disk exhaustion
  tmpEmptyDirSizeLimit: 256Mi
  # 🟢4: Configurable probe timeouts
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 4
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12
  env: {}
  envFrom: []

# ── Ingress ──────────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  hosts:
    - host: api.apexmail.ee
      paths:
        - path: /api/enterprise
          pathType: Prefix
          service: enterprise
        - path: /v1
          pathType: Prefix
          service: api-server
        - path: /t
          pathType: Prefix
          service: tracking-service
        - path: /
          pathType: Prefix
          service: api-server
    - host: track.apexmail.ee
      paths:
        - path: /
          pathType: Prefix
          service: tracking-service
  tls:
    - secretName: apexmail-tls
      hosts:
        - api.apexmail.ee
        - track.apexmail.ee

# ── PostgreSQL (Bitnami subchart) ────────────────────────────────────────────

postgresql:
  enabled: true
  auth:
    database: apexmail
    username: apexmail
    existingSecret: apexmail-db-credentials
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    # OBS-M-03: PostgreSQL slow query logging for performance monitoring
    # Logs all queries exceeding 1 second execution time to aid query optimization
    extendedConfiguration: |-
      log_min_duration_statement = 1000
      log_checkpoints = on
      log_connections = on
      log_disconnections = on
      log_lock_waits = on
      log_temp_files = 0
      log_autovacuum_min_duration = 1000
      # Track query statistics for pg_stat_statements (requires extension)
      shared_preload_libraries = 'pg_stat_statements'
      pg_stat_statements.max = 10000
      pg_stat_statements.track = all
  # For production: use an external managed database (RDS, Cloud SQL, etc.)
  # and set postgresql.enabled=false with externalDatabase settings below.

# ── External Database (when postgresql.enabled=false) ────────────────────────

externalDatabase:
  host: ""
  port: 5432
  database: apexmail
  user: apexmail
  existingSecret: apexmail-db-credentials
  existingSecretPasswordKey: password
  sslMode: require

# Database connection budget:
# Each pod's max_connections * replica_count must not exceed DB's max_connections.
# Example: api-server (20 conn × 10 replicas = 200) + worker (20 × 20 = 400) + MTA (5 × 10 = 50)
# Total: 650 connections. Ensure PostgreSQL max_connections >= 700 with 10% headroom.
# T-205: If total replicas × max_connections exceeds budget, pool creation logs a warning.
db_cluster_connection_budget: "650"

# Public service URLs and cross-origin settings shared with Kustomize manifests.
environment: production
apiBaseUrl: https://api.apexmail.ee
oauthRedirectBaseUrl: https://app.apexmail.ee
corsOrigins: https://app.apexmail.ee,https://admin.apexmail.ee

# ── Redis (Bitnami subchart) ────────────────────────────────────────────────
# Performance: allkeys-lru eviction policy prevents write failures when
# memory is exhausted.  maxmemory of 512mb is sized for moderate workloads;
# adjust based on cache hit ratio monitoring and available cluster RAM.
# In production with dedicated Redis nodes, 2-4GB is typical.

redis:
  enabled: true
  auth:
    existingSecret: apexmail-redis-credentials
  configuration: |-
    maxmemory 512mb
    maxmemory-policy allkeys-lru
  master:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

# ── External Redis (when redis.enabled=false) ───────────────────────────────

externalRedis:
  host: ""
  port: 6379
  existingSecret: apexmail-redis-credentials
  existingSecretPasswordKey: password

# ── ClickHouse (analytics) ──────────────────────────────────────────────────

clickhouse:
  enabled: false
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""

# ── Secrets ──────────────────────────────────────────────────────────────────
# All secrets should be provided via Kubernetes Secret resources.
# This section documents the required secret keys.

secrets:
  # Name of the Kubernetes Secret containing all application secrets
  existingSecret: apexmail-secrets
  # Required keys in the secret:
  #   JWT_PRIVATE_KEY_PEM
  #   JWT_PUBLIC_KEY_PEM
  #   API_KEY_HASH_SECRET
  #   WEBHOOK_SIGNING_SECRET
  #   TRACKING_SECRET_KEY
  #   SESSION_SECRET
  #   CSRF_SECRET
  #   KIWI_ENABLED              — "true" to enforce CAPTCHA on login/signup
  #   KIWI_SECRET_KEY           — Server-side secret for challenge signing/verification
  #   KIWI_ARGON_M_KIB          — Argon2 memory cost in KiB (e.g. "50000")
  #   KIWI_DIFFICULTY_BITS      — PoW difficulty in bits (e.g. "16")
  #   KIWI_CHALLENGE_TTL_SECS   — Challenge time-to-live in seconds (e.g. "120")

# ── HIPAA Compliance ─────────────────────────────────────────────────────────

hipaa:
  enabled: false
  # When true:
  #   - Field-level AES-256-GCM encryption is enabled for PHI columns
  #   - Audit logging retention is set to 7 years (2555 days)
  #   - Access logging is verbose
  #   - TLS 1.2+ is enforced everywhere
  encryption:
    # KEK (Key Encryption Key) must be provided via secret
    kekSecret: apexmail-kek
    kekSecretIdKey: kek_id
    kekSecretKeyKey: kek_material

# ── Monitoring ───────────────────────────────────────────────────────────────

monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s
  grafana:
    enabled: false
    dashboards: true
  tempo:
    enabled: true
    image: grafana/tempo:2.6.1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
  loki:
    enabled: true
    image: grafana/loki:3.0.0
    config:
      auth_enabled: true
      retention_period: 168h  # 7 days
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""

# ── Network Policies ─────────────────────────────────────────────────────────

networkPolicies:
  enabled: true

# ── Pod Security ─────────────────────────────────────────────────────────────

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Service Account ─────────────────────────────────────────────────────────

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Tolerations, Affinity, Node Selectors ────────────────────────────────────

tolerations: []
nodeSelector: {}
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: apexmail
          topologyKey: kubernetes.io/hostname
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/part-of: apexmail

# ── Service Mesh (Linkerd + SPIRE) ────────────────────────────────────────────
# INF-23/INF-24: Service mesh configuration for mTLS and service identity.
# See docs/operations/service-mesh.md for full documentation.

serviceMesh:
  enabled: true
  # Provider: linkerd or istio
  provider: linkerd
  # mTLS mode: strict, permissive, permissive-mutual, disable
  mtls: strict
  spire:
    enabled: true
    trustDomain: apexmail.ee
    server:
      replicaCount: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    agent:
      certificateTTL: 24h
      renewalWindow: 6h
  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  authorization:
    # Default action: deny (whitelist) or allow (blacklist)
    defaultAction: deny
  monitoring:
    metrics: true
    tracing: true
    accessLogs: true
  # Mesh-wide proxy configuration
  proxy:
    # Connection timeouts
    connectTimeout: 5s
    requestTimeout: 30s
    # Circuit breaker defaults
    circuitBreaker:
      maxConnections: 100
      maxPendingRequests: 50
      maxRetries: 3
      maxRequestsPerConnection: 10

# ── Production-Ready Defaults ──────────────────────────────────────────────────
# These values provide recommended production overrides. They are intentionally
# separate from the main values to make them easy to review and adjust.

productionDefaults:
  # Logging
  logging:
    level: info
    format: json
    accessLogs: true
  # Resource quotas per tenant
  tenant:
    maxSendingRate: 100  # emails/second default
    maxDailyVolume: 1000000  # emails/day default
  # Rate limiting
  rateLimiting:
    enabled: true
    default: 100  # requests/second
    burst: 150
  # Retry policy
  retry:
    maxAttempts: 3
    initialBackoff: 5s
    maxBackoff: 60s
  # Graceful shutdown
  lifecycle:
    preStopDelay: 15s  # Wait before SIGTERM for connection draining
    terminationGracePeriod: 60s
  # Pod disruption
  podDisruptionBudget:
    enabled: true
    minAvailable: 1  # Ensures at least 1 pod is always available
  # Priority class
  priorityClassName: apexmail-production
  # Topology spread
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
