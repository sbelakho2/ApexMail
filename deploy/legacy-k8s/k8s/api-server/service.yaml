apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: apexmail
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: api-server
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  type: ClusterIP