apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ingress
  namespace: apexmail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-server
      ports:
        - port: 3002
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 3002
          protocol: TCP