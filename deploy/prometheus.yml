# Prometheus Configuration for ApexMail
# =======================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API Service metrics
  - job_name: 'apexmail-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Worker metrics
  - job_name: 'apexmail-worker'
    static_configs:
      - targets: ['worker:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Tracking service metrics
  - job_name: 'apexmail-tracking'
    static_configs:
      - targets: ['tracking:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL metrics (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis metrics (if using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
