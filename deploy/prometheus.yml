# Prometheus Configuration for ApexMail
# =======================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Load ALL alerting rules
rule_files:
  - 'alerting-rules.yml'
  - 'monitoring/alerts/certificate-expiry.yml'
  - 'monitoring/alerts/disk-space.yml'
  - 'prometheus/alerts/api-alerts.yml'
  - 'prometheus/alerts/infrastructure-alerts.yml'

# All listed service targets expose a Prometheus-compatible `/metrics` route
# on a network shared with the Prometheus container.

scrape_configs:
  # API server metrics
  - job_name: 'apexmail-api'
    static_configs:
      - targets: ['api-server:9090']
    # The API server exposes Prometheus metrics on a dedicated recorder port.
    scrape_interval: 15s

  # Tracking service metrics
  - job_name: 'apexmail-tracking'
    static_configs:
      - targets: ['tracking:9092']
    metrics_path: '/metrics'
    # Tracking request and latency signals are high-churn and back 1m availability alerts.
    scrape_interval: 10s

  # Enterprise metrics
  - job_name: 'apexmail-enterprise'
    static_configs:
      - targets: ['enterprise:3008']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # MTA metrics (SMTP ingress availability and auth/cache counters)
  - job_name: 'apexmail-mta'
    static_configs:
      - targets: ['mta:9090']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Background processor health and operational metrics
  - job_name: 'apexmail-worker'
    static_configs:
      - targets: ['worker:9093']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Observability service: self-monitoring gauges plus the Redis eviction
  # monitor metrics, exposed in Prometheus text format on :4400/metrics.
  - job_name: 'apexmail-observability'
    static_configs:
      - targets: ['observability:4400']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ── Presence probes: sales-autopilot + billing-service ────────────────────
  # Neither service exposes a Prometheus /metrics endpoint today (see the gap
  # note below), so availability is asserted with blackbox presence probes
  # against their unauthenticated GET /health routes instead of `up` scrapes.
  # Public path through nginx (full edge): the unsubscribe route with a bogus
  # token must answer 404 — a 502/503 means sales-autopilot is down.
  - job_name: 'blackbox-sales-unsubscribe'
    metrics_path: /probe
    params:
      module: [http_sales_unsubscribe_404]
    static_configs:
      - targets:
          - https://api.apexmail.ee/sales-api/u/prometheus-probe
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s

  # Internal path (compose network, bypasses nginx): GET /health must be 200.
  - job_name: 'blackbox-sales-internal'
    metrics_path: /probe
    params:
      module: [http_internal_2xx]
    static_configs:
      - targets:
          - http://sales-autopilot:3010/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s

  # billing-service is internal-only (no public vhost): presence via its
  # internal GET /health on apexmail_backend.
  - job_name: 'blackbox-billing-internal'
    metrics_path: /probe
    params:
      module: [http_internal_2xx]
    static_configs:
      - targets:
          - http://billing-service:4100/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s

  # ── METRICS ENDPOINT GAP NOTE (do not invent scrape jobs) ─────────────────
  # The following services currently expose NO Prometheus /metrics endpoint
  # and are therefore only covered by the presence probes above (sales,
  # billing) or by their compose healthchecks (status-server, marketing):
  #   - sales-autopilot (:3010) — emits metrics::counter! calls but never
  #     installs a Prometheus exporter; add metrics-exporter-prometheus
  #     (workspace dep already exists) + a dedicated port, then add a job.
  #   - billing-service (:4100) — depends on metrics-exporter-prometheus but
  #     never installs the exporter; same treatment.
  #   - status-server / auth-server (:3000) — no metrics instrumentation.
  #   - marketing (nginx-alpine) — no stub_status location in its nginx.conf;
  #     enable one on a dedicated internal port before scraping.

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    # Database exporter metrics change more slowly and use multi-minute alert windows.
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    # Redis pressure and queue depth are operationally important enough to keep at the default cadence.
    scrape_interval: 15s

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse-exporter:9116']
    # ClickHouse exporter metrics are lower-churn infrastructure signals.
    scrape_interval: 30s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    # Host-level resource metrics use longer windows, so 30s keeps noise and scrape cost down.
    scrape_interval: 30s

  - job_name: 'blackbox-https'
    metrics_path: /probe
    params:
      module: [https_tls]
    # External reachability and TLS checks stay on the global 15s interval.
    static_configs:
      - targets:
          - https://api.apexmail.ee/health/live
          - https://track.apexmail.ee/
          - https://app.apexmail.ee/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Blackbox HTTP API probes for critical user journeys ──
  # Probes key API endpoints to verify functional correctness beyond simple health checks.
  # FIX (audit): the old `blackbox-http-email-send` job POSTed an
  # UNAUTHENTICATED request to /v1/email/send and expected 2xx — permanently
  # failing by construction (the route rejects unauthenticated sends with
  # 401; no credentials plumbing exists for a canary). It is retargeted to
  # the harmless /health endpoint (200 unauthenticated) and folded into this
  # job; the real email-send journey stays covered by the authenticated
  # E2E/synthetic suites, not by a blackbox POST.
  - job_name: 'blackbox-http-api-health'
    metrics_path: /probe
    params:
      module: [http_api_health]
    static_configs:
      - targets:
          - https://api.apexmail.ee/health/ready
          - https://api.apexmail.ee/health/live
          - https://api.apexmail.ee/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s

  - job_name: 'blackbox-http-login'
    metrics_path: /probe
    params:
      module: [http_login]
    static_configs:
      - targets:
          - https://api.apexmail.ee/v1/auth/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 60s

  # NOTE: the `blackbox-http-email-send` job that used to live here was
  # removed — see the comment on blackbox-http-api-health above (unauthed
  # POST + 2xx expectation could never succeed).

  - job_name: 'blackbox-smtp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - smtp.apexmail.ee:25
          - smtp.apexmail.ee:587
          - smtp.apexmail.ee:465
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-dns'
    metrics_path: /probe
    params:
      module: [dns_apexmail_mx]
    static_configs:
      - targets:
          - apexmail.ee
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-dns-txt'
    metrics_path: /probe
    params:
      module: [dns_apexmail_txt]
    static_configs:
      - targets:
          - apexmail.ee
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'synthetic-transactions'
    static_configs:
      - targets: ['synthetic-monitor:9128']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # NOTE (audit): the old `clickhouse-query` job was removed. It scraped the
  # same clickhouse-exporter target as the `clickhouse` job above with a
  # metric_relabel keep filter for `clickhouse_query_(duration_seconds|...)_
  # (sum|count|bucket)` — series the in-house exporter never emits (it
  # exposes flattened gauges only), so the filter dropped EVERY metric and
  # the job was a duplicate, zero-series scrape.

alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ['alertmanager']
          type: A
          port: 9093
