# Prometheus Configuration for ApexMail
# =======================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# FIX-072: Load alerting rules
rule_files:
  - 'alerting-rules.yml'

# Local Docker Compose only runs tracking plus the exporter stack.
# Production-style service discovery for API/worker lives in deployment
# targets that actually provision those services.

scrape_configs:
  # API server metrics
  - job_name: 'apexmail-api'
    static_configs:
      - targets: ['api-server:9090']
    # The API server exposes Prometheus metrics on a dedicated recorder port.
    scrape_interval: 15s

  # Tracking service metrics
  - job_name: 'apexmail-tracking'
    static_configs:
      - targets: ['tracking:9092']
    metrics_path: '/metrics'
    # Tracking request and latency signals are high-churn and back 1m availability alerts.
    scrape_interval: 10s

  # Enterprise metrics
  - job_name: 'apexmail-enterprise'
    static_configs:
      - targets: ['enterprise:3002']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'apexmail-internal-services'
    file_sd_configs:
      - files:
          - targets.d/apexmail-internal.yml
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    # Database exporter metrics change more slowly and use multi-minute alert windows.
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    # Redis pressure and queue depth are operationally important enough to keep at the default cadence.
    scrape_interval: 15s

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse-exporter:9116']
    # ClickHouse exporter metrics are lower-churn infrastructure signals.
    scrape_interval: 30s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    # Host-level resource metrics use longer windows, so 30s keeps noise and scrape cost down.
    scrape_interval: 30s

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [https_tls]
    # External reachability and TLS checks stay on the global 15s interval.
    static_configs:
      - targets:
          - https://api.apexmail.ee/health
          - https://track.apexmail.ee/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-smtp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - smtp.apexmail.ee:25
          - smtp.apexmail.ee:587
          - smtp.apexmail.ee:465
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-dns'
    metrics_path: /probe
    params:
      module: [dns_apexmail_mx]
    static_configs:
      - targets:
          - apexmail.ee
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'synthetic-transactions'
    static_configs:
      - targets: ['synthetic-monitor:9128']
    metrics_path: '/metrics'
    scrape_interval: 30s

alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ['alertmanager']
          type: A
          port: 9093
