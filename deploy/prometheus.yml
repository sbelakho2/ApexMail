# Prometheus Configuration for ApexMail
# =======================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# FIX-072: Load alerting rules
rule_files:
  - 'alerting-rules.yml'

# FIX-073: In production with multiple replicas, replace static_configs
# with DNS-based service discovery (docker_sd_configs, dns_sd_configs,
# or kubernetes_sd_configs) so Prometheus auto-discovers new instances.
# Example for Docker Swarm / Compose DNS:
#   dns_sd_configs:
#     - names: ['tasks.api']
#       type: A
#       port: 3000

scrape_configs:
  # API Service metrics
  # - job_name: 'apexmail-api'
  #   static_configs:
  #     - targets: ['api:3000']
  #   metrics_path: '/metrics'
  #   scrape_interval: 10s

  # Worker metrics
  # - job_name: 'apexmail-worker'
  #   static_configs:
  #     - targets: ['worker:9090']
  #   metrics_path: '/metrics'
  #   scrape_interval: 10s

  # Tracking service metrics
  - job_name: 'apexmail-tracking'
    static_configs:
      - targets: ['tracking:9092']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # NOTE: postgres_exporter and redis_exporter targets removed.
  # They were not defined in docker-compose.yml and caused scrape errors.
  # To re-enable, add the corresponding exporter services to docker-compose.yml
  # and uncomment the targets below:
  #
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #   scrape_interval: 30s
  #
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #   scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
