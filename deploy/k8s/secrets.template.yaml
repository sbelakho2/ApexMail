apiVersion: v1
kind: Secret
metadata:
  name: apexmail-secrets
  namespace: apexmail
  labels:
    app.kubernetes.io/name: apexmail
  annotations:
    # Hint ESO / Vault agent to manage this Secret
    secrets.apexmail.ee/managed-by: "external-secrets"
type: Opaque
stringData:
  tracking-secret-key: "[REQUIRED]"
  db-host: "postgresql"
  db-password: "[REQUIRED]"
  database-url: "postgresql://apexmail@postgresql:5432/apexmail?sslmode=require"
  redis-host: "redis-master"
  redis-password: "[REQUIRED]"
  redis-url: "redis://redis-master:6379/0"
  clickhouse-password: "[REQUIRED]"
  jwt-private-key-pem: |-
    [REQUIRED]
  jwt-public-key-pem: |-
    [REQUIRED]
  api-key-hash-secret: "[REQUIRED]"
  webhook-signing-secret: "[REQUIRED]"
  session-secret: "[REQUIRED]"
  impersonation-secret: "[REQUIRED]"
  csrf-secret: "[REQUIRED]"
  billing-company-iban: "[REQUIRED]"
  billing-company-phone: "[REQUIRED]"
