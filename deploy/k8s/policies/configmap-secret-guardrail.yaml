apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: apexmail-configmap-secret-guardrail
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
  validations:
    - expression: "!has(object.data) || object.data.all(key, !key.matches('.*(password|secret|token|credential|private-key|api-key|signing-key|session-key|csrf-key|database-url|redis-url).*'))"
      message: "Secret-like keys must be stored in apexmail-secrets, not ConfigMaps."
    - expression: "!has(object.data) || object.data.all(key, !object.data[key].matches('.*://[^/@\\s:]+:[^/@\\s]+@.*'))"
      message: "Connection strings with embedded credentials must be stored in Secrets, not ConfigMaps."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: apexmail-configmap-secret-guardrail
spec:
  policyName: apexmail-configmap-secret-guardrail
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: apexmail
