# =============================================================================
# ApexMail Pod Priority Classes
# =============================================================================
# 🟡2: Defines priority classes for critical vs. best-effort workloads.
# Apply with: kubectl apply -f deploy/k8s/policies/priority-classes.yaml
#
# Priority values:
#   apexmail-critical   (1000) — API server, MTA (can't be preempted)
#   apexmail-high       (500)  — Tracking, worker (important but deferrable)
#   apexmail-default    (0)    — Enterprise, observability (standard priority)
#   apexmail-low        (-100) — Batch jobs, non-production, best-effort
# =============================================================================
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apexmail-critical
  labels:
    app.kubernetes.io/name: apexmail
value: 1000
globalDefault: false
description: "Critical priority for API server and MTA — never preempt."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apexmail-high
  labels:
    app.kubernetes.io/name: apexmail
value: 500
globalDefault: false
description: "High priority for tracking and worker — important but can be preempted by critical."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apexmail-default
  labels:
    app.kubernetes.io/name: apexmail
value: 0
globalDefault: true
description: "Default priority for standard workloads."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: apexmail-low
  labels:
    app.kubernetes.io/name: apexmail
value: -100
globalDefault: false
description: "Low priority for batch jobs and non-production workloads — preempted first."
