# =============================================================================
# Kustomize root configuration for the ApexMail Kubernetes deployment
#
# Apply the full stack:
#   kubectl apply -k deploy/k8s/
#
# Apply just one overlay (e.g., staging):
#   kubectl apply -k deploy/k8s/overlays/staging/
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apexmail

resources:
  # Cluster-level namespace first
  - namespace.yaml
  # Shared config & secret template
  - configmap.yaml
  # Services
  - api-server/deployment.yaml
  - api-server/service.yaml
  - api-server/serviceaccount.yaml
  - api-server/hpa.yaml
  - api-server/pdb.yaml
  - api-server/network-policy.yaml
  - policies/configmap-secret-guardrail.yaml
  - policies/priority-classes.yaml
  # NOTE: policies/audit-policy.yaml is intentionally NOT a kustomize resource.
  # It is a kube-apiserver config file (audit.k8s.io/v1 Policy without
  # metadata.name) consumed via `--audit-policy-file=...` on the API server
  # itself, not applied with `kubectl apply` to a workload namespace.
  - observability/otel-collector.yaml
  - observability/prometheus-rules.yaml
  - tracking-service/deployment.yaml
  - tracking-service/service.yaml
  - tracking-service/serviceaccount.yaml
  - tracking-service/hpa.yaml
  - tracking-service/pdb.yaml
  - tracking-service/network-policy.yaml
  - mta/deployment.yaml
  - mta/service.yaml
  - mta/serviceaccount.yaml
  - mta/hpa.yaml
  - mta/pdb.yaml
  - mta/network-policy.yaml
  - worker/deployment.yaml
  - worker/service.yaml
  - worker/serviceaccount.yaml
  - worker/hpa.yaml
  - worker/pdb.yaml
  - worker/network-policy.yaml
  - enterprise/deployment.yaml
  - enterprise/service.yaml
  - enterprise/serviceaccount.yaml
  - enterprise/hpa.yaml
  - enterprise/pdb.yaml
  - enterprise/network-policy.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: apexmail
      app.kubernetes.io/managed-by: kustomize

# Image tags — pin to release versions (override via kustomize overlays per environment)
images:
  - name: apexmail/api-server
    newTag: v1.0.0
  - name: apexmail/tracking-service
    newTag: v1.0.0
  - name: apexmail/mail-server
    newTag: v1.0.0
  - name: apexmail/worker
    newTag: v1.0.0
  - name: apexmail/enterprise-server
    newTag: v1.0.0
