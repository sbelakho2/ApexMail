apiVersion: apps/v1
kind: Deployment
metadata:
  name: mta
  namespace: apexmail
  labels:
    app.kubernetes.io/name: mta
    app.kubernetes.io/component: mail-server
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mta
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mta
        app.kubernetes.io/component: mail-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mta
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: mta
          image: apexmail/mail-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: smtps
              containerPort: 465
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: METRICS_PORT
              value: "9090"
            - name: METRICS_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "mta"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: database-url
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: redis-password
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # 🟢2: NET_BIND_SERVICE is conditional — only needed when binding
              # to privileged ports (< 1024). If the MTA is configured to use
              # ports >= 1024 (e.g. 2525, 2587), this capability can be removed
              # for tighter security.
              add:
                - NET_BIND_SERVICE
          readinessProbe:
            tcpSocket:
              port: submission
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5      # 🟢4: configurable; override via Kustomize patch
          livenessProbe:
            tcpSocket:
              port: submission
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5      # 🟢4: configurable; override via Kustomize patch
          startupProbe:
            tcpSocket:
              port: submission
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5      # 🟢4: configurable; override via Kustomize patch
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spool
              mountPath: /var/spool/apexmail
      volumes:
        - name: tmp
          # 🟡7: Added size limit to prevent disk exhaustion from temporary files
          emptyDir:
            sizeLimit: 256Mi
        - name: spool
          emptyDir:
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mta
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mta