# =============================================================================
# ApexMail Tracking Service — Kubernetes Deployment
#
# The tracking-service is the Rust mail-delivery / event-tracking binary.
# It exposes:
#   - :3001  HTTP API (open-tracking, click-tracking, webhooks)
#   - :9092  Prometheus metrics
#
# Security posture
# ─────────────────
#  • Non-root UID/GID 1000
#  • Read-only root filesystem (scratch layers in Dockerfile)
#  • All capabilities dropped; NET_BIND_SERVICE not required (port > 1024)
#  • seccompProfile RuntimeDefault
#  • Resource requests/limits tuned for a 3-replica HA baseline
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: apexmail
  labels:
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/component: mail-server
    app.kubernetes.io/version: "1.0.0"
  annotations:
    # Trigger rolling update when ConfigMap changes (via checksum annotation
    # injected by Helm or deployment pipeline)
    config-checksum: ""
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime deploys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracking-service
        app.kubernetes.io/component: mail-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tracking-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: tracking-service
          image: apexmail/tracking-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: TRACKING_HOST
              value: "0.0.0.0"
            - name: TRACKING_PORT
              value: "3001"
            - name: METRICS_PORT
              value: "9092"
            - name: METRICS_ENABLED
              value: "true"
            - name: RUST_LOG
              value: "info"
            - name: RUST_BACKTRACE
              value: "0"
            # Secrets injected from Kubernetes Secret objects
            - name: TRACKING_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: tracking-secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: database-url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: redis-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: redis-port
            - name: CLICKHOUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: clickhouse-url
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: clickhouse-database
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: clickhouse-password
            - name: TRACKING_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: tracking-base-url
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: trusted-proxies
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        # Spread pods across availability zones for HA
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tracking-service
