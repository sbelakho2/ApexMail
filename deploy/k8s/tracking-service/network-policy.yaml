apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracking-service
  namespace: apexmail
  labels:
    app.kubernetes.io/name: tracking-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tracking-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the ingress controller (nginx / Traefik / ALB) on :3001
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 3001
          protocol: TCP
    # Allow Prometheus scraping on :9092 from the monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9092
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # ClickHouse HTTP + HTTPS API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - port: 8123
          protocol: TCP
        - port: 8443
          protocol: TCP
