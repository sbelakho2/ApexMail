apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: apexmail
  labels:
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/component: mail-server
spec:
  selector:
    app.kubernetes.io/name: tracking-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9092
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
---
# ServiceAccount — no extra RBAC needed for the tracking service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracking-service
  namespace: apexmail
  labels:
    app.kubernetes.io/name: tracking-service
automountServiceAccountToken: false
