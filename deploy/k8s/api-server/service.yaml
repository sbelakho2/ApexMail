apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: apexmail
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: api-server
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-server
  namespace: apexmail
  labels:
    app.kubernetes.io/name: api-server
automountServiceAccountToken: false