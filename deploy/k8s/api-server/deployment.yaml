# =============================================================================
# ApexMail API Server — Kubernetes Deployment
#
# The api-server is the Rust HTTP binary serving the REST API and browser
# surfaces directly from a single workload.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: apexmail
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-server
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-server
          image: apexmail/api-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: environment
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: METRICS_PORT
              value: "9090"
            - name: RUST_LOG
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "api-server"
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: api-base-url
            - name: OAUTH_REDIRECT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: oauth-redirect-base-url
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: cors-origins
            - name: BILLING_COMPANY_IBAN
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: billing-company-iban
            - name: BILLING_COMPANY_PHONE
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: billing-company-phone
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: trusted-proxies
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: db-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: db-port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: db-name
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: db-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: redis-password
            - name: TRACKING_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: tracking-secret-key
            - name: JWT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: jwt-private-key-pem
            - name: JWT_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: jwt-public-key-pem
            - name: API_KEY_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: api-key-hash-secret
            - name: WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: webhook-signing-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: session-secret
            - name: IMPERSONATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: impersonation-secret
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: apexmail-secrets
                  key: csrf-secret
            - name: RATE_LIMIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: rate-limit-enabled
            - name: RATE_LIMIT_MAX_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: apexmail-config
                  key: rate-limit-max-per-minute
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: api-server
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-server