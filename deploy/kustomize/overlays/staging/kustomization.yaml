# =============================================================================
# ApexMail — Staging Environment Overlay
# =============================================================================
# Overrides the base Kustomize configuration for staging deployments.
#
# Apply:
#   kubectl apply -k deploy/kustomize/overlays/staging/
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apexmail-staging

resources:
  - ../../kustomize

commonLabels:
  environment: staging

images:
  - name: apexmail/api-server
    newTag: latest
  - name: apexmail/tracking-service
    newTag: latest
  - name: apexmail/mail-server
    newTag: latest
  - name: apexmail/worker
    newTag: latest
  - name: apexmail/enterprise-server
    newTag: latest

replicas:
  - name: api-server
    count: 2
  - name: tracking-service
    count: 1
  - name: mta
    count: 2
  - name: worker
    count: 1
  - name: enterprise
    count: 1
