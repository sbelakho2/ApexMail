# =============================================================================
# ApexMail — Production Environment Overlay
# =============================================================================
# Overrides the base Kustomize configuration for production deployments.
# Production uses pinned versions and higher replica counts for HA.
#
# Apply:
#   kubectl apply -k deploy/kustomize/overlays/production/
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apexmail-production

resources:
  - ../../kustomize

commonLabels:
  environment: production

images:
  - name: apexmail/api-server
    newTag: v1.0.0
  - name: apexmail/tracking-service
    newTag: v1.0.0
  - name: apexmail/mail-server
    newTag: v1.0.0
  - name: apexmail/worker
    newTag: v1.0.0
  - name: apexmail/enterprise-server
    newTag: v1.0.0

replicas:
  - name: api-server
    count: 5
  - name: tracking-service
    count: 3
  - name: mta
    count: 5
  - name: worker
    count: 3
  - name: enterprise
    count: 2
