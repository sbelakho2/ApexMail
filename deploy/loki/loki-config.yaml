# =============================================================================
# ApexMail Loki Configuration
# =============================================================================
# https://grafana.com/docs/loki/latest/configuration/
#
# 🟡4: S3-compatible object storage configured via env vars.
# Falls back to local filesystem when S3 env vars are unset.
#
# Production (S3):
#   NOTE: this deployment runs the DEFAULT filesystem store; switching to
#   S3 requires editing common.storage.s3 below (the pinned Loki's
#   expand-env supports only bare ${var} substitution, so defaults are
#   written statically).
#   LOKI_S3_BUCKET=apexmail-loki-chunks
#   LOKI_S3_ENDPOINT=s3.amazonaws.com
#   LOKI_S3_ACCESS_KEY_ID=<key>
#   LOKI_S3_SECRET_ACCESS_KEY=<secret>
#   LOKI_S3_REGION=eu-central-1           (optional, default: eu-central-1)
#
# Development (local filesystem — default):
#   No env vars needed.
# =============================================================================

auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    # S3-compatible object storage (fallback: local filesystem)
    s3:
      bucketnames: apexmail-loki-chunks
      endpoint: s3.amazonaws.com
      access_key_id: unused-in-filesystem-mode
      secret_access_key: unused-in-filesystem-mode
      region: eu-central-1
      # SECURITY: Use path-style access (required for MinIO and some S3-compatible stores)
      # Set to false for virtual-hosted-style access (default for AWS S3)
      s3forcepathstyle: true
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      # Env-var-driven object store: "s3" for production, "filesystem" (default) for dev
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h  # 7 days (ADR 0009 compliance)

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_query_length: 721h
  max_entries_limit_per_query: 5000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true

ruler:
  alertmanager_url: http://alertmanager:9093
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
