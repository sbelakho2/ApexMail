modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
  https_tls:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"
  dns_apexmail_mx:
    prober: dns
    timeout: 5s
    dns:
      query_name: "apexmail.ee"
      query_type: "MX"
      valid_rcodes:
        - NOERROR
      preferred_ip_protocol: "ip4"
