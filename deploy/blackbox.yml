modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
  https_tls:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      fail_if_ssl: false
  http_api_health:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
      fail_if_not_ssl: true
  # Internal (plain-HTTP) liveness probes for services that expose an
  # unauthenticated GET /health on the compose networks but have no public
  # vhost of their own (billing-service, sales-autopilot). Powers the
  # presence-based SalesAutopilotDown / BillingServiceDown alerts.
  http_internal_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
  # The public sales unsubscribe route with a bogus token must answer 404
  # (route matched, token invalid). 502/503 means sales-autopilot is down
  # behind nginx — exactly the failure this probe exists to catch.
  http_sales_unsubscribe_404:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [404]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
  # NOTE (audit): the old `http_api_email_send` module was removed — it
  # POSTed an unauthenticated "send email" request to /v1/email/send and
  # expected 2xx, which the route can never answer (it rejects
  # unauthenticated sends with 401), so the probe failed permanently.
  # The scrape job that used it now probes the unauthenticated /health
  # endpoint (see deploy/prometheus.yml, job blackbox-http-api-health).
  http_login:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"email":"probe@apexmail.ee"}'
      valid_status_codes: [200, 201, 400, 401]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"
  # Full STARTTLS handshake against the MTA: validates the TLS certificate
  # chain and feeds probe_ssl_earliest_cert_expiry, so the mail-port
  # certificate (loaded once at MTA startup, renewed by certbot with a
  # MANUAL container restart) gets the same expiry alerting as HTTPS.
  smtp_starttls:
    prober: smtp
    timeout: 10s
    smtp:
      preferred_ip_protocol: "ip4"
      tls: true
      tls_config:
        insecure_skip_verify: false
  dns_apexmail_mx:
    prober: dns
    timeout: 5s
    dns:
      query_name: "apexmail.ee"
      query_type: "MX"
      valid_rcodes:
        - NOERROR
      preferred_ip_protocol: "ip4"
  dns_apexmail_txt:
    prober: dns
    timeout: 5s
    dns:
      query_name: "apexmail.ee"
      query_type: "TXT"
      valid_rcodes:
        - NOERROR
      preferred_ip_protocol: "ip4"
