modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
  https_tls:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      fail_if_ssl: false
  http_api_health:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
      fail_if_not_ssl: true
  # Internal (plain-HTTP) liveness probes for services that expose an
  # unauthenticated GET /health on the compose networks but have no public
  # vhost of their own (billing-service, sales-autopilot). Powers the
  # presence-based SalesAutopilotDown / BillingServiceDown alerts.
  http_internal_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
  # The public sales unsubscribe route with a bogus token must answer 404
  # (route matched, token invalid). 502/503 means sales-autopilot is down
  # behind nginx — exactly the failure this probe exists to catch.
  http_sales_unsubscribe_404:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [404]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
  # NOTE (audit): the old `http_api_email_send` module was removed — it
  # POSTed an unauthenticated "send email" request to /v1/email/send and
  # expected 2xx, which the route can never answer (it rejects
  # unauthenticated sends with 401), so the probe failed permanently.
  # The scrape job that used it now probes the unauthenticated /health
  # endpoint (see deploy/prometheus.yml, job blackbox-http-api-health).
  http_login:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"email":"probe@apexmail.ee"}'
      valid_status_codes: [200, 201, 400, 401]
      follow_redirects: false
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"
  # Mail-port TLS probes (audit F1): blackbox_exporter v0.25.0 ships only
  # dns/grpc/http/icmp/tcp probers — the previous `prober: smtp` module made
  # every /probe?module=smtp_starttls return "unknown prober"
  # (probe_success==0 forever → permanent critical alert train, and the mail
  # certificate expiry alerting was dead). The tcp prober replaces it:
  #   * smtp_starttls (ports 25/587): read the server's 220 banner, EHLO,
  #     require the STARTTLS advertisement, send STARTTLS, wait for the
  #     220 ready reply, THEN upgrade — the full RFC 3207 negotiation, in the
  #     same shape as the upstream blackbox_exporter example.yml. Two v0.25.0
  #     sharp edges (both verified live against the real MTA):
  #       1. `send` lines are terminated with a BARE LF by the exporter
  #          (fmt.Fprintf "%s\n"), which the MTA rejects with
  #          "500 5.5.2 Bare LF not allowed" — the trailing \r inside the
  #          YAML string turns the wire bytes into proper CRLF.
  #       2. a bare `starttls: true` item only marks the UPGRADE point — it
  #          does NOT send the STARTTLS command.
  #     The handshake still validates the certificate chain and populates
  #     probe_ssl_earliest_cert_expiry, so the mail-port certificate (loaded
  #     once at MTA startup, renewed by certbot with a MANUAL container
  #     restart) gets the same expiry alerting as HTTPS.
  #   * smtp_tls (ports 465/993): implicit TLS from the first byte (SMTPS /
  #     IMAPS never send a plaintext banner — a STARTTLS module would hang).
  # Module names stay stable so the job=blackbox-smtp alert selectors in
  # deploy/monitoring/alerts/certificate-expiry.yml and
  # deploy/alerting-rules.yml keep matching.
  smtp_starttls:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      query_response:
        - expect: "^220"
        - send: "EHLO probe\r"
        - expect: "^250-STARTTLS"
        - send: "STARTTLS\r"
        - expect: "^220"
        - starttls: true
      tls_config:
        insecure_skip_verify: false
  smtp_tls:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      tls: true
      tls_config:
        insecure_skip_verify: false
  dns_apexmail_mx:
    prober: dns
    timeout: 5s
    dns:
      query_name: "apexmail.ee"
      query_type: "MX"
      valid_rcodes:
        - NOERROR
      preferred_ip_protocol: "ip4"
  dns_apexmail_txt:
    prober: dns
    timeout: 5s
    dns:
      query_name: "apexmail.ee"
      query_type: "TXT"
      valid_rcodes:
        - NOERROR
      preferred_ip_protocol: "ip4"
