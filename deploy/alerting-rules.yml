# ApexMail Prometheus Alerting Rules
# FIX-072: Production-ready alerting for critical services

groups:
  - name: apexmail-availability
    rules:
      - alert: ApiServerDown
        expr: up{job="apexmail-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail API server is down"
          description: "API server {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://apexmail.ee/docs/alerts#api-server-down"

      # Tracking service down
      - alert: TrackingServiceDown
        expr: up{job="apexmail-tracking"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail Tracking service is down"
          description: "Tracking service {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://apexmail.ee/docs/alerts#tracking-service-down"

      - alert: MtaDown
        expr: up{job="apexmail-mta"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail MTA is down"
          description: "MTA {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://apexmail.ee/docs/alerts#mta-down"

      - alert: OutboundMtaDown
        expr: up{job="apexmail-outbound-mta"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail outbound-MTA relay daemon is down"
          description: "The outbound relay daemon {{ $labels.instance }} has been unreachable for more than 2 minutes. Durable retries in outbound_relay_ledger are NOT being drained — mail with transient failures stalls in pending until the daemon returns."
          runbook_url: "https://apexmail.ee/docs/alerts#outbound-mta-down"

      - alert: OutboundMtaPendingOldestAgeSlo
        # SLO: the oldest pending durable retry must not exceed 30 minutes —
        # the poll loop claims due rows every OUTBOUND_MTA_POLL_SECS, so an
        # old pending row means the daemon is down, wedged, or the retry
        # ceiling config starved legitimate sends.
        expr: apexmail_outbound_mta_pending_oldest_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbound-MTA pending queue oldest row exceeds the 30m SLO"
          description: "The oldest pending row in outbound_relay_ledger is {{ $value }} seconds old (>30m). Check daemon liveness, ledger errors and retry ceilings."
          runbook_url: "https://apexmail.ee/docs/alerts#outbound-mta-pending-oldest"

      - alert: WorkerDown
        expr: up{job="apexmail-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail worker is down"
          description: "Worker {{ $labels.instance }} has been unreachable for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#worker-down"

      - alert: EnterpriseServiceDown
        expr: up{job="apexmail-enterprise"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail enterprise service is down"
          description: "Enterprise service {{ $labels.instance }} has been unreachable for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#enterprise-service-down"

      # ── Presence-based availability (sales-autopilot, billing-service) ──
      # Neither service exposes a /metrics endpoint (see the gap note in
      # deploy/prometheus.yml), so availability is asserted with blackbox
      # presence probes instead of `up` scrapes:
      #   blackbox-sales-unsubscribe — public route via nginx, expects 404
      #     (502/503 = sales-autopilot down behind the edge)
      #   blackbox-sales-internal / blackbox-billing-internal — internal
      #     GET /health on the compose networks, expect 200
      - alert: SalesAutopilotDown
        expr: probe_success{job="blackbox-sales-unsubscribe"} == 0 or probe_success{job="blackbox-sales-internal"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail sales-autopilot is down"
          description: "The sales unsubscribe route or the internal :3010/health probe has failed for more than 2 minutes (502/timeout = service down behind nginx)."
          runbook_url: "https://apexmail.ee/docs/alerts#sales-autopilot-down"

      - alert: BillingServiceDown
        expr: probe_success{job="blackbox-billing-internal"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail billing service is down"
          description: "The billing-service internal :4100/health presence probe has failed for more than 2 minutes — plan metering, invoices and Mollie webhooks are impacted."
          runbook_url: "https://apexmail.ee/docs/alerts#billing-service-down"

      - alert: SyntheticTransactionFailure
        expr: apexmail_synthetic_transaction_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Synthetic transaction failed for {{ $labels.target }}"
          description: "Synthetic transaction target {{ $labels.target }} has failed for more than 2 minutes. Last error: {{ $labels.error }}."
          runbook_url: "https://apexmail.ee/docs/alerts#synthetic-transaction-failure"

      - alert: SyntheticSmtpFailure
        expr: apexmail_synthetic_smtp_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Synthetic SMTP probe failed for {{ $labels.target }}"
          description: "Synthetic SMTP target {{ $labels.target }} has failed for more than 2 minutes. Last error: {{ $labels.error }}."
          runbook_url: "https://apexmail.ee/docs/alerts#synthetic-smtp-failure"

      - alert: BlackboxProbeFailure
        # FIX (audit): was job=~"blackbox|blackbox-smtp|blackbox-dns" — fully
        # anchored, matched NONE of the real job names (blackbox-https,
        # blackbox-http-api-health, blackbox-http-login, blackbox-smtp,
        # blackbox-dns, blackbox-dns-txt, blackbox-sales-*,
        # blackbox-billing-internal) → permanently dead rule. The prefix
        # regex matches every blackbox job defined in deploy/prometheus.yml.
        expr: probe_success{job=~"blackbox.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox probe failed for {{ $labels.instance }}"
          description: "Blackbox probe {{ $labels.job }} for {{ $labels.instance }} has failed for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#blackbox-probe-failure"

  - name: apexmail-performance
    rules:
      - record: apexmail:api_availability:ratio_30d
        expr: 1 - (sum(increase(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[30d])) / clamp_min(sum(increase(apexmail_http_requests_total{job="apexmail-api"}[30d])), 1))

      - record: apexmail:api_latency_slo:ratio_30d
        expr: sum(increase(apexmail_http_request_duration_seconds_bucket{job="apexmail-api",le="1"}[30d])) / clamp_min(sum(increase(apexmail_http_request_duration_seconds_count{job="apexmail-api"}[30d])), 1)

      - alert: ApiAvailabilitySloBurn
        expr: apexmail:api_availability:ratio_30d < 0.999
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API availability SLO burn"
          description: "30-day API availability is {{ $value | humanizePercentage }}, below the 99.9% target."
          runbook_url: "https://apexmail.ee/docs/alerts#api-availability-slo-burn"

      - alert: ApiLatencySloBurn
        expr: apexmail:api_latency_slo:ratio_30d < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API latency SLO burn"
          description: "Fewer than 95% of API requests are completing within 1s over the 30-day SLO window."
          runbook_url: "https://apexmail.ee/docs/alerts#api-latency-slo-burn"

      # First-response SLO (SalesCloser plan §5.4): the measured interval
      # is accept -> enqueue of the first reply (docs/operations/
      # first-response-slo.md). p95 target: 300s.
      - alert: FirstResponseSloBurn
        expr: histogram_quantile(0.95, rate(first_response_latency_seconds_bucket[30m])) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "First-response p95 above the 5-minute target"
          description: "p95 first-response latency is {{ $value }}s over the last 30 minutes (target 300s); check the first-response queue depth and the mailbot runtime."
          runbook_url: "https://apexmail.ee/docs/alerts#first-response-slo-burn"

      # High API latency
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, rate(apexmail_http_request_duration_seconds_bucket{job="apexmail-api"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API p95 latency"
          description: "API p95 latency is {{ $value }}s, exceeding 1s threshold for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#high-api-latency"

      # High error rate
      - alert: HighApiErrorRate
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[5m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "API 5xx error rate is {{ $value | humanizePercentage }}, exceeding 5% threshold."
          runbook_url: "https://apexmail.ee/docs/alerts#high-api-error-rate"

      - alert: CriticalApiErrorRate
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[5m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])), 1) > 0.15
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical API error rate"
          description: "API 5xx error rate is {{ $value | humanizePercentage }}, exceeding 15% threshold."
          runbook_url: "https://apexmail.ee/docs/alerts#critical-api-error-rate"

  - name: apexmail-resources
    rules:
      # High CPU usage
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "Node CPU utilization is above 85% for more than 10 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#high-cpu-usage"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes{job="node"} - node_memory_MemAvailable_bytes{job="node"}) / node_memory_MemTotal_bytes{job="node"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Node memory utilization is above 85%."
          runbook_url: "https://apexmail.ee/docs/alerts#high-memory-usage"

      # API concurrency saturation
      - alert: HighApiInflightRequests
        expr: sum(apexmail_http_requests_in_flight{job="apexmail-api"}) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API in-flight request count"
          description: "More than 500 API requests have been in flight for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#high-api-inflight-requests"

  - name: apexmail-email-delivery
    rules:
      # Email queue backing up
      - alert: EmailQueueBacklog
        expr: sum(apexmail_email_queue_depth{status=~"pending|deferred"}) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Email queue backlog is high"
          description: "More than 10,000 pending or deferred emails have been waiting for 10 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#email-queue-backlog"

      - alert: CriticalEmailQueueBacklog
        expr: sum(apexmail_email_queue_depth{status=~"pending|deferred"}) > 50000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical email queue backlog"
          description: "More than 50,000 pending or deferred emails have been waiting for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#critical-email-queue-backlog"

      - alert: EmailDeadLetterQueue
        expr: apexmail_email_queue_depth{status="failed"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Email dead-letter queue is growing"
          description: "More than 100 email jobs are in the dead-letter state ('failed') for 15 minutes — permanently failed deliveries awaiting review. Inspect the last_error column and the DLQ runbook."
          runbook_url: "https://apexmail.ee/docs/alerts#email-dead-letter-queue"

      - alert: EmailDeadLetterQueueCritical
        expr: apexmail_email_queue_depth{status="failed"} > 1000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Critical email dead-letter backlog"
          description: "More than 1,000 permanently failed email jobs are queued for review — customer mail is being lost to a systemic fault."
          runbook_url: "https://apexmail.ee/docs/alerts#email-dead-letter-queue"

      # OPS-4 (live dogfood 2026-10-08): the old expr divided
      # `redis_memory_used_bytes{job="redis"}` — redis-exporter names that
      # nothing in this stack exports, so the rule was mathematically dead.
      # The canonical emitter is the RedisKeyMonitor INFO-memory poll
      # (observability-service), which the always-on api-server now also
      # runs and exposes on its scrape port; the ratio is 0.0 when maxmemory
      # is unlimited (no eviction pressure possible).
      - alert: RedisMemoryPressure
        expr: redis_memory_utilization_ratio{job="apexmail-api"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory pressure"
          description: "Redis memory usage is above 80% of maxmemory; investigate cache and queue consumers before writes hit noeviction limits."
          runbook_url: "https://apexmail.ee/docs/alerts#redis-memory-pressure"

      # Webhook delivery failures
      - alert: HighWebhookFailureRate
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/webhooks.*|/webhooks/.*",status=~"5.."}[10m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/webhooks.*|/webhooks/.*"}[10m])), 1) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High webhook delivery failure rate"
          description: "Webhook failure rate is {{ $value | humanizePercentage }}, exceeding 10% threshold."
          runbook_url: "https://apexmail.ee/docs/alerts#high-webhook-failure-rate"

      # ── Tracking pipeline health (FIX: dead-rule rewrite) ────────────────
      # The old TrackingProcessingBacklog keyed on tracking_requests_total —
      # a metric NOTHING exports, so the rule could never fire. The tracking
      # service itself exports only counters (apexmail_tracking_
      # clickhouse_events_total, _clickhouse_failures_total, _dedup_total,
      # _click_redirects_blocked_total — see crates/tracking-service/src/
      # processor.rs); it has NO in-process backlog gauge. The honest backlog
      # signal is the WAL: inbound events are RPUSHed to the Redis list
      # `apexmail:events:pending` (REDIS_WAL_KEY) and drained by an
      # LLEN-driven adaptive batch loop. The redis-exporter exports that
      # list's depth as redis_key_size (enabled via REDIS_EXPORTER_CHECK_KEYS
      # on the redis-exporter service in docker-compose.yml).
      - alert: TrackingWalBacklog
        expr: redis_key_size{job="redis",key="apexmail:events:pending"} > 10000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tracking WAL backlog is deep"
          description: "More than 10,000 events have been queued in the tracking WAL Redis list (apexmail:events:pending) for 15 minutes — the flush loop cannot keep up (Postgres/ClickHouse slow or down)."
          runbook_url: "https://apexmail.ee/docs/alerts#tracking-wal-backlog"

      # The poison dead-letter queue: events that exhausted MAX_EVENT_RETRIES
      # or arrived unparsable are durably parked in apexmail:events:dead
      # (never discarded). ANY depth means analytics data needs operator
      # recovery — treat as a data-integrity signal, not noise.
      - alert: TrackingDeadLetterQueue
        expr: redis_key_size{job="redis",key="apexmail:events:dead"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tracking poison DLQ is non-empty"
          description: "Events have been dead-lettered to apexmail:events:dead (persistent Postgres failures or unparsable envelopes). The records are durable — inspect, repair, and re-enqueue them."
          runbook_url: "https://apexmail.ee/docs/alerts#tracking-dead-letter-queue"

      # The service's own honest "processing broken" counter: every failed
      # ClickHouse flush bumps apexmail_tracking_clickhouse_failures_total
      # (events remain safe in Postgres).
      - alert: TrackingIngestFailures
        expr: increase(apexmail_tracking_clickhouse_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tracking ClickHouse ingest is failing"
          description: "The tracking service failed its ClickHouse flush (apexmail_tracking_clickhouse_failures_total increased over the last 15m). Postgres remains the source of truth; analytics is degraded."
          runbook_url: "https://apexmail.ee/docs/alerts#tracking-ingest-failures"

  - name: apexmail-billing
    rules:
      - record: apexmail:billing_requests:rate5m
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/billing.*"}[5m]))

      - record: apexmail:billing_errors:rate5m
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/billing.*",status=~"5.."}[5m]))

      # Mollie webhook processing failures
      - alert: MollieWebhookFailures
        expr: increase(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/billing.*|/webhooks/mollie",status=~"5.."}[1h]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Multiple Mollie webhook processing failures"
          description: "{{ $value }} Mollie webhook errors in the last hour."
          runbook_url: "https://apexmail.ee/docs/alerts#mollie-webhook-failures"

  - name: apexmail-database
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres is down"
          description: "Postgres exporter is reporting down for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-down"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter is reporting down for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#redis-down"

      # FIX (audit): severity warning → critical. ClickHouse down kills the
      # tracking/analytics pipeline; PostgresDown/RedisDown are critical.
      - alert: ClickHouseDown
        expr: up{job="clickhouse"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ClickHouse is down"
          description: "ClickHouse exporter is reporting down for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-down"

      # FIX (audit: dead-rule rewrite). The in-house exporter
      # (deploy/clickhouse-exporter/clickhouse_exporter.py) scrapes
      # system.metrics + system.asynchronous_metrics and exposes them as
      # FLATTENED GAUGES ONLY (names normalized: non-alphanumerics collapsed
      # to '_', lowercased, clickhouse_ prefix) — it can never emit the
      # clickhouse_query_duration_seconds_bucket histogram the old
      # ClickHouseQueryLatencyHigh quantiled over, so that rule was dead.
      # The supported saturation signal from system.metrics is `Query` (the
      # number of concurrently executing queries) → clickhouse_query.
      - alert: ClickHouseConcurrentQueriesHigh
        expr: clickhouse_query{job="clickhouse"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse concurrent queries are saturated"
          description: "More than 50 concurrently executing ClickHouse queries (system.metrics `Query`) for 10 minutes — queries are queueing behind slow scans; check the query log for the hot query."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-concurrent-queries-high"

      # FIX (audit): metric-name repair. The real system.metrics gauge is
      # `BackgroundMergesAndMutationsPoolTask` (tasks, pending + active, in
      # the merges/mutations pool), which the exporter normalizes to
      # clickhouse_backgroundmergesandmutationspooltask — the old
      # underscored camelCase selector matched nothing.
      - alert: ClickHouseMergeBacklog
        expr: clickhouse_backgroundmergesandmutationspooltask{job="clickhouse"} > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse merge backlog is high"
          description: "ClickHouse has more than 20 pending or active merge/mutation pool tasks (system.metrics `BackgroundMergesAndMutationsPoolTask`) for 15 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-merge-backlog"

      # Canonical "too many parts" signal the exporter DOES emit:
      # asynchronous_metrics `MaxPartCountForPartition` →
      # clickhouse_maxpartcountforpartition. Crossing 300 parts per partition
      # is ClickHouse's own too_many_parts danger zone (insert path
      # stalling).
      - alert: ClickHouseTooManyParts
        expr: clickhouse_maxpartcountforpartition{job="clickhouse"} > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse too-many-parts on the insert path"
          description: "The busiest partition has more than 300 parts (MaxPartCountForPartition) for 15 minutes — merges are not keeping up with inserts."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-too-many-parts"

      # FIX (audit): same normalization repair — asynchronous_metrics exposes
      # `ReplicasMaxAbsoluteDelay` (seconds) → clickhouse_
      # replicasmaxabsolutedelay; the underscored selector matched nothing.
      # Single-node deployments do not emit the metric, so the rule stays
      # inert there (no series → no alert).
      - alert: ClickHouseReplicasDown
        expr: clickhouse_replicasmaxabsolutedelay{job="clickhouse"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse replica lag is high"
          description: "A ClickHouse replicated table has been lagging by more than 300 seconds (ReplicasMaxAbsoluteDelay) for 10 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-replicas-down"

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections near limit"
          description: "Postgres connection usage above 90% for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-high-connections"

      - alert: PostgresReplicationLagHigh
        expr: max(pg_stat_replication_pg_wal_lsn_diff{job="postgres"}) > 268435456
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Postgres replication lag is high"
          description: "A Postgres replica is more than 256 MiB behind the primary for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-replication-lag-high"

  # F10 (audit): the old apexmail-storage / LowDiskSpace group was REMOVED —
  # it was a third byte-equivalent copy of the disk-pressure condition already
  # covered by HostDiskSpaceWarning/Critical/PredictedFull in
  # deploy/prometheus/alerts/infrastructure-alerts.yml (the single canonical
  # disk-alert family; NodeDiskSpace* duplicates in
  # deploy/monitoring/alerts/disk-space.yml were removed at the same time).
  # A full disk used to fire four alerts through three rule files.

  # ── WAL archive continuity (PITR enablement, external audit 2026-10-26) ────
  # When WAL archiving is on (deploy/docker-compose.wal-archive.yml), a
  # stalled archive pipeline means the PITR chain is silently breaking:
  # postgres retries failed archives forever (correct backpressure) while
  # pg_wal grows and the recovery point stops moving. These rules watch the
  # archiver through the SAME postgres_exporter scrape the postgres alerts
  # above consume (job="postgres", deploy/prometheus.yml).
  #
  # DEPENDENCY (honest note): the expressions use the standard
  # postgres_exporter pg_stat_archiver collector names
  # (pg_stat_archiver_failed_count / _last_archived_time, same lowercase
  # naming family as pg_stat_activity_count and pg_settings_max_connections
  # already used in apexmail-availability). If the deployed exporter image
  # disables the archiver collector the series are absent and these rules
  # stay INERT (no series → no alert) — verify once after enabling:
  # `curl postgres-exporter:9187/metrics | grep pg_stat_archiver`.
  # While the override is NOT enabled (archiving off, the default), the
  # rules are also inert by design — nothing archives, nothing breaks.
  - name: apexmail-wal-archive
    rules:
      - alert: PostgresWALArchiveFailing
        expr: increase(pg_stat_archiver_failed_count{job="postgres"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL WAL archiving is failing"
          description: "{{ $value }} WAL segments failed to archive in 15m on {{ $labels.instance }}. Postgres retries automatically (pg_wal grows as backpressure); check the offsite target's reachability/SSH key and the postgres log's archive_command lines."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-wal-archive-failing"

      - alert: PostgresWALArchiveLagExceeded
        # The RPO bound is archive_timeout (default 300s: a quiet database
        # still switches a segment every 5 minutes) plus one archive push.
        # A last-archived_time older than ~4x the timeout means the
        # deterministic bound is broken even while retries have not yet
        # failed loudly — catch it before the 2h critical.
        expr: (time() - pg_stat_archiver_last_archived_time{job="postgres"}) > 1200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL WAL archive lag exceeds the RPO bound (20m since last archived segment)"
          description: "No WAL segment reached the offsite archive for {{ $value | humanizeDuration }} on {{ $labels.instance }}. With archive_timeout=300s a quiet database still archives every ~5 minutes; 20m+ means the documented RPO bound (minutes, deterministic) is not holding. Check PostgresWALArchiveFailing and the archive helper's log lines."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-wal-archive-lag-exceeded"

      - alert: PostgresWALArchiveStalled
        # > 2h since the last segment reached the archive = the measured-
        # minutes RPO story is dead. CAUTION before paging: a fully idle
        # database produces no WAL, so last_archived_time can legitimately
        # go stale with zero failures — cross-check failed_count above and
        # pg_wal size (`docker compose exec postgres pg_waldump -s` or the
        # pg_wal disk usage in the WAL Disk Full runbook) before treating
        # this alone as data loss risk.
        expr: (time() - pg_stat_archiver_last_archived_time{job="postgres"}) > 7200
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL WAL archive is stale (>2h since last archived segment)"
          description: "No WAL segment has reached the offsite archive for {{ $value | humanizeDuration }} on {{ $labels.instance }}. The PITR recovery point stopped moving; either archiving is broken (see PostgresWALArchiveFailing) or the database has been write-idle for 2h+."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-wal-archive-stalled"

      # TODO (spool growth): alert on WAL spool backlog growth. The spool is
      # the wal_spool docker volume (host path under
      # /var/lib/docker/volumes/, mounted at /var/lib/postgresql/wal-spool in
      # the postgres container). This file intentionally carries NO
      # node_exporter rules — the node_filesystem family lives canonically
      # in deploy/prometheus/alerts/infrastructure-alerts.yml (job="node";
      # the F10 dedup note above). The precise rule needs the host-side
      # mountpoint of the wal_spool volume, which is an operator/deploy-host
      # fact; pin it once PITR is enabled, e.g. in infrastructure-alerts.yml:
      #   - alert: PostgresWALSpoolBacklog
      #     expr: node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay",mountpoint="<wal_spool host path>"}
      #           - node_filesystem_avail_bytes{...same selector...} > 16 * 1024 * 1024 * 1024
      # (16 GiB of un-pushed spool = the offsite leg has been down for a
      # long while despite PostgresWALArchiveFailing). Until that lands the
      # host-disk alerts (HostDiskSpaceWarning/Critical) are the backstop.

  - name: apexmail-tls
    rules:
      - alert: TlsCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 604800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon"
          description: "TLS certificate for {{ $labels.instance }} expires in less than 7 days."
          runbook_url: "https://apexmail.ee/docs/alerts#tls-certificate-expiring-soon"

  - name: apexmail-watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: info
        annotations:
          summary: "Alerting pipeline watchdog"
          description: "This alert should always be firing to verify alert delivery."

  # ── Content-security controls (2026-10-25 capability-truth wave) ─────────
  # The five security controls are advertised; "advertised" requires
  # monitoring (registry stage_rules), so each control's verdict counters
  # carry alerting here. The fail-open alerts page the operator whenever an
  # engine stops producing verdicts — a silent filter is worse than none.
  - name: apexmail-content-security
    rules:
      - alert: SpamFilterFailingOpen
        expr: increase(mta_content_security_spam_total{result="engine_failed"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Spam filter is failing open (engine errors)"
          description: "The spam engine produced {{ $value }} engine failures in 15m — mail is being tagged UNKNOWN and delivered unfiltered."
          runbook_url: "https://apexmail.ee/docs/alerts#spam-filter-failing-open"

      - alert: SpamRejectionSpike
        expr: increase(mta_content_security_spam_total{result="rejected"}[1h]) > 50
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Spam REJECT spike at DATA time"
          description: "{{ $value }} messages refused by the spam filter in 1h. A burst can mean a campaign against a tenant — or a threshold set too low (check the false-positive corpus before touching MTA_SPAM_REJECT_THRESHOLD)."
          runbook_url: "https://apexmail.ee/docs/alerts#spam-rejection-spike"

      - alert: IdsRefusalsFired
        expr: increase(mta_content_security_ids_total{result="refused"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "IDS refused inbound messages"
          description: "{{ $value }} DATA-time refusals by the IDS in 1h (Drop/Reject verdicts). Inspect the X-Apex-Ids-Verdict headers for the signature ids involved."
          runbook_url: "https://apexmail.ee/docs/alerts#ids-refusals-fired"

      - alert: IdsFailingOpen
        expr: increase(mta_content_security_ids_total{result="engine_failed"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "IDS is failing open (engine panics)"
          description: "{{ $value }} IDS engine panics in 15m — payloads are passing uninspected."
          runbook_url: "https://apexmail.ee/docs/alerts#ids-failing-open"

      - alert: AttachmentSandboxFailingOpen
        expr: increase(mta_content_security_sandbox_total{result="engine_failed"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Attachment sandbox is failing open (scan errors)"
          description: "{{ $value }} attachments could not be scanned in 15m and were passed with decision=ERROR."
          runbook_url: "https://apexmail.ee/docs/alerts#attachment-sandbox-failing-open"

      - alert: AttachmentSandboxActionedMail
        expr: increase(mta_content_security_sandbox_actions_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Sandbox stripped or rejected attachments"
          description: "{{ $value }} attachment actions (strip/reject) in 1h — active content reached the gate and was neutralized."
          runbook_url: "https://apexmail.ee/docs/alerts#attachment-sandbox-actioned-mail"

      - alert: DlpPresendRefusals
        expr: increase(apexmail_dlp_presend_refused_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Outbound DLP refused sends"
          description: "{{ $value }} outbound sends refused by the pre-send DLP gate in 1h (high-severity policy findings)."
          runbook_url: "https://apexmail.ee/docs/alerts#dlp-presend-refusals"

      - alert: DlpPresendQuarantines
        expr: increase(apexmail_dlp_presend_held_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Outbound DLP quarantined sends"
          description: "{{ $value }} sends held as deferred by the DLP gate in 1h — an operator review backlog may be forming."
          runbook_url: "https://apexmail.ee/docs/alerts#dlp-presend-quarantines"

      - alert: DlpFailingOpen
        expr: increase(apexmail_dlp_engine_unavailable_failopen_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbound DLP is failing open (engine unavailable)"
          description: "{{ $value }} sends delivered WITHOUT a DLP verdict in 15m (engine unavailable; fail-open contract)."
          runbook_url: "https://apexmail.ee/docs/alerts#dlp-failing-open"

      - alert: WafBlockedRequests
        expr: increase(apexmail_waf_decisions_total{result="blocked"}[15m]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "WAF is blocking requests"
          description: "{{ $value }} requests blocked by the WAF in 15m — expected under attack; a spike with no incident means a rule is too broad."
          runbook_url: "https://apexmail.ee/docs/alerts#waf-blocked-requests"

      - alert: WafWouldBlockSustained
        expr: increase(apexmail_waf_decisions_total{result="would_block"}[6h]) > 500
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "WAF monitor mode keeps would-blocking"
          description: "{{ $value }} would-block verdicts in 6h. If the false-positive rate stays near zero (checked in the WAF dashboard), flip WAF_ENFORCE."
          runbook_url: "https://apexmail.ee/docs/alerts#waf-would-block-sustained"
