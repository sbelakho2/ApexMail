# ApexMail Prometheus Alerting Rules
# FIX-072: Production-ready alerting for critical services

groups:
  - name: apexmail-availability
    rules:
      - alert: ApiServerDown
        expr: up{job="apexmail-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail API server is down"
          description: "API server {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://apexmail.ee/docs/alerts#api-server-down"

      # Tracking service down
      - alert: TrackingServiceDown
        expr: up{job="apexmail-tracking"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail Tracking service is down"
          description: "Tracking service {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://apexmail.ee/docs/alerts#tracking-service-down"

      - alert: MtaDown
        expr: up{job="apexmail-mta"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail MTA is down"
          description: "MTA {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "https://apexmail.ee/docs/alerts#mta-down"

      - alert: WorkerDown
        expr: up{job="apexmail-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail worker is down"
          description: "Worker {{ $labels.instance }} has been unreachable for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#worker-down"

      - alert: EnterpriseServiceDown
        expr: up{job="apexmail-enterprise"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail enterprise service is down"
          description: "Enterprise service {{ $labels.instance }} has been unreachable for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#enterprise-service-down"

      # ── Presence-based availability (sales-autopilot, billing-service) ──
      # Neither service exposes a /metrics endpoint (see the gap note in
      # deploy/prometheus.yml), so availability is asserted with blackbox
      # presence probes instead of `up` scrapes:
      #   blackbox-sales-unsubscribe — public route via nginx, expects 404
      #     (502/503 = sales-autopilot down behind the edge)
      #   blackbox-sales-internal / blackbox-billing-internal — internal
      #     GET /health on the compose networks, expect 200
      - alert: SalesAutopilotDown
        expr: probe_success{job="blackbox-sales-unsubscribe"} == 0 or probe_success{job="blackbox-sales-internal"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail sales-autopilot is down"
          description: "The sales unsubscribe route or the internal :3010/health probe has failed for more than 2 minutes (502/timeout = service down behind nginx)."
          runbook_url: "https://apexmail.ee/docs/alerts#sales-autopilot-down"

      - alert: BillingServiceDown
        expr: probe_success{job="blackbox-billing-internal"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ApexMail billing service is down"
          description: "The billing-service internal :4100/health presence probe has failed for more than 2 minutes — plan metering, invoices and Stripe webhooks are impacted."
          runbook_url: "https://apexmail.ee/docs/alerts#billing-service-down"

      - alert: SyntheticTransactionFailure
        expr: apexmail_synthetic_transaction_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Synthetic transaction failed for {{ $labels.target }}"
          description: "Synthetic transaction target {{ $labels.target }} has failed for more than 2 minutes. Last error: {{ $labels.error }}."
          runbook_url: "https://apexmail.ee/docs/alerts#synthetic-transaction-failure"

      - alert: SyntheticSmtpFailure
        expr: apexmail_synthetic_smtp_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Synthetic SMTP probe failed for {{ $labels.target }}"
          description: "Synthetic SMTP target {{ $labels.target }} has failed for more than 2 minutes. Last error: {{ $labels.error }}."
          runbook_url: "https://apexmail.ee/docs/alerts#synthetic-smtp-failure"

      - alert: BlackboxProbeFailure
        # FIX (audit): was job=~"blackbox|blackbox-smtp|blackbox-dns" — fully
        # anchored, matched NONE of the real job names (blackbox-https,
        # blackbox-http-api-health, blackbox-http-login, blackbox-smtp,
        # blackbox-dns, blackbox-dns-txt, blackbox-sales-*,
        # blackbox-billing-internal) → permanently dead rule. The prefix
        # regex matches every blackbox job defined in deploy/prometheus.yml.
        expr: probe_success{job=~"blackbox.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox probe failed for {{ $labels.instance }}"
          description: "Blackbox probe {{ $labels.job }} for {{ $labels.instance }} has failed for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#blackbox-probe-failure"

  - name: apexmail-performance
    rules:
      - record: apexmail:api_availability:ratio_30d
        expr: 1 - (sum(increase(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[30d])) / clamp_min(sum(increase(apexmail_http_requests_total{job="apexmail-api"}[30d])), 1))

      - record: apexmail:api_latency_slo:ratio_30d
        expr: sum(increase(apexmail_http_request_duration_seconds_bucket{job="apexmail-api",le="1"}[30d])) / clamp_min(sum(increase(apexmail_http_request_duration_seconds_count{job="apexmail-api"}[30d])), 1)

      - alert: ApiAvailabilitySloBurn
        expr: apexmail:api_availability:ratio_30d < 0.999
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API availability SLO burn"
          description: "30-day API availability is {{ $value | humanizePercentage }}, below the 99.9% target."
          runbook_url: "https://apexmail.ee/docs/alerts#api-availability-slo-burn"

      - alert: ApiLatencySloBurn
        expr: apexmail:api_latency_slo:ratio_30d < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API latency SLO burn"
          description: "Fewer than 95% of API requests are completing within 1s over the 30-day SLO window."
          runbook_url: "https://apexmail.ee/docs/alerts#api-latency-slo-burn"

      # High API latency
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, rate(apexmail_http_request_duration_seconds_bucket{job="apexmail-api"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API p95 latency"
          description: "API p95 latency is {{ $value }}s, exceeding 1s threshold for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#high-api-latency"

      # High error rate
      - alert: HighApiErrorRate
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[5m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "API 5xx error rate is {{ $value | humanizePercentage }}, exceeding 5% threshold."
          runbook_url: "https://apexmail.ee/docs/alerts#high-api-error-rate"

      - alert: CriticalApiErrorRate
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[5m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])), 1) > 0.15
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical API error rate"
          description: "API 5xx error rate is {{ $value | humanizePercentage }}, exceeding 15% threshold."
          runbook_url: "https://apexmail.ee/docs/alerts#critical-api-error-rate"

  - name: apexmail-resources
    rules:
      # High CPU usage
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "Node CPU utilization is above 85% for more than 10 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#high-cpu-usage"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes{job="node"} - node_memory_MemAvailable_bytes{job="node"}) / node_memory_MemTotal_bytes{job="node"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Node memory utilization is above 85%."
          runbook_url: "https://apexmail.ee/docs/alerts#high-memory-usage"

      # API concurrency saturation
      - alert: HighApiInflightRequests
        expr: sum(apexmail_http_requests_in_flight{job="apexmail-api"}) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API in-flight request count"
          description: "More than 500 API requests have been in flight for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#high-api-inflight-requests"

  - name: apexmail-email-delivery
    rules:
      # Email queue backing up
      - alert: EmailQueueBacklog
        expr: sum(apexmail_email_queue_depth{status=~"pending|deferred"}) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Email queue backlog is high"
          description: "More than 10,000 pending or deferred emails have been waiting for 10 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#email-queue-backlog"

      - alert: CriticalEmailQueueBacklog
        expr: sum(apexmail_email_queue_depth{status=~"pending|deferred"}) > 50000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical email queue backlog"
          description: "More than 50,000 pending or deferred emails have been waiting for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#critical-email-queue-backlog"

      - alert: RedisMemoryPressure
        expr: redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory pressure"
          description: "Redis memory usage is above 80%; investigate cache and queue consumers before writes hit noeviction limits."
          runbook_url: "https://apexmail.ee/docs/alerts#redis-memory-pressure"

      # Webhook delivery failures
      - alert: HighWebhookFailureRate
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/webhooks.*|/webhooks/.*",status=~"5.."}[10m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/webhooks.*|/webhooks/.*"}[10m])), 1) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High webhook delivery failure rate"
          description: "Webhook failure rate is {{ $value | humanizePercentage }}, exceeding 10% threshold."
          runbook_url: "https://apexmail.ee/docs/alerts#high-webhook-failure-rate"

      # ── Tracking pipeline health (FIX: dead-rule rewrite) ────────────────
      # The old TrackingProcessingBacklog keyed on tracking_requests_total —
      # a metric NOTHING exports, so the rule could never fire. The tracking
      # service itself exports only counters (apexmail_tracking_
      # clickhouse_events_total, _clickhouse_failures_total, _dedup_total,
      # _click_redirects_blocked_total — see crates/tracking-service/src/
      # processor.rs); it has NO in-process backlog gauge. The honest backlog
      # signal is the WAL: inbound events are RPUSHed to the Redis list
      # `apexmail:events:pending` (REDIS_WAL_KEY) and drained by an
      # LLEN-driven adaptive batch loop. The redis-exporter exports that
      # list's depth as redis_key_size (enabled via REDIS_EXPORTER_CHECK_KEYS
      # on the redis-exporter service in docker-compose.yml).
      - alert: TrackingWalBacklog
        expr: redis_key_size{job="redis",key="apexmail:events:pending"} > 10000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tracking WAL backlog is deep"
          description: "More than 10,000 events have been queued in the tracking WAL Redis list (apexmail:events:pending) for 15 minutes — the flush loop cannot keep up (Postgres/ClickHouse slow or down)."
          runbook_url: "https://apexmail.ee/docs/alerts#tracking-wal-backlog"

      # The service's own honest "processing broken" counter: every failed
      # ClickHouse flush bumps apexmail_tracking_clickhouse_failures_total
      # (events remain safe in Postgres).
      - alert: TrackingIngestFailures
        expr: increase(apexmail_tracking_clickhouse_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tracking ClickHouse ingest is failing"
          description: "The tracking service failed its ClickHouse flush (apexmail_tracking_clickhouse_failures_total increased over the last 15m). Postgres remains the source of truth; analytics is degraded."
          runbook_url: "https://apexmail.ee/docs/alerts#tracking-ingest-failures"

  - name: apexmail-billing
    rules:
      - record: apexmail:billing_requests:rate5m
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/billing.*"}[5m]))

      - record: apexmail:billing_errors:rate5m
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/billing.*",status=~"5.."}[5m]))

      # Stripe webhook processing failures
      - alert: StripeWebhookFailures
        expr: increase(apexmail_http_requests_total{job="apexmail-api",path_pattern=~"/v1/billing.*|/webhooks/stripe",status=~"5.."}[1h]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Multiple Stripe webhook processing failures"
          description: "{{ $value }} Stripe webhook errors in the last hour."
          runbook_url: "https://apexmail.ee/docs/alerts#stripe-webhook-failures"

  - name: apexmail-database
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres is down"
          description: "Postgres exporter is reporting down for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-down"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter is reporting down for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#redis-down"

      # FIX (audit): severity warning → critical. ClickHouse down kills the
      # tracking/analytics pipeline; PostgresDown/RedisDown are critical.
      - alert: ClickHouseDown
        expr: up{job="clickhouse"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ClickHouse is down"
          description: "ClickHouse exporter is reporting down for more than 2 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-down"

      # FIX (audit: dead-rule rewrite). The in-house exporter
      # (deploy/clickhouse-exporter/clickhouse_exporter.py) scrapes
      # system.metrics + system.asynchronous_metrics and exposes them as
      # FLATTENED GAUGES ONLY (names normalized: non-alphanumerics collapsed
      # to '_', lowercased, clickhouse_ prefix) — it can never emit the
      # clickhouse_query_duration_seconds_bucket histogram the old
      # ClickHouseQueryLatencyHigh quantiled over, so that rule was dead.
      # The supported saturation signal from system.metrics is `Query` (the
      # number of concurrently executing queries) → clickhouse_query.
      - alert: ClickHouseConcurrentQueriesHigh
        expr: clickhouse_query{job="clickhouse"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse concurrent queries are saturated"
          description: "More than 50 concurrently executing ClickHouse queries (system.metrics `Query`) for 10 minutes — queries are queueing behind slow scans; check the query log for the hot query."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-concurrent-queries-high"

      # FIX (audit): metric-name repair. The real system.metrics gauge is
      # `BackgroundMergesAndMutationsPoolTask` (tasks, pending + active, in
      # the merges/mutations pool), which the exporter normalizes to
      # clickhouse_backgroundmergesandmutationspooltask — the old
      # underscored camelCase selector matched nothing.
      - alert: ClickHouseMergeBacklog
        expr: clickhouse_backgroundmergesandmutationspooltask{job="clickhouse"} > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse merge backlog is high"
          description: "ClickHouse has more than 20 pending or active merge/mutation pool tasks (system.metrics `BackgroundMergesAndMutationsPoolTask`) for 15 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-merge-backlog"

      # Canonical "too many parts" signal the exporter DOES emit:
      # asynchronous_metrics `MaxPartCountForPartition` →
      # clickhouse_maxpartcountforpartition. Crossing 300 parts per partition
      # is ClickHouse's own too_many_parts danger zone (insert path
      # stalling).
      - alert: ClickHouseTooManyParts
        expr: clickhouse_maxpartcountforpartition{job="clickhouse"} > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse too-many-parts on the insert path"
          description: "The busiest partition has more than 300 parts (MaxPartCountForPartition) for 15 minutes — merges are not keeping up with inserts."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-too-many-parts"

      # FIX (audit): same normalization repair — asynchronous_metrics exposes
      # `ReplicasMaxAbsoluteDelay` (seconds) → clickhouse_
      # replicasmaxabsolutedelay; the underscored selector matched nothing.
      # Single-node deployments do not emit the metric, so the rule stays
      # inert there (no series → no alert).
      - alert: ClickHouseReplicasDown
        expr: clickhouse_replicasmaxabsolutedelay{job="clickhouse"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse replica lag is high"
          description: "A ClickHouse replicated table has been lagging by more than 300 seconds (ReplicasMaxAbsoluteDelay) for 10 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#clickhouse-replicas-down"

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections near limit"
          description: "Postgres connection usage above 90% for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-high-connections"

      - alert: PostgresReplicationLagHigh
        expr: max(pg_stat_replication_pg_wal_lsn_diff{job="postgres"}) > 268435456
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Postgres replication lag is high"
          description: "A Postgres replica is more than 256 MiB behind the primary for 5 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#postgres-replication-lag-high"

  - name: apexmail-storage
    rules:
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk free space below 15% for 10 minutes."
          runbook_url: "https://apexmail.ee/docs/alerts#low-disk-space"

  - name: apexmail-tls
    rules:
      - alert: TlsCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 604800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon"
          description: "TLS certificate for {{ $labels.instance }} expires in less than 7 days."
          runbook_url: "https://apexmail.ee/docs/alerts#tls-certificate-expiring-soon"

  - name: apexmail-watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: info
        annotations:
          summary: "Alerting pipeline watchdog"
          description: "This alert should always be firing to verify alert delivery."
