# =============================================================================
# docker-compose.wal-archive.yml — PostgreSQL WAL archiving override (PITR)
# =============================================================================
# Repo-side enablement for WAL archiving / PITR (external audit 2026-10-26,
# infrastructure blocker #1). Including this file is the OPERATOR's explicit
# production decision — nothing in the default deployment changes:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f deploy/docker-compose.wal-archive.yml \
#     --env-file .env up -d
#
# (run from the repository root: relative paths in EVERY compose file are
# resolved against the project directory, which is the FIRST -f file's dir.)
#
# What it adds to the `postgres` service (map keys replace, lists append):
#   * `command:` boots postgres with archive_mode=on and this repo's
#     archive_command helper. The brief of the override: adding `command:`
#     to the BASE file would overwrite image defaults unconditionally, so
#     it lives ONLY here, and it execs `docker-entrypoint.sh postgres ...`
#     (the image's own entrypoint) so init/secret handling is preserved.
#   * `pg-wal-archive.sh` bind-mounted at /usr/local/bin (read-only).
#   * `apexmail_backup_egress` — the dedicated NON-internal bridge the
#     backup containers already use; apexmail_data_internal has no egress,
#     so the WAL rsync needs this network to reach the offsite target.
#   * env guards: WAL_ARCHIVE_TARGET is REQUIRED (`${VAR:?}` — compose
#     refuses to render without it, the same fail-fast pattern every
#     mandatory production variable uses).
#
# The operator must also provide (see docs/operations/disaster-recovery.md,
# "Operator enablement checklist"):
#   1. WAL_ARCHIVE_TARGET in .env, e.g.
#      backup-user@offsite.example:/srv/apexmail-wal-archive
#   2. An SSH key on the host readable at WAL_SSH_KEY_FILE and the target's
#      authorized_keys provisioned with its public half; a pinned
#      known_hosts file (the archiver is non-interactive — BatchMode=yes —
#      so a first-connection host-key prompt FAILS the archive, it never
#      hangs postgres). Defaults mirror the backup mirror's
#      /var/run/apexmail-backup-ssh/ paths; the same key may be reused.
#      The key is mounted root-owned under /root/.ssh (the backup-service
#      pattern) and the command bootstrap below copies it into a
#      postgres-owned volume, because archive_command runs as the postgres
#      OS user and ssh refuses group/world-readable keys.
#   3. WAL_BASE_BACKUP_ENABLED=1 so the nightly backup scheduler takes the
#      WEEKLY physical base backup PITR replay needs (postgres-backup
#      service, same env file).
#
# ENCRYPTION (external audit 2026-10-28 P0): archived segments and physical
# base backups are envelope ciphertext (backup-envelope.sh). The postgres
# container therefore gets the `backup_encryption_key` secret and the
# envelope library; a missing key makes archive_command FAIL (postgres
# retries) — plaintext WAL is never shipped. WAL_ENCRYPTION_KEY_FILE can
# point at a DEDICATED key file instead of the backup key.
#
# RPO BOUND: `archive_timeout` (WAL_ARCHIVE_TIMEOUT_SECS, default 300s)
# forces a segment switch on a quiet database, so the worst-case WAL lag is
# the timeout plus one archive push — a deterministic bound, not
# "minutes under normal write volume".
#
# Failure semantics: archive_command failures make postgres retry the
# segment (built-in backpressure); pg_wal grows while retries fail and the
# `apexmail-wal-archive` alerts in deploy/alerting-rules.yml fire. The
# spool volume is bounded by cleanup after every confirmed offsite push.
#
# Validated by ci/stages/validate.sh (docker compose config -q with a
# dummy env, base + prod + this overlay).
# =============================================================================

services:
  postgres:
    # Audit 6 remediation #11: the WAL tooling (rsync + openssh-client) is
    # BAKED into this image instead of `apk add`-ed during database startup —
    # a package-mirror outage can no longer degrade the database's archive
    # path. Build (or pull) it with:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
    #     -f deploy/docker-compose.wal-archive.yml build postgres
    build:
      context: .
      dockerfile: deploy/hardening/postgres-wal/Dockerfile
    image: apexmail/postgres-wal:16.8-r1
    # entrypoint stays the image default; command replaces the bare
    # `postgres` CMD and is exec'd THROUGH docker-entrypoint.sh so the
    # official init path (POSTGRES_PASSWORD_FILE secret handling, initial
    # db creation, gosu drop to the postgres user) is unchanged.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        # rsync + openssh-client are BAKED into the image (see the build
        # block above); a package mirror is no longer a startup dependency.
        # Refuse to boot the archive path half-tooled: if the tools are
        # missing the image is wrong, and postgres must say so loudly
        # instead of quietly piling up unarchived segments.
        command -v rsync >/dev/null 2>&1 && command -v ssh >/dev/null 2>&1 \
          || { echo '[wal-archive] FATAL: rsync/ssh missing — the postgres-wal image is stale, rebuild it (deploy/hardening/postgres-wal/Dockerfile)' >&2; exit 1; }
        # archive_command runs as the postgres OS user: make the spool and
        # the SSH material it needs readable by that user (uid 70). The key
        # arrives root-owned under /root/.ssh (backup-service pattern);
        # copy it into the postgres-owned wal_ssh volume with 0600.
        mkdir -p /var/lib/postgresql/wal-spool /var/lib/postgresql/wal-ssh
        chown postgres:postgres /var/lib/postgresql/wal-spool /var/lib/postgresql/wal-ssh
        if [ -f /root/.ssh/id_ed25519 ]; then
          cp /root/.ssh/id_ed25519 /var/lib/postgresql/wal-ssh/id_ed25519
          chown postgres:postgres /var/lib/postgresql/wal-ssh/id_ed25519
          chmod 600 /var/lib/postgresql/wal-ssh/id_ed25519
        fi
        if [ -f /root/.ssh/known_hosts ]; then
          cp /root/.ssh/known_hosts /var/lib/postgresql/wal-ssh/known_hosts
          chown postgres:postgres /var/lib/postgresql/wal-ssh/known_hosts
        fi
        exec docker-entrypoint.sh postgres \
          -c archive_mode=on \
          -c archive_command='/usr/local/bin/pg-wal-archive.sh %p %f' \
          -c archive_timeout=${WAL_ARCHIVE_TIMEOUT_SECS:-300} \
          -c max_slot_wal_keep_size=${STANDBY_SLOT_WAL_KEEP_SIZE_MB:-4096}MB
    volumes:
      - ./deploy/hardening/scripts/pg-wal-archive.sh:/usr/local/bin/pg-wal-archive.sh:ro
      # The canonical envelope + the PITR restore tooling: archive_command
      # encrypts with the envelope; an operator-run `--restore-command`
      # invocation from THIS container decrypts segments during a drill.
      - ./deploy/hardening/scripts/backup-envelope.sh:/usr/local/lib/backup-envelope.sh:ro
      - ./deploy/hardening/scripts/pg-pitr-restore.sh:/usr/local/bin/pg-pitr-restore.sh:ro
      - wal_spool:/var/lib/postgresql/wal-spool
      - wal_ssh:/var/lib/postgresql/wal-ssh
      # SSH key + pinned known_hosts for the WAL rsync — the SAME host-path
      # pattern as the postgres-backup service's BACKUP_SSH_KEY_FILE mounts
      # (read-only; host paths env-overridable). The container is
      # read_only:true, hence the writable named volumes above.
      - ${WAL_SSH_KEY_FILE:-/var/run/apexmail-backup-ssh/id_ed25519}:/root/.ssh/id_ed25519:ro
      - ${WAL_SSH_KNOWN_HOSTS_FILE:-/var/run/apexmail-backup-ssh/known_hosts}:/root/.ssh/known_hosts:ro
    environment:
      # REQUIRED: rsync-over-ssh target for archived segments, e.g.
      # "backup-user@offsite.example:/srv/apexmail-wal-archive". An unset
      # value refuses to render — archiving that cannot leave the host is
      # not durability (the archive helper itself fails closed on an empty
      # value as well).
      WAL_ARCHIVE_TARGET: ${WAL_ARCHIVE_TARGET:?production must define the WAL archive target when the wal-archive override is included (PITR)}
      WAL_SPOOL_DIR: /var/lib/postgresql/wal-spool
      WAL_SSH_KEY_FILE: /var/lib/postgresql/wal-ssh/id_ed25519
      WAL_SSH_KNOWN_HOSTS_FILE: /var/lib/postgresql/wal-ssh/known_hosts
      WAL_RSYNC_TIMEOUT: ${WAL_RSYNC_TIMEOUT:-120}
      # Encryption material (see the header): the dedicated WAL key file
      # first, falling back to the shared backup key secret.
      WAL_ENCRYPTION_KEY_FILE: ${WAL_ENCRYPTION_KEY_FILE:-/run/secrets/backup_encryption_key}
      # Deterministic RPO bound: force a WAL switch at most every N seconds.
      WAL_ARCHIVE_TIMEOUT_SECS: ${WAL_ARCHIVE_TIMEOUT_SECS:-300}
      # P1-DR-3 (seventh audit): a physical replication slot retains WAL
      # with no default cap — an abandoned standby can fill the primary
      # disk. Bounded (default 4 GiB); when the bound trips the slot is
      # invalidated and the standby re-bootstraps from the PITR archive,
      # which is the designed recovery path (warm-standby runbook).
      STANDBY_SLOT_WAL_KEEP_SIZE_MB: ${STANDBY_SLOT_WAL_KEEP_SIZE_MB:-4096}
    secrets:
      # Envelope key for WAL segment encryption (the same secret the backup
      # service uses unless WAL_ENCRYPTION_KEY_FILE names a dedicated one).
      - backup_encryption_key
    networks:
      # The WAL rsync needs real egress: apexmail_data_internal is
      # internal:true; this is the same dedicated bridge the backup
      # containers use (list append — the data_internal membership from
      # the base file is preserved).
      - apexmail_backup_egress

  # ===========================================================================
  # REPLICATION HEARTBEAT RUNNER (eighth audit, DR wave)
  # ===========================================================================
  # Writes one apexmail_ops.replication_heartbeat row every
  # HEARTBEAT_INTERVAL_SECONDS (default 15) on the PRIMARY; physical
  # replication carries the rows to the standby, where
  # pg-standby-promote.sh measures their age as the END-TO-END "recently
  # heard from the primary" freshness evidence (the replay timestamp alone
  # freezes when replication stops and cannot serve this role — the audit
  # finding). See deploy/hardening/scripts/pg-replication-heartbeat.sh.
  # Reuses the SAME baked WAL/postgres image the postgres service above
  # builds (run the build block once: `docker compose ... build postgres`);
  # only ever talks to postgres over the data network, so it needs no
  # egress and works unchanged on the internal production network.
  postgres-heartbeat:
    image: apexmail/postgres-wal:16.8-r1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The image entrypoint execs this (first arg is not `postgres`); the
    # script connects with libpq env vars below + the shared password secret.
    command:
      - /bin/sh
      - /usr/local/bin/pg-replication-heartbeat.sh
    volumes:
      - ./deploy/hardening/scripts/pg-replication-heartbeat.sh:/usr/local/bin/pg-replication-heartbeat.sh:ro
    environment:
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-15}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-apexmail}
      PGDATABASE: postgres
      # The script reads this file into PGPASSWORD (same shared credential
      # the postgres service uses — one secret, no second password).
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - apexmail_data_internal
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    security_opt:
      - no-new-privileges:true

volumes:
  wal_spool:
  wal_ssh:
