# ==============================================================================
# ApexMail — Certificate Expiry Alerting Rules
# ==============================================================================
# MON-17: Certificate expiry monitoring for all TLS certificates.
#
# Loaded by: prometheus.yml -> rule_files
#
# F8 (audit) — this is a Docker Compose host. The previous version carried a
# Kubernetes cert-manager rule set (certmanager_certificate_expiration_*,
# certmanager_issuer_condition_status, certmanager_http_acme_request_errors_)
# and matched them against a `blackbox-apexmail` job that does not exist —
# NONE of those rules could ever fire. Certificates here are issued/renewed
# by the certbot compose service (ACME, see deploy/scripts/certbot-renew-
# loop.sh) and observed where they are actually served, via the blackbox
# exporter's TLS probes:
#   * job="blackbox-https" (https_tls module) → probe_ssl_earliest_cert_expiry
#     for api.apexmail.ee, track.apexmail.ee and app.apexmail.ee
#   * job="blackbox-http-api-health" (fail_if_not_ssl) → same metric for the
#     /health endpoints
# Every remaining rule references one of those real series.
# ==============================================================================

groups:
  - name: apexmail-certificate-expiry
    rules:
      # ── Served TLS certificates (blackbox TLS probes) ────────────────────────

      - alert: EndpointCertificateExpiring
        expr: |
          probe_ssl_earliest_cert_expiry{job=~"blackbox-https|blackbox-http-api-health"}
          - time() < 604800  # 7 days
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: |
            The certificate served at {{ $labels.instance }} expires in
            {{ $value | humanizeDuration }}. The certbot renewal loop should
            have replaced it by now — check: docker logs apexmail-certbot,
            and deploy/nginx/ssl/live/apexmail.ee/ mtimes. nginx picks up
            renewed material via its reload sentinel within 60s.
          runbook_url: "https://apexmail.ee/docs/runbooks/certificate-renewal"

      - alert: EndpointCertificateExpiringCritical
        expr: |
          probe_ssl_earliest_cert_expiry{job=~"blackbox-https|blackbox-http-api-health"}
          - time() < 172800  # 48 hours
        for: 30m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "CRITICAL: TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: |
            The certificate served at {{ $labels.instance }} expires in under
            48 hours. Renewal is failing — run deploy/scripts/issue-letsencrypt.sh
            manually and inspect the certbot container logs. A hard expiry
            takes the affected vhost (and its mail TLS) down.
          runbook_url: "https://apexmail.ee/docs/runbooks/certificate-renewal"

      - alert: EndpointCertificateExpired
        expr: |
          probe_ssl_earliest_cert_expiry{job=~"blackbox-https|blackbox-http-api-health"}
          - time() < 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} HAS EXPIRED"
          description: |
            The certificate served at {{ $labels.instance }} is expired.
            Clients are already rejecting the connection. Restore from the
            certbot archive or reissue IMMEDIATELY.
          runbook_url: "https://apexmail.ee/docs/runbooks/certificate-renewal"

      # ── Coverage guard: the TLS probes themselves must keep reporting ──────
      # If every probe_ssl_earliest_cert_expiry series disappears the expiry
      # alerts above go silently inert — this rule catches that.

      - alert: CertificateProbingMissing
        expr: absent(probe_ssl_earliest_cert_expiry{job="blackbox-https"})
        for: 15m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "No TLS certificate probe results are being reported"
          description: |
            The blackbox-https job stopped emitting probe_ssl_earliest_cert_expiry
            — the expiry alerts in this file have gone blind. Check the
            blackbox-exporter container and the https_tls probes in
            deploy/prometheus.yml.
          runbook_url: "https://apexmail.ee/docs/runbooks/certificate-renewal"
