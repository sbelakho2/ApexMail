# ApexMail API Performance Alerting Rules
# =========================================
# This file defines Prometheus alerting rules specifically for API performance
# degradation: high latency, error rate spikes, and throughput drops.
#
# Loaded by: prometheus.yml -> rule_files
# Load order: This file should be loaded before infrastructure-alerts.yml
#
# F8 (audit): every rule references a metric something actually emits.
#   * apexmail_http_requests_total / apexmail_http_request_duration_seconds_*
#     / apexmail_http_requests_in_flight are emitted by the api-server
#     (crates/api-server/src/middleware/metrics.rs, job="apexmail-api");
#     the per-route label is `path_pattern` (MatchedPath), NOT `endpoint`.
#   * The DB pool rules use postgres-exporter metrics (job="postgres"):
#     pg_stat_activity_count / pg_settings_max_connections — the
#     apexmail_db_pool_utilization gauge nothing exports was removed.
#   * The rate-limiter (apexmail_rate_limiter_*) and cache (apexmail_cache_*)
#     rules were DELETED: no service exports those metrics, so they could
#     never fire and only hid real coverage gaps.

groups:
  - name: apexmail-api-performance
    rules:
      # ── High Latency Alerts ────────────────────────────────────────────────

      - alert: ApiHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(apexmail_http_request_duration_seconds_bucket{job="apexmail-api"}[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API p95 latency exceeds 500ms"
          description: "API p95 latency is {{ $value | humanizeDuration }} over the last 5 minutes (threshold: 500ms)."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-high-latency"

      - alert: ApiHighLatencyP99
        expr: histogram_quantile(0.99, sum(rate(apexmail_http_request_duration_seconds_bucket{job="apexmail-api"}[5m])) by (le)) > 1.0
        for: 3m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API p99 latency exceeds 1s"
          description: "API p99 latency is {{ $value | humanizeDuration }} over the last 3 minutes (threshold: 1s)."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-high-latency"

      - alert: ApiEndpointHighLatency
        expr: histogram_quantile(0.95, sum(rate(apexmail_http_request_duration_seconds_bucket{job="apexmail-api",path_pattern=~"/v1/email/send|/v1/email"}[5m])) by (le, path_pattern)) > 2.0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High latency on endpoint {{ $labels.path_pattern }}"
          description: "p95 latency for {{ $labels.path_pattern }} is {{ $value | humanizeDuration }} over the last 5 minutes."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-high-latency"

      # ── Error Rate Alerts ──────────────────────────────────────────────────

      - alert: ApiErrorRateSpike
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[5m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API 5xx error rate exceeds 5%"
          description: "API 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 5%)."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-error-spike"

      - alert: ApiErrorRateElevated
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[5m])) / clamp_min(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])), 1e-9) > 0.01
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API 5xx error rate above 1% for 15 minutes"
          description: "API 5xx error rate is {{ $value | humanizePercentage }} over the last 15 minutes (threshold: 1%)."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-error-spike"

      - alert: ApiEndpointErrorBurst
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[1m])) by (path_pattern) > 10
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Error burst on endpoint {{ $labels.path_pattern }}"
          description: "Endpoint {{ $labels.path_pattern }} has {{ $value | humanize }} 5xx errors per second over the last 2 minutes."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-error-spike"

      # ── Throughput Alerts ──────────────────────────────────────────────────

      - alert: ApiThroughputDrop
        expr: sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])) < (sum(rate(apexmail_http_requests_total{job="apexmail-api"}[1h])) * 0.5)
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API throughput dropped by more than 50%"
          description: "Current throughput ({{ $value | humanize }} req/s) is less than 50% of the 1-hour average."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-throughput-drop"

      - alert: ApiThroughputAnomaly
        expr: abs(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m])) - avg_over_time(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m]))[7d:5m])) > (2 * stddev_over_time(sum(rate(apexmail_http_requests_total{job="apexmail-api"}[5m]))[7d:5m]))
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API throughput anomaly detected"
          description: "Current throughput ({{ $value | humanize }} req/s) deviates more than 2 standard deviations from the 7-day pattern."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-throughput-drop"

      # ── Concurrency ─────────────────────────────────────────────────────────

      - alert: ApiInflightRequestsHigh
        expr: sum(apexmail_http_requests_in_flight{job="apexmail-api"}) > 500
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API in-flight request count is high"
          description: "More than 500 API requests have been in flight for 5 minutes (apexmail_http_requests_in_flight)."
          runbook_url: "https://apexmail.ee/docs/runbooks/api-high-latency"

      # ── Database Connection Pool (postgres-exporter, job="postgres") ───────
      # F8 — the old apexmail_db_pool_utilization rules could never fire
      # (nothing emits that gauge). The postgres-exporter exposes the real
      # server-side connection pressure: pg_stat_activity_count (active
      # connections) against pg_settings_max_connections.

      - alert: ApiConnectionPoolExhaustion
        expr: pg_stat_activity_count{job="postgres"} / pg_settings_max_connections{job="postgres"} > 0.90
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Postgres connection usage at 90% of max_connections"
          description: "Postgres is at {{ $value | humanizePercentage }} of max_connections (pg_stat_activity_count). Risk of connection exhaustion for every service on the shared pool."
          runbook_url: "https://apexmail.ee/docs/runbooks/db-connection-pool"

      - alert: ApiConnectionPoolHigh
        expr: pg_stat_activity_count{job="postgres"} / pg_settings_max_connections{job="postgres"} > 0.75
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Postgres connection usage above 75% for 10 minutes"
          description: "Postgres is at {{ $value | humanizePercentage }} of max_connections (pg_stat_activity_count) for over 10 minutes."
          runbook_url: "https://apexmail.ee/docs/runbooks/db-connection-pool"

      # ── SLO Burn Rate Alerts ───────────────────────────────────────────────

      - alert: ApiAvailabilitySloBurnRate
        expr: |
          (
          1 - (sum(increase(apexmail_http_requests_total{job="apexmail-api",status=~"5.."}[1h])) / clamp_min(sum(increase(apexmail_http_requests_total{job="apexmail-api"}[1h])), 1))
          ) < 0.99
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API availability SLO burn rate exceeded (1h window)"
          description: "API availability over the last 1 hour is {{ $value | humanizePercentage }} (SLO: 99.9%). Action required within 1 hour to avoid SLO violation."
          runbook_url: "https://apexmail.ee/docs/runbooks/slo-burn-rate"

      - alert: ApiLatencySloBurnRate
        expr: |
          (
          sum(increase(apexmail_http_request_duration_seconds_bucket{job="apexmail-api",le="0.5"}[1h])) / clamp_min(sum(increase(apexmail_http_request_duration_seconds_count{job="apexmail-api"}[1h])), 1)
          ) < 0.95
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API latency SLO burn rate exceeded (1h window)"
          description: "API requests under 500ms over the last 1 hour is {{ $value | humanizePercentage }} (SLO: 99%)."
          runbook_url: "https://apexmail.ee/docs/runbooks/slo-burn-rate"
