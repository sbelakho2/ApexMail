# ApexMail Infrastructure Alerting Rules
# ==========================================
# Infrastructure-level alerts for the SINGLE-HOST Docker Compose deployment.
#
# Loaded by: prometheus.yml -> rule_files
#
# F8 (audit) — this file used to be a Kubernetes alert set (kube_*,
# container_*/cAdvisor, kubelet, HPA): NONE of those exporters run on the
# compose host, so every rule was permanently inert. It now uses ONLY
# metrics that are actually scraped on this host (see deploy/prometheus.yml):
#   * node_*      — node-exporter (job="node"): host CPU/memory/disk/inodes
#   * up          — every scrape job (exporters + app metrics endpoints)
#   * probe_*     — blackbox-exporter jobs (job=~"blackbox.*")
#   * pg_*        — postgres-exporter (job="postgres")
#   * redis_*     — redis-exporter (job="redis")
# Availability (`up == 0`) and queue/backlog alerts for the application
# services live in deploy/alerting-rules.yml (ApiServerDown, MtaDown,
# EmailQueueBacklog, TrackingWalBacklog, ...) and are not duplicated here.

groups:
  - name: apexmail-infrastructure
    rules:
      # ── Host CPU (node-exporter) ────────────────────────────────────────────

      - alert: HostCpuHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Host CPU usage above 85%"
          description: "Node {{ $labels.instance }} CPU utilization is {{ $value | humanizePercentage }} for over 10 minutes."
          runbook_url: "https://apexmail.ee/docs/runbooks/high-cpu-usage"

      - alert: HostCpuCritical
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 95
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "CRITICAL: Host CPU usage above 95%"
          description: "Node {{ $labels.instance }} CPU utilization is {{ $value | humanizePercentage }} for over 5 minutes. The whole compose stack shares this host."
          runbook_url: "https://apexmail.ee/docs/runbooks/high-cpu-usage"

      # ── Host Memory (node-exporter) ─────────────────────────────────────────

      - alert: HostMemoryHigh
        expr: (node_memory_MemTotal_bytes{job="node"} - node_memory_MemAvailable_bytes{job="node"}) / node_memory_MemTotal_bytes{job="node"} > 0.85
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Host memory usage above 85%"
          description: "Node {{ $labels.instance }} memory utilization is {{ $value | humanizePercentage }} — containers risk OOM kills (per-service compose memory limits)."
          runbook_url: "https://apexmail.ee/docs/runbooks/high-memory-usage"

      - alert: HostMemoryCritical
        expr: (node_memory_MemTotal_bytes{job="node"} - node_memory_MemAvailable_bytes{job="node"}) / node_memory_MemTotal_bytes{job="node"} > 0.95
        for: 3m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "CRITICAL: Host memory usage above 95%"
          description: "Node {{ $labels.instance }} memory utilization is {{ $value | humanizePercentage }}. The kernel OOM killer is imminent; check docker stats for the top consumer."
          runbook_url: "https://apexmail.ee/docs/runbooks/high-memory-usage"

      # ── Host Disk (node-exporter) ───────────────────────────────────────────
      # Compose volumes (postgres_data, clickhouse_data, backups) all live on
      # the host root filesystem — these are the real disk-pressure signals.
      # (fstype filters mirror deploy/alerting-rules.yml LowDiskSpace.)

      - alert: HostDiskSpaceWarning
        expr: (1 - (node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"})) * 100 > 80
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Host disk usage above 80% on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Disk is {{ $value | humanizePercentage }} full. Cleanup: docker system prune, old images, rotated logs; check the postgres_backups/clickhouse_backups volumes."
          runbook_url: "https://apexmail.ee/docs/runbooks/disk-space"

      - alert: HostDiskSpaceCritical
        expr: (1 - (node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "CRITICAL: Host disk usage above 90%"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full — Postgres/ClickHouse writes fail when it fills. IMMEDIATE ACTION REQUIRED."
          runbook_url: "https://apexmail.ee/docs/runbooks/disk-space"

      - alert: HostDiskPredictedFull
        expr: predict_linear(node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}[6h], 86400) < 0
        for: 30m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Host disk {{ $labels.mountpoint }} predicted to fill within 24 hours"
          description: "At the current consumption rate the filesystem fills within 24h. Check WAL accumulation, backup volume growth and log rotation."
          runbook_url: "https://apexmail.ee/docs/runbooks/disk-space"

      # ── Metrics-pipeline health (every job's up) ────────────────────────────

      - alert: ExporterDown
        expr: up{job=~"postgres|redis|clickhouse|node|synthetic-transactions"} == 0
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Metrics exporter {{ $labels.job }} is down"
          description: "The {{ $labels.job }} scrape target {{ $labels.instance }} has been unreachable for 5 minutes — its dashboard panels and dependent alerts are blind."
          runbook_url: "https://apexmail.ee/docs/runbooks/exporter-down"

      - alert: BlackboxProbeJobFailing
        expr: probe_success{job=~"blackbox.*"} == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Blackbox probe {{ $labels.job }} failing for {{ $labels.instance }}"
          description: "The {{ $labels.job }} probe against {{ $labels.instance }} has failed for 5 minutes (external reachability, TLS, SMTP or DNS is broken at the edge)."
          runbook_url: "https://apexmail.ee/docs/runbooks/blackbox-probe-failure"

      # ── Datastore saturation (exporters) ────────────────────────────────────

      - alert: PostgresConnectionSaturation
        expr: pg_stat_activity_count{job="postgres"} / pg_settings_max_connections{job="postgres"} > 0.90
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Postgres connection usage above 90% of max_connections"
          description: "Postgres is at {{ $value | humanizePercentage }} of max_connections — new application connections will start failing."
          runbook_url: "https://apexmail.ee/docs/runbooks/postgres-connections"

      - alert: PostgresRollbackSpike
        expr: sum(rate(pg_stat_database_xact_rollback{job="postgres"}[10m])) / clamp_min(sum(rate(pg_stat_database_xact_commit{job="postgres"}[10m])), 1e-9) > 0.10
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Postgres rollback ratio above 10%"
          description: "Rolled-back transactions are {{ $value | humanizePercentage }} of committed ones over 10 minutes — failing queries or deadlocks."
          runbook_url: "https://apexmail.ee/docs/runbooks/postgres-rollback-spike"

      - alert: RedisMemoryCritical
        expr: redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"} > 0.95
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Redis memory usage above 95%"
          description: "Redis is at {{ $value | humanizePercentage }} of maxmemory — writes are about to hit the eviction policy (or fail under noeviction). Immediate action required."
          runbook_url: "https://apexmail.ee/docs/runbooks/redis-memory"

      # NOTE (F8 deletions): the previous file also contained kube_/container_
      # CPU-memory-restart-network rules, HPA rules, apexmail_smtp_queue_depth
      # and apexmail_synthetic_probe_success rules — all referencing metrics
      # with no exporter on this host. Real coverage for the removed concerns:
      #   * container restarts/OOM → compose healthchecks + verify stage probes
      #   * email queue depth     → EmailQueueBacklog (alerting-rules.yml,
      #                              apexmail_email_queue_depth, job=apexmail-worker)
      #   * synthetic probes      → SyntheticTransactionFailure /
      #     SyntheticSmtpFailure (alerting-rules.yml, apexmail_synthetic_*)
