global:
  resolve_timeout: 5m
  # Fallback SMTP for email notifications
  smtp_smarthost: '${SMTP_HOST:?SMTP_HOST not set}:${SMTP_PORT:-587}'
  smtp_from: 'alertmanager@apexmail.ee'
  smtp_auth_username: '${SMTP_USERNAME:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'
  smtp_require_tls: true
  # PagerDuty configuration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  # OpsGenie configuration
  opsgenie_api_url: 'https://api.opsgenie.com'
  opsgenie_api_key: '${OPSGENIE_API_KEY:-}'

route:
  receiver: default
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    # ── Critical alerts: PagerDuty/OpsGenie + email + Slack ──
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 30m
      continue: false
    # ── Warning alerts: Slack + email ──
    - matchers:
        - severity="warning"
      receiver: warning
      repeat_interval: 2h
      continue: false
    # ── Info alerts: Slack (low-priority) ──
    - matchers:
        - severity="info"
      receiver: info
      repeat_interval: 12h
      continue: false

receivers:
  # ── Critical: PagerDuty + OpsGenie + Email + Slack ──
  - name: critical
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY:-}'
        severity: critical
        send_resolved: true
        images:
          - src: 'https://status.apexmail.ee/assets/img/apexmail-icon.png'
        links:
          - href: 'https://grafana.apexmail.ee/d/apexmail-api'
            text: 'ApexMail API Dashboard'
          - href: 'https://status.apexmail.ee'
            text: 'Status Page'
    opsgenie_configs:
      - api_key: '${OPSGENIE_API_KEY:-}'
        responders:
          - type: team
            name: 'on-call'
        priority: P1
        send_resolved: true
    webhook_configs:
      - url: 'https://hooks.slack.com/services/${SLACK_WEBHOOK_PATH:-}'
        send_resolved: true
      - url: 'http://observability:4400/alerts'
        send_resolved: true
        http_config:
          headers:
            X-Api-Key: '${INTERNAL_SERVICE_TOKEN}'
    email_configs:
      - to: '${ALERT_EMAIL_CRITICAL:-admin@apexmail.ee}'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }} - ApexMail'
          priority: urgent

  # ── Warning: Slack + Email ──
  - name: warning
    webhook_configs:
      - url: 'https://hooks.slack.com/services/${SLACK_WEBHOOK_PATH:-}'
        send_resolved: true
      - url: 'http://observability:4400/alerts'
        send_resolved: true
        http_config:
          headers:
            X-Api-Key: '${INTERNAL_SERVICE_TOKEN}'
    email_configs:
      - to: '${ALERT_EMAIL_WARNING:-admin@apexmail.ee}'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .GroupLabels.alertname }} - ApexMail'

  # ── Info: Slack (low-priority channel) ──
  - name: info
    webhook_configs:
      - url: 'https://hooks.slack.com/services/${SLACK_WEBHOOK_PATH_LOW:-}'
        send_resolved: true
      - url: 'http://observability:4400/alerts'
        send_resolved: true
        http_config:
          headers:
            X-Api-Key: '${INTERNAL_SERVICE_TOKEN}'

  # ── Default fallback ──
  - name: default
    webhook_configs:
      - url: 'http://observability:4400/alerts'
        send_resolved: true
        http_config:
          headers:
            X-Api-Key: '${INTERNAL_SERVICE_TOKEN}'
