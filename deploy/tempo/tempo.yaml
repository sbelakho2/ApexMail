# =============================================================================
# ApexMail Tempo Configuration
# =============================================================================
# 🟡3: S3-compatible object storage configured via env vars.
# Falls back to local filesystem when S3 env vars are unset.
#
# Production (S3):
#   TEMPO_STORAGE_BACKEND=s3
#   TEMPO_S3_BUCKET=apexmail-tempo-traces
#   TEMPO_S3_ENDPOINT=s3.amazonaws.com
#   TEMPO_S3_ACCESS_KEY=<key>
#   TEMPO_S3_SECRET_KEY=<secret>
#   TEMPO_S3_REGION=eu-central-1        (optional, default: eu-central-1)
#
# Development (local filesystem — default):
#   No env vars needed.
# =============================================================================

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1048576
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

# ── Query-frontend / Search ─────────────────────────────────────────────────
# Enables trace search functionality (required for Grafana Tempo datasource
# search and traceQL queries).
query_frontend:
  search:
    concurrent_requests: 1000

querier:
  search:
    # Number of concurrent jobs to execute while searching
    external_hedge_requests_at: 8s
    external_hedge_requests_up_to: 2

# ── Metrics-generator ───────────────────────────────────────────────────────
# Enables span metrics (RED metrics: Rate, Errors, Duration) derived from traces.
metrics_generator:
  registry:
    collection_interval: 15s
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# ── Ring configuration ──────────────────────────────────────────────────────
# In production, use a consistent backend (etcd/consul) for the distributor
# ring instead of the default in-memory ring. In-memory ring means each
# distributor has an independent view of ingesters, which can cause data
# loss during rolling restarts.
#
# For single-binary mode (single instance), in-memory is acceptable.
# For scalable deployments, uncomment and configure:
# ring:
#   kvstore:
#     store: etcd
#     etcd:
#       endpoints:
#         - 
#     # or for consul:
#     # store: consul
#     # consul:
#     #   host: 

storage:
  trace:
    # The pinned image's expand-env supports only bare ${var} (no defaults),
    # so the deployment default (local filesystem) is written statically.
    # To switch to S3: backend: s3 and populate the s3: block below.
    backend: local
    s3:
      bucket: apexmail-tempo-traces
      endpoint: s3.amazonaws.com
      access_key: unused-in-local-mode
      secret_key: unused-in-local-mode
      region: eu-central-1
      # SECURITY: Force path-style access (required for MinIO)
      # Bool fields cannot come from env expansion (string vs bool).
      forcepathstyle: true
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
