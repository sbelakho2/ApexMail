# =============================================================================
# ApexMail Tempo Configuration
# =============================================================================
# 🟡3: S3-compatible object storage configured via env vars.
# Falls back to local filesystem when S3 env vars are unset.
#
# Production (S3):
#   TEMPO_STORAGE_BACKEND=s3
#   TEMPO_S3_BUCKET=apexmail-tempo-traces
#   TEMPO_S3_ENDPOINT=s3.amazonaws.com
#   TEMPO_S3_ACCESS_KEY=<key>
#   TEMPO_S3_SECRET_KEY=<secret>
#   TEMPO_S3_REGION=us-east-1           (optional, default: us-east-1)
#
# Development (local filesystem — default):
#   No env vars needed.
# =============================================================================

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1048576
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    # Env-var-driven backend: "s3" for production, "local" (default) for dev
    backend: ${TEMPO_STORAGE_BACKEND:-local}
    s3:
      bucket: ${TEMPO_S3_BUCKET:}
      endpoint: ${TEMPO_S3_ENDPOINT:-s3.amazonaws.com}
      access_key: ${TEMPO_S3_ACCESS_KEY:}
      secret_key: ${TEMPO_S3_SECRET_KEY:}
      region: ${TEMPO_S3_REGION:-us-east-1}
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
