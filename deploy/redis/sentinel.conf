# =============================================================================
# ApexMail — Redis Sentinel Configuration (High Availability)
# =============================================================================
# SCALE-H-01: Redis Sentinel monitors the Redis primary instance and automates
# failover when the primary becomes unreachable. This configuration is designed
# for a 3-node Sentinel deployment (quorum = 2) to prevent split-brain while
# tolerating a single Sentinel failure.
#
# Usage:
#   redis-sentinel /path/to/sentinel.conf
#
# Or as a Docker container:
#   docker run -v $(pwd)/sentinel.conf:/etc/redis/sentinel.conf \
#     redis:7-alpine redis-sentinel /etc/redis/sentinel.conf
#
# Deployment with Helm:
#   The ApexMail Helm chart (deploy/helm/apexmail/) supports configuring
#   Sentinel via values.yaml. Set:
#     redis.sentinel.enabled: true
#     redis.sentinel.quorum: 2
# =============================================================================

# ── General Sentinel Configuration ──────────────────────────────────────────

# Port on which the Sentinel instance listens for commands and pub/sub messages
# from other Sentinels and the application.
port 26379

# Daemonize: run in background (set to 'no' when run via Docker/systemd)
daemonize no

# Log file: 'stdout' for containerised deployments, file path for bare-metal
logfile ""

# PID file path (used when daemonize is set to 'yes')
pidfile /var/run/redis-sentinel.pid

# ── Primary Monitor Configuration ───────────────────────────────────────────

# Monitor the Redis primary at 127.0.0.1:6379.
# Format: sentinel monitor <master-group-name> <ip> <port> <quorum>
#
# <master-group-name>  — Logical name used by applications to discover the
#                        current primary via Sentinel.
# <quorum>             — Number of Sentinels that must agree the primary is
#                        down before initiating a failover.
#
# Quorum of 2:
#   With 3 Sentinels, at least 2 must agree the primary is unreachable before
#   a failover is triggered. This prevents a single Sentinel's network blip
#   from causing a spurious failover.
sentinel monitor apexmail-primary 127.0.0.1 6379 2

# ── Authentication ──────────────────────────────────────────────────────────

# Authenticate Sentinel to the Redis primary/replicas.
# Set this to the same password configured on the Redis server.
# In ApexMail, the password is injected via the Kubernetes secret
# (see deploy/k8s/secrets.template.yaml) or Docker secret.
#
# Uncomment and set the password:
# sentinel auth-pass apexmail-primary <your-redis-password>

# ── Failure Detection ───────────────────────────────────────────────────────

# How long (in milliseconds) Sentinel waits without receiving a reply from the
# primary before considering it subjectively down (SDOWN).
#
# 5000ms = 5 seconds:
#   - Aggressive enough to detect failures quickly
#   - Tolerant of brief network jitter (< 5s)
#   - Should be higher than the expected p99.9 latency of Redis PING
sentinel down-after-milliseconds apexmail-primary 5000

# ── Failover Timing ─────────────────────────────────────────────────────────

# How long (in milliseconds) a failover can take before Sentinel considers it
# to have failed.
#
# 30000ms = 30 seconds:
#   - Covers: replica promotion, replication offset sync, config rewrite
#   - If failover exceeds this, Sentinel aborts and retries
#   - Adjust upward if replicas are geographically distant or under heavy load
sentinel failover-timeout apexmail-primary 30000

# ── Parallel Syncs ──────────────────────────────────────────────────────────

# Number of replicas that can be reconfigured to replicate from the new primary
# simultaneously during a failover.
#
# Lower values = slower failover completion but less load on the new primary.
# Higher values = faster failover but may overwhelm the promoted instance.
sentinel parallel-syncs apexmail-primary 1

# ── Notification Scripts (Commented Out) ────────────────────────────────────

# Sentinel supports optional user-provided scripts that are called when certain
# events occur. These scripts can be used to integrate with external alerting,
# service discovery, or auto-remediation systems.
#
# IMPORTANT: Scripts block Sentinel during execution. If they take too long,
# Sentinel may time out on its own internal operations. Always use short-lived,
# idempotent scripts and consider backgrounding long-running work.

# sentinel notification-script <master-group-name> <script-path>
#
# Called when a Sentinel event occurs (e.g., -sdown, +sdown, -odown, +odown,
# +failover-start, +failover-end, etc.). Useful for routing Sentinel events to
# an external monitoring system (PagerDuty, Slack, OpsGenie, etc.).
#
# Example:
#   sentinel notification-script apexmail-primary /usr/local/bin/sentinel-notify.sh
#
# The script receives two arguments: the event type and the event description.

# sentinel client-reconfig-script <master-group-name> <script-path>
#
# Called AFTER a failover is completed and the configuration has been updated.
# The script receives:
#   <role> <ip> <port> <master-group-name> <old-ip> <old-port> <new-ip> <new-port>
#
# This is the recommended hook for updating DNS records, service discovery
# (Consul, etcd), or application-side connection pools to point at the new
# primary.
#
# Example:
#   sentinel client-reconfig-script apexmail-primary /usr/local/bin/update-dns.sh
#
# ApexMail applications using Redis should connect via Sentinel (not directly
# to the primary) so they automatically discover the new primary after failover.
# See: https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/
# for guidance on Sentinel-aware Redis clients.

# ── Security Considerations ─────────────────────────────────────────────────

# 1. Network ACLs: Sentinel should be bound to an internal network interface,
#    not 0.0.0.0. Use `bind` to restrict access:
#      bind 127.0.0.1 10.0.0.0/24
#
# 2. Authentication: Use `sentinel auth-pass` to authenticate Sentinel to
#    the Redis primary. All Redis instances in the cluster must share the
#    same password.
#
# 3. TLS: For production, run Sentinel + Redis over TLS.
#    See deploy/redis/entrypoint.sh for TLS configuration.
#
# 4. Minimum Sentinel count: Always run an odd number of Sentinels (3 or 5).
#    With 3, you tolerate 1 failure. With 5, you tolerate 2.
#
# 5. Split-brain prevention: The quorum of 2 ensures that a network partition
#    isolating a single Sentinel does not trigger a spurious failover.
