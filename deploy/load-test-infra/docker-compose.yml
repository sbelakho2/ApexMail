# ApexMail Load Test Environment
# =============================================================================
# One-command provisioning of all dependencies needed to run the full load
# test suite. Includes PostgreSQL, Redis, and a mock SMTP server (Mailpit).
#
# Usage:
#   docker compose -f deploy/load-test-infra/docker-compose.yml up -d
#   docker compose -f deploy/load-test-infra/docker-compose.yml down
#
# All credentials are read from environment variables. Copy .env.example to
# .env and customise before running.
#
# F11 hardening: every datastore port is bound to 127.0.0.1 ONLY (load-test
# credentials are throwaway but real; 0.0.0.0 exposed them to the network),
# and the Redis healthcheck authenticates via REDISCLI_AUTH instead of a
# `-a $PASSWORD` command line (visible in `ps` inside the container).
# =============================================================================

version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres: # nosemgrep — throwaway load-test stack (see file header): the only two rules that fire here are the docker-compose no-new-privileges and writable-filesystem checks, both triaged: production compose enforces security_opt/read_only on every service
    image: postgres:16-alpine
    container_name: apexmail-lt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexmail_loadtest}
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexmail} -d ${POSTGRES_DB:-apexmail_loadtest}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis: # nosemgrep — throwaway load-test stack (see file header): the only two rules that fire here are the docker-compose no-new-privileges and writable-filesystem checks, both triaged: production compose enforces security_opt/read_only on every service
    image: redis:7-alpine
    container_name: apexmail-lt-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    # The password is interpolated into the command by compose; exporting it
    # as container env lets the healthcheck authenticate via REDISCLI_AUTH
    # (redis-cli reads it automatically) instead of a `-a` CLI flag.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # $$ = literal for compose: the shell inside the container expands
      # $REDIS_PASSWORD from the environment block above.
      test: ["CMD-SHELL", "export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ── Mailpit (Mock SMTP) ───────────────────────────────────────────────────
  # Captures all outgoing emails during load tests. Web UI at http://localhost:8025
  mailpit: # nosemgrep — throwaway load-test stack (see file header): the only two rules that fire here are the docker-compose no-new-privileges and writable-filesystem checks, both triaged: production compose enforces security_opt/read_only on every service
    # SECURITY: Pin to specific version for reproducible builds
    image: axllent/mailpit:v1.21
    container_name: apexmail-lt-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP server
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"    # Web UI
    environment:
      MP_MAX_MESSAGES: 500000
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── k6 (optional, for running tests in container) ─────────────────────────
  k6: # nosemgrep — throwaway load-test stack (see file header): the only two rules that fire here are the docker-compose no-new-privileges and writable-filesystem checks, both triaged: production compose enforces security_opt/read_only on every service
    # SECURITY: Pin to specific version for reproducible builds
    image: grafana/k6:0.54.0
    container_name: apexmail-lt-k6
    profiles:
      - runner
    environment:
      K6_API_BASE: ${K6_API_BASE:-http://host.docker.internal:3000}
      K6_API_KEY: ${K6_API_KEY:?Set K6_API_KEY in .env}
      K6_TRACKING_BASE: ${K6_TRACKING_BASE:-http://host.docker.internal:3000}
      K6_OUT: ${K6_OUT:-}
    volumes:
      - ../../services/mail-server/crates/load-tests/tests/k6:/tests
    command: run /tests/api-load-test.js
    depends_on:
      - postgres
      - redis
      - mailpit

volumes:
  pgdata:
  redis-data:
  mailpit-data:
