services:
  postgres:
    volumes:
      - ./secrets/postgres_password.txt:/run/secrets/postgres_password:ro
  redis:
    volumes:
      - ./secrets/redis_password.txt:/run/secrets/redis_password:ro
  clickhouse:
    volumes:
      - ./secrets/clickhouse_password.txt:/run/secrets/clickhouse_password:ro
  api-server:
    volumes:
      - ./secrets/postgres_password.txt:/run/secrets/postgres_password:ro
      - ./secrets/redis_password.txt:/run/secrets/redis_password:ro
      - ./secrets/clickhouse_password.txt:/run/secrets/clickhouse_password:ro
      - ./secrets/internal_service_token.txt:/run/secrets/internal_service_token:ro
      - ./secrets/jwt_public_key_pem.txt:/run/secrets/jwt_public_key_pem:ro
      - ./secrets/jwt_private_key_pem.txt:/run/secrets/jwt_private_key_pem:ro
      - ./apps/marketing-zola/public:/app/apps/marketing-zola/public:ro
      # Hybrid: volume-mount host-built binary for fast deploys
      - /opt/apexmail/services/mail-server/target/release/api-server:/usr/local/bin/api-server:ro
    environment:
      KIWI_ENABLED: "true"
      KIWI_SECRET_KEY_FILE: /run/secrets/kiwi_secret_key
      KIWI_PBKDF2_ITERATIONS: "1"
      KIWI_DIFFICULTY_BITS: "14"
      KIWI_CHALLENGE_TTL_SECS: "120"
      KIWI_MIN_DURATION_MS: "0"
