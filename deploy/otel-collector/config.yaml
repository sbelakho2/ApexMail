# =============================================================================
# ApexMail OpenTelemetry Collector Configuration
# =============================================================================
# 🟡5: Added head-based probabilistic sampling to reduce observability costs
# while maintaining representative trace coverage.
#
# Sampling strategy:
#   - Traces: 10% head-based probabilistic sampling (adjust via env var)
#   - Metrics: 100% (low volume, high value)
#   - Logs: 100% (low volume, critical for debugging)
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # SECURITY: Enable TLS for production deployments
        # Uncomment and configure with proper certificates:
        # tls:
        #   cert_file: /etc/otelcol/certs/tls.crt
        #   key_file: /etc/otelcol/certs/tls.key
        #   client_ca_file: /etc/otelcol/certs/ca.crt
      http:
        endpoint: 0.0.0.0:4318
        # SECURITY: Enable TLS for production deployments
        # Uncomment and configure with proper certificates:
        # tls:
        #   cert_file: /etc/otelcol/certs/tls.crt
        #   key_file: /etc/otelcol/certs/tls.key
        #   client_ca_file: /etc/otelcol/certs/ca.crt
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:

processors:
  # 🟡5: Head-based probabilistic sampling for traces
  # Samples 10% of traces by default; override with OTEL_TRACES_SAMPLING_RATIO
  probabilistic_sampler:
    hash_seed: 42
    sampling_percentage: ${env:OTEL_TRACES_SAMPLING_PERCENTAGE}
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  debug:
    verbosity: basic
  otlp/tempo:
    endpoint: ${env:OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
    # Schema for the pinned collector: default_labels_enabled is a MAP of
    # label -> bool; per-attribute label hints live on the pipeline's
    # resource/log-to-attributes conversion, not an `attributes` list here.
    default_labels_enabled:
      exporter: false
      job: true
      instance: true
      service_name: true
      service_version: true
      environment: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      # 🟡5: probabilistic_sampler added before batch/memory_limiter to drop
      # traces early and reduce downstream load on Tempo
      processors: [probabilistic_sampler, memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp, hostmetrics]
      # Metrics are not sampled — they're low-volume and high-value for alerting
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      # Logs are not sampled — every log entry is important for debugging
      processors: [memory_limiter, batch]
      exporters: [loki, debug]
