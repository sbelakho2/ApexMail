# ApexMail Kernel Hardening — July 2026
# Apply: sysctl -p /etc/sysctl.d/99-apexmail-hardening.conf
# Reboot-persistent: copy to /etc/sysctl.d/

# ── Network Layer Hardening ──────────────────────────────────
# Enable SYN cookie protection against SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Enable reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable IP source routing (CVE-1999-0909 class)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Disable ICMP redirect acceptance
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable ICMP redirect sending
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Enable IP spoofing protection (ignore bogus ICMP errors)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP echo broadcasts (smurf attack mitigation)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable TCP timestamps for PAWS (Protection Against Wrapped Sequence numbers)
net.ipv4.tcp_timestamps = 1

# ── Connection Tracking Hardening ────────────────────────────
# Increase netfilter connection tracking table size for SMTP workloads
net.netfilter.nf_conntrack_max = 524288

# Reduce TIME_WAIT socket recycling interval
net.ipv4.tcp_fin_timeout = 30

# Fast reuse of TIME_WAIT sockets
net.ipv4.tcp_tw_reuse = 1

# Maximum number of kept TIME_WAIT sockets — protect against port exhaustion
net.ipv4.tcp_max_tw_buckets = 1440000

# ── General Kernel Hardening ─────────────────────────────────
# Kernel ASLR: randomize kernel image, modules, and data
kernel.kptr_restrict = 2

# Prevent unprivileged users from reading dmesg
kernel.dmesg_restrict = 1

# Restrict eBPF to privileged users (CAP_SYS_ADMIN or CAP_BPF)
kernel.unprivileged_bpf_disabled = 1

# Restrict user namespaces to CAP_SYS_ADMIN (mitigates many CVEs)
user.max_user_namespaces = 0

# Restrict perf_event_open to privileged users
kernel.perf_event_paranoid = 3

# Require PT_SCOPE privilege for process tracing
kernel.yama.ptrace_scope = 2

# Core dumps: restrict to pipe-only (if enabled at all)
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# ── Memory Hardening ─────────────────────────────────────────
# Disable memory overcommit abuse via mmap(MAP_32BIT)
vm.mmap_min_addr = 65536

# Disable kexec (prevent loading unsigned kernels at runtime)
kernel.kexec_load_disabled = 1

# ── Filesystem Hardening ─────────────────────────────────────
# Protect hardlinks from unprivileged cross-user linking
fs.protected_hardlinks = 1

# Protect symlinks from TOCTOU races
fs.protected_symlinks = 1

# Protect FIFOs and regular files in sticky directories
fs.protected_fifos = 2
fs.protected_regular = 2

# ── IPv6 Hardening ───────────────────────────────────────────
# Accept Router Advertisements only if forwarding is disabled
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Disable IPv6 auto-configuration (rely on static/DHCPv6 config)
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.default.autoconf = 0
