{{- if .Values.mta.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexmail.fullname" . }}-mta
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apexmail.labels" . | nindent 4 }}
    {{- include "apexmail.selectorLabels" (dict "name" "mta" "context" .) | nindent 4 }}
    app.kubernetes.io/component: mail-server
spec:
  {{- if not .Values.mta.autoscaling.enabled }}
  replicas: {{ .Values.mta.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "apexmail.selectorLabels" (dict "name" "mta" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "apexmail.labels" . | nindent 8 }}
        {{- include "apexmail.selectorLabels" (dict "name" "mta" "context" .) | nindent 8 }}
        app.kubernetes.io/component: mail-server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.mta.ports.metrics | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "apexmail.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "apexmail.podSecurityContext" . | nindent 6 }}
      {{- include "apexmail.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: mta
          image: {{ include "apexmail.image" (dict "image" .Values.mta.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: smtp
              containerPort: {{ .Values.mta.ports.smtp }}
              protocol: TCP
            - name: submission
              containerPort: {{ .Values.mta.ports.submission }}
              protocol: TCP
            - name: smtps
              containerPort: {{ .Values.mta.ports.smtps }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.mta.ports.metrics }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: METRICS_PORT
              value: {{ .Values.mta.ports.metrics | quote }}
            - name: METRICS_ENABLED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: database-url
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: redis-password
            {{- with .Values.mta.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.mta.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.mta.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              {{- if or (le (int .Values.mta.ports.smtp) 1024) (le (int .Values.mta.ports.smtps) 1024) }}
              add:
                - NET_BIND_SERVICE
              {{- end }}
          readinessProbe:
            tcpSocket:
              port: submission
            initialDelaySeconds: {{ .Values.mta.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.mta.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.mta.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.mta.probes.readiness.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: submission
            initialDelaySeconds: {{ .Values.mta.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.mta.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.mta.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.mta.probes.liveness.failureThreshold }}
          startupProbe:
            tcpSocket:
              port: submission
            initialDelaySeconds: {{ .Values.mta.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.mta.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.mta.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.mta.probes.startup.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spool
              mountPath: /var/spool/apexmail
      volumes:
        - name: tmp
          # 🟡7: Added size limit to prevent disk exhaustion
          emptyDir:
            sizeLimit: {{ .Values.mta.tmpEmptyDirSizeLimit | default "256Mi" }}
        - name: spool
          emptyDir:
            sizeLimit: {{ .Values.mta.spoolEmptyDirSizeLimit | default "1Gi" }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "apexmail.selectorLabels" (dict "name" "mta" "context" $) | nindent 14 }}
        {{- end }}
      {{- end }}
{{- end }}
