{{- if .Values.apiServer.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexmail.fullname" . }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apexmail.labels" . | nindent 4 }}
    {{- include "apexmail.selectorLabels" (dict "name" "api-server" "context" .) | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.apiServer.autoscaling.enabled }}
  replicas: {{ .Values.apiServer.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "apexmail.selectorLabels" (dict "name" "api-server" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "apexmail.labels" . | nindent 8 }}
        {{- include "apexmail.selectorLabels" (dict "name" "api-server" "context" .) | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.apiServer.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "apexmail.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "apexmail.podSecurityContext" . | nindent 6 }}
      {{- include "apexmail.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-server
          image: {{ include "apexmail.image" (dict "image" .Values.apiServer.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apiServer.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.apiServer.metricsPort }}
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.apiServer.port | quote }}
            - name: METRICS_PORT
              value: {{ .Values.apiServer.metricsPort | quote }}
            - name: API_REPLICA_COUNT
              value: {{ .Values.apiServer.replicaCount | quote }}
            - name: RUST_LOG
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: database-url
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: redis-password
            - name: TRACKING_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: tracking-secret-key
            - name: RATE_LIMIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: rate-limit-enabled
            - name: RATE_LIMIT_MAX_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: rate-limit-max-per-minute
            {{- with .Values.apiServer.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.apiServer.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.apiServer.resources | nindent 12 }}
          {{- include "apexmail.containerSecurityContext" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.apiServer.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiServer.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.apiServer.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.apiServer.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.apiServer.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiServer.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.apiServer.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.apiServer.probes.liveness.failureThreshold }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.apiServer.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiServer.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.apiServer.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.apiServer.probes.startup.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          # 🟡7: Added size limit to prevent disk exhaustion
          emptyDir:
            sizeLimit: {{ .Values.apiServer.tmpEmptyDirSizeLimit | default "256Mi" }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "apexmail.selectorLabels" (dict "name" "api-server" "context" $) | nindent 14 }}
        {{- end }}
      {{- end }}
{{- end }}
