{{/*
Custom Horizontal Pod Autoscaler configuration with Prometheus-Adapter metrics.
This file defines HPAs that use custom/external metrics (queue depth, request
latency p99, connection pool utilization) in addition to CPU/memory.

Prerequisites:
  1. Prometheus Adapter installed in the cluster
  2. Custom metrics registered in Prometheus Adapter config
  3. Services expose the required metrics on their /metrics endpoints
*/}}

{{- if .Values.customMetrics.enabled }}
{{- range $service := .Values.customMetrics.services }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "apexmail.fullname" $ }}-{{ $service.name }}-custom
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "apexmail.labels" $ | nindent 4 }}
    {{- include "apexmail.selectorLabels" (dict "name" $service.name "context" $) | nindent 4 }}
  annotations:
    description: "HPA with custom Prometheus metrics for {{ $service.name }}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "apexmail.fullname" $ }}-{{ $service.name }}
  minReplicas: {{ $service.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $service.autoscaling.maxReplicas | default 20 }}
  metrics:
    # ── CPU utilization (standard resource metric) ─────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $service.autoscaling.targetCPUUtilizationPercentage | default 70 }}

    # ── Memory utilization (standard resource metric) ──────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $service.autoscaling.targetMemoryUtilizationPercentage | default 80 }}

    {{- if hasKey $service "queueMetric" }}
    # ── Queue depth (custom metric via Prometheus Adapter) ─────────────────
    # Metric: apexmail_queue_depth{queue="<service>"}
    - type: Pods
      pods:
        metric:
          name: {{ $service.queueMetric.name | default "apexmail_queue_depth" }}
        target:
          type: AverageValue
          averageValue: {{ $service.queueMetric.target | default 100 }}
    {{- end }}

    {{- if hasKey $service "latencyMetric" }}
    # ── Request latency p99 (custom metric via Prometheus Adapter) ──────────
    # Metric: apexmail_http_request_duration_seconds{p90, pod="<pod>"}
    - type: Pods
      pods:
        metric:
          name: {{ $service.latencyMetric.name | default "apexmail_http_latency_p99" }}
        target:
          type: AverageValue
          averageValue: {{ $service.latencyMetric.target | default "500m" }}
    {{- end }}

    {{- if hasKey $service "connectionPoolMetric" }}
    # ── Connection pool utilization (custom metric via Prometheus Adapter) ──
    # Metric: apexmail_db_pool_utilization{pool="<service>"}
    - type: Pods
      pods:
        metric:
          name: {{ $service.connectionPoolMetric.name | default "apexmail_db_pool_utilization" }}
        target:
          type: AverageValue
          averageValue: {{ $service.connectionPoolMetric.target | default 0.8 }}
    {{- end }}

    {{- if hasKey $service "additionalMetrics" }}
    {{- range $metric := $service.additionalMetrics }}
    # ── Additional custom metric: {{ $metric.description }} ─────────────────
    - type: Pods
      pods:
        metric:
          name: {{ $metric.name }}
        target:
          type: AverageValue
          averageValue: {{ $metric.target }}
    {{- end }}
    {{- end }}

  # ── Scaling behavior ────────────────────────────────────────────────────
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ $service.autoscaling.scaleUpStabilization | default 60 }}
      policies:
        - type: Percent
          value: {{ $service.autoscaling.scaleUpPercent | default 100 }}
          periodSeconds: 60
        - type: Pods
          value: {{ $service.autoscaling.scaleUpPods | default 4 }}
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: {{ $service.autoscaling.scaleDownStabilization | default 300 }}
      policies:
        - type: Percent
          value: {{ $service.autoscaling.scaleDownPercent | default 10 }}
          periodSeconds: 60
{{- end }}
{{- end }}
