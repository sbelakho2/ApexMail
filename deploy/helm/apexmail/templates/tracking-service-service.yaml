{{- if .Values.trackingService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apexmail.fullname" . }}-tracking-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apexmail.labels" . | nindent 4 }}
    {{- include "apexmail.selectorLabels" (dict "name" "tracking-service" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.trackingService.service.type }}
  selector:
    {{- include "apexmail.selectorLabels" (dict "name" "tracking-service" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.trackingService.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9092
      targetPort: metrics
      protocol: TCP
{{- end }}
