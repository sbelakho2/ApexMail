{{- if .Values.enterprise.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexmail.fullname" . }}-enterprise
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apexmail.labels" . | nindent 4 }}
    {{- include "apexmail.selectorLabels" (dict "name" "enterprise" "context" .) | nindent 4 }}
    app.kubernetes.io/component: enterprise
spec:
  {{- if not .Values.enterprise.autoscaling.enabled }}
  replicas: {{ .Values.enterprise.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "apexmail.selectorLabels" (dict "name" "enterprise" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "apexmail.labels" . | nindent 8 }}
        {{- include "apexmail.selectorLabels" (dict "name" "enterprise" "context" .) | nindent 8 }}
        app.kubernetes.io/component: enterprise
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "apexmail.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "apexmail.podSecurityContext" . | nindent 6 }}
      {{- include "apexmail.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: enterprise
          image: {{ include "apexmail.image" (dict "image" .Values.enterprise.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.enterprise.port }}
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.enterprise.port | quote }}
            - name: RUST_LOG
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: database-url
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "apexmail.fullname" . }}-config
                  key: redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: redis-password
            {{- if .Values.hipaa.enabled }}
            - name: HIPAA_ENABLED
              value: "true"
            - name: KEK_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hipaa.encryption.kekSecret }}
                  key: {{ .Values.hipaa.encryption.kekSecretIdKey }}
            - name: KEK_MATERIAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hipaa.encryption.kekSecret }}
                  key: {{ .Values.hipaa.encryption.kekSecretKeyKey }}
            {{- end }}
            {{- with .Values.enterprise.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.enterprise.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.enterprise.resources | nindent 12 }}
          {{- include "apexmail.containerSecurityContext" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
