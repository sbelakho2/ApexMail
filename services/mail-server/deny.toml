# =============================================================================
# ApexMail — cargo-deny configuration
# =============================================================================
# See https://embarkstudios.github.io/cargo-deny/ for documentation.
#
# This file gates CI: `cargo deny check` runs on every PR to prevent
# vulnerable, unmaintained, or yanked dependencies from entering the
# workspace, and warns on duplicate crate versions for tracking.
#
# NOTE: This config targets cargo-deny >= 0.19.x.
# In 0.19.x, `vulnerability`, `notice`, and `severity-threshold` have
# been removed. Use `unmaintained`, `unsound` (scope) and `yanked` (severity).

[advisories]
# ── Scope ───────────────────────────────────────────────────────────────────
# Controls which crates are checked for each advisory type.
# Valid values: "all", "workspace", "transitive", "none"
unmaintained = "all"         # Check all crates for unmaintained status
unsound = "all"              # Check all crates for soundness issues

# ── Severity ────────────────────────────────────────────────────────────────
# Yanked versions: deny = block CI
yanked = "deny"

# ── Ignored advisories ──────────────────────────────────────────────────────
# Add advisory IDs here ONLY when:
#   1. The advisory has been reviewed and accepted by the engineering team
#   2. A fix is planned or the advisory doesn't affect ApexMail's use case
#   3. Each entry is annotated with a justification comment
ignore = [
    # ── hickory-proto (RUSTSEC-2026-0119) ────────────────────────────────
    # Hickory-proto 0.24.x is pulled in by hickory-resolver for DNS. The
    # O(n²) name compression CPU exhaustion only affects malicious DNS
    # responses; ApexMail uses trusted DNS resolvers. Tracked in #DEP-02.
    "RUSTSEC-2026-0119",

    # ── protobuf (RUSTSEC-2024-0437) ─────────────────────────────────────
    # Pulled in transitively by opentelemetry-proto for OTEL export. The
    # uncontrolled recursion crash requires crafted protobuf input. ApexMail
    # only deserializes protobuf from trusted OTEL collectors. Tracked in #DEP-03.
    "RUSTSEC-2024-0437",

    # ── rsa (RUSTSEC-2023-0071) ──────────────────────────────────────────
    # "Marvin Attack" timing sidechannel. No fixed upgrade available. The
    # rsa crate is used only for DKIM signing/verification, which does not
    # expose a timing oracle over the network. Tracked in #SEC-42.
    "RUSTSEC-2023-0071",

    # ── rustls-webpki 0.101.x (RUSTSEC-2026-0098/0099/0104) ──────────
    # Pulled in by older rustls 0.22.x. The 0.103.x version used by rustls
    # 0.23.x is updated to 0.103.13. Remaining 0.101.x advisories cannot be
    # updated due to semver constraints. Tracked in #DEP-04.
    "RUSTSEC-2026-0098",  # rustls-webpki: Name constraints for URI names
    "RUSTSEC-2026-0099",  # rustls-webpki: Wildcard name constraints
    "RUSTSEC-2026-0104",  # rustls-webpki: CRL parsing reachable panic

    # ── quick-xml <0.41 (RUSTSEC-2026-0194/0195) — LOCKSTEP with
    #    ci/pipeline.conf CI_CARGO_AUDIT_IGNORES (same justification there).
    # Five transitive copies <0.41 via the typst 0.14 ecosystem
    # (calamine/citationberg/plist) and mail-auth 0.4 (via mail-send 0.4).
    # The direct workspace copy IS patched (0.41). Revisit on typst 0.15 /
    # mail-send 0.6.
    "RUSTSEC-2026-0194",  # quick-xml: quadratic duplicate-attribute parsing
    "RUSTSEC-2026-0195",  # quick-xml: unbounded NsReader allocation DoS

    # ── h2 0.3.x (RUSTSEC-2026-0258) ─────────────────────────────────
    # Transitive via aws-smithy-http-client (AWS SDK); no fixed 0.3.x
    # exists; our h2 0.4 copy IS patched (>=0.4.16). Revisit on SDK refresh.
    "RUSTSEC-2026-0258",

    # ── Unmaintained crates (reviewed, low impact) ───────────────────────
    # bincode (RUSTSEC-2025-0141) — used for internal serialization in
    # non-critical paths. Replacement tracked in #DEP-05.
    "RUSTSEC-2025-0141",
    # fxhash (RUSTSEC-2025-0057) — used pervasively; replacement with
    # rustc-hash or ahash tracked in #DEP-06.
    "RUSTSEC-2025-0057",
    # instant (RUSTSEC-2024-0384) — pulled in by `cached` via leptos_router.
    # Only used for WASM time mocking; functionally stable. Tracked in #DEP-09.
    "RUSTSEC-2024-0384",
    # paste (RUSTSEC-2024-0436) — proc-macro helper, functionally stable.
    "RUSTSEC-2024-0436",
    # proc-macro-error (RUSTSEC-2024-0370) — pulled in by syn_derive → rstml
    # for leptos macro expansion. Functionally stable. Tracked in #DEP-10.
    "RUSTSEC-2024-0370",
    # rustls-pemfile (RUSTSEC-2025-0134) — superseded by rustls-pki-types.
    # Used only in legacy certificate loading paths. Tracked in #DEP-07.
    "RUSTSEC-2025-0134",
    # yaml-rust (RUSTSEC-2024-0320) — used only in config parsing for
    # legacy format. Replacement with serde_yaml tracked in #DEP-08.
    "RUSTSEC-2024-0320",
    # RUSTSEC-2023-0086 — soundness issue (lexical-core) in transitive dep.
    # Pulled in by nom 5.x (imap/imap-proto). Assessed: no exploitable path
    # in ApexMail's usage of IMAP.
    "RUSTSEC-2023-0086",
    # RUSTSEC-2026-0002 — lru IterMut violates Stacked Borrows.
    # Pulled in by leptos_router for reactive navigation cache. Assessed: no
    # UB in current usage patterns. Tracked in #DEP-11.
    "RUSTSEC-2026-0002",

    # ── 2026-09-10 deny-lane sync (new advisory DB entries, triaged) ────
    # ttf-parser 0.25 (RUSTSEC-2026-0192) and rustybuzz (RUSTSEC-2026-0206)
    # are unmaintained entries in the typst 0.14 / pdf-renderer
    # (dev-dependency evaluation) font stack — same treatment as the other
    # typst-ecosystem unmaintained entries above. Revisit on typst upgrade.
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained (typst stack)
    "RUSTSEC-2026-0206",  # rustybuzz unmaintained (typst stack)
    # scc 2.4.0 (RUSTSEC-2026-0205) — unsound Array::insert double-free,
    # reachable ONLY via serial_test 3.4 → integration-tests (test-only).
    # serial_test pins scc 2.x; the fix (>=3.8.4) needs a serial_test
    # release against scc 3. The panic-in-compare precondition never occurs
    # with serial_test's standard key types. Revisit on serial_test upgrade.
    "RUSTSEC-2026-0205",
]

# ── Duplicate version tracking ───────────────────────────────────────────────
# Multiple versions of the same crate increase binary size and compile time.
# Known unavoidable duplicates are listed in `skip-tree` with rationale.
#
# NOTE: multiple-versions is set to "warn" because many duplicates come from
# the pdf-renderer (typst) dev-dependency stack, IMAP library (imap v2.x pulls
# nom 5.x), and the wide crypto/ASN.1 crate family. These are tracked but not
# CI-blocking. Use `cargo deny check bans` locally to review.
[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip-tree = [
    # rustls 0.21 pulled in transitively via hickory-resolver 0.24
    # (trust-dns-resolver → hickory-resolver → hickory-proto → rustls 0.21)
    # Track https://github.com/hickory-dns/hickory-dns for upgrade.
    { name = "rustls", version = "0.21.12", depth = 1 },
    # hashbrown is vendored by many crates as an internal dep
    { name = "hashbrown", version = "0.12", depth = 1 },
    { name = "hashbrown", version = "0.14", depth = 1 },
    { name = "hashbrown", version = "0.15", depth = 1 },
    # quick-xml used by multiple crates at incompatible versions
    { name = "quick-xml", version = "0.31", depth = 1 },
    { name = "quick-xml", version = "0.36", depth = 1 },
    # phf / phf_shared — procedural macro dependencies
    { name = "phf", version = "0.11", depth = 1 },
    { name = "phf_shared", version = "0.11", depth = 1 },
    # itertools — widely used at different versions
    { name = "itertools", version = "0.10", depth = 1 },
    # der / pem-rfc7468 — cryptographic crate family
    { name = "der", version = "0.6", depth = 1 },
    { name = "der", version = "0.7", depth = 1 },
    { name = "pem-rfc7468", version = "0.7", depth = 1 },
    # base64
    { name = "base64", version = "0.21", depth = 1 },
    { name = "base64", version = "0.22", depth = 1 },
    # getrandom
    { name = "getrandom", version = "0.2", depth = 1 },
    # time
    { name = "time", version = "0.3.36", depth = 1 },
    { name = "time", version = "0.3.37", depth = 1 },
    # zstd-sys
    { name = "zstd-sys", version = "2.0.8+zstd.1.5.5", depth = 1 },
    { name = "zstd-sys", version = "2.0.9+zstd.1.5.5", depth = 1 },
    { name = "zstd-sys", version = "2.0.13+zstd.1.5.6", depth = 1 },
    # nom — three versions: 5.x (imap/imap-proto), 7.x (pdf-renderer), 8.x (core)
    { name = "nom", version = "5.1.3", depth = 1 },
    { name = "nom", version = "7.1.3", depth = 1 },
    # windows-sys / windows-targets / windows-*
    { name = "windows-sys", version = "0.48", depth = 1 },
    { name = "windows-sys", version = "0.52", depth = 1 },
    { name = "windows-targets", version = "0.48", depth = 1 },
    { name = "windows-targets", version = "0.52", depth = 1 },
    { name = "windows_aarch64_gnullvm", version = "0.48", depth = 1 },
    { name = "windows_aarch64_gnullvm", version = "0.52", depth = 1 },
    { name = "windows_aarch64_msvc", version = "0.48", depth = 1 },
    { name = "windows_aarch64_msvc", version = "0.52", depth = 1 },
    { name = "windows_i686_gnu", version = "0.48", depth = 1 },
    { name = "windows_i686_gnu", version = "0.52", depth = 1 },
    { name = "windows_i686_msvc", version = "0.48", depth = 1 },
    { name = "windows_i686_msvc", version = "0.52", depth = 1 },
    { name = "windows_x86_64_gnu", version = "0.48", depth = 1 },
    { name = "windows_x86_64_gnu", version = "0.52", depth = 1 },
    { name = "windows_x86_64_gnullvm", version = "0.48", depth = 1 },
    { name = "windows_x86_64_gnullvm", version = "0.52", depth = 1 },
    { name = "windows_x86_64_msvc", version = "0.48", depth = 1 },
    { name = "windows_x86_64_msvc", version = "0.52", depth = 1 },
    # pdf-renderer — dev-dependency for evaluation report generation.
    # Pulls in the entire typst stack (typst, pdf-renderer, krilla, resvg,
    # hayro, usvg, image, etc.) which has deep, unavoidable duplicate crate
    # versions. This is a leaf workspace member, not a library dependency.
    { name = "pdf-renderer", version = "0.1.0", depth = 10 },
]


[licenses]
# ── Allowed licenses ────────────────────────────────────────────────────────
# Inventory-driven allow list: exactly the SPDX expressions the workspace
# lockfile actually resolves to (`cargo deny list`, 2026-09-10 sweep over
# ~1500 locked crates). Every genuinely-permissive license found in the
# inventory is listed; anything NOT listed fails `cargo deny check licenses`
# fail-closed, so a newly introduced GPL/AGPL/SSPL/unknown-license
# dependency breaks the build until it is consciously reviewed here.
# (Two historical entries — "OpenSSL" and "LicenseRef-Adobe-Glyph" — were
# dropped: no locked crate carries them today. Re-add ONLY with a
# justification if a future inventory needs them.)
allow = [
    "0BSD",                    # BSD Zero Clause (3 crates)
    "Apache-2.0",              # Apache License 2.0 (638 crates)
    "Apache-2.0 WITH LLVM-exception",  # LLVM Exception (9 crates)
    "BSD-2-Clause",            # BSD 2-Clause (5 crates)
    "BSD-3-Clause",            # BSD 3-Clause (12 crates)
    "BSL-1.0",                 # Boost Software License (3 crates)
    "CC0-1.0",                 # Creative Commons Zero v1.0 (5 crates)
    "CDLA-Permissive-2.0",     # Community Data License Agreement (2 crates)
    "ISC",                     # ISC License (19 crates)
    "MIT",                     # MIT License (745 crates)
    "MIT-0",                   # MIT No Attribution (3 crates)
    "MPL-2.0",                 # Mozilla Public License 2.0 (6 crates — file-level copyleft, per-file compliance OK)
    "Unicode-3.0",             # Unicode License v3 (39 crates)
    "Unlicense",               # The Unlicense (9 crates)
    "Zlib",                    # zlib License (13 crates)
    # First-party only: the workspace root sets license = "LicenseRef-PROPRIETARY"
    # (inherited by every crates/* member). A registry crate would have to
    # literally declare this id to pass — treat any such occurrence as a
    # review event, not a silent pass.
    "LicenseRef-PROPRIETARY",
]

# ── Scoped exceptions (reviewed weak-copyleft, per-crate) ──────────────────
# LGPL-2.1-or-later is NOT in the general allow list — ApexMail is a
# proprietary product and weak-copyleft licenses are accepted only as
# narrow, justified, crate-scoped exceptions below. Never widen this to a
# blanket allow.
[[licenses.exceptions]]
# r-efi 5.3.0 / 6.0.0 — LGPL-2.1-or-later EFI API bindings, pulled into
# Cargo.lock by getrandom 0.3.x/0.4.x. getrandom declares it as
#   [target.'cfg(all(target_os = "uefi", getrandom_backend = "efi_rng"))'.dependencies]
# (verified in the vendored manifests): the crate is compiled ONLY for UEFI
# targets with the efi_rng backend explicitly enabled. ApexMail ships
# Linux (debian:bookworm-slim docker images) and macOS dev builds — no
# distributed binary ever links r-efi code, so LGPL redistribution
# obligations are never triggered. Cargo.lock is target-agnostic, which is
# the only reason cargo-deny sees it at all. REVISIT if a UEFI target is
# ever added: at that point the exception must be re-reviewed with counsel
# (static LGPL linking requires relinkable object files or dynamic linking).
allow = ["LGPL-2.1-or-later"]
crate = "r-efi"

# ── Private / workspace crate handling ─────────────────────────────────────
# Workspace crates inherit `license = "PROPRIETARY"` (or no license field)
# from the root Cargo.toml, which cargo-deny cannot resolve as a valid SPDX
# expression. These are first-party path dependencies published only within
# the ApexMail workspace; they are not uploaded to crates.io and are
# governed by the project LICENSE file.
#
# Setting `ignore = true` instructs cargo-deny to skip license verification
# for all path dependencies that are not published to a registry.
[licenses.private]
ignore = true

[sources]
allow-git = []
unknown-registry = "deny"
unknown-git = "deny"
