[package]
name = "waf-engine"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust Web Application Firewall: AST-based SQLi/XSS prevention, OWASP CRS-compatible rule engine, zero-copy payload inspection"
license.workspace = true  # LicenseRef-PROPRIETARY via workspace (was literal "PROPRIETARY")

[features]
default = ["core"]
full = ["core"]
core = []

[dependencies]
# Async
tracing = "0.1"
mail-common = { path = "../mail-common" }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Pattern matching (Aho-Corasick, zero-backtrack)
aho-corasick = { version = "1.1", features = ["perf-literal"] }
unicode-normalization = "0.1"

# Utilities
thiserror = "2.0"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "waf_bench"
harness = false
