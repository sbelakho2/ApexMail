[package]
name = "api-server"
version.workspace = true
license.workspace = true
edition.workspace = true
[[bin]]
name = "api-server"
path = "src/bin/server.rs"

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
apexmail-db = { path = "../apexmail-db" }
dns-resolver = { path = "../dns-resolver", package = "apexmail-dns-resolver" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Contact-form parsing: repeated checkbox keys (compliance_needs=…&…)
# cannot be collected by serde_urlencoded, so routes/contact.rs parses
# the RawForm body directly. Already in the tree via serde_urlencoded.
form_urlencoded = "1"
sqlx = { workspace = true }
redis = { workspace = true }
deadpool-redis = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
sha1 = { version = "0.10", features = ["oid"] }
hmac = { workspace = true }
rsa = { workspace = true }
zeroize = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
ipnetwork = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }
x509-parser = "0.16"
csv = "1.3"
calamine = "0.26"
bcrypt = "0.15"
regex = "1"
jsonwebtoken = "11.0"
http = "1.0"
dirs = "5.0"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# AWS SDK (SES dedicated IP management)
aws-config = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
urlencoding = { workspace = true }

# Internal crates
email-grader = { path = "../email-grader" }
threat-intel = { path = "../threat-intel" }
billing-service = { path = "../billing-service" }
billing-common = { path = "../billing-common" }
ui-foundation = { path = "../ui-foundation" }
mail-common = { path = "../mail-common" }
ddos-protection = { path = "../ddos-protection" }
waf-engine = { path = "../waf-engine" }
apexmail-analytics = { path = "../analytics", package = "analytics" }
observability-service = { path = "../observability-service" }
inbox-placement = { path = "../inbox-placement" }
kiwicaptcha = { path = "../../../../packages/kiwicaptcha" }

[features]
default = []
# Live-database integration tests that require a running PostgreSQL instance
# and the full AppState wiring (DdosProtector). Disabled by default.
live-db = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
# DB-backed tests bootstrap through the REAL production migrator (audit F01):
# the same embedded canonical migration set the deploy gate applies.
migrator = { path = "../migrator" }
