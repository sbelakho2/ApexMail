[package]
name = "api-server"
version.workspace = true
edition.workspace = true
[[bin]]
name = "api-server"
path = "src/bin/server.rs"

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
apexmail-db = { path = "../apexmail-db" }
dns-resolver = { path = "../dns-resolver", package = "apexmail-dns-resolver" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
deadpool-redis = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
ipnetwork = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }
jsonwebtoken = "9.3"
headers = "0.4"
http = "1.0"
dirs = "5.0"

# AWS SDK (SES dedicated IP management)
aws-config = { workspace = true }
aws-sdk-sesv2 = { workspace = true }

# Internal crates
ops-service = { path = "../ops-service" }
billing-service = { path = "../billing-service" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }