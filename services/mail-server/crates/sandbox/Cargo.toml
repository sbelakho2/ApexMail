[package]
name = "sandbox"
version = "0.1.0"
edition.workspace = true
description = "Secure attachment detonation sandbox using Linux namespaces, cgroups v2, and seccomp-bpf"
license.workspace = true  # LicenseRef-PROPRIETARY via workspace (was "MIT" — scaffolding drift; the product is proprietary per the root LICENSE)

[dependencies]
tokio = { workspace = true, features = ["full"] }
sha2 = { workspace = true }
hex = "0.4"
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { workspace = true, features = ["v4"] }
aho-corasick = { workspace = true }
mail-common = { path = "../mail-common", optional = true }

[features]
events = ["mail-common"]
