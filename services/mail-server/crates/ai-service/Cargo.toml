[package]
name = "ai-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail AI Intelligence Suite — analytics, assistant, bandits, content, inference, STO, and training"

[[bin]]
name = "ai-service"
path = "src/bin/server.rs"

[dependencies]
mail-parser.workspace = true
sha2.workspace = true
apexmail-lib = { path = "../apexmail-lib" }

# Async runtime
tokio.workspace = true

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Database and distributed rate limiting
sqlx.workspace = true

# Cryptography and persistence
aes-gcm.workspace = true
zeroize.workspace = true
hex.workspace = true

# HTML sanitization
ammonia = "4.0"

# Utils
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }
thiserror.workspace = true
anyhow.workspace = true
reqwest.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
regex.workspace = true
rand.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
