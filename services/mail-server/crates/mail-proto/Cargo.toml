[package]
name = "mail-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tonic.workspace = true
prost.workspace = true

# The tonic/prost generated server traits return Result<_, tonic::Status>
# (>128 bytes) — generated code, not ours to restructure.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[lints.clippy]
result_large_err = "allow"


[build-dependencies]
tonic-build.workspace = true

[package.metadata.cargo-machete]
# `tonic-build` is used from build.rs (`tonic_build::configure()...compile_protos(...)`).
# Plain `cargo machete` (the CI gate) detects that usage; only
# `cargo machete --with-metadata` mis-resolves the workspace-inherited
# build-dependency and reports it as unused. Keeping it in this list keeps both
# modes honest: the crate genuinely stops compiling if the build.rs call goes away.
ignored = ["tonic-build"]
