<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApexMail Control Plane</title><meta name="description" content="ApexMail administration and monitoring"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><link rel="stylesheet" href="/assets/globals.css"></head><body class="antialiased bg-surface-950 text-surface-100"><main class="flex min-h-screen items-center justify-center"><div class="w-full max-w-md space-y-8 rounded-sm border border-border bg-card p-8 "><div class="text-center"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-sm bg-primary text-primary-foreground font-bold text-lg shadow">A</div><h1 class="mt-4 text-2xl font-bold">Control Plane</h1><p class="mt-2 text-sm text-muted-foreground">Administrator access</p></div><form class="space-y-4" action="/api/auth/login" method="POST"><div class="space-y-2"><label for="login-email" class="text-sm font-medium leading-none">Email or username</label><input id="login-email" name="email" type="text" required autocomplete="username" placeholder="admin@apexmail.ee" class="flex h-10 w-full rounded-sm border border-input bg-background px-3 py-2 text-sm" /></div><div class="space-y-2"><label for="login-password" class="text-sm font-medium leading-none">Password</label><input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="flex h-10 w-full rounded-sm border border-input bg-background px-3 py-2 text-sm" /></div><button type="submit" class="inline-flex items-center justify-center whitespace-nowrap rounded-sm text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 h-10 w-full">Sign In</button></form><div id="login-mfa" class="hidden space-y-4"><p class="text-sm text-muted-foreground">MFA Verification</p><input name="mfaCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" class="flex h-10 w-full rounded-sm border border-input bg-background px-3 py-2 text-sm font-mono text-center tracking-widest" /></div></div></main></body></html>
