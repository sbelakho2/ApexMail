[package]
name = "ddos-protection"
version = "0.1.0"
edition = "2021"
description = "Multi-layer DDoS protection for ApexMail"
license = "MIT"

[features]
default = ["core"]
full = ["core", "ml", "challenges", "coordinator"]
core = []
ml = ["dep:rand"]
challenges = ["dep:hex", "dep:hmac", "dep:subtle"]
coordinator = ["dep:redis", "dep:bincode"]
xdp = []  # Requires separate kernel module build

[dependencies]
# Core
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
mail-common = { path = "../mail-common" }
parking_lot = "0.12"
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Rate limiting (internal)
apexmail-rate-limiter = { path = "../rate-limiter" }

# Fingerprinting
fingerprint = { path = "../fingerprint" }

# ML (optional)
rand = { version = "0.9", optional = true }

# Challenges (optional)
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
subtle = { version = "2.5", optional = true }

# Coordination (optional)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
bincode = { version = "1.3", optional = true }

# Metrics
prometheus = "0.13"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
once_cell = "1.21"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
rand = "0.9"
tempfile = "3.14"
sha2 = "0.10"
hex = "0.4"

[[bench]]
name = "rate_limiter"
harness = false
