[package]
name = "fuzz-tests"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
billing-service = { path = "../billing-service" }
ai-service = { path = "../ai-service" }
pattern-matcher = { path = "../pattern-matcher" }
observability-service = { path = "../observability-service" }
# SM12 F2: the property suite exercises these PRODUCTION types directly
# (SlidingWindowCounter, worker-processors CircuitBreaker) instead of the
# local reimplementations the suite used to carry.
apexmail-rate-limiter = { path = "../rate-limiter" }
worker-processors = { path = "../worker-processors" }

rand = { workspace = true }
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true

# T7 parser drivers (src/fuzz_api.rs): the SAME parsers production runs.
# mta exposes doc-hidden seams over its SMTP command/envelope tokenizers; the
# MIME parser is the mail-parser call the submission path makes; DKIM/SPF/
# DMARC are mail-auth's record parsers; the remaining surfaces are the
# template, tracking and billing webhook-verification crates.
mta = { path = "../mta" }
mail-parser = { workspace = true }
mail-auth = { workspace = true }
template-renderer = { path = "../template-renderer" }
tracking-service = { path = "../tracking-service" }
mail-proto = { path = "../mail-proto" }
prost = { workspace = true }
# NOTE: imap-proto-patched is a NESTED workspace (`[workspace]` in its
# Cargo.toml), so the main workspace cannot depend on it ("multiple
# workspace roots"). Its parser is fuzzed by the libFuzzer target
# `fuzz_imap_response` in the separate fuzz subproject; the deterministic
# smoke test covers the other targets and documents the gap.

# Property-based testing
proptest = "1.4"

# Security crates for fuzz testing
waf-engine = { path = "../waf-engine" }
ids-engine = { path = "../ids-engine" }
spam-filter = { path = "../spam-filter" }
dlp-engine = { path = "../dlp-engine" }
sandbox = { path = "../sandbox" }
ato-protection = { path = "../ato-protection" }
threat-intel = { path = "../threat-intel" }
