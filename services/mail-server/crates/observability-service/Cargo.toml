[package]
name = "observability-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail observability service – Prometheus metrics, distributed tracing, log aggregation, alerting, SLO monitoring, and health check dashboards"

[[bin]]
name = "observability-service"
path = "src/bin/server.rs"

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
apexmail-db = { path = "../apexmail-db" }

# Async runtime
tokio.workspace = true

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Database
sqlx.workspace = true

# Utils
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
zeroize.workspace = true

# Logging & Observability
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Redis (key eviction monitoring)
deadpool-redis.workspace = true
redis.workspace = true

# OpenTelemetry (distributed tracing)
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true

# HTTP client (for alert webhooks)
reqwest.workspace = true

# CLI / Config
clap.workspace = true
dotenvy.workspace = true
