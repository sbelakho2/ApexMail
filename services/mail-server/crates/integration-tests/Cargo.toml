[package]
name = "integration-tests"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
apexmail-db = { path = "../apexmail-db" }
api-server = { path = "../api-server" }
kiwicaptcha = { path = "../../../../packages/kiwicaptcha" }
billing-service = { path = "../billing-service" }
platform-catalog = { path = "../platform-catalog" }
devex-service = { path = "../devex-service" }
observability-service = { path = "../observability-service" }
sales-autopilot = { path = "../sales-autopilot" }
ai-service = { path = "../ai-service" }
analytics = { path = "../analytics" }
compliance = { path = "../compliance" }
enterprise = { path = "../enterprise" }
pattern-matcher = { path = "../pattern-matcher" }
# The `redis` feature is required so these tests can drive the REAL
# `RedisLimiter` (token-bucket Lua + tenant-scoped in-memory fallback),
# not only the always-available in-memory primitives (audit F16a).
apexmail-rate-limiter = { path = "../rate-limiter", features = ["redis"] }
template-renderer = { path = "../template-renderer" }
ui-foundation = { path = "../ui-foundation" }
# Gate G / service page contracts render the tracking-service unsubscribe and
# preferences pages directly (workspace-internal dev surface, batch 1 W2).
tracking-service = { path = "../tracking-service" }

# Security crates for integration testing
waf-engine = { path = "../waf-engine" }
ids-engine = { path = "../ids-engine" }
spam-filter = { path = "../spam-filter" }
dlp-engine = { path = "../dlp-engine" }
sandbox = { path = "../sandbox" }
ato-protection = { path = "../ato-protection" }
threat-intel = { path = "../threat-intel" }
worker-processors = { path = "../worker-processors" }

tokio = { workspace = true, features = ["full", "test-util"] }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
aws-config.workspace = true
aws-sdk-sesv2.workspace = true
deadpool-redis.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
parking_lot = { workspace = true }
serial_test = "3"

[dev-dependencies]
# Test-only: implement `billing_service::send_admission::SendAdmissionBackend`
# (an `#[async_trait]` trait) for the in-memory admission fake used by the
# adversarial mail-workflow suite.
async-trait.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
tracing-subscriber.workspace = true
# The schema-contract suite validates against the REAL deploy-time schema:
# the canonical chain applied through the production migrator (audit F01).
migrator = { path = "../migrator" }
