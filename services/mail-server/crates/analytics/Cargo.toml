[package]
name = "analytics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail analytics – query engine, compaction, STO, churn, subject analysis, bot detection, etc."

[[bin]]
name = "analytics-worker"
path = "src/bin/worker.rs"

[dependencies]
mail-common = { path = "../mail-common" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true

# Database
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
clickhouse = { version = "0.12", features = ["lz4", "time"] }
time = "0.3"

# Redis
deadpool-redis.workspace = true
redis.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }

# Utils
chrono.workspace = true
# IANA timezone resolution for tenant-local send-time optimization (F5).
# Same version already used by billing-service — not a new workspace dep.
chrono-tz = "0.10"
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
regex.workspace = true
sha2.workspace = true
hmac.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
moka.workspace = true
rand.workspace = true

# CLI / Config
clap.workspace = true
dotenvy.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
