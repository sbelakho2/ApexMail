[package]
name = "outbound-mta"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Recipient-facing outbound MTA: durable queueing, MX resolution, retry/TLS/source-IP policy, DSNs, idempotent acceptance"

[features]
# Exposes the in-memory ledger, the static MX resolver and the scripted SMTP
# server so dependent test suites (worker-processors) can exercise the
# submission/acceptance contract end to end without Postgres or real DNS.
# Never enabled for production binaries.
test-support = []

[lib]
name = "outbound_mta"
path = "src/lib.rs"

[[bin]]
name = "outbound-mta"
path = "src/main.rs"

[dependencies]
# Workspace crates (reuse only: MX lookup helpers + the canonical warmup schedule)
apexmail-dns-resolver = { path = "../dns-resolver" }
mail-common = { path = "../mail-common" }
sha2 = { workspace = true }
# Warmup admission at the SMTP-effect boundary (P0): the relay is the
# component that can transmit DATA, so it owns the warming-IP daily cap.
deadpool-redis = { workspace = true }
redis = { workspace = true }

# Async runtime
tokio.workspace = true
async-trait.workspace = true

# Database (durable queue / acceptance ledger)
sqlx.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging & Observability
tracing.workspace = true
tracing-subscriber.workspace = true

# TLS
rustls.workspace = true
# NOTE: tokio-rustls's default `aws_lc_rs` feature is active here; the
# workspace `rustls` pin adds `ring`, leaving two crypto providers in the
# graph. `crate::tls::client_config` therefore installs the ring provider
# explicitly before the first ClientConfig::builder() call.
tokio-rustls.workspace = true
webpki-roots = "0.26"

# HTTP (health endpoint)
axum.workspace = true

# Utils
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros"] }
# The gate tests drive the fake SMTP server through the crate's own
# test-support surface.
outbound-mta = { path = ".", features = ["test-support"] }
# Canonical test fixtures: a PRIVATE migration-chain database per DB test
# (the shared-table variant raced under nextest's process-per-test model).
migrator = { path = "../migrator" }
