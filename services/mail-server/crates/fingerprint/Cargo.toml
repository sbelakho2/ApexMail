[package]
name = "fingerprint"
version = "0.1.0"
edition = "2021"
description = "TLS and HTTP/2 fingerprinting for bot detection"
# Proprietary — matches the root LICENSE (Bel Consulting OÜ) and the workspace
# default (services/mail-server/Cargo.toml `license = "PROPRIETARY"`).
license.workspace = true  # LicenseRef-PROPRIETARY via workspace (was literal "PROPRIETARY")

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
dashmap = "6.1"

[dev-dependencies]
tokio-test = "0.4"
