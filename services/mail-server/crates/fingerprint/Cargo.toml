[package]
name = "fingerprint"
version = "0.1.0"
edition = "2021"
description = "TLS and HTTP/2 fingerprinting for bot detection"
license = "MIT"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
dashmap = "6.1"

[dev-dependencies]
tokio-test = "0.4"
