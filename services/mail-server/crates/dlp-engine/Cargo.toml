[package]
name = "dlp-engine"
version = "0.1.0"
edition.workspace = true
description = "Data Loss Prevention engine — PII detection, sensitive data scanning, document watermarking, and outbound content policies"
license.workspace = true  # LicenseRef-PROPRIETARY via workspace (was "MIT" — scaffolding drift; the product is proprietary per the root LICENSE)

[dependencies]
aho-corasick = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
flate2 = "1.1"
tracing = { workspace = true }
unicode-normalization = { workspace = true }
idna = "1"
mail-common = { path = "../mail-common", optional = true }

[features]
default = ["events"]
events = ["mail-common"]
