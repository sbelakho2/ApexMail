[package]
name = "sales-autopilot"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sales-autopilot"
path = "src/bin/server.rs"

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
apexmail-db  = { path = "../apexmail-db" }
async-trait.workspace      = true
tokio.workspace            = true
axum.workspace             = true
serde.workspace            = true
serde_json.workspace       = true
sqlx.workspace             = true
uuid.workspace             = true
chrono.workspace           = true
tracing.workspace          = true
thiserror.workspace        = true
reqwest.workspace          = true
dashmap.workspace          = true
parking_lot.workspace      = true
regex.workspace            = true
url.workspace              = true
tower-http.workspace       = true
tower.workspace            = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }
# Real quota gate for campaign/reply sends (audit F1): the dispatcher calls
# billing_service::usage::record_with_quota_check / rollback_usage_record —
# the same functions api-server's REST send path uses — instead of a local
# mirror whose counter key drifted from the billing-cycle-anchored original.
billing-service = { path = "../billing-service" }
metrics.workspace             = true
anyhow.workspace           = true
deadpool-redis.workspace   = true
redis.workspace            = true

[dev-dependencies]
# Test databases bootstrap through the REAL production migrator (audit F01):
# the same embedded canonical migration set the deploy gate applies.
migrator = { path = "../migrator" }
