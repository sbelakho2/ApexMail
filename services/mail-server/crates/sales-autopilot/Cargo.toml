[package]
name = "sales-autopilot"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "sales-autopilot"
path = "src/bin/server.rs"

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
async-trait.workspace      = true
tokio.workspace            = true
axum.workspace             = true
serde.workspace            = true
serde_json.workspace       = true
sqlx.workspace             = true
uuid.workspace             = true
chrono.workspace           = true
# IANA timezone database (DST-correct calendar arithmetic, §29).
chrono-tz.workspace        = true
tracing.workspace          = true
thiserror.workspace        = true
reqwest.workspace          = true
parking_lot.workspace      = true
url.workspace              = true
tower-http.workspace       = true
tower.workspace            = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }
# F85: campaign creation initializes its optimization arm through the
# canonical campaign_arms producer (analytics::campaign_autopilot).
analytics = { path = "../analytics" }
# Real quota gate for campaign/reply sends (audit F1): the dispatcher calls
# billing_service::usage::record_with_quota_check / rollback_usage_record —
# the same functions api-server's REST send path uses — instead of a local
# mirror whose counter key drifted from the billing-cycle-anchored original.
billing-service = { path = "../billing-service" }
metrics.workspace             = true
anyhow.workspace           = true
deadpool-redis.workspace   = true
redis.workspace            = true
# Waterfall/independent provider calls are joined with futures::future::join_all.
futures.workspace          = true
# The experiment engine draws Thompson samples through the ONE Beta sampler
# (analytics::campaign_autopilot::sample_beta), which takes a `rand::Rng`.
rand.workspace             = true
# Opaque v2 unsubscribe tokens: 32 random bytes (rand::rngs::OsRng) are
# URL-safe base64-encoded for the link and only their SHA-256 hash is stored
# (migration 203's sales_unsubscribe_tokens). Both crates are already in the
# workspace dependency table.
base64.workspace           = true
sha2.workspace             = true

[dev-dependencies]
# Test databases bootstrap through the REAL production migrator (audit F01):
# the same embedded canonical migration set the deploy gate applies.
migrator = { path = "../migrator" }
