[package]
name = "mailstore-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "mailstore"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
mail-common = { path = "../mail-common" }
mail-proto = { path = "../mail-proto" }

# Async runtime
tokio.workspace = true
tokio-stream = "0.1"
futures.workspace = true

# gRPC
tonic.workspace = true

# Database
sqlx.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Email parsing
mail-parser.workspace = true

# Utilities
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }
clap.workspace = true
argon2.workspace = true

# Rate limiting
governor.workspace = true
nonzero_ext.workspace = true

# Encryption at rest
aes-gcm.workspace = true
zeroize.workspace = true
base64.workspace = true

# Crypto helpers
rand.workspace = true
sha2.workspace = true

[dev-dependencies]
# Canonical test fixtures (audit F01): DB-gated tests provision a throwaway
# database carrying the REAL production migration chain through the production
# migrator's test_support, instead of connecting to the base TEST_DATABASE_URL
# — whose early history predates later canonical migrations (e.g. 097 drops the
# account-wide UNIQUE(account_id, message_id) index these tests depend on).
migrator = { path = "../migrator" }
