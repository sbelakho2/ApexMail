[package]
name = "ato-protection"
version = "0.1.0"
edition.workspace = true
description = "Account Takeover Protection — behavioral biometrics, impossible travel detection, session fingerprinting, and adaptive MFA"
license.workspace = true  # LicenseRef-PROPRIETARY via workspace (was "MIT" — scaffolding drift; the product is proprietary per the root LICENSE)

[dependencies]
tokio = { workspace = true, features = ["full"] }
sha2 = { workspace = true }
hex = "0.4"
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = "0.1"
uuid = { workspace = true, features = ["v4"] }
mail-common = { path = "../mail-common", optional = true }
redis = { workspace = true, optional = true, features = ["tokio-comp"] }

[features]
default = ["redis-lockout"]
events = ["mail-common"]
# Enabled by default: without it, RedisLockoutBackend degrades to a logged
# no-op that reports zero historical lockouts — a fail-open trap for any
# caller that constructs it without reading the feature matrix.
redis-lockout = ["redis"]
