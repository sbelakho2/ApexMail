[package]
name = "threat-intel"
version = "0.1.0"
edition.workspace = true
description = "Threat intelligence feed ingestion, IP/domain blocklist management, and reputation scoring"
license.workspace = true  # LicenseRef-PROPRIETARY via workspace (was "MIT" — scaffolding drift; the product is proprietary per the root LICENSE)

[dependencies]
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
mail-common = { path = "../mail-common", optional = true }

[features]
events = ["mail-common"]
