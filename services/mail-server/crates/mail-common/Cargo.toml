[package]
name = "mail-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
config.workspace = true
dotenvy.workspace = true
# Concurrent hash map for high-throughput security event correlation
dashmap = "6.1"
# Better atomics for rate limiting
parking_lot = "0.12"
# HMAC for event signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# CSPRNG for cryptographic key generation
rand.workspace = true
# Lock-free atomic config hot-reload
arc-swap.workspace = true
# Optional — enabled by crates that pull in sqlx
sqlx = { workspace = true, optional = true }
# Optional — enabled by crates that need internal auth middleware
axum = { workspace = true, optional = true }
# Constant-time comparison for token authentication
subtle = { version = "2.6", optional = true }

[features]
sqlx = ["dep:sqlx"]
axum = ["dep:axum", "dep:subtle"]