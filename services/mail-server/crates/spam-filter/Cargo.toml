[package]
name = "spam-filter"
version = "0.1.0"
edition = "2021"
description = "Multi-layer spam & phishing detection: Bayesian classifier, URL reputation, header analysis, content scoring"
license.workspace = true  # LicenseRef-PROPRIETARY via workspace (was literal "PROPRIETARY")

[features]
default = ["full"]
full = ["core", "phishing", "events"]
core = []
phishing = ["reqwest"]  # Enables deep URL and attachment analysis
events = ["mail-common"]

[dependencies]
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
aho-corasick = { version = "1.1", features = ["perf-literal"] }
url = "2.5"
idna = "1.0"
unicode-normalization = { workspace = true }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }
mail-common = { path = "../mail-common", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
