[package]
name = "tracking-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail high-performance email tracking service (open pixel, click, unsubscribe)"

[[bin]]
name = "tracking-service"
path = "src/main.rs"

[dependencies]
mail-common = { path = "../mail-common", features = ["sqlx"] }
# D: recipient privacy-encoding for the ClickHouse analytics ingest path.
analytics = { path = "../analytics" }
# F54: canonical 26-char entity-ID generator (same one the api-server uses
# for suppressions.id — `generate_id("sup", 22)`); suppressions.id and
# subscription_preferences.id are VARCHAR(26) and must not receive the
# 36-char UUID-based IDs the tracking crate used to mint locally.
apexmail-lib = { path = "../apexmail-lib" }

# Async runtime
tokio.workspace = true
futures.workspace = true
async-stream.workspace = true
tokio-stream.workspace = true

# HTTP server
axum.workspace = true
tower-http.workspace = true

# CLI / config
dotenvy.workspace = true

# Logging & Observability
tracing.workspace = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Database
sqlx.workspace = true

# ClickHouse (OLAP event ingestion)
clickhouse = { version = "0.12", features = ["lz4", "time"] }
time = "0.3"

# Redis
deadpool-redis.workspace = true
redis.workspace = true

# Cache
moka.workspace = true

# Crypto
aes-gcm.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
zeroize.workspace = true
subtle = "2"
jsonwebtoken = "11.0"

# Pattern matching (linear-time)
aho-corasick.workspace = true

# IP networking
ipnetwork.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# Error handling
anyhow.workspace = true

# Utils
hex.workspace = true
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
axum-test = "14"
tokio = { version = "1", features = ["full", "test-util"] }
