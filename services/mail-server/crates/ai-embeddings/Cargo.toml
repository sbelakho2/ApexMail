[package]
name = "ai-embeddings"
description = "AI text embeddings, vector store, and similarity search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ai-embeddings"
path = "src/bin/server.rs"

[dependencies]
# Async
tokio = { workspace = true }

# HTTP
axum = { workspace = true }
apexmail-lib = { path = "../apexmail-lib" }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
observability-service = { path = "../observability-service" }
metrics = { workspace = true }

# Utils
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Config
clap = { workspace = true }
dotenvy = { workspace = true }

# Concurrent data structures (O-9.4)
dashmap = { workspace = true }

# HMAC-SHA256 for NDJSON persistence integrity (O-9.2)
hmac = { workspace = true }
sha2 = { workspace = true }

# Hex encoding for HMAC signatures (O-9.2)
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
