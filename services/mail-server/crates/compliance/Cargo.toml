[package]
name = "compliance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "compliance-server"
path = "src/bin/server.rs"

[dependencies]
mail-common = { path = "../mail-common" }

tokio      = { workspace = true }
sqlx       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
observability-service = { path = "../observability-service" }
chrono     = { workspace = true }
uuid       = { workspace = true }
sha2       = { workspace = true }
hmac       = { workspace = true }
aes-gcm    = { workspace = true }
zeroize    = { workspace = true }
base64     = { workspace = true }
regex      = { workspace = true }
aho-corasick = { workspace = true }
moka       = { workspace = true }
deadpool-redis = { workspace = true }
redis      = { workspace = true }
axum       = { workspace = true }
tower-http = { workspace = true }
hex        = { workspace = true }
clap       = { workspace = true }
dotenvy    = { workspace = true }
thiserror  = { workspace = true }
url        = { workspace = true }
anyhow     = { workspace = true }
reqwest    = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
# Canonical test fixtures (audits F76/F77): provision throwaway databases
# carrying the REAL production migration chain through the production
# migrator's test_support, instead of hand-written schema subsets.
migrator = { path = "../migrator" }
