[package]
name = "ops-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail operations service: health checks, incidents, SLO monitoring, status pages, IP warmup, and trust scoring"

[[bin]]
name = "ops-service"
path = "src/bin/server.rs"

[dependencies]
apexmail-lib = { path = "../apexmail-lib" }
apexmail-db = { path = "../apexmail-db" }

# Async runtime
tokio.workspace = true

# HTTP server
axum.workspace = true
tower-http.workspace = true

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx.workspace = true

# Identifiers & time
uuid.workspace = true
chrono.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Errors
thiserror.workspace = true
anyhow.workspace = true

# Concurrent data structures
dashmap.workspace = true
parking_lot.workspace = true

# HTTP client (for health checks)
reqwest.workspace = true

# AWS SES (monitoring)
aws-config.workspace = true
aws-sdk-sesv2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tower.workspace = true
