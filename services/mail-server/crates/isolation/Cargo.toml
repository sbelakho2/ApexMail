[package]
license.workspace = true  # LicenseRef-PROPRIETARY via workspace
name = "isolation"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "isolation-server"
path = "src/bin/server.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
observability-service = { path = "../observability-service" }
axum = { workspace = true }
tower-http = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
aes-gcm = { workspace = true }
dashmap = { workspace = true }
redis = { workspace = true }
deadpool-redis = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
regex = { workspace = true }
hkdf = "0.12"
zeroize = { workspace = true }
urlencoding = { workspace = true }
apexmail-lib = { path = "../apexmail-lib" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

# DB-backed tests bootstrap through the REAL production migrator (audit F01):
# a green test means the code works against the deploy-time schema.
migrator = { path = "../migrator" }
