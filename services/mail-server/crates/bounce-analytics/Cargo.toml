[package]
name = "bounce-analytics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail bounce analytics – aggregation, pattern detection, and trend analysis for email bounces"

[[bin]]
name = "bounce-analytics-worker"
path = "src/bin/worker.rs"

[dependencies]
# Internal
mail-common = { path = "../mail-common" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true
futures.workspace = true

# Database
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }

# Time & IDs
chrono.workspace = true
uuid.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Pattern matching / text analysis
regex.workspace = true

# Data structures
dashmap.workspace = true
parking_lot.workspace = true

# CLI / Config
clap.workspace = true
dotenvy.workspace = true

# Metrics
metrics.workspace = true

# HTTP client (for webhook enrichment)
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
