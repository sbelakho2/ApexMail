[package]
name = "inbox-placement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace crates
analytics = { path = "../analytics" }
apexmail-dns-resolver = { path = "../dns-resolver" }
mta = { path = "../mta" }
mail-common = { path = "../mail-common" }
threat-intel = { path = "../threat-intel" }
enterprise = { path = "../enterprise" }

# Axum
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7" }

# Utilities
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }

# SMTP delivery (lettre)
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# IMAP polling
imap = { version = "2.4", features = ["native-tls"] }
native-tls = "0.2"
