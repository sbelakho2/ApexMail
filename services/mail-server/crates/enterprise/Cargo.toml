[package]
name = "enterprise"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "enterprise-server"
path = "src/bin/server.rs"

# Operator CLI for the Dedicated Tenant workflow (bundle render/validate +
# monthly review packet). Thin wrapper over the `dedicated_tenant` module;
# argv is parsed by hand like the repo's other operator CLIs
# (mail-common/src/bin/receipt_public_key.rs), so no clap dependency is
# added for two subcommands.
[[bin]]
name = "dedicated-tenant"
path = "src/bin/dedicated_tenant.rs"

[dependencies]
tokio      = { workspace = true }
sqlx       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
observability-service = { path = "../observability-service" }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Utils
chrono     = { workspace = true }
uuid       = { workspace = true }
sha2       = { workspace = true }
hmac       = { workspace = true }
base64     = { workspace = true }
rand       = { workspace = true }
regex      = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
axum       = { workspace = true }
tower      = { workspace = true }
tower-http = { workspace = true }
dotenvy    = { workspace = true }
deadpool-redis = { workspace = true }
redis      = { workspace = true }
reqwest    = { workspace = true }
aes-gcm    = { workspace = true }
zeroize    = { workspace = true }
hex        = { workspace = true }
quick-xml  = "0.41"
mail-common = { path = "../mail-common" }
apexmail-dns-resolver = { path = "../dns-resolver" }
# Plan entitlements: the template-approval and sub-account surfaces are gated
# on the SAME override-aware snapshot api-server handlers use, so the gate is
# the plan flag, never the tenant type. billing-service depends on no
# enterprise crate — no cycle.
billing-service = { path = "../billing-service" }
billing-entitlements = { path = "../billing-entitlements" }
# Dedicated Tenant provisioning: the canonical plan catalog (fees, minimum
# term, setup range — zero-dependency crate) and the structured product
# (`compliance::deployment_products::DedicatedTenant`: 5M recipients,
# 2 managed IPs, EEA default). Both are the plan's truth; the validation in
# `dedicated_tenant.rs` refuses any deployment record that contradicts them.
# Neither crate depends on enterprise — no cycle.
platform-catalog = { path = "../platform-catalog" }
compliance = { path = "../compliance" }
urlencoding = { workspace = true }
flate2 = "1.1"
jsonwebtoken = "9.3"
xml-sec = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
jsonwebtoken = "9.3"
# sqlx emits its statement log through the `log` crate; the escalation
# batching tests capture it through a tracing layer, so the bridge must be
# installed explicitly (relying on another test to install it made the
# assertion order-dependent).
tracing-log = "0.2"

# DB-backed tests bootstrap through the REAL production migrator (audit F01):
# a green test means the code works against the deploy-time schema.
migrator = { path = "../migrator" }
