[package]
name = "edge-cases"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail edge-cases – EAI validation, attachment scanning, calendar, delivery edge cases"

[[bin]]
name = "edge-cases-server"
path = "src/bin/server.rs"

[dependencies]
mail-common = { path = "../mail-common" }
apexmail-lib = { path = "../apexmail-lib" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true

# Database
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Redis
deadpool-redis.workspace = true
redis.workspace = true

# HTTP
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }

# Utils
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
bytes.workspace = true
regex.workspace = true
base64.workspace = true
hex.workspace = true
dashmap.workspace = true
moka.workspace = true

# DNS
trust-dns-resolver.workspace = true

# Email
mail-parser.workspace = true

# MIME detection
mime_guess = "2"

# IDN / Punycode
idna = "1"
unicode-normalization = "0.1"

# HTTP client (for ClamAV health + future use)
reqwest.workspace = true

# CLI
clap.workspace = true
dotenvy.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
