[package]
name = "pdf-renderer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ApexMail PDF generation service — Typst-powered rendering for invoices, DPAs, reports"

[[bin]]
name = "pdf-renderer"
path = "src/bin/server.rs"

[dependencies]
# Typst compiler + PDF backend (the designed layouts in src/templates/*.typ
# are compiled by this stack; typst-layout names PagedDocument for the
# compile::<PagedDocument> call and typst-pdf exports it)
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"

# Async runtime
tokio.workspace = true

# HTTP server
axum.workspace = true
apexmail-lib = { path = "../apexmail-lib" }
tower.workspace = true
tower-http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging & Observability
tracing.workspace = true
tracing-subscriber.workspace = true
observability-service = { path = "../observability-service" }

# Utils
chrono.workspace = true
base64.workspace = true
thiserror.workspace = true
anyhow.workspace = true
once_cell.workspace = true

# CLI / config
clap.workspace = true
dotenvy.workspace = true

[dev-dependencies]
# Independent PDF text extractor used by the layout tests to prove the
# delivered document's reading order and content (never the producer's own
# byte-level internals).
pdf-extract = "0.8"
