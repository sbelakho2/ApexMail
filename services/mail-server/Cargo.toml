[workspace]
resolver = "2"
members = [
    "crates/mailstore-core",
    "crates/mail-proto",
    "crates/mail-common",
    "crates/tracking-service",
    "crates/worker-processors",
    "crates/mta",
    "crates/imap-server",
    "crates/edge-cases",
    "crates/analytics",
    "crates/compliance",
    "crates/isolation",
    "crates/ha",
    "crates/enterprise",
    "crates/template-renderer",
    "crates/ai-embeddings",
    "crates/queue-provider",
    "crates/pattern-matcher",
    "crates/rate-limiter",
    "crates/dns-resolver",
    "crates/api-server",
    "crates/auth-server",
    "crates/billing-service",
    "crates/billing-common",
    "crates/devex-service",
    "crates/observability-service",
    "crates/ui-foundation",
    "crates/sales-autopilot",
    "crates/ai-service",
    "crates/pdf-renderer",
    "crates/apexmail-db",
    "crates/apexmail-lib",
    "crates/migrator",
    "crates/smoke-tests",
    "crates/functional-tests",
    "crates/integration-tests",
    "crates/perf-tests",
    "crates/fuzz-tests",
    "crates/load-tests",
    # DDoS Protection
    "crates/ddos-protection",
    "crates/fingerprint",
    # Security Systems (WAF, IDS, Anti-Spam, Sandbox, ATO, DLP, Threat Intel)
    "crates/waf-engine",
    "crates/ids-engine",
    "crates/spam-filter",
    "crates/sandbox",
    "crates/ato-protection",
    "crates/dlp-engine",
    "crates/threat-intel",
    "crates/email-grader",
    "crates/inbox-placement",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ApexMail Team <dev@apexmail.ee>"]
# LicenseRef-PROPRIETARY (not the bare word "PROPRIETARY", which is not a
# valid SPDX expression): cargo-deny's licenses gate can parse and allow-list
# this id for the first-party workspace crates while fail-closing on any
# third-party license absent from services/mail-server/deny.toml. Metadata
# only — the licensing terms are unchanged (see the repo LICENSE file).
license = "LicenseRef-PROPRIETARY"
repository = "https://github.com/sbelakho2/ApexMail"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# gRPC & Protobuf
tonic = "0.12"
prost = "0.13"
tonic-build = "0.14"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Crypto & Security
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = "0.26"
sha2 = "0.10"
hmac = "0.12"
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
rand = "0.9"
argon2 = { version = "0.5.3", features = ["std"] }
pbkdf2 = { version = "0.12", features = ["simple"] }
bcrypt = "0.16"
arc-swap = "1.7"

# Email protocols
mail-parser = "0.10"
mail-builder = "0.3"
mail-auth = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# OpenTelemetry (distributed tracing)
opentelemetry = { version = "0.24", features = ["trace"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["tonic", "trace"] }
tracing-opentelemetry = "0.25"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.8"
parking_lot = "0.12"
dashmap = "6.1"
once_cell = "1.20"

# DNS
trust-dns-resolver = { package = "hickory-resolver", version = "0.26" }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# AWS SDK (SES dedicated IP management)
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-sesv2 = "1.50"

# HTTP Server (axum-based tracking service)
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id", "timeout", "limit", "fs", "set-header"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1" }

# Leptos UI framework (SSR + islands hydration)
leptos = { version = "0.6", features = ["csr", "ssr", "nightly"] }
leptos_axum = { version = "0.6" }
leptos_router = { version = "0.8", features = ["ssr"] }
leptos_meta = { version = "0.6", features = ["ssr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlElement", "Element", "Document", "Window", "DomRect", "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry", "KeyboardEvent", "MouseEvent", "FocusEvent", "ResizeObserver", "ResizeObserverEntry", "MutationObserver", "MutationObserverInit", "MutationRecord", "CssStyleDeclaration", "MediaQueryList"] }
js-sys = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Config
config = "0.15"
dotenvy = "0.15"

# Compression
zstd = "0.13"

# Unicode normalization (NFC for pattern matching)
unicode-normalization = "0.1"

# Pattern matching (linear-time, no backtracking)
aho-corasick = { version = "1.1", features = ["perf-literal"] }
regex = { version = "1.10", features = ["perf"] }

# Concurrent LRU / TTL cache
moka = { version = "0.12", features = ["future", "sync"] }

# Redis (async, pooled)
deadpool-redis = { version = "0.18", features = ["rt_tokio_1", "cluster"] }
redis = { version = "0.27", default-features = false, features = ["aio", "connection-manager", "script", "keep-alive", "streams", "tokio-rustls-comp"] }

# Rate limiting (token bucket, governor)
governor = { version = "0.6", features = ["std", "jitter"] }
nonzero_ext = "0.3"

# Crypto (AEAD)
aes-gcm = { version = "0.10", features = ["aes"] }
zeroize = { version = "1.8", features = ["derive"] }

# IP networking / CIDR
ipnetwork = "0.20"

# Hex encoding
hex = "0.4"

# URL parsing / percent-decoding
url = "2.5"
urlencoding = "2.1"

# DDoS Protection workspace crates
apexmail-ddos-protection = { path = "crates/ddos-protection" }
apexmail-fingerprint = { path = "crates/fingerprint" }

# Security Systems workspace crates
waf-engine = { path = "crates/waf-engine" }
ids-engine = { path = "crates/ids-engine" }
spam-filter = { path = "crates/spam-filter" }
sandbox = { path = "crates/sandbox" }
ato-protection = { path = "crates/ato-protection" }
dlp-engine = { path = "crates/dlp-engine" }
threat-intel = { path = "crates/threat-intel" }
email-grader = { path = "crates/email-grader" }
inbox-placement = { path = "crates/inbox-placement" }

# Patch imap-proto to fix trailing-semicolon future-incompat warnings in macro bodies.
# See https://github.com/rust-lang/rust/issues/79813
[patch.crates-io]
imap-proto = { path = "crates/imap-proto-patched" }

[workspace.metadata]
description = "ApexMail — Enterprise email delivery platform"
homepage = "https://apexmail.ee"
documentation = "https://docs.apexmail.ee"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# catch_unwind is used in production code (analytics.rs:451) for async task
# isolation — panic = "abort" prevents catch_unwind from working and would
# abort the entire process on panic. unwind ensures destructors run and logs
# are flushed before the task-level panic propagates.
panic = "unwind"
