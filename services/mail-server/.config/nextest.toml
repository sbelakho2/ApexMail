# Fail hung tests instead of stalling the whole run: a test exceeding the
# slow period is retried once, then terminated. The period must be generous
# enough for INSTRUMENTED (llvm-cov) runs — migrator provisioning tests
# legitimately run 20+ minutes there — while still bounding a real hang
# (60 min max). Retries absorb one-off scheduling stalls.
[profile.default]
slow-timeout = { period = "1800s", terminate-after = 2 }

# Bound how many test processes run at once. At the default parallelism
# (= nproc) a full-workspace run oversubscribes Postgres: every DB-heavy
# test process holds several pool connections, and 18-way concurrency
# pushed demand past max_connections=100 — fixtures died at their 60 s
# acquire timeout (observed as ~150 sales-autopilot tests failing at
# exactly 60.0 s in one wave). 12 keeps worst-case demand inside the
# server limit; on CI runners with fewer cores this cap is inert (it only
# lowers, never raises, the natural parallelism). 12 fit the plain runs but
# INSTRUMENTED (llvm-cov) tests hold their pool connections 3-5x longer, so
# worst-case concurrent demand crested max_connections=100 and fixtures
# died at admin-connect; 8 keeps the instrumented worst case inside the
# limit with margin.
[test-groups]
all-tests = { max-threads = 8 }
# Explorer sandbox-cache tests share one sandbox key row across processes;
# serialize them so sibling re-mints can't flip the convergence assertions.
explorer-sandbox = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'all()'
test-group = 'all-tests'


[[profile.default.overrides]]
filter = 'test(concurrent_first_requests_converge_on_a_live_sandbox_key) or test(sandbox_key_is_cached_per_process_and_capped_at_one_row) or test(sandbox_cache_self_heals_when_a_sibling_re_mints_the_key_row) or test(sandbox_adopts_the_shared_key) or test(concurrent_first_requests_converge)'
test-group = 'explorer-sandbox'
