# ApexMail Mail Server - Docker Compose
#
# Enterprise-grade email infrastructure.
# Outbound delivery enters through the outbound queue contract; workers choose
# the configured transport backend. Inbound email is always handled by the
# native Rust MTA.

services:
  # MTA Server (unified inbound + submission)
  # Receives email on port 25 (inbound) and authenticated sends on port 587
  # (submission) in a single process. The legacy smtp-edge/submission split
  # binaries and Docker targets were removed with the outbound-queue rework.
  mta:
    build:
      context: ../..
      dockerfile: services/mail-server/Dockerfile
      target: mta
    ports:
      - "${SMTP_EDGE_BIND:-127.0.0.1}:25:25"         # SMTP inbound
      - "${SMTP_SUBMISSION_BIND:-127.0.0.1}:587:587" # Submission (STARTTLS)
    environment:
      - RUST_LOG=info
      - INBOUND_HOSTNAME=${MAIL_SERVER_HOSTNAME:-mail.apexmail.ee}
      - BOUNCE_HOSTNAME=${MAIL_SERVER_HOSTNAME:-mail.apexmail.ee}
      - FBL_HOSTNAME=${MAIL_SERVER_HOSTNAME:-mail.apexmail.ee}
      - SUBMISSION_HOSTNAME=${MAIL_SERVER_HOSTNAME:-mail.apexmail.ee}
      - MAILSTORE_GRPC_ADDR=http://mailstore:50051
      - HEALTH_PORT=8081
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me}
      - TLS_ENABLED=false
    entrypoint:
      - /bin/sh
      - -c
      - >
        export POSTGRES_PASSWORD="$(cat /run/secrets/postgres_password)";
        export DATABASE_URL="postgres://apexmail:${POSTGRES_PASSWORD}@postgres:5432/apexmail_mail";
        export REDIS_PASSWORD="$(cat /run/secrets/redis_password)";
        export REDIS_URL="redis://default:${REDIS_PASSWORD}@redis:6379";
        exec /usr/bin/tini -- mta-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailstore:
        condition: service_started
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    secrets:
      - postgres_password
      - redis_password

  # Mailstore Service
  # Message storage and retrieval
  mailstore:
    build:
      context: ../..
      dockerfile: services/mail-server/Dockerfile
      target: mailstore
    ports:
      - "127.0.0.1:50051:50051"  # gRPC
    environment:
      - RUST_LOG=info
      # Container deployments must bind all interfaces so the port mapping and
      # sibling services (imap-server) can reach the mailstore over the
      # internal network. Bare-metal/dev runs keep the safe 127.0.0.1 default.
      - MAILSTORE_BIND_ADDR=0.0.0.0:50051
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me}
    entrypoint:
      - /bin/sh
      - -c
      - >
        export POSTGRES_PASSWORD="$(cat /run/secrets/postgres_password)";
        export DATABASE_URL="postgres://apexmail:${POSTGRES_PASSWORD}@postgres:5432/apexmail_mail";
        exec /usr/bin/tini -- mailstore
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    secrets:
      - postgres_password

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"  # Different port to avoid conflicts
    environment:
      - POSTGRES_USER=apexmail
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=apexmail_mail
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexmail -d apexmail_mail"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    secrets:
      - postgres_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - apexmail
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
    secrets:
      - redis_password

  # ── Worker Processors ───────────────────────────────────────────────────
  # Runs background workers: email delivery, analytics, webhook dispatch,
  # and reply-handler processing. Defined in Helm but was missing from
  # docker-compose (OBS-11). Environment mirrors Helm's worker-deployment.yaml.
  worker:
    build:
      context: ../..
      dockerfile: services/mail-server/Dockerfile
      target: worker
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      - RUST_LOG=info
      - HEALTH_PORT=9090
      - WORKER_CONCURRENCY=10
      - WORKER_POLL_INTERVAL=5
      - EMAIL_TRANSPORT_TYPE=${EMAIL_TRANSPORT_TYPE:-ses}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - DKIM_PRIVATE_KEY_ENCRYPTION_KEY=${DKIM_PRIVATE_KEY_ENCRYPTION_KEY:?DKIM_PRIVATE_KEY_ENCRYPTION_KEY is required}
    entrypoint:
      - /bin/sh
      - -c
      - >
        export POSTGRES_PASSWORD="$(cat /run/secrets/postgres_password)";
        export DATABASE_URL="postgres://apexmail:${POSTGRES_PASSWORD}@postgres:5432/apexmail_mail";
        export REDIS_PASSWORD="$(cat /run/secrets/redis_password)";
        export REDIS_URL="redis://default:${REDIS_PASSWORD}@redis:6379";
        exec /usr/bin/tini -- worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      # The worker binary serves /health on HEALTH_PORT (9090), not 3006.
      test: ["CMD", "nc", "-z", "localhost", "9090"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    secrets:
      - postgres_password
      - redis_password

  # ── Observability Stack ─────────────────────────────────────────────────

  # Loki — log aggregation (Grafana OSS, ADR 0009)
  loki:
    image: grafana/loki:3.0.0
    container_name: apexmail-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ../../deploy/loki:/etc/loki:ro
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: apexmail-otel-collector
    ports:
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
      - "127.0.0.1:8889:8889"  # Prometheus self-metrics
    volumes:
      - ../../deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    networks:
      - apexmail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:13133/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  # Prometheus — metrics collection
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: apexmail-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  # Grafana — dashboards & visualization
  grafana:
    image: grafana/grafana:11.2.2
    container_name: apexmail-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
    networks:
      - apexmail
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  # Grafana Tempo — distributed tracing backend
  tempo:
    image: grafana/tempo:2.6.1
    container_name: apexmail-tempo
    ports:
      - "127.0.0.1:3200:3200"   # Query frontend
      - "127.0.0.1:4317:4317"   # OTLP gRPC (duplicate — use otel-collector instead)
      - "127.0.0.1:9411:9411"   # Zipkin (legacy)
    volumes:
      - ../../deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # Alertmanager — alert routing & notification
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: apexmail-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../../deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M

networks:
  apexmail:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  alertmanager_data:
  loki_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
