# ApexMail Mail Server - Docker Compose
#
# Enterprise-grade email infrastructure.
# Outbound delivery defaults to AWS SES API (EMAIL_TRANSPORT_TYPE=ses).
# Set EMAIL_TRANSPORT_TYPE=smtp for direct SMTP delivery with DKIM signing.
# Inbound email is always handled by the native Rust MTA.

services:
  # Outbound Queue Service
  # Handles email sending with retry logic
  outbound-queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: outbound-queue
    ports:
      - "127.0.0.1:50052:50052"  # gRPC
    environment:
      - RUST_LOG=info
      - FROM_DOMAIN=${MAIL_FROM_DOMAIN:-apexmail.ee}
      - DKIM_SELECTOR=${MAIL_DKIM_SELECTOR:-apexmail2026}
      - DKIM_KEY_PATH=/etc/apexmail/dkim/private.pem
    entrypoint:
      - /bin/sh
      - -c
      - >
        export POSTGRES_PASSWORD="$(cat /run/secrets/postgres_password)";
        export DATABASE_URL="postgres://apexmail:${POSTGRES_PASSWORD}@postgres:5432/apexmail_mail";
        exec /usr/bin/tini -- outbound-queue --listen 0.0.0.0:50052
    volumes:
      - ./config/dkim:/etc/apexmail/dkim:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50052"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    secrets:
      - postgres_password

  # SMTP Edge Server (Inbound)
  # Receives incoming emails on port 25
  smtp-edge:
    build:
      context: .
      dockerfile: Dockerfile
      target: smtp-edge
    ports:
      - "${SMTP_EDGE_BIND:-127.0.0.1}:25:25"     # SMTP
    environment:
      - RUST_LOG=info
      - HOSTNAME=${MAIL_SERVER_HOSTNAME:-mail.apexmail.ee}
      - MAILSTORE_URL=http://mailstore:50051
    entrypoint:
      - /bin/sh
      - -c
      - >
        export POSTGRES_PASSWORD="$(cat /run/secrets/postgres_password)";
        export DATABASE_URL="postgres://apexmail:${POSTGRES_PASSWORD}@postgres:5432/apexmail_mail";
        exec /usr/bin/tini -- smtp-edge --listen 0.0.0.0:25
    depends_on:
      postgres:
        condition: service_healthy
      mailstore:
        condition: service_started
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    secrets:
      - postgres_password

  # Submission Server (Authenticated SMTP)
  # For clients to send mail via port 587
  submission:
    build:
      context: .
      dockerfile: Dockerfile
      target: submission
    ports:
      - "${SMTP_SUBMISSION_BIND:-127.0.0.1}:587:587"   # Submission
      - "${SMTP_SUBMISSION_BIND:-127.0.0.1}:465:465"   # SMTPS (TLS)
    environment:
      - RUST_LOG=info
      - HOSTNAME=${MAIL_SERVER_HOSTNAME:-mail.apexmail.ee}
      - OUTBOUND_URL=http://outbound-queue:50052
      - REQUIRE_AUTH=true
      - ENABLE_STARTTLS=true
    entrypoint:
      - /bin/sh
      - -c
      - >
        export POSTGRES_PASSWORD="$(cat /run/secrets/postgres_password)";
        export DATABASE_URL="postgres://apexmail:${POSTGRES_PASSWORD}@postgres:5432/apexmail_mail";
        exec /usr/bin/tini -- submission-server --listen 0.0.0.0:587
    volumes:
      - ./config/certs:/etc/apexmail/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      outbound-queue:
        condition: service_started
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "587"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    secrets:
      - postgres_password

  # Mailstore Service
  # Message storage and retrieval
  mailstore:
    build:
      context: .
      dockerfile: Dockerfile
      target: mailstore
    ports:
      - "127.0.0.1:50051:50051"  # gRPC
    environment:
      - RUST_LOG=info
    entrypoint:
      - /bin/sh
      - -c
      - >
        export POSTGRES_PASSWORD="$(cat /run/secrets/postgres_password)";
        export DATABASE_URL="postgres://apexmail:${POSTGRES_PASSWORD}@postgres:5432/apexmail_mail";
        exec /usr/bin/tini -- mailstore
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    secrets:
      - postgres_password

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"  # Different port to avoid conflicts
    environment:
      - POSTGRES_USER=apexmail
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=apexmail_mail
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - apexmail
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexmail -d apexmail_mail"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    secrets:
      - postgres_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - apexmail
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M

networks:
  apexmail:
    driver: bridge

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
