# ==============================================================================
# ApexMail Coverage Targets — INFORMATIONAL, NOT ENFORCED BY CI
# ==============================================================================
# Audit SM14 F13: this file previously claimed "minimum coverage requirements
# that must be met for CI to pass". That was FALSE — nothing consumes this
# file (no tool in the repo or CI reads coverage.toml), and a tool that did
# (cargo-tarpaulin-style configs) is not installed anywhere. Editing the
# numbers below changes NOTHING in CI.
#
# The OPERATIVE coverage gate is the ratchet in ci/stages/test.sh
# run_coverage_gate: `cargo llvm-cov nextest --workspace` line coverage is
# compared against ci/coverage-baseline.txt (a single float; below baseline
# FAILS the run, CI_COVERAGE_CHECK=required). Raise the baseline in the same
# PR that earns it.
#
# The tiers below are kept as internal QUALITY TARGETS only:
#
# Coverage types:
# - lines: Lines of code executed
# - branches: Decision branches (if/else, match arms) covered
# - functions: Functions called at least once
#
# Tiered approach:
# - Tier 1 (Critical): Security crates - 90% target
# - Tier 2 (Core): Business logic - 80% target
# - Tier 3 (Support): Utilities & infrastructure - 70% target
# ==============================================================================

# Global minimum thresholds (applies to all code)
[global]
lines = 75
branches = 70
functions = 75

# INFORMATIONAL ONLY — nothing consumes this file; see the header. The CI
# ratchet gate is ci/coverage-baseline.txt + ci/stages/test.sh.
enforce = false

# ==============================================================================
# Tier 1: Security-Critical Packages (90% required)
# These handle authentication, encryption, input validation
# ==============================================================================

[packages.waf-engine]
lines = 90
branches = 85
functions = 90
description = "Web Application Firewall - Must catch all attack patterns"

[packages.ids-engine]
lines = 90
branches = 85
functions = 90
description = "Intrusion Detection - Pattern matching must be thorough"

[packages.spam-filter]
lines = 85
branches = 80
functions = 85
description = "Spam filtering - ML and rule-based detection"

[packages.dlp-engine]
lines = 90
branches = 85
functions = 90
description = "Data Loss Prevention - Sensitive data detection"

[packages.sandbox]
lines = 85
branches = 80
functions = 85
description = "Attachment sandbox - Isolation security"

[packages.ato-protection]
lines = 90
branches = 85
functions = 90
description = "Account Takeover Prevention - Critical auth protection"

[packages.threat-intel]
lines = 85
branches = 80
functions = 85
description = "Threat intelligence - Reputation scoring"

[packages.mail-common]
lines = 85
branches = 80
functions = 85
description = "Common mail types - Shared security primitives"

# ==============================================================================
# Tier 2: Core Business Logic (80% required)
# ==============================================================================

[packages.smtp-edge]
lines = 80
branches = 75
functions = 80
description = "SMTP Edge protocol implementation"

[packages.mta]
lines = 80
branches = 75
functions = 80
description = "Mail Transfer Agent - Core routing"

[packages.mailstore-core]
lines = 80
branches = 75
functions = 80
description = "Mail storage - Data persistence"

# ==============================================================================
# Tier 3: Support & Infrastructure (70% required)
# ==============================================================================

[packages.observability-service]
lines = 70
branches = 65
functions = 70
description = "Observability - Metrics, tracing, and monitoring"

# ==============================================================================
# Excluded from coverage (test code, examples, generated)
# ==============================================================================

[exclude]
paths = [
  "**/tests/**",
  "**/benches/**",
  "**/examples/**",
  "**/*.generated.rs",
  "**/build.rs",
  "**/fuzz-tests/**",
  "**/integration-tests/**",
  "**/functional-tests/**",
  "**/performance-tests/**",
  "**/load-tests/**",
]

# Functions to exclude (test utilities, debug code)
functions = [
  "test_*",
  "mock_*",
  "debug_*",
  "fmt",
  "default",
]
