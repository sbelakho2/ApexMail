minimum_pre_commit_version: "3.6.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # Audit P — pinned to the full commit SHA (tags are mutable).
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(secrets/|reports/|target/)
      - id: trailing-whitespace
        exclude: ^(secrets/|reports/|target/)
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    # Audit P — pinned to the full commit SHA (tags are mutable).
    rev: ac4b5146b0f112df989b4374abb2b12799e37cba  # v8.18.2
    hooks:
      - id: gitleaks
        name: Gitleaks secret scanning
        description: Detect hardcoded secrets, API keys, and credentials
        args: ["--config", ".gitleaks.toml"]

  - repo: local
    hooks:
      - id: cargo-fmt-mail-server
        name: cargo fmt (mail-server)
        entry: cargo fmt --manifest-path services/mail-server/Cargo.toml --all -- --check
        language: system
        pass_filenames: false
        files: ^services/mail-server/.*\.rs$

      - id: forbidden-pattern-gate
        name: forbidden pattern gate
        entry: bash tools/check-forbidden-patterns.sh
        language: system
        pass_filenames: false

      - id: kiwi-marketing-isolation
        name: KiwiCaptcha/marketing isolation gate
        description: >-
          Enforces that KiwiCaptcha never leaks into the ApexMail marketing
          site source (apps/marketing-zola/{content,templates,static,data} and
          config.toml). ApexMail mascot branding is allowlisted. See
          marketing_audit.md v2 §6.
        entry: bash tools/check-kiwi-marketing-isolation.sh
        language: system
        pass_filenames: false
        files: ^apps/marketing-zola/.*

      - id: cargo-audit-mail-server
        name: cargo audit (mail-server)
        entry: bash scripts/security-audit.sh
        language: system
        pass_filenames: false
        files: ^services/mail-server/.*(Cargo\.toml|Cargo\.lock)$
