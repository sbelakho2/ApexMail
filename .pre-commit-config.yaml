minimum_pre_commit_version: "3.6.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # Audit P — pinned to the full commit SHA (tags are mutable).
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(secrets/|reports/|target/)
      - id: trailing-whitespace
        exclude: ^(secrets/|reports/|target/)
      - id: check-yaml
        # Audit SM14 F12 (the CI lane made this hook non-opt-in): three
        # tracked files legitimately fail stock pyyaml parsing and are
        # excluded here — everything else (including .woodpecker.yml, ci/
        # and every workflow-shaped YAML) is checked:
        #   * deploy/cdn/cloudfront.yaml — CloudFormation !Ref/!Sub tags are
        #     not YAML-constructor-parseable by pyyaml;
        #   * docker-compose.prod.yml — compose's !override/!reset
        #     extension tags (same class);
        #   * docs/api/openapi.yaml — duplicate schema keys in the tracked
        #     spec (spec cleanup is a docs task, not this hook's).
        exclude: |
          (?x)^(
            deploy/cdn/cloudfront\.yaml|
            docker-compose\.prod\.yml|
            docs/api/openapi\.yaml
          )$
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    # Audit P — pinned to the full commit SHA (tags are mutable).
    # Audit SM14 F12 — the pin MUST track the CI image's gitleaks
    # (GITLEAKS_VERSION in ci/ci-image/Dockerfile + toolchain-versions.env,
    # currently 8.30.1): rule sets drift between releases, and a developer
    # scanning with 8.18.2 locally while CI scans with 8.30.1 is exactly the
    # skew this config exists to prevent. Bump BOTH in the same change.
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1 (== CI image pin)
    hooks:
      - id: gitleaks
        name: Gitleaks secret scanning
        description: Detect hardcoded secrets, API keys, and credentials
        args: ["--config", ".gitleaks.toml"]

  - repo: local
    hooks:
      - id: cargo-fmt-mail-server
        name: cargo fmt (mail-server)
        entry: cargo fmt --manifest-path services/mail-server/Cargo.toml --all -- --check
        language: system
        pass_filenames: false
        files: ^services/mail-server/.*\.rs$

      - id: forbidden-pattern-gate
        name: forbidden pattern gate (scans the BUILT site; skips when public/ is not built — CI runs it post-build with --require-build)
        entry: bash tools/check-forbidden-patterns.sh
        language: system
        pass_filenames: false

      - id: kiwi-marketing-isolation
        name: KiwiCaptcha/marketing isolation gate
        description: >-
          Enforces that KiwiCaptcha never leaks into the ApexMail marketing
          site source (apps/marketing-zola/{content,templates,static,data} and
          config.toml). ApexMail mascot branding is allowlisted. See
          marketing_audit.md v2 §6.
        entry: bash tools/check-kiwi-marketing-isolation.sh
        language: system
        pass_filenames: false
        files: ^apps/marketing-zola/.*

      - id: marketing-serving-gate
        name: marketing serving gate (built pages, artifacts, asset routes)
        description: >-
          Every built page in apps/marketing-zola/public must have a
          marketing_static_document whitelist arm, every root artifact must be
          world-readable (the image runs as uid 10001), security.txt + the PGP
          keys must be routed, and the consent banner's policy link must stay
          locale-prefixed. These four drifted independently and shipped 63
          live 404s plus an unstyled site (dogfood 2026-10-08).
        entry: python3 tools/check_marketing_serving.py
        language: system
        pass_filenames: false
        files: ^(apps/marketing-zola/|services/mail-server/(Dockerfile|crates/(ui-foundation|api-server)/src/(axum_router|app)\.rs))

      - id: cargo-audit-mail-server
        name: cargo audit (mail-server)
        entry: bash scripts/security-audit.sh
        language: system
        pass_filenames: false
        files: ^services/mail-server/.*(Cargo\.toml|Cargo\.lock)$
        # Audit SM14 F12: this hook is deliberately NOT in the pre-commit /
        # CI-lane stage set:
        #   * it duplicates the security stage's REQUIRED cargo audit (which
        #     owns the canonical CI_CARGO_AUDIT_IGNORES list);
        #   * it cargo-INSTALLS cargo-audit/cargo-deny on demand — not a
        #     fast-iteration hook;
        #   * its inline ignore list has already drifted from the canonical
        #     one (still lists RUSTSEC-2024-0437; missing the 2026-0192/0205/
        #     0206/0258 entries) — scripts/ is outside CI-review scope, so
        #     gating CI on it would gate CI on a stale ledger. The security
        #     stage's selftest asserts the CANONICAL pair in lockstep.
        # It still runs before every push (pre-push stage) and on demand
        # (`pre-commit run cargo-audit-mail-server --all-files`).
        stages: [pre-push, manual]
