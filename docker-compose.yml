# =============================================================================
# ApexMail Docker Compose - Development Deployment
# =============================================================================
# WARNING: This configuration is for DEVELOPMENT only.
# For production, use docker-compose.prod.yml which:
# - Requires all secrets to be set via environment variables
# - Does not expose database ports to host
# - Uses proper resource limits
#
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # DATABASE
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: apexmail-postgres
    restart: unless-stopped
    environment:
      # SECURITY: In production, POSTGRES_PASSWORD must be set via environment
      # Never use default values in production!
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-apexmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/migrations:/docker-entrypoint-initdb.d:ro
    # SECURITY: Port exposure controlled via environment variable
    # Set to empty in production to disable host binding
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexmail} -d ${POSTGRES_DB:-apexmail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apexmail
    # SECURITY: Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ===========================================================================
  # REDIS
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: apexmail-redis
    restart: unless-stopped
    # SECURITY: Enable password authentication
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    # SECURITY: Port exposure controlled via environment variable
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apexmail
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ===========================================================================
  # API SERVER
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-apexmail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apexmail}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      # SECURITY: These secrets MUST be set in production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      API_KEY_SECRET: ${API_KEY_SECRET:?API_KEY_SECRET must be set}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-http://tracking:3001}
    ports:
      - "${API_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - apexmail
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ===========================================================================
  # WORKER
  # ===========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-apexmail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apexmail}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_RATE_LIMIT: ${SMTP_RATE_LIMIT:-10}
      # IP Rate Limiting
      IP_RATE_LIMITING_ENABLED: ${IP_RATE_LIMITING_ENABLED:-true}
      SENDING_IP_ADDRESS: ${SENDING_IP_ADDRESS:-}
      IP_HOURLY_LIMIT: ${IP_HOURLY_LIMIT:-2500}
      # Tracking
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-http://tracking:3001}
      TRACKING_ENABLED: ${TRACKING_ENABLED:-true}
      # Warmup
      WARMUP_ENABLED: ${WARMUP_ENABLED:-false}
      # Metrics
      METRICS_ENABLED: true
      METRICS_PORT: 9090
    ports:
      - "${WORKER_METRICS_PORT:-9090}:9090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - apexmail
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ===========================================================================
  # TRACKING SERVER
  # ===========================================================================
  tracking:
    build:
      context: .
      dockerfile: Dockerfile.tracking
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-apexmail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apexmail}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
    ports:
      - "${TRACKING_PORT:-3001}:3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - apexmail
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ===========================================================================
  # DEVELOPMENT SMTP (Mailpit)
  # ===========================================================================
  mailpit:
    # SECURITY: Pin to specific version to ensure reproducible builds
    image: axllent/mailpit:v1.21
    container_name: apexmail-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP
      - "${MAILPIT_WEB_PORT:-8025}:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    networks:
      - apexmail
    profiles:
      - dev

  # ===========================================================================
  # PROMETHEUS (Optional metrics collection)
  # ===========================================================================
  prometheus:
    # SECURITY: Pin to specific version to ensure reproducible builds
    image: prom/prometheus:v2.54.1
    container_name: apexmail-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - apexmail
    profiles:
      - monitoring

  # ===========================================================================
  # GRAFANA (Optional dashboards)
  # ===========================================================================
  grafana:
    # SECURITY: Pin to specific version to ensure reproducible builds
    image: grafana/grafana:11.3.0
    container_name: apexmail-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # SECURITY: Set GRAFANA_PASSWORD in production - no weak defaults
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SECURITY_DISABLE_GRAVATAR: true
      GF_ANALYTICS_REPORTING_ENABLED: false
    ports:
      - "${GRAFANA_PORT:-127.0.0.1:3002}:3000"
    networks:
      - apexmail
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

# ===========================================================================
# VOLUMES
# ===========================================================================
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

# ===========================================================================
# NETWORKS
# ===========================================================================
networks:
  apexmail:
    driver: bridge
