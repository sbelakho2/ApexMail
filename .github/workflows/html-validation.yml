name: HTML & Accessibility Validation

on:
  pull_request:
    paths:
      - 'apps/marketing-zola/templates/**'
      - 'apps/marketing-zola/content/**'
      - 'deploy/tests/html-validate.sh'
      - '.github/workflows/html-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/marketing-zola/templates/**'
      - 'apps/marketing-zola/content/**'
      - 'deploy/tests/html-validate.sh'
      - '.github/workflows/html-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-validate:
    name: HTML & A11y Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build Zola site
        working-directory: apps/marketing-zola
        run: |
          if command -v zola &>/dev/null; then zola build; else
            curl -sSL "https://github.com/getzola/zola/releases/download/v0.19.1/zola-v0.19.1-x86_64-unknown-linux-gnu.tar.gz" | tar xz && ./zola build; fi
      - name: Run HTML & accessibility validator
        run: |
          chmod +x deploy/tests/html-validate.sh
          BUILD_DIR=apps/marketing-zola/public bash deploy/tests/html-validate.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@fe9530cd28e02193eced3282e22f38e03d99fa02
        with:
          name: html-validation-report
          path: deploy/tests/.html-validation-report.json
          retention-days: 30
