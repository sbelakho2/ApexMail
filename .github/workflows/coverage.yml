name: Test Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Coverage thresholds - fail CI if below these
  MIN_LINE_COVERAGE: 75
  MIN_RUST_COVERAGE: 70

jobs:
  # Rust coverage job (security crates)
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            services/mail-server/target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage for security crates
        working-directory: services/mail-server
        run: |
          cargo llvm-cov \
            -p waf-engine \
            -p ids-engine \
            -p spam-filter \
            -p dlp-engine \
            -p sandbox \
            -p ato-protection \
            -p threat-intel \
            -p mail-common \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '(test|mock|generated)'

      - name: Check Rust coverage threshold
        working-directory: services/mail-server
        run: |
          # Parse coverage percentage from lcov
          TOTAL=$(grep -E "^LF:" lcov.info | cut -d: -f2 | paste -sd+ | bc || echo 0)
          COVERED=$(grep -E "^LH:" lcov.info | cut -d: -f2 | paste -sd+ | bc || echo 0)
          
          if [ "$TOTAL" -gt 0 ]; then
            PERCENTAGE=$(( COVERED * 100 / TOTAL ))
          else
            PERCENTAGE=0
          fi
          
          echo "Rust coverage: $COVERED / $TOTAL lines ($PERCENTAGE%)"
          echo "rust_coverage=$PERCENTAGE" >> $GITHUB_OUTPUT
          
          if [ "$PERCENTAGE" -lt "$MIN_RUST_COVERAGE" ]; then
            echo "::error::Rust coverage $PERCENTAGE% is below threshold $MIN_RUST_COVERAGE%"
            exit 1
          fi
          echo "::notice::Rust coverage $PERCENTAGE% meets threshold"

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/mail-server/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # TypeScript coverage job
  coverage:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apexmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/apexmail_test
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        run: pnpm test:coverage:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./reports/coverage/lcov.info,./apps/*/reports/coverage/lcov.info,./packages/*/reports/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            reports/coverage/
            apps/*/reports/coverage/
            packages/*/reports/coverage/

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: reports/coverage/COVERAGE_REPORT.md

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: coverage
    
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: reports/

      - name: Check coverage thresholds
        run: |
          if [ -f reports/coverage/coverage-aggregate.json ]; then
            passed=$(jq -r '.passed' reports/coverage/coverage-aggregate.json)
            if [ "$passed" = "false" ]; then
              echo "::error::Coverage thresholds not met"
              jq '.aggregate' reports/coverage/coverage-aggregate.json
              exit 1
            fi
            echo "::notice::All coverage thresholds passed!"
            jq '.aggregate' reports/coverage/coverage-aggregate.json
          else
            echo "::warning::No coverage report found"
          fi
