name: Test Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apexmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/apexmail_test
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        run: pnpm test:coverage:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./reports/coverage/lcov.info,./apps/*/reports/coverage/lcov.info,./packages/*/reports/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            reports/coverage/
            apps/*/reports/coverage/
            packages/*/reports/coverage/

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: reports/coverage/COVERAGE_REPORT.md

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: coverage
    
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: reports/

      - name: Check coverage thresholds
        run: |
          if [ -f reports/coverage/coverage-aggregate.json ]; then
            passed=$(jq -r '.passed' reports/coverage/coverage-aggregate.json)
            if [ "$passed" = "false" ]; then
              echo "::error::Coverage thresholds not met"
              jq '.aggregate' reports/coverage/coverage-aggregate.json
              exit 1
            fi
            echo "::notice::All coverage thresholds passed!"
            jq '.aggregate' reports/coverage/coverage-aggregate.json
          else
            echo "::warning::No coverage report found"
          fi
