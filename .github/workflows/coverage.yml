name: Test Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions: {}  # Least-privilege: no permissions by default

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Coverage thresholds - fail CI if below these
  MIN_LINE_COVERAGE: 75
  MIN_RUST_COVERAGE: 70

jobs:
  # Rust coverage job (security crates)
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            services/mail-server/target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage for security crates
        working-directory: services/mail-server
        run: |
          cargo llvm-cov \
            -p waf-engine \
            -p ids-engine \
            -p spam-filter \
            -p dlp-engine \
            -p sandbox \
            -p ato-protection \
            -p threat-intel \
            -p mail-common \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '(test|mock|generated)'

      - name: Check Rust coverage threshold
        working-directory: services/mail-server
        run: |
          # Parse coverage percentage from lcov
          TOTAL=$(grep -E "^LF:" lcov.info | cut -d: -f2 | paste -sd+ | bc || echo 0)
          COVERED=$(grep -E "^LH:" lcov.info | cut -d: -f2 | paste -sd+ | bc || echo 0)
          
          if [ "$TOTAL" -gt 0 ]; then
            PERCENTAGE=$(( COVERED * 100 / TOTAL ))
          else
            PERCENTAGE=0
          fi
          
          echo "Rust coverage: $COVERED / $TOTAL lines ($PERCENTAGE%)"
          echo "rust_coverage=$PERCENTAGE" >> $GITHUB_OUTPUT
          
          if [ "$PERCENTAGE" -lt "$MIN_RUST_COVERAGE" ]; then
            echo "::error::Rust coverage $PERCENTAGE% is below threshold $MIN_RUST_COVERAGE%"
            exit 1
          fi
          echo "::notice::Rust coverage $PERCENTAGE% meets threshold"

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: services/mail-server/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # TypeScript coverage job
  coverage:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write  # needed for sticky-pull-request-comment
    
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apexmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@90f659ecb4e9337ce0ccede6ef8e59e5bb6d4724 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/apexmail_test
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        run: pnpm test:coverage:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./reports/coverage/lcov.info,./apps/*/reports/coverage/lcov.info,./packages/*/reports/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            reports/coverage/
            apps/*/reports/coverage/
            packages/*/reports/coverage/

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          path: reports/coverage/COVERAGE_REPORT.md

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: coverage
    timeout-minutes: 5
    permissions:
      contents: read
    
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-reports
          path: reports/

      - name: Check coverage thresholds
        run: |
          if [ -f reports/coverage/coverage-aggregate.json ]; then
            passed=$(jq -r '.passed' reports/coverage/coverage-aggregate.json)
            if [ "$passed" = "false" ]; then
              echo "::error::Coverage thresholds not met"
              jq '.aggregate' reports/coverage/coverage-aggregate.json
              exit 1
            fi
            echo "::notice::All coverage thresholds passed!"
            jq '.aggregate' reports/coverage/coverage-aggregate.json
          else
            echo "::warning::No coverage report found"
          fi
