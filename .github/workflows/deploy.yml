# =============================================================================
# ApexMail Deploy — Docker Build, Vulnerability Scan, SBOM & Push
# =============================================================================
name: Deploy — Docker Build & Push

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - services/mail-server/**
      - apps/marketing-zola/**
      - deploy/**
      - .github/workflows/deploy.yml
  push:
    branches:
      - main
    paths:
      - services/mail-server/**
      - apps/marketing-zola/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed for PR gate checks
  pull-requests: read
  checks: read
  statuses: read
  # Needed for attestations/SBOM
  id-token: write
  attestations: write
  # Needed for Trivy SARIF upload to GitHub code scanning (advisory; ignored
  # if code-scanning is disabled at the repo level).
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── PR Gate ────────────────────────────────────────────────────────────────
  # Require all required status checks to pass before building images
  pr-gate:
    name: PR Gate — Required Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check required CI statuses
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.7
        with:
          script: |
            const requiredChecks = [
              'cargo check --workspace --all-targets',
              'Rust panic-path guardrail / rust-panic-paths',
              'Validate SQLx migrations / Validate SQLx migrations',
              'Pricing Drift Validation / pricing-drift',
            ];

            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });

            const failed = [];
            const pending = [];
            const missing = [];

            for (const checkName of requiredChecks) {
              const found = checks.check_runs.filter(c => c.name === checkName);
              if (found.length === 0) {
                missing.push(checkName);
              } else {
                const latest = found.sort((a, b) =>
                  new Date(b.completed_at) - new Date(a.completed_at)
                )[0];
                if (latest.status !== 'completed') {
                  pending.push(checkName);
                } else if (latest.conclusion !== 'success') {
                  failed.push(`${checkName} (${latest.conclusion})`);
                }
              }
            }

            let statusMsg = '';
            if (failed.length > 0) {
              statusMsg = `❌ Failed checks:\n${failed.map(c => `  - ${c}`).join('\n')}`;
            }
            if (pending.length > 0) {
              statusMsg += `\n⏳ Pending checks:\n${pending.map(c => `  - ${c}`).join('\n')}`;
            }
            if (missing.length > 0) {
              statusMsg += `\n⚠️  Missing checks:\n${missing.map(c => `  - ${c}`).join('\n')}`;
            }

            if (failed.length > 0) {
              core.setFailed(statusMsg);
            } else if (pending.length > 0) {
              core.warning(statusMsg);
            } else {
              console.log('✅ All required checks passed');
            }

  # ── Image-Name Drift Guard ─────────────────────────────────────────────────
  # Asserts every `image:` reference in the compose files matches the canonical
  # service map in deploy/DEPLOYMENT.md. Prevents the "clashing paths" class of
  # bug where a service gets renamed in one file but not the others.
  deploy-image-name-guard:
    name: Deploy — Image-Name Drift Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify compose image references are canonical
        run: |
          set -euo pipefail
          # Canonical image basenames (after the registry/namespace path).
          # Mirrors deploy/DEPLOYMENT.md exactly — update both together.
          canonical=(
            api-server mta worker enterprise tracking-service
            observability marketing
          )
          # Third-party images that are allowed as-is (pinned upstream images).
          allowed_third_party=(
            nginx: certbot/certbot: prodrigestivill/postgres-backup-local:
            postgres: redis: clickhouse/clickhouse-server:
          )

          files=(docker-compose.yml docker-compose.prod.yml docker-compose.override.yml)
          missing_files=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || missing_files+=("$f")
          done
          if (( ${#missing_files[@]} > 0 )); then
            echo "::warning::Skipping guard — compose files not all present: ${missing_files[*]}"
            exit 0
          fi

          # Extract all `image:` values from the prod compose (the deploy source of truth).
          mapfile -t refs < <(grep -hE '^\s*image:\s' docker-compose.yml docker-compose.prod.yml \
                                | sed -E 's/^\s*image:\s*//; s/^["'"'"']//; s/["'"'"']$//' \
                                | sort -u)

          errors=()
          for ref in "${refs[@]}"; do
            # Skip allowed third-party images.
            skip=0
            for tp in "${allowed_third_party[@]}"; do
              if [[ "$ref" == "${tp}"* ]]; then skip=1; break; fi
            done
            (( skip )) && continue

            # For GHCR refs, the basename is the last path component before the tag.
            if [[ "$ref" == ghcr.io/* ]]; then
              base="$(printf '%s' "${ref#ghcr.io/*/}" | sed -E 's/:[^:/]+$//' )"
              found=0
              for c in "${canonical[@]}"; do
                if [[ "$base" == "$c" ]]; then found=1; break; fi
              done
              if (( ! found )); then
                errors+=("non-canonical GHCR image: $ref (basename '$base')")
              fi
              # Reject version tags that CI never produces (only :latest and :<sha> are published).
              if [[ "$ref" =~ :v[0-9] ]]; then
                errors+=("version tag in $ref — CI only publishes :latest and :<sha>; see deploy/DEPLOYMENT.md")
              fi
            fi
          done

          # Also assert the canonical set each appear at least once in prod compose.
          for c in "${canonical[@]}"; do
            if ! grep -qE "image:.*[/:]${c}(:latest|:[0-9a-f]{7,40})?\s*$" docker-compose.prod.yml \
               && ! grep -qE "image:.*[/:]${c}:" docker-compose.prod.yml; then
              errors+=("canonical service '$c' has no image reference in docker-compose.prod.yml")
            fi
          done

          if (( ${#errors[@]} > 0 )); then
            printf '::error::%s\n' "${errors[@]}"
            exit 1
          fi
          echo "✅ All compose image references are canonical."

  # ── Docker Build & Push ────────────────────────────────────────────────────
  docker-build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      # ── Optimisation: only build images whose source changed ───────────────
      # Per-image change detection keeps CI fast — an image only rebuilds when
      # its own source tree (or shared base/runtime layers) changed.
      - name: Detect changed image sources
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            marketing:
              - 'apps/marketing-zola/**'
            rust-workspace:
              - 'services/mail-server/**'
              - 'deploy/Dockerfile.tracking'
            deploy-infra:
              - 'deploy/**'
              - 'docker-compose*.yml'

      # Build the marketing site first (cheap, no Rust toolchain) so the
      # public website still publishes even if the larger Rust builds below
      # exceed the job timeout-minutes.
      - name: Build and push marketing site image
        if: steps.changes.outputs.marketing == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: ./apps/marketing-zola
          file: ./apps/marketing-zola/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/marketing:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/marketing:latest
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Build and push Docker image (runtime-base)
        id: build-runtime
        if: steps.changes.outputs.rust-workspace == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: services/mail-server/Dockerfile
          push: true
          target: runtime-base
          # runtime-base is a shared layer used by the per-service images below;
          # tag it under its own name so it can be referenced as a cache source.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/runtime-base:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/runtime-base:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Build and push API server image
        if: steps.changes.outputs.rust-workspace == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: services/mail-server/Dockerfile
          push: true
          target: api-server
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-server:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Build and push tracking service image
        if: steps.changes.outputs.rust-workspace == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: deploy/Dockerfile.tracking
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tracking-service:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tracking-service:latest
          cache-from: type=gha,scope=tracking
          cache-to: type=gha,mode=max,scope=tracking
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Build and push MTA image
        if: steps.changes.outputs.rust-workspace == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: services/mail-server/Dockerfile
          push: true
          target: mta
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mta:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mta:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Build and push worker image
        if: steps.changes.outputs.rust-workspace == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: services/mail-server/Dockerfile
          push: true
          target: worker
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Build and push enterprise image
        if: steps.changes.outputs.rust-workspace == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: services/mail-server/Dockerfile
          push: true
          target: enterprise
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/enterprise:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/enterprise:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Build and push observability image
        if: steps.changes.outputs.rust-workspace == 'true'
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          file: services/mail-server/Dockerfile
          push: true
          target: observability
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/observability:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/observability:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      # NOTE: ops-service intentionally NOT built — no compose consumer references
      # it and it has no runtime deployment. Removing it eliminates a phantom
      # image that drifted from the canonical service list.

      # (marketing image is built earlier — at the top of the build sequence)

      # ── Container Image Vulnerability Scanning ──────────────────────────────
      # H5: Uses Trivy (open-source, no rate limits) to scan the API server image
      - name: Run Trivy vulnerability scanner (api-server)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-server:${{ github.sha }}
          format: sarif
          output: trivy-api-server-results.sarif
          severity: CRITICAL,HIGH
          # SECURITY: Fail CI on HIGH/CRITICAL CVEs. Do not set to 0.
          exit-code: 1

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@1521896cd211af95be3f02edf6f436e10b819c27 # v3.35.4
        if: hashFiles('trivy-api-server-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-api-server-results.sarif

      - name: Run Trivy vulnerability scanner (MTA)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mta:${{ github.sha }}
          format: sarif
          output: trivy-mta-results.sarif
          severity: CRITICAL,HIGH
          # SECURITY: Fail CI on HIGH/CRITICAL CVEs. Do not set to 0.
          exit-code: 1

      - name: Upload Trivy scan results to GitHub Security (MTA)
        uses: github/codeql-action/upload-sarif@1521896cd211af95be3f02edf6f436e10b819c27 # v3.35.4
        if: hashFiles('trivy-mta-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-mta-results.sarif

      # ── Software Bill of Materials (SBOM) Generation ────────────────────────
      # H9: Uses Syft to generate SPDX SBOM for the runtime base image
      - name: Generate SBOM (runtime-base)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/runtime-base:${{ github.sha }}
          format: spdx-json
          output-file: sbom-runtime-base.spdx.json

      - name: Upload SBOM artifact
        if: hashFiles('sbom-runtime-base.spdx.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-*.spdx.json
          retention-days: 90
