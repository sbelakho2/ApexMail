# =============================================================================
# ApexMail — CI Load Gate Workflow
# =============================================================================
# LT-C-03: Performance gate that runs HTTP load tests (k6) against the API
# server and gates CI/CD on the results. If performance thresholds are not
# met, the workflow fails and prevents the PR from being merged (when
# configured as a required check).
#
# Triggers:
#   - workflow_dispatch: Manual trigger via GitHub UI or API
#   - pull_request labeled 'load-test': Auto-triggered when a PR receives
#     the 'load-test' label (useful for performance-sensitive changes)
#
# Steps:
#   1. Checkout code
#   2. Generate ephemeral JWT keypair + API secrets
#   3. Build + start the real API server (postgres + redis + api-server
#      via deploy/load-test-infra/docker-compose.ci.yml) on localhost:3000
#   4. Bootstrap DB schema + seed the smoke-test user
#   5. Wait for API readiness
#   6. Setup k6 (install)
#   7. Run smoke test (1 VU, 1 iteration — quick sanity check)
#   8. Determine test profile
#   9. Run load test (50 VUs, ramp-up → sustain → ramp-down)
#   10-11. Run stress/spike tests (profile-dependent)
#   12. Store results as artifacts
#   13. Check thresholds against defined pass/fail criteria
#   14. Post results as a PR comment (if triggered by PR)
#   15. Fail or pass based on threshold results
# =============================================================================

name: Load Test Gate

on:
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Load test profile to execute'
        required: true
        default: 'standard'
        type: choice
        options:
          - smoke       # Smoke test only (quick check)
          - standard    # Smoke + load test (default)
          - stress      # Smoke + stress test
          - spike       # Smoke + spike test
          - full        # All tests
      api_base_url:
        description: 'API server base URL (default: http://localhost:3000)'
        required: false
        default: 'http://localhost:3000'
        type: string

  pull_request:
    types: [labeled]
    branches: [main]

env:
  K6_API_BASE: ${{ github.event.inputs.api_base_url || 'http://localhost:3000' }}
  K6_API_KEY: ${{ secrets.LOAD_TEST_API_KEY }}
  K6_INSECURE: 'true'
  LOAD_GATE_COMPOSE: deploy/load-test-infra/docker-compose.ci.yml

jobs:
  load-gate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'load-test')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── Step 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Step 1b: Fail fast when the API key secret is not configured ───────
      - name: Verify LOAD_TEST_API_KEY secret is configured
        run: |
          if [ -z "${K6_API_KEY}" ]; then
            echo "::error::Secret LOAD_TEST_API_KEY is not set. Configure it before running the load gate — no fallback key is used."
            exit 1
          fi

      # ── Step 2: Generate ephemeral JWT keypair + secrets for the API server ──
      - name: Generate API server secrets (ephemeral per run)
        run: |
          set -euo pipefail
          openssl genrsa -out /tmp/jwt-private.pem 2048 2>/dev/null
          openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem 2>/dev/null
          {
            printf 'JWT_PRIVATE_KEY_PEM="%s"\n' "$(cat /tmp/jwt-private.pem)"
            printf 'JWT_PUBLIC_KEY_PEM="%s"\n'  "$(cat /tmp/jwt-public.pem)"
            printf 'API_KEY_HASH_SECRET="%s"\n'    "$(openssl rand -hex 32)"
            printf 'WEBHOOK_SIGNING_SECRET="%s"\n' "$(openssl rand -hex 32)"
            printf 'SESSION_SECRET="%s"\n'         "$(openssl rand -hex 32)"
            printf 'IMPERSONATION_SECRET="%s"\n'   "$(openssl rand -hex 32)"
            printf 'CSRF_SECRET="%s"\n'            "$(openssl rand -hex 32)"
            printf 'TRACKING_SECRET_KEY="%s"\n'    "$(openssl rand -hex 32)"
            printf 'INTERNAL_SERVICE_TOKEN="%s"\n' "$(openssl rand -hex 32)"
          } > /tmp/loadgate.env
          echo "secrets env written: $(wc -l < /tmp/loadgate.env) vars"

      # ── Step 3: Build + start the API server (postgres + redis + api-server) ─
      # The k6 suites target http://localhost:3000 — without a running API
      # server every request would fail. This boots the real image from the
      # repo's Dockerfile with the backing services from the CI compose.
      - name: Build and start API server (postgres + redis + api-server)
        run: |
          set -euo pipefail
          docker compose --env-file /tmp/loadgate.env \
            -f "${LOAD_GATE_COMPOSE}" up -d --build postgres redis api-server
          docker compose -f "${LOAD_GATE_COMPOSE}" ps

      # ── Step 4: Bootstrap schema + seed the smoke-test user ────────────────
      # The api-server does not run migrations at startup; apply the canonical
      # DDL (apexmail_db::migrations::SCHEMA) and insert the login used by the
      # k6 scripts so /v1/auth/login and /v1/messages checks can pass.
      - name: Bootstrap schema and seed smoke-test user
        run: |
          set -euo pipefail
          docker compose -f "${LOAD_GATE_COMPOSE}" exec -T postgres \
            pg_isready -U apexmail -d apexmail_loadtest
          awk '/^pub const SCHEMA: &str = r#"$/{f=1; next} /^"#;$/{f=0} f' \
            services/mail-server/crates/apexmail-db/src/migrations.rs > /tmp/schema.sql
          wc -l /tmp/schema.sql
          docker compose -f "${LOAD_GATE_COMPOSE}" exec -T postgres \
            psql -U apexmail -d apexmail_loadtest -v ON_ERROR_STOP=1 < /tmp/schema.sql
          sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils >/dev/null
          HASH="$(htpasswd -bnBC 10 '' 'smoke-test-password' | tr -d ':\n')"
          docker compose -f "${LOAD_GATE_COMPOSE}" exec -T postgres \
            psql -U apexmail -d apexmail_loadtest -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO tenants (id, name, slug)
          VALUES (gen_random_uuid(), 'Load Test', 'loadtest')
          ON CONFLICT (slug) DO NOTHING;
          INSERT INTO users (id, tenant_id, email, name, password_hash, role, status)
          SELECT gen_random_uuid(), id, 'smoke-test@apexmail.ee', 'Smoke Test', '${HASH}', 'owner', 'active'
          FROM tenants WHERE slug = 'loadtest'
          ON CONFLICT (email) DO NOTHING;
          SQL

      # ── Step 5: Wait for API readiness ─────────────────────────────────────
      - name: Wait for API server readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health/ready >/dev/null 2>&1; then
              echo "API server ready after ${i}0s"
              curl -s http://localhost:3000/health/live
              exit 0
            fi
            sleep 10
          done
          echo "::error::API server did not become ready on localhost:3000"
          docker compose -f "${LOAD_GATE_COMPOSE}" logs --tail 50 api-server
          exit 1

      # ── Step 6: Setup k6 ──────────────────────────────────────────────────
      - name: Setup k6
        run: |
          echo "Installing k6 — a modern load testing tool for APIs"
          sudo apt-get update
          sudo apt-get install -y gnupg
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          echo "k6 version: $(k6 version)"

      # ── Step 7: Run Smoke Test ────────────────────────────────────────────
      - name: Run smoke test
        id: smoke-test
        working-directory: load-tests/http
        run: |
          set -o pipefail
          echo "=== Running smoke test ==="
          k6 run smoke-test.js \
            --summary-export=/tmp/k6-smoke-summary.json \
            --out json=/tmp/k6-smoke-results.json \
            2>&1 | tee /tmp/k6-smoke-output.log
          test -f /tmp/k6-smoke-summary.json || {
            echo "::error::k6 smoke test produced no summary JSON"; exit 1; }

      # ── Step 8: Determine test profile ────────────────────────────────────
      - name: Determine test profile
        id: profile
        run: |
          PROFILE="${{ github.event.inputs.test_profile || 'standard' }}"
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT

      # ── Step 9: Run Load Test ─────────────────────────────────────────────
      - name: Run load test (standard profile)
        if: steps.profile.outputs.profile == 'standard' || steps.profile.outputs.profile == 'full'
        working-directory: load-tests/http
        run: |
          set -o pipefail
          echo "=== Running load test ==="
          k6 run load-test.js \
            --summary-export=/tmp/k6-load-summary.json \
            --out json=/tmp/k6-load-results.json \
            2>&1 | tee /tmp/k6-load-output.log
          test -f /tmp/k6-load-summary.json || {
            echo "::error::k6 load test produced no summary JSON"; exit 1; }

      # ── Step 10: Run Stress Test (conditional) ────────────────────────────
      - name: Run stress test
        if: steps.profile.outputs.profile == 'stress' || steps.profile.outputs.profile == 'full'
        working-directory: load-tests/http
        continue-on-error: true  # Stress tests may intentionally exceed thresholds
        run: |
          set -o pipefail
          echo "=== Running stress test ==="
          k6 run stress-test.js \
            --summary-export=/tmp/k6-stress-summary.json \
            --out json=/tmp/k6-stress-results.json \
            2>&1 | tee /tmp/k6-stress-output.log
          test -f /tmp/k6-stress-summary.json || {
            echo "::error::k6 stress test produced no summary JSON"; exit 1; }

      # ── Step 11: Run Spike Test (conditional) ─────────────────────────────
      - name: Run spike test
        if: steps.profile.outputs.profile == 'spike' || steps.profile.outputs.profile == 'full'
        working-directory: load-tests/http
        continue-on-error: true  # Spike tests may intentionally exceed thresholds
        run: |
          set -o pipefail
          echo "=== Running spike test ==="
          k6 run spike-test.js \
            --summary-export=/tmp/k6-spike-summary.json \
            --out json=/tmp/k6-spike-results.json \
            2>&1 | tee /tmp/k6-spike-output.log
          test -f /tmp/k6-spike-summary.json || {
            echo "::error::k6 spike test produced no summary JSON"; exit 1; }

      # ── Step 12: Store Results as Artifacts ───────────────────────────────
      - name: Store k6 results as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-load-test-results
          path: |
            /tmp/k6-*.json
            /tmp/k6-*.log
          retention-days: 7

      # ── Step 13: Check Thresholds & Baseline Comparison ──────────────────────
      - name: Check load test thresholds and compare against baselines
        id: check-thresholds
        run: |
          FAILED=false
          RESULTS_DIR="/tmp"
          BASELINE_FILE="load-tests/baselines/v1.0.json"
          REGRESSION_THRESHOLD=1.20  # 20% regression tolerance

          echo "=== Threshold Verification & Baseline Comparison ==="
          echo ""

          # Helper function to extract a value from k6 summary JSON
          extract_metric() {
            local file="$1"
            local metric="$2"
            local value="$3"
            if [ -f "$file" ]; then
              jq -r ".metrics.\"$metric\".values.\"$value\" // \"N/A\"" "$file"
            else
              echo "N/A"
            fi
          }

          # ── Smoke test thresholds ─────────────────────────────────────────
          if [ -f "$RESULTS_DIR/k6-smoke-summary.json" ]; then
            echo "── Smoke Test ──"
            SMOKE_P95=$(extract_metric "$RESULTS_DIR/k6-smoke-summary.json" "http_req_duration" "p(95)")
            SMOKE_FAIL=$(extract_metric "$RESULTS_DIR/k6-smoke-summary.json" "http_req_failed" "rate")
            echo "  p(95) latency: ${SMOKE_P95}ms"
            echo "  Error rate:    ${SMOKE_FAIL}"

            # Check: p95 < 2000ms for smoke test
            if [ "$SMOKE_P95" != "N/A" ] && [ "$(echo "$SMOKE_P95 > 2000" | bc -l)" -eq 1 ]; then
              echo "  ❌ Smoke test p(95) latency exceeds 2000ms"
              FAILED=true
            else
              echo "  ✅ Smoke test p(95) latency within limit"
            fi

            # Check: error rate < 1%
            if [ "$SMOKE_FAIL" != "N/A" ] && [ "$(echo "$SMOKE_FAIL > 0.01" | bc -l)" -eq 1 ]; then
              echo "  ❌ Smoke test error rate exceeds 1%"
              FAILED=true
            else
              echo "  ✅ Smoke test error rate within limit"
            fi
          fi
          echo ""

          # ── Load test thresholds ──────────────────────────────────────────
          if [ -f "$RESULTS_DIR/k6-load-summary.json" ]; then
            echo "── Load Test ──"
            LOAD_P95=$(extract_metric "$RESULTS_DIR/k6-load-summary.json" "http_req_duration" "p(95)")
            LOAD_P99=$(extract_metric "$RESULTS_DIR/k6-load-summary.json" "http_req_duration" "p(99)")
            LOAD_FAIL=$(extract_metric "$RESULTS_DIR/k6-load-summary.json" "http_req_failed" "rate")
            LOAD_RATE=$(extract_metric "$RESULTS_DIR/k6-load-summary.json" "http_reqs" "rate")
            echo "  p(95) latency:     ${LOAD_P95}ms"
            echo "  p(99) latency:     ${LOAD_P99}ms"
            echo "  Error rate:        ${LOAD_FAIL}"
            echo "  Request rate:      ${LOAD_RATE} req/s"

            # Check: p95 < 500ms
            if [ "$LOAD_P95" != "N/A" ] && [ "$(echo "$LOAD_P95 > 500" | bc -l)" -eq 1 ]; then
              echo "  ❌ Load test p(95) latency exceeds 500ms"
              FAILED=true
            else
              echo "  ✅ Load test p(95) latency within limit"
            fi

            # Check: p99 < 2000ms
            if [ "$LOAD_P99" != "N/A" ] && [ "$(echo "$LOAD_P99 > 2000" | bc -l)" -eq 1 ]; then
              echo "  ❌ Load test p(99) latency exceeds 2000ms"
              FAILED=true
            else
              echo "  ✅ Load test p(99) latency within limit"
            fi

            # Check: error rate < 1%
            if [ "$LOAD_FAIL" != "N/A" ] && [ "$(echo "$LOAD_FAIL > 0.01" | bc -l)" -eq 1 ]; then
              echo "  ❌ Load test error rate exceeds 1%"
              FAILED=true
            else
              echo "  ✅ Load test error rate within limit"
            fi
          fi
          echo ""

          # ── Baseline Regression Comparison ─────────────────────────────────
          if [ -f "$BASELINE_FILE" ]; then
            echo "── Baseline Regression Check (threshold: >20% slower = fail) ──"
            BASELINE_P95=$(jq -r '.api_throughput.p95_latency_ms // "N/A"' "$BASELINE_FILE")
            BASELINE_P99=$(jq -r '.api_throughput.p99_latency_ms // "N/A"' "$BASELINE_FILE")
            BASELINE_RPS=$(jq -r '.api_throughput.sustained_rps // "N/A"' "$BASELINE_FILE")
            BASELINE_ERR=$(jq -r '.api_throughput.error_rate // "N/A"' "$BASELINE_FILE")
            echo "  Baseline p95 latency:  ${BASELINE_P95}ms"
            echo "  Baseline p99 latency:  ${BASELINE_P99}ms"
            echo "  Baseline throughput:   ${BASELINE_RPS} req/s"
            echo "  Baseline error rate:   ${BASELINE_ERR}"

            if [ -f "$RESULTS_DIR/k6-load-summary.json" ]; then
              # Compare p95 latency against baseline
              if [ "$LOAD_P95" != "N/A" ] && [ "$BASELINE_P95" != "N/A" ]; then
                P95_RATIO=$(echo "scale=4; $LOAD_P95 / $BASELINE_P95" | bc -l)
                echo "  p95 ratio (actual/baseline): ${P95_RATIO}"
                if [ "$(echo "$P95_RATIO > $REGRESSION_THRESHOLD" | bc -l)" -eq 1 ]; then
                  echo "  ❌ p(95) regression: ${LOAD_P95}ms is >20% slower than baseline ${BASELINE_P95}ms"
                  FAILED=true
                else
                  echo "  ✅ p(95) within 20% of baseline"
                fi
              fi

              # Compare p99 latency against baseline
              if [ "$LOAD_P99" != "N/A" ] && [ "$BASELINE_P99" != "N/A" ]; then
                P99_RATIO=$(echo "scale=4; $LOAD_P99 / $BASELINE_P99" | bc -l)
                echo "  p99 ratio (actual/baseline): ${P99_RATIO}"
                if [ "$(echo "$P99_RATIO > $REGRESSION_THRESHOLD" | bc -l)" -eq 1 ]; then
                  echo "  ❌ p(99) regression: ${LOAD_P99}ms is >20% slower than baseline ${BASELINE_P99}ms"
                  FAILED=true
                else
                  echo "  ✅ p(99) within 20% of baseline"
                fi
              fi

              # Compare throughput against baseline (inverse: lower is worse)
              if [ "$LOAD_RATE" != "N/A" ] && [ "$BASELINE_RPS" != "N/A" ]; then
                RPS_RATIO=$(echo "scale=4; $BASELINE_RPS / $LOAD_RATE" | bc -l)
                echo "  throughput ratio (baseline/actual): ${RPS_RATIO}"
                if [ "$(echo "$RPS_RATIO > $REGRESSION_THRESHOLD" | bc -l)" -eq 1 ]; then
                  echo "  ❌ Throughput regression: ${LOAD_RATE} req/s is >20% below baseline ${BASELINE_RPS} req/s"
                  FAILED=true
                else
                  echo "  ✅ Throughput within 20% of baseline"
                fi
              fi

              # Compare error rate against baseline
              if [ "$LOAD_FAIL" != "N/A" ] && [ "$BASELINE_ERR" != "N/A" ]; then
                ERR_RATIO=$(echo "scale=4; $LOAD_FAIL / $BASELINE_ERR" | bc -l)
                echo "  error rate ratio (actual/baseline): ${ERR_RATIO}"
                if [ "$(echo "$ERR_RATIO > $REGRESSION_THRESHOLD" | bc -l)" -eq 1 ]; then
                  echo "  ❌ Error rate regression: ${LOAD_FAIL} is >20% higher than baseline ${BASELINE_ERR}"
                  FAILED=true
                else
                  echo "  ✅ Error rate within 20% of baseline"
                fi
              fi
            fi
          else
            echo "⚠️  No baseline file found at $BASELINE_FILE — skipping regression check"
          fi
          echo ""

          # ── Results ────────────────────────────────────────────────────────
          if $FAILED; then
            echo "❌ Performance thresholds not met!"
            echo "threshold_passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All performance thresholds passed!"
            echo "threshold_passed=true" >> $GITHUB_OUTPUT
          fi

      # ── Step 14: Post Results as PR Comment ──────────────────────────────
      - name: Post load test results as PR comment
        if: |
          github.event_name == 'pull_request' &&
          always()  # Always post, even on failure
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const resultsDir = '/tmp';

            function loadSummary(name) {
              const file = `${resultsDir}/k6-${name}-summary.json`;
              try {
                return JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch {
                return null;
              }
            }

            function formatMetric(summary, metric, label) {
              if (!summary || !summary.metrics || !summary.metrics[metric]) {
                return `  | ${label} | N/A | N/A | N/A | ❌ |\n`;
              }
              const m = summary.metrics[metric];
              const p95 = m.values ? (m.values['p(95)'] || 'N/A') : 'N/A';
              const p99 = m.values ? (m.values['p(99)'] || 'N/A') : 'N/A';
              const fail = m.values ? (m.values['fail'] || 'N/A') : 'N/A';
              const passed = m.thresholds ? Object.values(m.thresholds).every(t => t.ok) : 'N/A';
              return `  | ${label} | ${p95}ms | ${p99}ms | ${fail} | ${passed ? '✅' : '❌'} |\n`;
            }

            let comment = `## 🏋️ Load Test Gate Results\n\n`;
            comment += `**Run:** #${context.runNumber} | **Commit:** ${context.sha.substring(0, 7)} | **Trigger:** ${context.eventName}\n\n`;

            // Smoke test results
            const smokeSummary = loadSummary('smoke');
            if (smokeSummary) {
              comment += `### 🔥 Smoke Test\n`;
              comment += `| Metric | p(95) | p(99) | Failed | Thresholds |\n`;
              comment += `|--------|-------|-------|--------|------------|\n`;
              comment += formatMetric(smokeSummary, 'http_req_duration', 'Request duration');
              comment += formatMetric(smokeSummary, 'http_req_failed', 'Error rate');
            }

            // Load test results
            const loadSummary = loadSummary('load');
            if (loadSummary) {
              comment += `\n### 📊 Load Test\n`;
              comment += `| Metric | p(95) | p(99) | Failed | Thresholds |\n`;
              comment += `|--------|-------|-------|--------|------------|\n`;
              comment += formatMetric(loadSummary, 'http_req_duration', 'Request duration');
              comment += formatMetric(loadSummary, 'http_req_failed', 'Error rate');
              const rate = loadSummary.metrics?.http_reqs?.values?.rate || 'N/A';
              comment += `  | Throughput | ${rate} req/s | — | — | — |\n`;
            }

            // Overall verdict
            const thresholdsPassed = '${{ steps.check-thresholds.outputs.threshold_passed }}';
            comment += `\n### ✅ Overall Verdict\n\n`;
            comment += `**${thresholdsPassed === 'true' ? '✅ ALL THRESHOLDS PASSED' : '❌ SOME THRESHOLDS FAILED'}**\n\n`;
            comment += `Threshold criteria:\n`;
            comment += `- p(95) latency < 500ms\n`;
            comment += `- p(99) latency < 2000ms\n`;
            comment += `- Error rate < 1%\n\n`;
            comment += `> Artifacts available in this workflow run (retained for 7 days).\n`;

            // Find the PR number from the label event
            let issueNumber;
            if (context.payload.pull_request) {
              issueNumber = context.payload.pull_request.number;
            }

            if (issueNumber) {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
              console.log(`Comment posted to PR #${issueNumber}`);
            } else {
              console.log('No PR context — skipping comment');
              console.log(comment);
            }

      # ── Step 15: Notify on Failure ─────────────────────────────────────────
      - name: Notify load test failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const comment = `⚠️ **Load test gate failed** for commit ${context.sha.substring(0, 7)}.\n\n` +
              `Please review the performance impact of your changes. ` +
              `Consider optimising the hot path or requesting a performance review.\n\n` +
              `📋 [View workflow run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            }
