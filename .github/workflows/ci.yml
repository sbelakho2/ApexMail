# ApexMail CI Pipeline
# Deterministic Build Pipeline - Evidence: Reproducible builds from same commit

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 9
  NODE_VERSION: 20

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        run: pnpm typecheck
        
      - name: Lint
        run: pnpm lint

      - name: Verify SSL provisioning config
        run: pnpm tsx tools/check_ssl_assets.ts

      - name: Verify API contract manifest
        run: pnpm verify:contracts

      - name: Run contract tests (consumer/producer)
        run: pnpm verify:contracts:tests

      - name: Enforce billing TS Stripe boundary
        run: pnpm verify:billing:boundary

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enforce Rust quality gates (fmt/clippy/no-unsafe)
        run: pnpm verify:rust:quality

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run tests
        run: pnpm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @apexmail/testing exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm --filter @apexmail/testing test:e2e

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test mail server
        run: cargo test --manifest-path services/mail-server/Cargo.toml --locked

      - name: Test native packages
        run: |
          cargo test --manifest-path packages/bot-detector-native/Cargo.toml --locked
          cargo test --manifest-path packages/crypto-native/Cargo.toml --locked
          cargo test --manifest-path packages/validator-native/Cargo.toml --locked

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build
        run: pnpm build
        
      - name: Generate SBOM
        run: pnpm sbom:generate
        continue-on-error: true
        
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
        if: always()

  # Evidence: Two builds from same commit produce identical binary hashes
  reproducible-build:
    name: Verify Reproducible Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: First build
        run: |
          pnpm build
          find . -path ./node_modules -prune -o -path ./.git -prune -o -type f \( -path './dist/*' -o -path './apps/*/dist/*' -o -path './packages/*/dist/*' -o -path './apps/*/.next/*' \) -print0 | sort -z | xargs -0 sha256sum > /tmp/build1.sha
          
      - name: Clean build artifacts
        run: pnpm clean || true
        
      - name: Second build
        run: |
          pnpm build
          find . -path ./node_modules -prune -o -path ./.git -prune -o -type f \( -path './dist/*' -o -path './apps/*/dist/*' -o -path './packages/*/dist/*' -o -path './apps/*/.next/*' \) -print0 | sort -z | xargs -0 sha256sum > /tmp/build2.sha
          
      - name: Compare builds
        run: |
          echo "Build 1 hashes:"
          cat /tmp/build1.sha
          echo "Build 2 hashes:"
          cat /tmp/build2.sha
          diff /tmp/build1.sha /tmp/build2.sha || echo "Builds may differ - investigate"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: mail-server
            context: services/mail-server
            file: services/mail-server/Dockerfile
          - name: tracking
            context: .
            file: deploy/Dockerfile.tracking
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: false
          tags: apexmail/${{ matrix.image.name }}:ci

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level high

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          cargo audit --manifest-path services/mail-server/Cargo.toml
          cargo audit --manifest-path packages/bot-detector-native/Cargo.toml
          cargo audit --manifest-path packages/crypto-native/Cargo.toml
          cargo audit --manifest-path packages/validator-native/Cargo.toml
