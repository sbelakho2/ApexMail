name: Pricing Drift Validation

on:
  pull_request:
    paths:
      - docs/pricing.md
      - apps/marketing-zola/templates/**
      - tools/validate_pricing_drift.py
      - .github/workflows/pricing-drift.yml
  push:
    branches: [main]
    paths:
      - docs/pricing.md
      - apps/marketing-zola/templates/**
      - tools/validate_pricing_drift.py
      - .github/workflows/pricing-drift.yml

jobs:
  pricing-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Validate pricing copy
        run: python3 tools/validate_pricing_drift.py
