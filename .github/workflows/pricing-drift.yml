name: Pricing Drift Validation

on:
  pull_request:
    paths:
      - docs/pricing.md
      - apps/marketing-zola/templates/**
      - tools/validate_pricing_drift.py
      - services/mail-server/crates/billing-service/src/plans.rs
      - .github/workflows/pricing-drift.yml
  push:
    branches: [main]
    paths:
      - docs/pricing.md
      - apps/marketing-zola/templates/**
      - tools/validate_pricing_drift.py
      - services/mail-server/crates/billing-service/src/plans.rs
      - .github/workflows/pricing-drift.yml

jobs:
  pricing-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate pricing copy
        run: python3 tools/validate_pricing_drift.py
