name: Pricing Drift Validation

on:
  pull_request:
    paths:
      - docs/pricing.md
      - docs/pricing-authority.md
      - docs/architecture/billing-lifecycle.md
      - docs/tool-contracts/stripe.md
      - docs/api/endpoints/billing.md
      - apps/marketing-zola/**
      - tools/validate_pricing_drift.py
      - compliance/**
      - services/mail-server/crates/billing-service/**
      - services/mail-server/crates/api-server/**
      - services/mail-server/crates/ui-foundation/**
      - services/mail-server/crates/enterprise/**
      - services/mail-server/migrations/**
      - scripts/consistency-test.sh
      - .github/workflows/pricing-drift.yml
  push:
    branches: [main]
    paths:
      - docs/pricing.md
      - docs/pricing-authority.md
      - docs/architecture/billing-lifecycle.md
      - docs/tool-contracts/stripe.md
      - docs/api/endpoints/billing.md
      - apps/marketing-zola/**
      - tools/validate_pricing_drift.py
      - compliance/**
      - services/mail-server/crates/billing-service/**
      - services/mail-server/crates/api-server/**
      - services/mail-server/crates/ui-foundation/**
      - services/mail-server/crates/enterprise/**
      - services/mail-server/migrations/**
      - scripts/consistency-test.sh
      - .github/workflows/pricing-drift.yml

jobs:
  pricing-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2
      - name: Build static marketing output
        run: zola build --root apps/marketing-zola
      - name: Validate runtime pricing consistency
        run: python3 tools/validate_pricing_drift.py
