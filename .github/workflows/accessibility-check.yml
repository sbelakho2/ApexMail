name: Accessibility CI

on:
  pull_request:
    paths:
      - 'apps/marketing-zola/templates/**'
      - 'apps/marketing-zola/css/**'
      - 'deploy/tests/contrast-check.sh'
      - '.github/workflows/accessibility-check.yml'
  push:
    branches: [main]
    paths:
      - 'apps/marketing-zola/templates/**'
      - 'apps/marketing-zola/css/**'
      - 'deploy/tests/contrast-check.sh'
      - '.github/workflows/accessibility-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: WCAG 2.2 AA Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build Zola site
        working-directory: apps/marketing-zola
        run: |
          if command -v zola &>/dev/null; then zola build; else
            curl -sSL "https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz" | tar xz && ./zola build; fi
      - name: Run contrast & accessibility check
        run: |
          chmod +x deploy/tests/contrast-check.sh
          BUILD_DIR=apps/marketing-zola/public bash deploy/tests/contrast-check.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessibility-report
          path: deploy/tests/.contrast-check-report.json
          retention-days: 30
