name: Broken Link Check

on:
  pull_request:
    paths:
      - 'apps/marketing-zola/**'
      - 'deploy/tests/broken-links.sh'
      - '.github/workflows/broken-link-check.yml'
  push:
    branches: [main]
    paths:
      - 'apps/marketing-zola/**'
      - 'deploy/tests/broken-links.sh'
      - '.github/workflows/broken-link-check.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broken-links:
    name: Broken Link Crawler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build Zola site
        working-directory: apps/marketing-zola
        run: |
          if command -v zola &>/dev/null; then zola build; else
            curl -sSL "https://github.com/getzola/zola/releases/download/v0.19.1/zola-v0.19.1-x86_64-unknown-linux-gnu.tar.gz" | tar xz && ./zola build; fi
      - name: Run broken-link checker
        run: |
          chmod +x deploy/tests/broken-links.sh
          BUILD_DIR=apps/marketing-zola/public bash deploy/tests/broken-links.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@fe9530cd28e02193eced3282e22f38e03d99fa02
        with:
          name: broken-links-report
          path: deploy/tests/.broken-links-report.json
          retention-days: 30
