# =============================================================================
# ApexMail — Hetzner Production Deploy (SSH + Docker Compose)
# =============================================================================
# Deploys the docker-compose.yml + docker-compose.prod.yml stack onto the
# Hetzner host over SSH. Pulls images from GHCR (built by deploy.yml) and
# renders production secrets from a single repository/org secret
# APEXMAIL_PROD_ENV.
#
# Required GitHub secrets (repository OR org level):
#   HETZNER_SSH_HOST         — production host IP/hostname (NO hardcoded default)
#   HETZNER_SSH_USER         — SSH user (NO hardcoded default; recommend 'root' or 'deploy')
#   HETZNER_SSH_PRIVATE_KEY  — private key matching the host's authorized_keys
#   HETZNER_KNOWN_HOSTS      — output of `ssh-keyscan -H <HETZNER_SSH_HOST>`
#   APEXMAIL_PROD_ENV        — full .env contents (see deploy/DEPLOYMENT.md)
#   GHCR_DEPLOY_TOKEN        — PAT with read:packages for the host's `docker login ghcr.io`
#                              (must own the package or be granted read access).
#
# Optional secrets (with defaults):
#   HETZNER_DEPLOY_DIR       — defaults to /opt/apexmail
# =============================================================================
name: Deploy — Hetzner

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref / image tag to deploy (defaults to latest main)"
        required: false
        default: ""
      skip_pull:
        description: "Skip docker compose pull (use existing local images)"
        required: false
        default: "false"
  workflow_run:
    workflows: ["Deploy — Docker Build & Push"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: production
      url: https://app.apexmail.ee

    env:
      # NO hardcoded host/user defaults — these MUST come from secrets so a
      # misconfigured workflow fails loudly instead of deploying to a stale IP.
      DEPLOY_HOST: ${{ secrets.HETZNER_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.HETZNER_SSH_USER }}
      DEPLOY_DIR:  ${{ secrets.HETZNER_DEPLOY_DIR || '/opt/apexmail' }}
      DEPLOY_REF:  ${{ github.event.inputs.ref || github.sha }}

    steps:
      - name: Fail fast if host/user secrets are absent
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          if [[ -z "${DEPLOY_HOST:-}" || -z "${DEPLOY_USER:-}" ]]; then
            echo "::error::HETZNER_SSH_HOST and HETZNER_SSH_USER secrets are required (no defaults)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Validate APEXMAIL_PROD_ENV against the compose contract
        # Fail fast ON THE RUNNER (before touching the host): derive the
        # required variable set straight out of docker-compose*.yml (${:?}
        # guards) and check every value in the rendered env for missing or
        # still-placeholder entries. SKIP_FILE_CHECK=1 because the PROD_*_FILE
        # targets live on the HOST (rendered by a later step), not here.
        env:
          APEXMAIL_PROD_ENV: ${{ secrets.APEXMAIL_PROD_ENV }}
        run: |
          set -euo pipefail
          umask 177
          env_file="$(mktemp /tmp/apexmail-prod-env.XXXXXX)"
          trap 'shred -u "$env_file" 2>/dev/null || rm -f "$env_file"' EXIT
          printf '%s\n' "${APEXMAIL_PROD_ENV}" > "$env_file"
          SKIP_FILE_CHECK=1 bash tools/validate-prod-env.sh "$env_file"

      - name: Validate required secrets are present
        env:
          HETZNER_SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          APEXMAIL_PROD_ENV: ${{ secrets.APEXMAIL_PROD_ENV }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          missing=()
          [[ -n "${HETZNER_SSH_HOST:-}"        ]] || missing+=("HETZNER_SSH_HOST")
          [[ -n "${HETZNER_SSH_USER:-}"        ]] || missing+=("HETZNER_SSH_USER")
          [[ -n "${HETZNER_SSH_PRIVATE_KEY:-}" ]] || missing+=("HETZNER_SSH_PRIVATE_KEY")
          [[ -n "${HETZNER_KNOWN_HOSTS:-}"     ]] || missing+=("HETZNER_KNOWN_HOSTS")
          [[ -n "${APEXMAIL_PROD_ENV:-}"       ]] || missing+=("APEXMAIL_PROD_ENV")
          [[ -n "${GHCR_DEPLOY_TOKEN:-}"       ]] || missing+=("GHCR_DEPLOY_TOKEN")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Configure SSH client
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.HETZNER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat <<EOF > ~/.ssh/config
          Host hetzner
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Probe host reachability
        run: ssh hetzner 'set -e; uname -a; docker --version; docker compose version'

      - name: Sync deploy artifacts to host
        run: |
          set -euo pipefail
          ssh hetzner "install -d -m 750 ${DEPLOY_DIR}"
          # rsync --delete is destructive: it removes anything on the host that
          # doesn't exist locally. The Let's Encrypt store lives under
          # deploy/nginx/ssl/{live,archive,accounts,renewal,renewal-hooks,csr,
          # keys} as well as the live cert files (fullchain.pem, privkey.pem,
          # ca-chain.pem) that the certbot deploy-hook writes there. Protect
          # those paths from deletion (rsync still copies anything new from
          # the source — we just don't let it nuke runtime state).
          rsync -az --delete \
            --exclude='.git' --exclude='target' --exclude='node_modules' \
            --filter='protect /deploy/nginx/ssl/fullchain.pem' \
            --filter='protect /deploy/nginx/ssl/privkey.pem' \
            --filter='protect /deploy/nginx/ssl/ca-chain.pem' \
            --filter='protect /deploy/nginx/ssl/live' \
            --filter='protect /deploy/nginx/ssl/live/**' \
            --filter='protect /deploy/nginx/ssl/archive' \
            --filter='protect /deploy/nginx/ssl/archive/**' \
            --filter='protect /deploy/nginx/ssl/accounts' \
            --filter='protect /deploy/nginx/ssl/accounts/**' \
            --filter='protect /deploy/nginx/ssl/renewal' \
            --filter='protect /deploy/nginx/ssl/renewal/**' \
            --filter='protect /deploy/nginx/ssl/renewal-hooks' \
            --filter='protect /deploy/nginx/ssl/renewal-hooks/**' \
            --filter='protect /deploy/nginx/ssl/csr' \
            --filter='protect /deploy/nginx/ssl/csr/**' \
            --filter='protect /deploy/nginx/ssl/keys' \
            --filter='protect /deploy/nginx/ssl/keys/**' \
            -e 'ssh' \
            docker-compose.yml docker-compose.prod.yml \
            deploy \
            "hetzner:${DEPLOY_DIR}/"

      - name: Render production .env on host (mode 0600)
        run: |
          set -euo pipefail
          # Pipe secret directly to the remote host without it touching the runner FS.
          ssh hetzner "umask 177 && cat > ${DEPLOY_DIR}/.env" <<'EOF_ENV'
          ${{ secrets.APEXMAIL_PROD_ENV }}
          EOF_ENV
          ssh hetzner "chmod 600 ${DEPLOY_DIR}/.env && wc -l ${DEPLOY_DIR}/.env"

      - name: Render docker secret files from .env (all 24 PROD_*_FILE secrets)
        run: |
          set -euo pipefail
          ssh hetzner "DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'REMOTE_SH'
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          install -d -m 700 secrets
          # Source .env values. The .env must define every secret value below
          # and the matching PROD_*_FILE path (validated by docker-compose.prod.yml
          # with ${VAR:?} on the compose's secrets.file entries).
          set -a; . ./.env; set +a

          # render_secret <value-var> <file-var>
          #   value-var  — plain secret value in .env (e.g. API_KEY_HASH_SECRET)
          #   file-var   — PROD_*_FILE var in .env pointing at the rendered file
          render_secret() {
            local val="${!1:-}"
            if [[ -z "$val" ]]; then
              echo "::error::$1 missing from APEXMAIL_PROD_ENV (required by docker-compose.prod.yml)" >&2
              exit 1
            fi
            local path="${!2:-}"
            if [[ -z "$path" ]]; then
              echo "::error::$2 missing from APEXMAIL_PROD_ENV (required by docker-compose.prod.yml)" >&2
              exit 1
            fi
            install -d -m 700 "$(dirname "$path")"
            umask 177
            printf '%s' "$val" > "$path"
            # Secrets directory stays 700 (root-only); files are 644 so container
            # users (non-root, uid varies per image) can read them through bind mounts.
            chmod 644 "$path"
          }

          # render_secret_optional <value-var> <file-var>
          #   Same contract, but an EMPTY value is allowed: the secret file is
          #   still created (empty) so the compose :? guards on PROD_*_FILE
          #   stay satisfied for deployment modes that do not use the secret
          #   (e.g. SMTP credentials while running the SES transport).
          render_secret_optional() {
            local val="${!1:-}"
            local path="${!2:-}"
            if [[ -z "$path" ]]; then
              echo "::error::$2 missing from APEXMAIL_PROD_ENV (required by docker-compose.prod.yml)" >&2
              exit 1
            fi
            install -d -m 700 "$(dirname "$path")"
            umask 177
            printf '%s' "$val" > "$path"
            chmod 644 "$path"
          }

          render_secret POSTGRES_PASSWORD      PROD_POSTGRES_PASSWORD_FILE
          render_secret REDIS_PASSWORD         PROD_REDIS_PASSWORD_FILE
          render_secret CLICKHOUSE_PASSWORD    PROD_CLICKHOUSE_PASSWORD_FILE
          # Audit I — dedicated ClickHouse admin credential.
          render_secret CLICKHOUSE_ADMIN_PASSWORD PROD_CLICKHOUSE_ADMIN_PASSWORD_FILE
          render_secret API_KEY_HASH_SECRET    PROD_API_KEY_HASH_SECRET_FILE
          render_secret WEBHOOK_SIGNING_SECRET PROD_WEBHOOK_SIGNING_SECRET_FILE
          render_secret TRACKING_SECRET_KEY    PROD_TRACKING_SECRET_KEY_FILE
          render_secret INTERNAL_SERVICE_TOKEN PROD_INTERNAL_SERVICE_TOKEN_FILE
          render_secret JWT_SECRET             PROD_JWT_SECRET_FILE
          render_secret JWT_PRIVATE_KEY_PEM    PROD_JWT_PRIVATE_KEY_FILE
          render_secret JWT_PUBLIC_KEY_PEM     PROD_JWT_PUBLIC_KEY_FILE
          render_secret SESSION_SECRET         PROD_SESSION_SECRET_FILE
          render_secret IMPERSONATION_SECRET   PROD_IMPERSONATION_SECRET_FILE
          render_secret CSRF_SECRET            PROD_CSRF_SECRET_FILE
          render_secret DKIM_PRIVATE_KEY_ENCRYPTION_KEY PROD_DKIM_PRIVATE_KEY_ENCRYPTION_KEY_FILE
          render_secret KIWI_SECRET_KEY        PROD_KIWI_SECRET_KEY_FILE
          # Stripe credentials for billing-service (compose secrets
          # stripe_secret_key / stripe_webhook_secret).
          render_secret STRIPE_SECRET_KEY      PROD_STRIPE_SECRET_KEY_FILE
          render_secret STRIPE_WEBHOOK_SECRET  PROD_STRIPE_WEBHOOK_SECRET_FILE
          # HMAC key signing sales-autopilot campaign unsubscribe tokens
          # (compose secret sales_unsubscribe_secret).
          render_secret SALES_UNSUBSCRIBE_SECRET PROD_SALES_UNSUBSCRIBE_SECRET_FILE
          # Audit G — AWS SES + direct-SMTP credentials as secret FILES.
          render_secret_optional AWS_ACCESS_KEY_ID     PROD_AWS_ACCESS_KEY_ID_FILE
          render_secret_optional AWS_SECRET_ACCESS_KEY PROD_AWS_SECRET_ACCESS_KEY_FILE
          render_secret_optional SMTP_USERNAME         PROD_SMTP_USERNAME_FILE
          render_secret_optional SMTP_PASSWORD         PROD_SMTP_PASSWORD_FILE
          # Audit E — backup encryption key.
          render_secret BACKUP_ENCRYPTION_KEY PROD_BACKUP_ENCRYPTION_KEY_FILE
          ls -l secrets/
          REMOTE_SH

      - name: Bootstrap TLS material (self-signed fallback so nginx can start)
        run: |
          set -euo pipefail
          ssh hetzner "DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'REMOTE_SH'
          set -euo pipefail
          cd "${DEPLOY_DIR}/deploy/nginx"
          # Audit N — the ssl directory holds the live private key: 750, not 755.
          install -d -m 750 ssl
          cd ssl
          # dhparam (2048-bit, generated once; ~30s).
          # Audit N/F — the committed dhparam.pem is a ~206-byte PLACEHOLDER.
          # The old `[[ ! -s ]]` guard saw it as non-empty and never
          # regenerated it. Any file smaller than 1024 bytes cannot be real
          # 2048-bit DH parameters — regenerate it.
          dh_size=0
          [[ -f dhparam.pem ]] && dh_size=$(wc -c < dhparam.pem || echo 0)
          if (( dh_size < 1024 )); then
            echo "[tls] dhparam.pem missing or placeholder (${dh_size} bytes) — regenerating"
            openssl dhparam -out dhparam.pem 2048
          fi
          # Generate a self-signed cert ONLY if no real cert is present.
          # Once certbot issues real LE certs, they overwrite fullchain.pem/privkey.pem.
          if [[ ! -s fullchain.pem || ! -s privkey.pem ]]; then
            openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
              -keyout privkey.pem -out fullchain.pem \
              -subj "/CN=apexmail.ee/O=ApexMail/C=EE" \
              -addext "subjectAltName=DNS:apexmail.ee,DNS:www.apexmail.ee,DNS:api.apexmail.ee,DNS:app.apexmail.ee,DNS:admin.apexmail.ee,DNS:control.apexmail.ee,DNS:enterprise.apexmail.ee,DNS:track.apexmail.ee,DNS:mail.apexmail.ee"
            # ssl_trusted_certificate (used for OCSP stapling) — same file for self-signed.
            cp fullchain.pem ca-chain.pem
            chmod 644 fullchain.pem ca-chain.pem dhparam.pem
            # Audit N — the private key must NOT be world-readable (was 644).
            # Owned by uid 101 (the nginx container user) with mode 640 —
            # same ownership model the certbot deploy-hook applies to the
            # renewed LE keys (owner-only read, no world access).
            chown 101:101 privkey.pem 2>/dev/null || true
            chmod 640 privkey.pem
            echo "[tls] self-signed cert generated; replace with Let's Encrypt via deploy/scripts/issue-letsencrypt.sh"
          else
            echo "[tls] existing cert kept: $(openssl x509 -in fullchain.pem -noout -subject -enddate)"
          fi
          ls -l
          REMOTE_SH

      - name: Authenticate host to GHCR
        # Audit N — the token never appears in a command line (local or
        # remote `ps` output): it is mapped to an env var, piped on stdin
        # through ssh and consumed by `docker login --password-stdin`.
        env:
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_DEPLOY_TOKEN}" | \
            ssh hetzner "docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin"

      - name: Remove non-compose-managed legacy containers
        run: |
          # Bare-metal-era containers (created via `docker run`, no compose
          # labels) hold the mail ports (993/50051) and block the compose
          # stack from binding them. Mirrors deploy.sh Step 1: remove them
          # ONLY when they are not managed by compose.
          ssh hetzner "set -e
            for name in apexmail-imap apexmail-mta apexmail-mailstore; do
              if docker ps -a --format '{{.Names}}' | grep -q \"^\${name}\$\"; then
                if ! docker inspect \"\$name\" --format '{{.Config.Labels}}' | grep -q 'compose'; then
                  echo '[cleanup] removing legacy container: '\$name
                  docker rm -f \"\$name\"
                fi
              fi
            done"

      - name: Pull updated images
        if: ${{ github.event.inputs.skip_pull != 'true' }}
        run: |
          ssh hetzner "cd ${DEPLOY_DIR} && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env \
              pull api-server mta imap-server mailstore worker enterprise tracking \
                observability marketing status-server billing-service sales-autopilot \
                postgres-backup nginx postgres redis clickhouse certbot migrator"

      - name: Run database migrations (gate before up)
        # P0 — migrations 101-108 previously ran in NO deploy path. The
        # migrator is a one-shot compose job (profile `migrate`, restart: no)
        # that applies the embedded sqlx migration chain and exits; `up`
        # below only runs if it succeeded. On a fresh host this also pulls
        # postgres up (healthy) as a run dependency.
        run: |
          ssh hetzner "cd ${DEPLOY_DIR} && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env \
              --profile migrate run --rm migrator"

      - name: Apply stack (canonical service set)
        run: |
          ssh hetzner "cd ${DEPLOY_DIR} && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env \
              up -d --remove-orphans --no-build \
              postgres redis clickhouse api-server mta imap-server mailstore worker \
              enterprise tracking observability marketing status-server billing-service \
              sales-autopilot postgres-backup nginx certbot"

      - name: Reload nginx to re-resolve upstream container IPs
        run: |
          # When docker compose recreates a backend container (api/tracking/
          # enterprise/marketing) it gets a new container IP on the user
          # network. nginx's `upstream { server <name>:port; }` blocks resolve
          # the name ONCE at worker start and then cache it forever, so any
          # recreation leaves nginx connecting to a dead IP (502/connection
          # refused/host unreachable). A graceful reload makes nginx re-resolve
          # all upstream hostnames without dropping in-flight requests.
          ssh hetzner "cd ${DEPLOY_DIR} && \
            for i in 1 2 3 4 5; do \
              if docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                   --env-file .env exec -T nginx nginx -s reload 2>&1; then \
                echo '[nginx] reload OK'; break; \
              fi; \
              echo '[nginx] reload attempt '\$i' failed; nginx may still be starting'; \
              sleep 3; \
            done"

      - name: Verify rollout
        # Real assertions, not just a `ps` dump: every canonical service must
        # report a healthy/running compose state, and the public surfaces must
        # answer (HTTP health endpoints via the host, sales unsubscribe route
        # answering 404 — i.e. sales-autopilot is alive behind nginx, not 502 —
        # and the SMTP banner on :25).
        run: |
          ssh hetzner "DEPLOY_DIR='${DEPLOY_DIR}' bash -s" <<'REMOTE_SH'
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env"

          services=(api-server mta imap-server mailstore worker enterprise tracking \
                    observability marketing status-server billing-service sales-autopilot \
                    postgres-backup nginx certbot postgres redis clickhouse)
          failed=0
          for svc in "${services[@]}"; do
            state="$(${COMPOSE} ps --format '{{.Name}} {{.State}} {{.Health}}' "$svc" 2>/dev/null | head -1 || true)"
            name="$(echo "$state" | awk '{print $1}')"
            stat="$(echo "$state" | awk '{print $2}')"
            health="$(echo "$state" | awk '{print $3}')"
            if [[ -z "$name" ]]; then
              echo "::error::service $svc has no container (compose ps empty)" >&2
              failed=1
            elif [[ "$health" == "unhealthy" ]] || [[ "$stat" != "running" ]]; then
              echo "::error::service $svc is $stat/$health (expected running/healthy)" >&2
              failed=1
            else
              echo "[verify] $svc: $stat/${health:-no-healthcheck} OK"
            fi
          done
          (( failed )) && { echo '::error::compose health assertion failed'; exit 1; }

          echo "[verify] HTTP checks from the host"
          check_http() {
            local label="$1" url="$2" expect="$3"
            code="$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)"
            if [[ "$code" != "$expect" ]]; then
              echo "::error::$label returned HTTP $code (expected $expect)" >&2
              failed=1
            else
              echo "[verify] $label -> $code OK"
            fi
          }
          check_http "api health"        "https://api.apexmail.ee/health"          "200"
          check_http "track health"      "https://track.apexmail.ee/health"        "200"
          check_http "status page"       "https://status.apexmail.ee/status"       "200"
          check_http "enterprise health" "https://enterprise.apexmail.ee/health"  "200"
          # The unsubscribe route with a bogus token must 404 (route matched,
          # token invalid). A 502/503 means sales-autopilot is DOWN behind nginx.
          check_http "sales-api (expect 404, not 502)" "https://api.apexmail.ee/sales-api/u/healthcheck-probe" "404"
          (( failed )) && exit 1

          echo "[verify] SMTP banner on :25"
          banner="$( (printf 'QUIT\r\n'; sleep 1) | timeout 10 openssl s_client -starttls smtp -connect 127.0.0.1:25 -quiet 2>/dev/null | head -1 || true )"
          if [[ "${banner:-}" == *"2"*"0"* || "${banner:-}" == *"ESMTP"* ]]; then
            echo "[verify] SMTP banner OK: ${banner}"
          else
            # openssl -quiet hides the banner on some builds; fall back to a
            # raw TCP read of the greeting.
            banner="$( (exec 3<>/dev/tcp/127.0.0.1/25 && head -1 <&3) 2>/dev/null || true )"
            if [[ "${banner:-}" == *"ESMTP"* || "${banner:-}" == *"220"* ]]; then
              echo "[verify] SMTP banner OK: ${banner}"
            else
              echo "::error::no SMTP banner on 127.0.0.1:25 (got: '${banner:-nothing}')" >&2
              exit 1
            fi
          fi

          echo "[verify] rollout verified: ${#services[@]} services healthy, endpoints and SMTP answering"
          REMOTE_SH

      - name: Verify TLS certificate (warn if self-signed / LE not yet issued)
        run: |
          ssh hetzner "cd ${DEPLOY_DIR}/deploy/nginx/ssl && \
            if [[ -s fullchain.pem ]]; then \
              openssl x509 -in fullchain.pem -noout -subject -issuer -enddate 2>/dev/null \
                || echo '::warning::fullchain.pem present but unparseable'; \
              if openssl x509 -in fullchain.pem -noout -issuer 2>/dev/null | grep -qi 'lets encrypt'; then \
                echo '[tls] Let\\'s Encrypt certificate active'; \
              else \
                echo '::warning::Self-signed certificate in place — run deploy/scripts/issue-letsencrypt.sh to issue a real LE cert.'; \
              fi; \
            else \
              echo '::warning::No fullchain.pem found — nginx will fail to start.'; \
            fi"

      - name: Cleanup SSH material
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
          rm -f ~/.ssh/config ~/.ssh/known_hosts
