# Native NAPI-RS Package Build Pipeline
# Builds validator-native, bot-detector-native, crypto-native for all target triples

name: Native Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/validator-native/**'
      - 'packages/bot-detector-native/**'
      - 'packages/crypto-native/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/validator-native/**'
      - 'packages/bot-detector-native/**'
      - 'packages/crypto-native/**'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    name: Build ${{ matrix.package }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 Linux (production servers)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            package: validator-native
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            package: bot-detector-native
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            package: crypto-native

          # x86_64 Linux musl (Alpine / Docker)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            package: validator-native
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            package: bot-detector-native
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            package: crypto-native

          # aarch64 macOS (developer laptops — Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-14
            package: validator-native
          - target: aarch64-apple-darwin
            runner: macos-14
            package: bot-detector-native
          - target: aarch64-apple-darwin
            runner: macos-14
            package: crypto-native

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/${{ matrix.package }}/target
          key: native-${{ matrix.package }}-${{ matrix.target }}-${{ hashFiles(format('packages/{0}/Cargo.lock', matrix.package), format('packages/{0}/Cargo.toml', matrix.package)) }}
          restore-keys: |
            native-${{ matrix.package }}-${{ matrix.target }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install napi-cli
        run: npm install -g @napi-rs/cli

      - name: Build native module
        working-directory: packages/${{ matrix.package }}
        run: napi build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: packages/${{ matrix.package }}/*.node
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify native binaries load
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all x86_64-linux-gnu artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-x86_64-unknown-linux-gnu'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy binaries to package dirs
        run: |
          cp validator-native-x86_64-unknown-linux-gnu/*.node packages/validator-native/ || true
          cp bot-detector-native-x86_64-unknown-linux-gnu/*.node packages/bot-detector-native/ || true
          cp crypto-native-x86_64-unknown-linux-gnu/*.node packages/crypto-native/ || true

      - name: Verify validator-native loads
        run: node -e "const m = require('./packages/validator-native/index.js'); console.log('validator-native loaded:', Object.keys(m))"

      - name: Verify bot-detector-native loads
        run: node -e "const m = require('./packages/bot-detector-native/index.js'); console.log('bot-detector-native loaded:', Object.keys(m))"

      - name: Verify crypto-native loads
        run: node -e "const m = require('./packages/crypto-native/index.js'); console.log('crypto-native loaded:', Object.keys(m))"
