# =============================================================================
# ApexMail Rust Workspace Check — Build, Test, Lint, Audit, Security Scan
# =============================================================================
name: Rust Workspace Check

on:
  pull_request:
    paths:
      - .github/workflows/rust-check.yml
      - services/mail-server/**
      - docs/security/ws-all-audit-coverage.md
      - tools/check_audit_coverage.py
      - tools/check_cargo_cycles.py
      - tools/validate_security_feature_flags.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/rust-check.yml
      - services/mail-server/**
      - docs/security/ws-all-audit-coverage.md
      - tools/check_audit_coverage.py
      - tools/check_cargo_cycles.py
      - tools/validate_security_feature_flags.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Secret Scanning (H6) ──────────────────────────────────────────────────
  # Uses Gitleaks to detect hardcoded secrets, API keys, and credentials
  secret-scan:
    name: Secret Scanning — Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # Runs the same pinned gitleaks version and config as the pre-commit
      # hook (.pre-commit-config.yaml: gitleaks v8.18.2 + .gitleaks.toml).
      # Replaces a fabricated gitleaks-action SHA (CI audit 2026-08).
      - name: Detect secrets with Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz" \
            | tar xz -C /tmp
          /tmp/gitleaks detect --config .gitleaks.toml --redact --verbose

  # ── SAST Scanning (🟡9) ──────────────────────────────────────────────────
  # Uses Semgrep for static analysis of Python, JS, Dockerfile, YAML configs
  sast-scan:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # semgrep-action is deprecated and its v1 image ignores the
      # generateSarif/publishDeployment inputs previously referenced here;
      # run the semgrep CLI directly so semgrep.sarif is actually produced
      # for the upload-sarif step below (CI audit 2026-08).
      - name: Run Semgrep SAST
        run: |
          pip install semgrep==1.173.0
          semgrep scan \
            --config p/default \
            --config p/rust \
            --config p/dockerfile \
            --config p/github-actions \
            --sarif --output semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SAST results to GitHub Security
        # v3.35.4 — pinned to the commit SHA (the tag object's own SHA is not
        # a commit and does not resolve; CI audit 2026-08).
        uses: github/codeql-action/upload-sarif@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3.35.4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ── Rust Build & Test ─────────────────────────────────────────────────────
  cargo-check-all-targets:
    name: cargo check --workspace --all-targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: stable

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: services/mail-server/target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('services/mail-server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check workspace all targets
        working-directory: services/mail-server
        run: cargo check --workspace --all-targets

      - name: Check workspace dependency cycles
        run: python3 tools/check_cargo_cycles.py

      - name: Check production security feature flags
        run: python3 tools/validate_security_feature_flags.py

      - name: Check WS-ALL audit coverage ledger
        run: python3 tools/check_audit_coverage.py

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check unused Rust dependencies
        working-directory: services/mail-server
        run: cargo machete

      # Advisory auditing (cargo audit + the RUSTSEC ignore list with
      # justifications) lives ONLY in security-audit.yml to avoid drift;
      # this workflow still enforces advisories via cargo-deny below
      # (services/mail-server/deny.toml holds the same reviewed ignores).

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependencies with cargo-deny
        working-directory: services/mail-server
        run: cargo deny check advisories bans sources

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e03236526ace47fa2e04bebcfc6da471ebd4690c # v2.49.0
        with:
          tool: cargo-nextest

      - name: Run tests
        working-directory: services/mail-server
        # No nextest.toml exists in this repo, so the previously referenced
        # `ci` profile is undefined — run with the default profile.
        run: cargo nextest run --workspace --all-targets

      - name: Clippy lint check (deny warnings)
        working-directory: services/mail-server
        run: cargo clippy --workspace --all-targets -- -D warnings