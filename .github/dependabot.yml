version: 2
updates:
  # NOTE (audit §4): the github-actions ecosystem entry was removed —
  # .github/workflows is empty (deployment is the self-hosted ci/ pipeline,
  # which dependabot cannot track). The docker "/" entry was removed —
  # there is no root Dockerfile (build contexts live under deploy/,
  # services/mail-server/, apps/marketing-zola/).

  - package-ecosystem: cargo
    directory: "/services/mail-server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope

  # tools/contrast-audit is the only npm manifest outside vendored
  # node_modules trees (package.json + package-lock.json at its root).
  - package-ecosystem: npm
    directory: "/tools/contrast-audit"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: pip
    directory: "/packages/sdk-python"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: gomod
    directory: "/packages/sdk-go"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: maven
    directory: "/packages/sdk-java"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: composer
    directory: "/packages/sdk-php"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: bundler
    directory: "/packages/sdk-ruby"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      include: scope
