version: 2
updates:
  # NOTE (audit §4): the github-actions ecosystem entry was removed —
  # .github/workflows is empty (deployment is the self-hosted ci/ pipeline,
  # which dependabot cannot track). The docker "/" entry was removed —
  # there is no root Dockerfile (build contexts live under deploy/,
  # services/mail-server/, apps/marketing-zola/).

  - package-ecosystem: cargo # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown — Dependabot config is vestigial (auto-merge archived; the self-hosted ci/ pipeline owns dependency updates) — cooldown tuning is moot
    directory: "/services/mail-server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope

