name: Performance Budget

on:
  pull_request:
    paths:
      - 'apps/marketing-zola/**'
      - 'deploy/tests/performance-budget.sh'
      - '.github/workflows/performance-budget.yml'
  push:
    branches: [main]
    paths:
      - 'apps/marketing-zola/**'
      - 'deploy/tests/performance-budget.sh'
      - '.github/workflows/performance-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-budget:
    name: Performance Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install chromium and jq (if missing)
        run: |
          if ! command -v chromium >/dev/null 2>&1 && \
             ! command -v chromium-browser >/dev/null 2>&1 && \
             ! command -v google-chrome >/dev/null 2>&1 && \
             ! command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends chromium
          fi
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get install -y jq
          fi
      - name: Run performance budget check
        run: |
          chmod +x deploy/tests/performance-budget.sh
          bash deploy/tests/performance-budget.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-budget-report
          path: deploy/tests/.performance-budget-report.json
          retention-days: 30
