<script>
(function() {
  var W = document.querySelector("[data-kiwi-widget]");
  if (!W) return;
  var statusEl = W.querySelector("[data-kiwi-status]");
  var pillEl = W.querySelector("[data-kiwi-pill]");
  var fillEl = W.querySelector(".kiwi-fill");
  var tokenEl = document.getElementById("kiwi-token-input");

  function setStatus(label, pill, state) {
    if (statusEl) statusEl.textContent = label;
    if (pillEl) { pillEl.textContent = pill; pillEl.className = pillEl.className.replace(/idle|solving|done|failed/,"") + " " + state; }
    if (fillEl) fillEl.style.width = state === "done" ? "100%" : state === "failed" ? "0%" : (parseFloat(fillEl.style.width)||0) + "%";
  }

  function fail(msg) {
    setStatus(msg || "Verification failed — please reload", "Failed", "failed");
    if (tokenEl) tokenEl.value = "";
    stopCountdown();
  }

  var countdownEl = W.querySelector("[data-kiwi-countdown]");
  var countdownTimer = null;

  function startCountdown(ttlSecs) {
    if (!countdownEl) return;
    var remaining = ttlSecs;
    function tick() {
      if (remaining <= 0) { countdownEl.textContent = ""; return; }
      countdownEl.textContent = remaining + "s";
    }
    tick();
    stopCountdown();
    countdownTimer = setInterval(function() {
      remaining--;
      if (remaining < 0) { countdownEl.textContent = "expired"; clearInterval(countdownTimer); countdownTimer = null; return; }
      countdownEl.textContent = remaining + "s";
    }, 1000);
  }

  function stopCountdown() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    if (countdownEl) countdownEl.textContent = "";
  }

  var mouseEvents = 0, keyEvents = 0;
  document.addEventListener("mousemove", function(){mouseEvents++;},{passive:true});
  document.addEventListener("keydown", function(){keyEvents++;},{passive:true});

  // ── PBKDF2-HMAC-SHA256 via WebCrypto (zero dependencies) ──────────
  function b64decode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    return Uint8Array.from(atob(str), function(c) { return c.charCodeAt(0); });
  }

  function leadingZeros(bytes) {
    var n = 0;
    for (var i = 0; i < bytes.length; i++) {
      if (bytes[i] === 0) { n += 8; }
      else { var b = bytes[i]; while ((b & 128) === 0) { n++; b <<= 1; } break; }
    }
    return n;
  }

  async function deriveHash(prefix, counter, saltBytes, iterations) {
    var password = new TextEncoder().encode(prefix + counter);
    var algo = { name: "PBKDF2", hash: "SHA-256", salt: saltBytes, iterations: iterations };
    var key = await crypto.subtle.importKey("raw", password, {name:"PBKDF2"}, false, ["deriveBits"]);
    return crypto.subtle.deriveBits(algo, key, 256);
  }

  async function solve(prefix, saltB64, iterations, targetBits) {
    var salt = b64decode(saltB64);
    var solveStart = performance.now();

      var bytes = new Uint8Array(buf);
      if (leadingZeros(bytes) >= targetBits) {
        return { counter: counter, duration: Math.round(performance.now() - solveStart) };
      }

        if (fillEl) fillEl.style.width = Math.min(95, (counter * 100) / Math.pow(2, targetBits)) + "%";
        await new Promise(function(r) { setTimeout(r, 0); });
      }
    }
    return null;
  }

  // ── Widget driver ──────────────────────────────────────────────────
  async function run() {
    try {
      setStatus("Requesting challenge\u2026", "Connecting", "solving");
      var scope = "login";
      var p = window.location.pathname.toLowerCase();
      if (p.indexOf("signup")>=0||p.indexOf("register")>=0) scope="signup";
      else if (p.indexOf("forgot")>=0) scope="forgot-password";
      else if (p.indexOf("reset")>=0) scope="reset-password";

      setStatus("Computing proof-of-work\u2026", "Verifying", "solving");

        dm: navigator.deviceMemory || 0,
        pl: navigator.plugins ? navigator.plugins.length : 0,

        iw: window.innerWidth || 0, ih: window.innerHeight || 0

      var plain = data.nonce + "." + result.counter + "." + result.duration + "." + JSON.stringify(telemetry);
      var token = btoa(plain);
      if (tokenEl) tokenEl.value = token;
      setStatus("Verified \u2014 you may continue", "Verified", "done");
      if (fillEl) fillEl.style.width = "100%";
      stopCountdown();
    } catch (e) {
      fail("Verification failed \u2014 " + (e.message || "please reload"));
    }
  }

  if (window.crypto && window.crypto.subtle) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
    else run();
  } else {
    setStatus("Browser not supported", "Unsupported", "idle");
  }
})();
</script><button type="submit" class="w-full bg-primary hover:bg-brand-700 text-white font-bold uppercase tracking-tight flex items-center justify-center gap-3 py-4 rounded-sm shadow-premium transition-all group"><span>Sign In</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M5 12h12m-4-4 4 4-4 4"></path></svg></button><div id="login-mfa" data-mfa-section class="hidden" aria-hidden="true"><p class="text-[11px] font-bold uppercase tracking-tight text-surface-500">Additional verification required. Enter your MFA code.</p><p class="text-[10px] text-surface-400 font-medium leading-relaxed mt-1">Check your spam folder if you haven't received the code.</p><label class="sr-only" for="mfaCode">MFA code</label><input id="mfaCode" name="mfaCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" class="flex h-12 w-full rounded-sm border border-surface-200 bg-background px-4 py-2 text-sm font-mono text-center tracking-widest focus:border-primary outline-none transition-all" disabled tabindex="-1" /></div><div id="login-form-errors" class="hidden" role="alert" aria-live="assertive" data-error-key="auth.error.rate_limited"></div></form><div class="px-10 pb-10"><p class="text-center text-xs text-surface-500 font-medium">Operator console restricted to authorized administrators.</p></div></div></div></div><script>(function(){var ALLOWED={'/v1/auth/login':['email','password','mfaCode','kiwi__token'],'/api/auth/login':['email','password','mfaCode','kiwi__token'],'/v1/auth/signup':['name','email','password','company_name','plan','kiwi__token'],'/v1/auth/register':['name','email','password','company_name','plan','kiwi__token'],'/v1/auth/forgot-password':['email','kiwi__token'],'/v1/auth/reset-password':['token','email','password','confirmPassword','kiwi__token']};function destFor(action){if(action.indexOf('/login')>-1)return '/dashboard';if(action.indexOf('/signup')>-1||action.indexOf('/register')>-1)return '/verify-email';if(action.indexOf('/forgot-password')>-1)return null;if(action.indexOf('/reset-password')>-1)return '/login?reset=1';return null;}function showError(form,msg){var box=form.querySelector('[data-error-key],[role="alert"]');if(!box){box=document.createElement('div');box.setAttribute('role','alert');box.className='text-sm text-warning-700 font-bold uppercase tracking-tight';form.appendChild(box);}box.classList.remove('hidden');box.textContent=msg||'Request failed. Please try again.';}function showSuccess(form,msg){var box=form.querySelector('[data-success]');if(!box){box=document.createElement('div');box.setAttribute('data-success','true');box.className='text-sm text-success-700 font-bold uppercase tracking-tight';form.appendChild(box);}box.classList.remove('hidden');box.textContent=msg||'Done.';}function togglePassword(btn){var id=btn.getAttribute('data-password-toggle')||btn.getAttribute('aria-controls');var input=id?document.getElementById(id):null;if(!input)return;var showing=input.type==='text';input.type=showing?'password':'text';btn.setAttribute('aria-pressed',showing?'false':'true');btn.setAttribute('aria-label',showing?'Show password':'Hide password');btn.textContent=showing?'Show':'Hide';}function bindPasswordToggles(){document.querySelectorAll('[data-password-toggle]').forEach(function(btn){btn.dataset.passwordToggleBound='1';});if(document.documentElement.dataset.passwordTogglesBound==='1')return;document.documentElement.dataset.passwordTogglesBound='1';document.addEventListener('click',function(ev){var target=ev.target&&ev.target.closest?ev.target.closest('[data-password-toggle]'):null;if(!target)return;ev.preventDefault();togglePassword(target);});}async function submitForm(ev){var form=ev.currentTarget;var action=form.getAttribute('action')||'';if(action.indexOf('/v1/auth/')!==0&&action.indexOf('/api/auth/')!==0)return;ev.preventDefault();var btn=form.querySelector('button[type="submit"]');if(btn){btn.disabled=true;btn.dataset.originalLabel=btn.textContent;}var fd=new FormData(form);var allowed=ALLOWED[action]||null;var payload={};fd.forEach(function(v,k){if(k==='_csrf')return;if(allowed&&allowed.indexOf(k)===-1)return;payload[k]=v;});if(form.dataset.mfaToken&&payload.mfaCode){action=form.dataset.mfaOriginalAction.replace('/login','/mfa/verify');payload={challenge_token:form.dataset.mfaToken,mfa_code:payload.mfaCode};form.dataset.mfaToken='';}var headers={'Content-Type':'application/json','Accept':'application/json'};var csrf=fd.get('_csrf');if(csrf)headers['X-CSRF-Token']=csrf;try{var res=await fetch(action,{method:'POST',headers:headers,credentials:'same-origin',body:JSON.stringify(payload)});var data=null;try{data=await res.json();}catch(_e){}if(res.ok){if(action.indexOf('/forgot-password')>-1){showSuccess(form,(data&&data.message)||'If that account exists, a reset link is on the way.');}else if(res.status===202&&data&&data.challengeToken){form.dataset.mfaToken=data.challengeToken;form.dataset.mfaOriginalAction=action;var mfaEl=form.querySelector('[data-mfa-section]');if(mfaEl){mfaEl.classList.remove('hidden');mfaEl.removeAttribute('aria-hidden');mfaEl.removeAttribute('inert');}var sbtn=form.querySelector('button[type=submit]');if(sbtn){sbtn.dataset.originalMfaLabel=sbtn.textContent;sbtn.textContent='Verify MFA';sbtn.disabled=false;}if(btn){btn.disabled=false;}
}else{var dest=destFor(action);if(dest){var qs='';if(action.indexOf('/signup')>-1&&payload.email){qs='?email='+encodeURIComponent(payload.email);}window.location.assign(dest+qs);}else{showSuccess(form,(data&&data.message)||'Done.');}}}else{var msg=(data&&data.error&&(data.error.message||data.error.code))||(data&&data.message)||('Request failed ('+res.status+').');showError(form,msg);delete form.dataset.mfaToken;if(btn){btn.disabled=false;if(btn.dataset.originalLabel)btn.textContent=btn.dataset.originalLabel;}}}catch(err){showError(form,'Network error. Please try again.');if(btn){btn.disabled=false;if(btn.dataset.originalLabel)btn.textContent=btn.dataset.originalLabel;}}}function bind(){bindPasswordToggles();document.querySelectorAll('form[action^="/v1/auth/"],form[action^="/api/auth/"]').forEach(function(f){if(f.dataset.authBound==='1')return;f.dataset.authBound='1';f.addEventListener('submit',submitForm);});}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',bind);}else{bind();}})();</script></main></body></html>
