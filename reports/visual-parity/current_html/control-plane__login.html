<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApexMail Control Plane</title><meta name="description" content="ApexMail administration and monitoring"><link rel="stylesheet" href="/assets/globals.css"></head><body class="antialiased bg-background text-surface-950"><main class="flex min-h-screen items-center justify-center bg-surface-50"><div class="w-full max-w-md space-y-10 rounded-sm border border-surface-200 bg-white p-10 shadow-premium"><div class="text-center"><div class="mx-auto flex h-14 w-14 items-center justify-center rounded-sm bg-primary text-white font-bold text-xl shadow-premium mb-8">A</div><h1 class="text-3xl font-bold uppercase tracking-tighter text-surface-950">Control Plane</h1><p class="mt-3 text-sm font-bold uppercase tracking-tight text-surface-500">Administrator access</p></div><form class="space-y-6" action="/api/auth/login" method="POST"><input type="hidden" name="_csrf" value="" /><div class="space-y-2"><label for="login-email" class="text-[11px] font-bold uppercase tracking-tight text-surface-950">Email or username</label><input id="login-email" name="email" type="text" required autocomplete="username" placeholder="admin@apexmail.ee" class="flex h-12 w-full rounded-sm border border-surface-200 bg-background px-4 py-2 text-sm focus:border-primary outline-none transition-all" /></div><div class="space-y-2"><label for="login-password" class="text-[11px] font-bold uppercase tracking-tight text-surface-950">Password</label><div class="relative"><input id="login-password" name="password" type="password" required autocomplete="current-password" minlength="12" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{12,}" title="Must contain at least 12 characters with uppercase, lowercase, number, and special character" placeholder="••••••••" class="flex h-12 w-full rounded-sm border border-surface-200 bg-background px-4 py-2 text-sm focus:border-primary outline-none transition-all pr-12" /><button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold uppercase tracking-tight text-surface-400 hover:text-surface-600" aria-label="Show password" aria-pressed="false" data-password-toggle="login-password" aria-controls="login-password">Show</button></div></div><button type="submit" class="inline-flex items-center justify-center whitespace-nowrap rounded-sm text-sm font-bold uppercase tracking-tight bg-primary text-white hover:bg-brand-700 h-12 w-full transition-all">Sign In</button></form><div id="login-mfa" class="hidden space-y-6" inert><p class="text-[11px] font-bold uppercase tracking-tight text-surface-500">MFA Verification</p><input name="mfaCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" class="flex h-12 w-full rounded-sm border border-surface-200 bg-background px-4 py-2 text-sm font-mono text-center tracking-widest focus:border-primary outline-none transition-all" disabled tabindex="-1" /></div></div><script>(function(){var ALLOWED={'/v1/auth/login':['email','password','mfaCode','mcaptcha__token'],'/api/auth/login':['email','password','mfaCode','mcaptcha__token'],'/v1/auth/signup':['name','email','password','company_name','plan','mcaptcha__token'],'/v1/auth/register':['name','email','password','company_name','plan','mcaptcha__token'],'/v1/auth/forgot-password':['email','mcaptcha__token'],'/v1/auth/reset-password':['token','password','mcaptcha__token']};function destFor(action){if(action.indexOf('/login')>-1)return '/dashboard';if(action.indexOf('/signup')>-1||action.indexOf('/register')>-1)return '/verify-email';if(action.indexOf('/forgot-password')>-1)return null;if(action.indexOf('/reset-password')>-1)return '/login?reset=1';return null;}function showError(form,msg){var box=form.querySelector('[data-error-key],[role="alert"]');if(!box){box=document.createElement('div');box.setAttribute('role','alert');box.className='text-sm text-warning-700 font-bold uppercase tracking-tight';form.appendChild(box);}box.classList.remove('hidden');box.textContent=msg||'Request failed. Please try again.';}function showSuccess(form,msg){var box=form.querySelector('[data-success]');if(!box){box=document.createElement('div');box.setAttribute('data-success','true');box.className='text-sm text-success-700 font-bold uppercase tracking-tight';form.appendChild(box);}box.classList.remove('hidden');box.textContent=msg||'Done.';}async function submitForm(ev){var form=ev.currentTarget;var action=form.getAttribute('action')||'';if(action.indexOf('/v1/auth/')!==0&&action.indexOf('/api/auth/')!==0)return;ev.preventDefault();var btn=form.querySelector('button[type="submit"]');if(btn){btn.disabled=true;btn.dataset.originalLabel=btn.textContent;}var fd=new FormData(form);var allowed=ALLOWED[action]||null;var payload={};fd.forEach(function(v,k){if(k==='_csrf')return;if(allowed&&allowed.indexOf(k)===-1)return;payload[k]=v;});var headers={'Content-Type':'application/json','Accept':'application/json'};var csrf=fd.get('_csrf');if(csrf)headers['X-CSRF-Token']=csrf;try{var res=await fetch(action,{method:'POST',headers:headers,credentials:'same-origin',body:JSON.stringify(payload)});var data=null;try{data=await res.json();}catch(_e){}if(res.ok){if(action.indexOf('/forgot-password')>-1){showSuccess(form,(data&&data.message)||'If that account exists, a reset link is on the way.');}else{var dest=destFor(action);if(dest){var qs='';if(action.indexOf('/signup')>-1&&payload.email){qs='?email='+encodeURIComponent(payload.email);}window.location.assign(dest+qs);}else{showSuccess(form,(data&&data.message)||'Done.');}}}else{var msg=(data&&data.error&&(data.error.message||data.error.code))||(data&&data.message)||('Request failed ('+res.status+').');showError(form,msg);if(btn){btn.disabled=false;if(btn.dataset.originalLabel)btn.textContent=btn.dataset.originalLabel;}}}catch(err){showError(form,'Network error. Please try again.');if(btn){btn.disabled=false;if(btn.dataset.originalLabel)btn.textContent=btn.dataset.originalLabel;}}}function bind(){document.querySelectorAll('form[action^="/v1/auth/"],form[action^="/api/auth/"]').forEach(function(f){if(f.dataset.authBound==='1')return;f.dataset.authBound='1';f.addEventListener('submit',submitForm);});}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',bind);}else{bind();}})();</script></main></body></html>
