          /* No external font fetches — the zero-third-party design keeps CSP strict.
     System font stack below. */
  .kiwi-container {
    --kiwi-primary: #dd524c;
    --kiwi-primary-rgb: 221, 82, 76;
    --kiwi-success: #059669;
    --kiwi-bg: #ffffff;
    --kiwi-text: #1a1a1a;
    --kiwi-text-muted: #6b7280;
    --kiwi-border: #e5e7eb;
    --kiwi-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --kiwi-radius: 12px;
    
    display: inline-flex;
    align-items: center;
    width: 100%;
    max-width: 100%;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    position: relative;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    .kiwi-container {
      --kiwi-bg: #111111;
      --kiwi-text: #f9fafb;
      --kiwi-text-muted: #9ca3af;
      --kiwi-border: #262626;
      --kiwi-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5);
    }
  }
  .kiwi-widget {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--kiwi-bg);
    border: 1px solid var(--kiwi-border);
    border-radius: var(--kiwi-radius);
    color: var(--kiwi-text);
    box-shadow: var(--kiwi-shadow);
    transition: all 0.3s ease;
    width: 100%;
    position: relative;
    overflow: hidden;
    cursor: default;
    user-select: none;
  }
  .kiwi-widget:hover { border-color: var(--kiwi-primary); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
  
  .kiwi-icon-wrapper {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(var(--kiwi-primary-rgb), 0.05);
    color: var(--kiwi-primary);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .kiwi-widget[data-state="solving"] .kiwi-icon-wrapper { animation: kiwi-pulse 2s infinite ease-in-out; }
  .kiwi-widget[data-state="done"] .kiwi-icon-wrapper {
    background: var(--kiwi-success) !important;
    color: #ffffff !important;
    transform: scale(1.05);
  }
  @keyframes kiwi-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.95); opacity: 0.8; } }
  
  .kiwi-main { flex: 1; min-width: 0; }
  .kiwi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .kiwi-label { font-size: 14px; font-weight: 600; color: var(--kiwi-text); letter-spacing: -0.01em; }
  .kiwi-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--kiwi-border);
    color: var(--kiwi-text-muted);
    transition: all 0.3s ease;
  }
  .kiwi-widget[data-state="solving"] .kiwi-badge { background: rgba(var(--kiwi-primary-rgb), 0.15) !important; color: var(--kiwi-primary) !important; }
  .kiwi-widget[data-state="done"] .kiwi-badge { background: rgba(16, 185, 129, 0.15) !important; color: var(--kiwi-success) !important; }
  
  .kiwi-track { height: 4px; width: 100%; border-radius: 2px; background: var(--kiwi-border); overflow: hidden; }
  .kiwi-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--kiwi-primary), #fda4af);
    transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
    width: 0%;
  }
  /* Progress driven by data-progress attribute (CSP3-safe: no inline styles).
     11 discrete steps from 0% to 100%. */
  .kiwi-bar[data-progress="10"] { width: 10%; }
  .kiwi-bar[data-progress="20"] { width: 20%; }
  .kiwi-bar[data-progress="30"] { width: 30%; }
  .kiwi-bar[data-progress="40"] { width: 40%; }
  .kiwi-bar[data-progress="50"] { width: 50%; }
  .kiwi-bar[data-progress="60"] { width: 60%; }
  .kiwi-bar[data-progress="70"] { width: 70%; }
  .kiwi-bar[data-progress="80"] { width: 80%; }
  .kiwi-bar[data-progress="90"] { width: 90%; }
  .kiwi-bar[data-progress="100"] { width: 100%; }
  .kiwi-widget[data-state="done"] .kiwi-bar { background: var(--kiwi-success); }
  
  .kiwi-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .kiwi-info { font-size: 11px; color: var(--kiwi-text-muted); font-weight: 500; margin: 0; }
  .kiwi-timer { font-size: 10px; font-weight: 700; color: var(--kiwi-primary); font-variant-numeric: tabular-nums; }
  
  /* Premium Finish Anim */
  .kiwi-glow {
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-25deg);
    pointer-events: none;
  }
  .kiwi-widget[data-state="done"] .kiwi-glow { animation: kiwi-shine 1s ease-in-out forwards; }
  @keyframes kiwi-shine { 0% { left: -100%; } 100% { left: 150%; } }

</style>
