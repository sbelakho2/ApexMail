test_anchors = ["services/mail-server/crates/billing-service/src/maintenance.rs", "services/mail-server/crates/billing-service/src/mollie_webhooks.rs", "tools/check_prod_billing_wiring.py"]
plan_test_today = "The charge-body test pins sequenceType=recurring, the customer/mandate/amount fields and the Idempotency-Key; the webhook tests pin the recurring-token binding; the wiring gate pins the live base URL and webhook path"
gates = ["V1"]

