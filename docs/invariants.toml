# docs/invariants.toml - the 27 critical invariants (T14).
#
# Source of truth: ApexMail-Plan-and-Review.pdf, "Tests & enforcement",
# "Critical invariants" table, checked at 61e3db3. Each invariant names at
# least one existing code anchor and one gate; tools/check_invariants.py
# fails when the anchor is gone, when the gate is not a required lane, or
# when the invariant itself disappears.

