[[invariant]]
id = "I26"
statement = "Every stored-mandate charge is a Mollie POST /v2/payments with sequenceType: recurring against the tenant's cst_ customer and mdt_ mandate, an exact decimal amount and a deterministic Idempotency-Key, against the live base URL https://api.mollie.com/v2; the webhook ledger binds the resulting recurring token to the tenant"
