      summary: Replace a provisioned user
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          description: SCIM user identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUser'
          application/json:
            schema:
              $ref: '#/components/schemas/ScimUser'
      responses:
        '200':
          description: Updated SCIM user
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
            application/json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      operationId: deleteScimUser
      summary: Deactivate a provisioned user
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          description: SCIM user identifier
          schema:
            type: string
      responses:
        '204':
          description: SCIM user deactivated
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /scim/Groups:
    get:
      operationId: listScimGroups
      summary: List provisioned groups
      description: Return tenant groups in SCIM ListResponse format.
      tags:
        - SCIM
      parameters:
        - name: startIndex
          in: query
          description: One-based start index for SCIM pagination.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: count
          in: query
          description: Maximum number of SCIM resources to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          description: Optional offset alias supported by the implementation.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: SCIM group list
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroupListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ScimGroupListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'

    post:
      operationId: createScimGroup
      summary: Create a provisioned group
      tags:
        - SCIM
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
          application/json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '201':
          description: SCIM group created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
            application/json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /scim/Groups/{id}:
    get:
      operationId: getScimGroup
      summary: Get a provisioned group
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          description: SCIM group identifier
          schema:
            type: string
      responses:
        '200':
          description: SCIM group details
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
            application/json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      operationId: updateScimGroup
      summary: Replace a provisioned group
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          description: SCIM group identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
          application/json:
            schema:
              $ref: '#/components/schemas/ScimGroup'
      responses:
        '200':
          description: Updated SCIM group
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
            application/json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      operationId: patchScimGroup
      summary: Patch a provisioned group
      description: Apply SCIM patch operations such as member add/remove or displayName replacement.
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          description: SCIM group identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatchGroupRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ScimPatchGroupRequest'
      responses:
        '200':
          description: Patched SCIM group
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
            application/json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      operationId: deleteScimGroup
      summary: Delete a provisioned group
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          description: SCIM group identifier
          schema:
            type: string
      responses:
        '204':
          description: SCIM group deleted
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key authentication. Include your API key in the X-API-Key header:
        `X-API-Key: am_live_xxxxxxxxxxxxxxxxxxxxxxxx`
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: am_session
      description: Browser session cookie issued by `/auth/login` and refreshed by `/auth/refresh`.
    BearerSessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer form of the same session token used by `/auth/session`.
    CsrfHeaderAuth:
      type: apiKey
      in: header
      name: x-csrf-token
      description: CSRF token header paired with the `csrf_token` cookie for browser session flows.

  parameters:
    emailId:
      name: emailId
      in: path
      required: true
      description: Email ID
      schema:
        type: string
        example: email_01HQMXJ5KXMW0NREP0YGCZKNVD

    domainId:
      name: domainId
      in: path
      required: true
      description: Domain ID
      schema:
        type: string
        example: domain_01HQMXJ5KXMW0NREP0YGCZKNVD

    webhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook ID
      schema:
        type: string
        example: webhook_01HQMXJ5KXMW0NREP0YGCZKNVD

    keyId:
      name: keyId
      in: path
      required: true
      description: API Key ID
      schema:
        type: string
        example: key_01HQMXJ5KXMW0NREP0YGCZKNVD

  schemas:
    EmailAddress:
      oneOf:
        - type: string
          format: email
          example: user@example.com
        - type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
            name:
              type: string
          example:
            email: user@example.com
            name: John Doe

    Attachment:
      type: object
      required:
        - filename
        - content
      properties:
        filename:
          type: string
          description: Attachment filename
          example: report.pdf
        content:
          type: string
          format: byte
          description: Base64-encoded file content
        contentType:
          type: string
          description: MIME type
          example: application/pdf

    Tag:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          maxLength: 64
          example: category
        value:
          type: string
          maxLength: 256
          example: transactional

    MessageSendRequest:
      type: object
      required:
        - from
        - to
        - subject
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          oneOf:
            - type: array
              items:
                type: string
                format: email
            - type: 'null'
        bcc:
          oneOf:
            - type: array
              items:
                type: string
                format: email
            - type: 'null'
        subject:
          type: string
        html:
          oneOf:
            - type: string
            - type: 'null'
        text:
          oneOf:
            - type: string
            - type: 'null'
        tags:
          oneOf:
            - type: array
              items:
                type: string
            - type: 'null'
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        scheduled_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'

    MessageQueueResponse:
      type: object
      required:
        - id
        - status
        - created_at
      properties:
        id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    MessageDetail:
      type: object
      required:
        - id
        - from
        - to
        - subject
        - status
        - created_at
      properties:
        id:
          type: string
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        status:
          type: string
        tags:
          oneOf:
            - type: array
              items:
                type: string
            - type: 'null'
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        scheduled_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        sent_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time

    BatchMessageSendRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageSendRequest'
          minItems: 1
          maxItems: 100

    BatchMessageSendResult:
      type: object
      required:
        - index
        - status
      properties:
        index:
          type: integer
          format: int64
        id:
          oneOf:
            - type: string
            - type: 'null'
        status:
          type: string
        error:
          oneOf:
            - type: string
            - type: 'null'

    BatchMessageSendResponse:
      type: object
      required:
        - accepted
        - rejected
        - results
      properties:
        accepted:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchMessageSendResult'

    SendEmailRequest:
      type: object
      required:
        - from
        - to
        - subject
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: array
              items:
                $ref: '#/components/schemas/EmailAddress'
              maxItems: 50
        cc:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: array
              items:
                $ref: '#/components/schemas/EmailAddress'
              maxItems: 50
        bcc:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: array
              items:
                $ref: '#/components/schemas/EmailAddress'
              maxItems: 50
        replyTo:
          $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
          maxLength: 998
          example: Welcome to ApexMail!
        html:
          type: string
          description: HTML content
        text:
          type: string
          description: Plain text content
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          maxItems: 10
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom email headers
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          maxItems: 10
        scheduledAt:
          type: string
          format: date-time
          description: Schedule email for future delivery

    SendEmailResponse:
      type: object
      properties:
        id:
          type: string
          description: Email ID
          example: email_01HQMXJ5KXMW0NREP0YGCZKNVD
        status:
          type: string
          enum: [queued, scheduled]
          example: queued

    BatchEmailRequest:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            $ref: '#/components/schemas/SendEmailRequest'
          minItems: 1
          maxItems: 1000

    BatchEmailResponse:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: IDs of successfully queued emails
        successCount:
          type: integer
          description: Number of successfully queued emails
        failureCount:
          type: integer
          description: Number of failed emails
        failures:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Index in the batch
              error:
                type: string
                description: Error message

    Email:
      type: object
      properties:
        id:
          type: string
          example: email_01HQMXJ5KXMW0NREP0YGCZKNVD
        status:
          type: string
          enum: [queued, sent, delivered, bounced, complained, failed]
        from:
          type: object
          properties:
            email:
              type: string
            name:
              type: string
        to:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
              name:
                type: string
        subject:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
        clickedAt:
          type: string
          format: date-time

    EmailListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        hasMore:
          type: boolean
        cursor:
          type: string
          description: Cursor for next page

    CreateDomainRequest:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          format: hostname
          example: example.com

    DnsRecord:
      type: object
      properties:
        type:
          type: string
          enum: [TXT, CNAME, MX]
        name:
          type: string
        value:
          type: string
        priority:
          type: integer
        status:
          type: string
          enum: [pending, verified, failed]

    Domain:
      type: object
      properties:
        id:
          type: string
          example: domain_01HQMXJ5KXMW0NREP0YGCZKNVD
        domain:
          type: string
          example: example.com
        status:
          type: string
          enum: [pending, verified, failed]
        dnsRecords:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time

    DomainListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Domain'

    CreateWebhookRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/webhooks/apexmail
        events:
          type: array
          items:
            type: string
            enum:
              - message.sent
              - message.delivered
              - message.bounced
              - message.complained
              - message.opened
              - message.clicked
          minItems: 1

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - message.sent
              - message.delivered
              - message.bounced
              - message.complained
              - message.opened
              - message.clicked
        active:
          type: boolean

    Webhook:
      type: object
      properties:
        id:
          type: string
          example: webhook_01HQMXJ5KXMW0NREP0YGCZKNVD
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        secret:
          type: string
          description: Webhook signing secret (only returned on creation)
        createdAt:
          type: string
          format: date-time

    WebhookListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'

    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 64
          example: Production API Key
        scopes:
          type: array
          items:
            type: string
            enum:
              - messages:send
              - messages:read
              - messages:write
              - domains:read
              - domains:write
              - suppressions:read
              - suppressions:write
              - events:read
              - events:write
              - templates:read
              - templates:write
              - analytics:read
              - webhooks:read
              - webhooks:write
              - dedicated-ips:read
              - dedicated-ips:write
              - contacts:read
              - contacts:write
              - admin
          description: Permission scopes (empty for full access)

    ApiKeyCreated:
      type: object
      properties:
        id:
          type: string
          example: key_01HQMXJ5KXMW0NREP0YGCZKNVD
        key:
          type: string
          description: Full API key (only shown once)
          example: am_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxx
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    ApiKey:
      type: object
      properties:
        id:
          type: string
        keyPrefix:
          type: string
          description: First 8 characters of the key
          example: am_live_
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ApiKeyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'

    Analytics:
      type: object
      properties:
        sent:
          type: integer
          description: Total emails sent
        delivered:
          type: integer
          description: Total emails delivered
        opened:
          type: integer
          description: Total emails opened
        clicked:
          type: integer
          description: Total links clicked
        bounced:
          type: integer
          description: Total bounces
        complained:
          type: integer
          description: Total spam complaints
        deliveryRate:
          type: number
          format: float
          description: Delivery rate (0-1)
        openRate:
          type: number
          format: float
          description: Open rate (0-1)
        clickRate:
          type: number
          format: float
          description: Click rate (0-1)
        bounceRate:
          type: number
          format: float
          description: Bounce rate (0-1)
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              sent:
                type: integer
              delivered:
                type: integer
              opened:
                type: integer
              clicked:
                type: integer
              bounced:
                type: integer
              complained:
                type: integer

    BillingUsageSummary:
      type: object
      additionalProperties: true
      description: Service-calculated usage summary for the current billing period.

    BillingRealtimeUsageCounter:
      type: object
      required:
        - metric
        - count
        - period
      properties:
        metric:
          type: string
        count:
          type: integer
          format: int64
        period:
          type: string

    BillingPaygEmailPricingTier:
      type: object
      required:
        - pricePerEmailMillicents
      properties:
        upTo:
          oneOf:
            - type: integer
              format: int64
            - type: 'null'
        pricePerEmailMillicents:
          type: integer
          format: int64

    BillingPaygApiPricing:
      type: object
      required:
        - freeCallsPerMonth
        - pricePerThousandCallsCents
      properties:
        freeCallsPerMonth:
          type: integer
          format: int64
        pricePerThousandCallsCents:
          type: integer
          format: int64

    BillingPaygPricing:
      type: object
      required:
        - emailPricing
        - apiPricing
        - minimumMonthlyChargeCents
      properties:
        emailPricing:
          type: array
          items:
            $ref: '#/components/schemas/BillingPaygEmailPricingTier'
        apiPricing:
          $ref: '#/components/schemas/BillingPaygApiPricing'
        minimumMonthlyChargeCents:
          type: integer
          format: int64

    BillingUsageWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    BillingPaygUsageAmounts:
      type: object
      required:
        - emailsSent
        - apiCalls
      properties:
        emailsSent:
          type: integer
          format: int64
        apiCalls:
          type: integer
          format: int64

    BillingPaygCostBreakdown:
      type: object
      required:
        - emailCostCents
        - apiCostCents
        - totalCostCents
        - emailCostUsd
        - apiCostUsd
        - totalCostUsd
      properties:
        emailCostCents:
          type: integer
          format: int64
        apiCostCents:
          type: integer
          format: int64
        totalCostCents:
          type: integer
          format: int64
        emailCostUsd:
          type: string
        apiCostUsd:
          type: string
        totalCostUsd:
          type: string

    BillingPaygUsageResponse:
      type: object
      required:
        - period
        - usage
        - cost
        - pricing
      properties:
        period:
          $ref: '#/components/schemas/BillingUsageWindow'
        usage:
          $ref: '#/components/schemas/BillingPaygUsageAmounts'
        cost:
          $ref: '#/components/schemas/BillingPaygCostBreakdown'
        pricing:
          $ref: '#/components/schemas/BillingPaygPricing'

    BillingQuotaStatus:
      type: object
      additionalProperties: true
      description: Quota enforcement state returned by the billing usage service.

    EventRecord:
      type: object
      required:
        - id
        - event_type
        - timestamp
      properties:
        id:
          type: string
        message_id:
          oneOf:
            - type: string
            - type: 'null'
        event_type:
          type: string
        recipient:
          oneOf:
            - type: string
            - type: 'null'
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        timestamp:
          type: string
          format: date-time

    EventStatsSummary:
      type: object
      required:
        - total
        - delivered
        - bounced
        - complained
        - opened
        - clicked
      properties:
        total:
          type: integer
          format: int64
        delivered:
          type: integer
          format: int64
        bounced:
          type: integer
          format: int64
        complained:
          type: integer
          format: int64
        opened:
          type: integer
          format: int64
        clicked:
