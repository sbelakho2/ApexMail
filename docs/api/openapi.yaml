openapi: 3.1.0
info:
  title: ApexMail API
  description: |
    The ApexMail API is a modern, developer-friendly transactional email API.
    
    ## Authentication
    
    Most API requests require authentication using an API key. Public and session-bootstrap endpoints under `/auth/*` are documented individually and may be public or use session cookies instead. For API-key protected routes, include your API key in the `X-API-Key` header:
    
    ```
    X-API-Key: am_live_xxxxxxxxxxxxxxxxxxxxxxxx
    ```

    The `am_live_xxxxxxxxxxxxxxxxxxxxxxxx` value above is an example placeholder. Replace it with a real API key from the ApexMail dashboard.
    
    ## Rate Limits
    
    The API enforces a default tenant-wide limit of 1,000 requests/minute.
    Authentication and other sensitive endpoints may apply stricter caps.
    Enterprise deployments may negotiate higher limits.
    
    Rate limit headers are included in all responses:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Requests remaining in window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets
    
    ## Errors
    
    The API uses conventional HTTP response codes:
    - `2xx` - Success
    - `4xx` - Client error (bad request, unauthorized, etc.)
    - `5xx` - Server error
  version: 1.0.0
  contact:
    name: ApexMail Support
    email: contact@apexmail.ee
    url: https://apexmail.ee/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-logo:
    url: https://apexmail.ee/logo.png
    altText: ApexMail Logo

servers:
  - url: https://api.apexmail.ee/v1
    description: Production API
  - url: https://sandbox.api.apexmail.ee/v1
    description: Sandbox API (for testing)

tags:
  - name: Emails
    description: Send and manage transactional emails
  - name: Domains
    description: Configure sending domains with DNS verification
  - name: Webhooks
    description: Receive real-time event notifications
  - name: Events
    description: Query message delivery and engagement event history
  - name: SES
    description: Receive Amazon SES SNS notifications and subscription confirmations
  - name: Health
    description: Public liveness and readiness endpoints for infrastructure monitoring
  - name: API Keys
    description: Manage API keys for authentication
  - name: Analytics
    description: Email delivery and engagement analytics
  - name: Billing
    description: Billing usage, subscriptions, and invoices
  - name: Billing Admin
    description: Administrative billing operations for tenant support workflows
  - name: Templates
    description: Manage and render reusable email templates
  - name: Suppressions
    description: Manage suppression lists and pre-send suppression checks
  - name: Lists
    description: Manage audience lists and list subscribers
  - name: Contacts
    description: Manage contacts, bulk contact operations, and imports
  - name: Campaigns
    description: Manage campaigns and campaign delivery lifecycle actions
  - name: Dedicated IPs
    description: Allocate, list, warm, and release dedicated sending IPs
  - name: Automations
    description: Manage tenant automation workflows and enable or disable them
  - name: Support
    description: Manage tenant support tickets and ticket messages
  - name: SCIM
    description: Provision users and groups over the SCIM 2.0 interface
  - name: Auth
    description: User authentication, sessions, CSRF, password reset, and SSO flows
  - name: Account
    description: Inspect the current account profile and schedule account deletion
  - name: Admin
    description: Control-plane administration endpoints for platform operators
  - name: AI
    description: AI-powered optimization, prediction, and bot-detection insights
  - name: Streams
    description: Issue short-lived tokens for real-time event streaming
  - name: Observability
    description: Record client-reported errors and authentication telemetry

security:
  - ApiKeyAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Create a session
      description: Authenticate a user with email and password and issue a session cookie.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/register:
    post:
      operationId: register
      summary: Register a tenant and owner account
      description: Create a pending tenant and owner account, then enqueue email verification.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/signup:
    post:
      operationId: signup
      summary: Register a tenant and owner account
      description: Alias of `/auth/register`.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/verify-email:
    get:
      operationId: verifyEmail
      summary: Verify a registered email address
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Email verification token
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password with a reset token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset email
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a CSRF token
      description: Generate a CSRF token and set the matching cookie for browser session flows.
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: CSRF token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'

  /auth/session:
    get:
      operationId: getSession
      summary: Inspect the current session
      description: Resolve the current browser or bearer-backed session, including impersonation state.
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: Blacklist the current session token and clear the session cookie.
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
          CsrfHeaderAuth: []
        - BearerSessionAuth: []
      responses:
        '204':
          description: Session revoked

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh a browser session token
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
          CsrfHeaderAuth: []
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /api/auth/login:
    post:
      operationId: apiLogin
      summary: Create a session
      description: Control-plane alias of `/auth/login`.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/auth/register:
    post:
      operationId: apiRegister
      summary: Register a tenant and owner account
      description: Control-plane alias of `/auth/register`.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/auth/signup:
    post:
      operationId: apiSignup
      summary: Register a tenant and owner account
      description: Control-plane alias of `/auth/signup`.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/auth/verify-email:
    get:
      operationId: apiVerifyEmail
      summary: Verify a registered email address
      description: Control-plane alias of `/auth/verify-email`.
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Email verification token
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/auth/reset-password:
    post:
      operationId: apiResetPassword
      summary: Reset a password with a reset token
      description: Control-plane alias of `/auth/reset-password`.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/auth/logout:
    post:
      operationId: apiLogout
      summary: Revoke the current session
      description: Control-plane alias of `/auth/logout`.
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
          CsrfHeaderAuth: []
        - BearerSessionAuth: []
      responses:
        '204':
          description: Session revoked

  /api/auth/refresh:
    post:
      operationId: apiRefreshSession
      summary: Refresh a browser session token
      description: Control-plane alias of `/auth/refresh`.
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
          CsrfHeaderAuth: []
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /api/auth/session:
    get:
      operationId: getApiSession
      summary: Inspect the current session
      description: Control-plane alias of `/auth/session`.
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'

  /api/csrf:
    get:
      operationId: getApiCsrfToken
      summary: Issue a CSRF token
      description: Control-plane alias of `/auth/csrf`.
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: CSRF token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'

  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLivenessResponse'

  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadinessResponse'
        '503':
          description: Dependencies are degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadinessResponse'

  /health/deep:
    get:
      operationId: getHealthDeep
      summary: Deep readiness probe with response times
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Deep health check passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepHealthResponse'
        '503':
          description: Deep health check degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepHealthResponse'

  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the current user's password
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /auth/sessions/revoke:
    post:
      operationId: revokeSession
      summary: Revoke one or more stored sessions
      description: Revoke a specific session by ID or all stored sessions for the current user.
      tags:
        - Auth
      security:
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '200':
          description: Session revocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /auth/api-keys:
    get:
      operationId: listAuthApiKeys
      summary: List API keys
      tags:
        - API Keys
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: cursor
          in: query
          description: Optional offset alias used by the server implementation.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: API keys for the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyInfo'
        '401':
          $ref: '#/components/responses/AuthenticationError'

    post:
      operationId: createAuthApiKey
      summary: Create an API key
      tags:
        - API Keys
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'

  /auth/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Delete an API key
      tags:
        - API Keys
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: API key identifier
          schema:
            type: string
      responses:
        '204':
          description: API key deleted
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /auth/sso/google:
    get:
      operationId: startGoogleSso
      summary: Start Google SSO
      tags:
        - Auth
      security: []
      parameters:
        - name: next
          in: query
          schema:
            type: string
        - name: returnUrl
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to Google OAuth consent.
        '404':
          $ref: '#/components/responses/NotFoundError'

  /auth/sso/github:
    get:
      operationId: startGithubSso
      summary: Start GitHub SSO
      tags:
        - Auth
      security: []
      parameters:
        - name: next
          in: query
          schema:
            type: string
        - name: returnUrl
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to GitHub OAuth consent.
        '404':
          $ref: '#/components/responses/NotFoundError'

  /auth/sso/google/callback:
    get:
      operationId: completeGoogleSso
      summary: Complete Google SSO
      tags:
        - Auth
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the dashboard or login page with an SSO result.
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/sso/github/callback:
    get:
      operationId: completeGithubSso
      summary: Complete GitHub SSO
      tags:
        - Auth
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the dashboard or login page with an SSO result.
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/impersonate:
    post:
      operationId: startImpersonation
      summary: Start an impersonation session
      description: Validate an operator-issued impersonation token, set the impersonation session cookie, and redirect the browser to the dashboard.
      tags:
        - Auth
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonateRequest'
      responses:
        '302':
          description: Impersonation session created and browser redirected.
          headers:
            Set-Cookie:
              description: Cookie carrying the impersonation browser session.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/impersonate/end:
    post:
      operationId: endImpersonation
      summary: End an impersonation session
      description: Clear the impersonation session cookie and return a success acknowledgement.
      tags:
        - Auth
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      responses:
        '200':
          description: Impersonation session ended.
          headers:
            Set-Cookie:
              description: Cookie header that clears the impersonation session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndImpersonationResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/telemetry:
    post:
      operationId: recordAuthTelemetry
      summary: Record authentication client telemetry
      description: Accept client-side authentication telemetry for observability. The server intentionally returns success even when the payload is malformed.
      tags:
        - Observability
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPayload'
      responses:
        '200':
          description: Telemetry accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'

  /client-errors:
    post:
      operationId: reportClientError
      summary: Report a client-side application error
      description: Persist a browser-side error report for later investigation and observability analysis.
      tags:
        - Observability
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
      responses:
        '202':
          description: Client error accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientErrorAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      summary: Fetch tenant dashboard statistics
      description: Return the authenticated tenant's last-30-days delivery metrics and top-level resource counts for the product dashboard.
      tags:
        - Analytics
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      responses:
        '200':
          description: Dashboard statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/send-time:
    get:
      operationId: getSendTimeOptimization
      summary: Recommend the best send time
      description: Analyze historical engagement to recommend a send hour for a tenant or specific recipient.
      tags:
        - AI
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      parameters:
        - name: recipient
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: timezone
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Send-time recommendation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTimeResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /ai/subject-analysis:
    get:
      operationId: analyzeSubjectLine
      summary: Score and analyze a subject line
      tags:
        - AI
      security:
        - ApiKeyAuth: []
        - SessionCookieAuth: []
        - BearerSessionAuth: []
      parameters:
        - name: subject
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subject analysis result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectAnalysisResponse'
        '401':
