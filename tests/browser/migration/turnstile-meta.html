<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Turnstile migration fixture with provider metadata</title>
  <script src="/kiwi-captcha/api.js?compat=turnstile" async defer></script>
</head>
<body>
  <form id="checkout" action="/submit" method="post">
    <label>Email <input name="email" type="email"></label>
    <!-- data-action / data-cdata: bound at challenge ISSUANCE (server-owned). -->
    <div class="cf-turnstile" data-sitekey="6Lc_turnstile_meta" data-action="checkout" data-cdata="order_19382" data-callback="onToken"></div>
    <button type="submit">Submit</button>
  </form>
  <p id="out"></p>
  <script>
    function onToken(token) {
      document.getElementById('out').textContent = 'cb:' + String(token).slice(0, 8);
    }
  </script>
</body>
</html>
