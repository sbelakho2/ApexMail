<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>reCAPTCHA v2 checkbox migration fixture</title>
  <!-- The ONLY change vs a standard reCAPTCHA v2 page: the provider script URL. -->
  <script src="/kiwi-captcha/api.js?compat=recaptcha" async defer></script>
</head>
<body>
  <form id="checkout" action="/submit" method="post">
    <label>Email <input name="email" type="email"></label>
    <div class="g-recaptcha" data-sitekey="6Lc_checkout_login" data-kiwi-endpoint="/kiwi-captcha/challenge?ttl=2" data-callback="onCheckoutCaptcha" data-expired-callback="onCheckoutExpired" data-error-callback="onCheckoutError"></div>
    <button type="submit">Submit</button>
  </form>
  <p id="out"></p>
  <script>
    function onCheckoutCaptcha(token) {
      document.getElementById('out').textContent = 'cb:' + String(token).slice(0, 8);
    }
    function onCheckoutExpired() { document.getElementById('out').textContent = 'expired-cb'; }
    function onCheckoutError(err) { document.getElementById('out').textContent = 'err-cb'; }
  </script>
</body>
</html>
