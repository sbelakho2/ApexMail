<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>reCAPTCHA shims fixture</title>
  <!-- The plain driver bootstrap (no compat parameter) plus the shim
       asset: the provider global exists for application code. -->
  <script src="/kiwi-captcha/api.js" defer></script>
  <script src="/kiwi-captcha/widget-shims.js" defer
          data-kiwi-scope-map='{"6Lc_shim_v2":"login","6Lc_shim_map":"signup","6Lc_shim_v3":"login"}'></script>
</head>
<body>
  <form id="checkout" action="/submit" method="post">
    <label>Email <input name="email" type="email"></label>
    <div id="shim-box" data-kiwi-scope="login"></div>
    <div id="map-box"></div>
    <button id="invisible-go" class="g-recaptcha" type="button" data-sitekey="6Lc_shim_v2">Programmatic sign in</button>
    <button type="submit">Submit</button>
  </form>
  <p id="out"></p>
  <script>
    window.shimEvents = [];
    function onShimToken(token) {
      document.getElementById('out').textContent = 'cb:' + String(token).slice(0, 8);
    }
    function onShimExpired() {
      document.getElementById('out').textContent = 'expired-cb';
    }
  </script>
</body>
</html>
