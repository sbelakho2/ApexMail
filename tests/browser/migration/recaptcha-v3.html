<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>reCAPTCHA v3 migration fixture</title>
  <script src="/kiwi-captcha/api.js?compat=recaptcha" async defer></script>
</head>
<body>
  <form id="checkout" action="/submit" method="post">
    <label>Email <input name="email" type="email"></label>
    <button type="submit">Submit</button>
  </form>
  <p id="out"></p>
  <script>
    function onToken(token) {
      document.getElementById('out').textContent = 'cb:' + String(token).slice(0, 8);
    }
    async function runCheckout() {
      try {
        const token = await grecaptcha.execute('6Lc_v3_sitekey_a', { action: 'checkout' });
        document.getElementById('out').textContent = 'v3:' + String(token).slice(0, 8);
      } catch (e) {
        document.getElementById('out').textContent = 'err:' + String(e && e.message);
      }
    }
  </script>
</body>
</html>
