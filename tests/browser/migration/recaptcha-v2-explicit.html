<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>reCAPTCHA v2 explicit-loading migration fixture</title>
  <!-- The standard documented explicit pattern: onload + render=explicit,
       only the provider script URL changed. -->
  <script src="/kiwi-captcha/api.js?compat=recaptcha&onload=onKiwiCaptchaLoad&render=explicit" async defer></script>
</head>
<body>
  <form id="checkout" action="/submit" method="post">
    <label>Email <input name="email" type="email"></label>
    <div id="captcha-explicit" class="g-recaptcha"></div>
    <button type="submit">Submit</button>
  </form>
  <p id="out"></p>
  <script>
    var kiwiExplicitRendered = false;
    function onKiwiCaptchaLoad() {
      // The documented explicit pattern: render inside the onload callback.
      kiwiExplicitRendered = true;
      grecaptcha.render('captcha-explicit', {
        sitekey: '6Lc_explicit_checkout_login',
        callback: onCheckoutCaptcha,
      });
    }
    function onCheckoutCaptcha(token) {
      document.getElementById('out').textContent = 'cb:' + String(token).slice(0, 8);
    }
  </script>
</body>
</html>
