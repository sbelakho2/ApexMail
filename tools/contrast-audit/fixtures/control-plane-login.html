<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApexMail Control Plane</title><meta name="description" content="ApexMail administration and monitoring"><link rel="stylesheet" href="assets/globals.css"></head><body class="antialiased bg-background text-surface-950"><a href="#app-main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-sm focus:bg-card focus:px-4 focus:py-2 focus:text-sm focus:font-bold focus:text-surface-950 focus:border focus:border-surface-950">Skip to content</a><main class="min-h-screen bg-surface-50 relative flex items-center justify-center p-6"><div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none ui-dot-grid"></div><div class="relative z-10 w-full max-w-[400px]"><div class="bg-white rounded-xl shadow-premium border border-surface-200/60 overflow-hidden"><div class="p-8 pb-0"><a href="/" class="inline-block mb-6 group transition-all hover:opacity-80"><span class="text-2xl font-bold tracking-tighter"><span class="text-primary">Apex</span><span class="text-surface-950">Mail</span></span></a><h1 class="text-2xl font-bold text-surface-950 tracking-tight">Operator access</h1><p class="text-surface-500 mt-2 text-sm font-medium">Sign in to the ApexMail control plane</p></div><form class="p-8 space-y-6" action="/web/cp/login" method="POST"><input type="hidden" name="_csrf" value="" /><div class="space-y-2"><label class="apex-klabel" for="login-email"><svg class="apex-arc" viewBox="0 0 24 14" width="17" height="11" fill="none" aria-hidden="true"><path d="M4 12 A 9 9 0 0 1 20 12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Operator Identity</label><input id="login-email" name="email" type="text" required autocomplete="username" placeholder="Email or username" class="apex-input w-full px-4 py-3 border border-surface-200 focus-visible:outline-none transition-all placeholder:text-muted-foreground bg-surface-50 text-sm font-medium text-surface-950" /></div><div class="space-y-2"><div class="flex items-center justify-between"><label class="apex-klabel" for="login-password"><svg class="apex-arc" viewBox="0 0 24 14" width="17" height="11" fill="none" aria-hidden="true"><path d="M4 12 A 9 9 0 0 1 20 12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Access Password</label></div><div class="relative"><input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="Enter password" class="apex-input w-full px-4 py-3 border border-surface-200 focus-visible:outline-none transition-all bg-surface-50 text-surface-950" /></div></div><div class="flex items-center gap-2 py-1"><input id="rememberMe" name="rememberMe" type="checkbox" checked class="h-4 w-4 rounded border-surface-300 text-primary focus:ring-primary transition-all cursor-pointer" /><label for="rememberMe" class="text-xs text-surface-500 font-medium cursor-pointer">Maintain session security</label></div><button type="submit" class="w-full bg-primary hover:bg-brand-700 text-white text-sm font-semibold flex items-center justify-center gap-3 py-3 rounded-[8px_8px_7px_7px] shadow-premium transition-all active:scale-[0.99] group mt-2"><span>Authorize Access</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M5 12h12m-4-4 4 4-4 4"></path></svg></button></form><div class="px-8 pb-8"><p class="text-center text-[11px] text-surface-500 font-medium leading-relaxed px-4">Operator console restricted to authorized administrators.</p></div></div></div></main></body></html>
