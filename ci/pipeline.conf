# =============================================================================
# ci/pipeline.conf — pipeline defaults (sourced as POSIX sh).
# =============================================================================
# Override precedence (highest wins):
#   1. environment variables already set when ci/pipeline.sh starts
#   2. /etc/apexmail/pipeline.conf            (host-wide, created by install.sh)
#   3. this file                               (repo defaults)
# Every assignment below uses : "${VAR:=value}" so an exported env var always
# wins and the file stays safe to source repeatedly (idempotent).
# =============================================================================

# --- stage order -------------------------------------------------------------
# Comma-separated, executed left to right. Stage scripts live in ci/stages/.
# The split CI model (2026-10-16, WP A1): the heavy gate line runs on the CI
# MACHINE (this tree, `ci/pipeline.sh run`), never on the production host —
# the 12k-test battery is too much for the server. The host runs the DEPLOY
# line (set in /etc/apexmail/pipeline.conf):
#   CI_STAGES=fetch,images,migrate,deploy,verify,notify
# and its fetch stage refuses any sha without a fresh .gate-blessing.json
# (ci/stages/fetch.sh + ci/lib.sh gate_blessing_refusal) delivered by
# `ci/pipeline.sh push-blessing <host>` after a green gate run here.
: "${CI_STAGES:=fetch,validate,docs,ui,test,security}"

# --- per-stage timeouts (seconds) ----------------------------------------------
: "${CI_TIMEOUT_fetch:=180}"
: "${CI_TIMEOUT_validate:=1800}"
: "${CI_TIMEOUT_docs:=300}"          # docs architecture-truth gates (python stdlib, seconds)
: "${CI_TIMEOUT_ui:=900}"           # fixtures export (cargo build) + 6 static gates
: "${CI_TIMEOUT_test:=64800}"       # full workspace suite at --test-threads 4 runs HOURS on
                                    # the deploy host (~12.6k tests ≈ 3.5-4h, measured
                                    # 2026-10-11); with --no-fail-fast the stage always runs
                                    # to completion. 5h is that worst case with margin.
# Mixed-workload throughput floor handed to the workspace suite: the test
# defaults to the dev-machine 25k ops/s budget; the runner host measured
# ~19.3k/s at --test-threads 4 while concurrently serving production, so CI
# calibrates the floor with margin instead of asserting machine speed.
: "${CI_LOAD_TEST_OPS_FLOOR:=12000}"
# Scheduler-slack scale for the load-isolation ratios: the runner measures
# tenant B while the ENTIRE suite competes for the same cores; the dev
# bounds (2µs/10µs absolute slack) missed by 0.33µs on the first host run.
: "${CI_LOAD_TEST_ISOLATION_SLACK_SCALE:=10}"
: "${CI_TIMEOUT_security:=2700}"
: "${CI_TIMEOUT_images:=21600}"     # full Rust docker build, cold cache
: "${CI_TIMEOUT_migrate:=600}"
: "${CI_TIMEOUT_deploy:=1200}"
: "${CI_TIMEOUT_verify:=900}"
: "${CI_TIMEOUT_notify:=300}"

# --- first-host triage windows: ENDED 2026-10-13 --------------------------------------
# The 2026-10-11/12 triage windows (coverage-ratchet, PHP-lane, first-host-
# exercise) are CLOSED. Each lane has now produced a verified result, so the
# early `:=advisory` overrides are DELETED: the :=required defaults in the
# lane blocks below are the only declarations for these flags, and the
# effective value equals the declared value (no shadowed dead assignments).
#   * CI_PHP_CHECK — 2026-10-13: all three phpunit suites green locally after
#     the composer install; the lane now repairs a stale vendor/ instead of
#     exercising the previous mirror (commit 12600d07).
#   * CI_SATELLITE_CHECK / CI_STATIC_LINT_CHECK / CI_PRE_COMMIT_CHECK /
#     CI_CONTRAST_GATE_CHECK / CI_BROWSER_SUITE_CHECK — their prerequisites
#     are structurally present (the CI image bakes the pinned chromium +
#     pre-commit toolchain; ci/install.sh provisions the deploy host). A
#     missing prerequisite now FAILS CLOSED with the lane's explicit
#     message — the intended fail-closed semantics.
#
# Coverage ratchet — the ONE window kept open (2026-10-11, re-affirmed
# 2026-10-13): the deploy host has NEVER produced a coverage.lcov (the
# instrumented pass carries a ~150G scratch-tree precondition and every
# attempt so far was skipped ahead of it), so no measured value exists to
# raise/flip against. The gate still runs and records the lcov artifact when
# its precondition holds; the flip belongs to the PR that FIRST records a
# host measurement at/above ci/coverage-baseline.txt (baseline untouched by
# this wave).
: "${CI_COVERAGE_CHECK:=advisory}"

# Coverage must not be skipped silently on the GATE line (external audit
# 2026-10-27, item 6): `ci/pipeline.sh run` is the release gate — its green
# result produces the blessing the production host accepts — so a runner
# without the instrumented pass's scratch headroom FAILS the test lane here
# instead of downgrading the evidence. Developer hosts that deliberately run
# a single lane (or `ci/stages/test.sh` directly) keep the skip-loud default;
# an operator can still set =0 for a non-release pipeline run.
: "${CI_COVERAGE_DISK_REQUIRED:=1}"

# Load-flake triage (2026-10-12) EXPIRED (2026-10-14): both exclusions are
# gone and the list is empty again. Root causes were fixed at the SOURCE, not
# papered over:
#   - ses replay idempotency ("2 queue rows under load"): the webhook dedup
#     key used the processing clock (Utc::now, second granularity), so a
#     replay processed across a second boundary — the normal case under
#     fsync latency — inserted a SECOND customer webhook (a real product
#     bug, not only a flake). The key now uses the provider timestamp from
#     the payload (routes/ses_notifications.rs::queue_webhook_event).
#   - billing maintenance startup sweeps: the test polled the archive row to
#     a deadline but raced the sequentially-next reclaim arm with a single
#     query; it now polls both arms (billing-service/src/maintenance.rs).
# Disk headroom is healthy (target/debug reclaimed, 114G). The canonical
# empty assignment lives with the known-failing-tests block below.

# --- advisory stages -------------------------------------------------------------
# Comma-separated stage names that may fail without failing the run (their
# failure is recorded as advisory in the manifest and still triggers notify).
# Default: none. Suggested advisory candidates: validate (on a fresh checkout).
: "${CI_ADVISORY_STAGES:=}"

# --- run-artifact retention ---------------------------------------------------------
: "${CI_KEEP_RUNS:=30}"             # newest N run dirs kept under ci/runs/
: "${CI_LOG_MAX_LINES:=200000}"     # per-command output cap written to stage logs

# --- repositories / host ------------------------------------------------------------
: "${CI_DEPLOY_DIR:=/opt/apexmail}" # canonical deploy dir on the Hetzner host
: "${CI_ENV_FILE:=}"                # prod env file for validate stage; default:
                                    #   $CI_DEPLOY_DIR/.env when present, else
                                    #   $REPO_ROOT/.env, else the check is skipped
: "${CI_REF:=main}"                 # branch the pipeline tracks/validates
: "${CI_REPO_URL:=origin}"          # git remote used by the fetch stage

# fetch stage: allow running from a non-git working copy (e.g. rsync'd host
# trees). 0 = require a git checkout with the HEAD pushed to the remote.
: "${CI_ALLOW_NO_GIT:=0}"

# --- test stage ----------------------------------------------------------------------
# Audit fix (defaults that gated nothing): the canonical pipeline now runs
# DB/Redis-gated tests for real — ephemeral containers, the canonical SCHEMA,
# TEST_DATABASE_URL/TEST_REDIS_URL exported (see ci/stages/test.sh). Set
# CI_TEST_DB=none / CI_TEST_REDIS=0 only to reproduce GitHub-runner
# soft-skip behaviour deliberately.
: "${CI_TEST_DB:=ephemeral}"
: "${CI_TEST_REDIS:=1}"
# CI_TEST_DB / CI_TEST_REDIS modes:
#   ephemeral (default) — this pipeline starts its own docker postgres/redis.
#   none / 0            — GitHub-parity: the DB/Redis-gated tests self-skip.
#   service             — a CI EXECUTOR provides the instance (Woodpecker's
#                         `services:`, a sidecar, or an operator's server).
#                         TEST_DATABASE_URL / TEST_REDIS_URL must already be
#                         exported; the canonical chain is applied to the
#                         provided database and nothing is rewritten. Missing
#                         URL = hard failure (a green pipeline that ran zero
#                         DB-gated tests is the failure mode this prevents).
#   `.woodpecker.yml` runs the test and security stages this way.
: "${CI_EPHEM_PG_IMAGE:=postgres:16-alpine}"
: "${CI_EPHEM_REDIS_IMAGE:=redis:7-alpine}"

# --- security stage --------------------------------------------------------------------
# RUSTSEC ignores mirror services/mail-server/deny.toml [advisories].ignore
# EXACTLY (keep both lists in lockstep — justifications live in both places).
# 2026-09-10 sync (deny-lane expansion): +2026-0192 ttf-parser unmaintained
# (typst 0.14 stack), +2026-0206 rustybuzz unmaintained (same), +2026-0205
# scc 2.4 unsound — test-only via serial_test→integration-tests, fix needs
# serial_test against scc 3; revisit on the next serial_test/typst bump.
# 2026-10-17 advisory refresh (published 2026-10-09/14 after the last sweep):
#   +2026-0367/0368/0369 zip 2.4.2 — the vulnerable APIs are
#     ZipArchive::extract / ZipStreamReader::extract (symlink escape, SUID
#     preservation). The remaining 2.4.2 copies are transitive and READ-ONLY
#     in memory: mail-auth DMARC/TLS-RPT report parsing (ZipArchive::new +
#     by_index) and calamine XLSX reading (by_index; no extract). The ONE
#     attacker-facing archive extractor — crates/sandbox — is upgraded to
#     zip 9.0.5 (99/99 tests). Revisit when mail-auth/calamine lift zip 2.
#   +2026-0346/0349 rustls 0.21.12 — EOL line pinned by
#     aws-smithy-http-client 1.5.0 and hickory-proto 0.24.4 (via mail-auth
#     0.5.1/mail-send 0.4.9); no 0.21.x fix exists. Our 0.23 copy IS patched
#     (0.23.46). The Debug advisory needs Debug-formatted TLS session values
#     (we never log them); the downgrade needs a hostile server on
#     connections we open to AWS/known resolvers. Tracked with the AWS SDK +
#     mail-auth majors.
: "${CI_CARGO_AUDIT_IGNORES:=RUSTSEC-2026-0258 RUSTSEC-2026-0194 RUSTSEC-2026-0195 RUSTSEC-2026-0119 RUSTSEC-2023-0071 RUSTSEC-2026-0098 RUSTSEC-2026-0099 RUSTSEC-2026-0104 RUSTSEC-2025-0141 RUSTSEC-2025-0057 RUSTSEC-2024-0384 RUSTSEC-2024-0436 RUSTSEC-2024-0370 RUSTSEC-2025-0134 RUSTSEC-2024-0320 RUSTSEC-2023-0086 RUSTSEC-2026-0002 RUSTSEC-2026-0192 RUSTSEC-2026-0206 RUSTSEC-2026-0205 RUSTSEC-2026-0187 RUSTSEC-2024-0449 RUSTSEC-2026-0367 RUSTSEC-2026-0368 RUSTSEC-2026-0369 RUSTSEC-2026-0346 RUSTSEC-2026-0349}"
# Reviewed RUSTSEC ignores (2026-08-22 sweep — every direct-dep advisory fixed):
#   2026-0258 h2 0.3.x — transitive via aws-smithy-http-client (AWS SDK); no fixed 0.3.x
#     exists; our h2 0.4 copy IS patched (>=0.4.16). Revisit on SDK refresh.
#   2026-0194/0195 quick-xml — five transitive copies <0.41 via typst 0.14 ecosystem
#     (calamine/citationberg/plist) and mail-auth 0.4 (via mail-send 0.4). Direct
#     workspace copy IS patched (0.41). Revisit on typst 0.15 / mail-send 0.6 upgrade.
#   2026-0119 hickory-proto 0.24 — transitive via mail-auth 0.4 (mail-send 0.4); our
#     direct copy IS patched (hickory-resolver 0.26.1). Revisit with mail-send 0.6.
#   2023-0071 rsa — no fixed upgrade exists (MARVIN); accepted with mitigations.
#   2026-00xx/2025-xxxx rustls-webpki + unmaintained warnings — long-standing reviewed
#     entries (see .cargo/audit.toml header for the original triage).
# Fixed this sweep (no longer ignored): RUSTSEC-2024-0437 protobuf 2.28
#   (prometheus 0.13 → 0.14 dropped protobuf), ammonia/crossbeam-epoch/lettre/
#   quinn-proto/memmap2/scc/h2-0.4 (patch bumps).
: "${CI_GITLEAKS_CONFIG:=.gitleaks.toml}"
: "${CI_TRIVY_SEVERITY:=CRITICAL,HIGH}"
# Secret scanning + dependency auditing are fail-closed (advisory overrides
# exist only for triage windows — see README §9 F11/F12).
: "${CI_GITLEAKS_CHECK:=required}"
: "${CI_CARGO_AUDIT_CHECK:=required}"
# --- 2026-09-10 enterprise coverage expansion -------------------------------------------
# semgrep SAST: was advisory with a plain warn-skip — now REQUIRED and
# fail-closed on the deploy host (ci_have_tool). Every finding must be fixed
# or triaged with a targeted inline `# nosemgrep: <rule-id>` justification.
# Host pin: semgrep 1.176.x (ci/install.sh venv recipe).
: "${CI_SEMGREP_CHECK:=required}"
# trivy filesystem scan (source-tree vuln+secret, CRITICAL/HIGH): REQUIRED.
# Triage lives in .trivyignore — every entry carries a justification.
: "${CI_TRIVY_FS_CHECK:=required}"
# Fresh-DB migration validation (README §9 F1): the migration chain was
# previously broken (failed at 109) which forced this gate to advisory; the
# chain is fixed through 118, so the gate is REQUIRED again — a fresh-DB
# migration failure fails the run. Set to advisory only for a triage window.
: "${CI_MIGRATION_CHECK:=required}"

# --- validate stage (marketing site-quality validators) --------------------------------
# F14: deploy/tests/{contrast-check,html-validate,seo-validate}.sh each write a
# JSON report AND exit non-zero on critical violations; the validate stage
# preserves those reports as run artifacts and hard-fails when one is missing.
# This switch enforces their exit codes (non-zero exit on violations) in the
# gate: `required` fails the run on any critical finding.
# Default `required` since 2026-09-10: the checker backlog is fixed (every
# script's detection patterns were corrected for the minified, unquoted
# markup the zola build actually emits, the subshell-lost counters in the
# font/image audits repaired, and the real findings they surfaced — dead
# social/status links, locale 404s, vague-language copy — triaged), so the
# full marketing-validation list now runs green and GATES. The
# AUTHORITATIVE pixel-verified WCAG gate remains tools/contrast-audit/gate.sh,
# REQUIRED in the test stage either way. `advisory` is a triage-window
# override only.
: "${CI_MARKETING_VALIDATION:=required}"

# --- test stage (fmt/clippy/ledger gates) ---------------------------------------------
# All three lanes RUN on every test stage. Audit fix (defaults that gated
# nothing): all three are now REQUIRED — the committed fmt/clippy/ledger
# drift (README §9 F7/F8/F9) has landed, so a regression fails the run.
# Set an individual gate back to advisory only for a bounded triage window.
: "${CI_FMT_CHECK:=required}"
: "${CI_CLIPPY_CHECK:=required}"
: "${CI_AUDIT_COVERAGE_CHECK:=required}"

# --- ui stage (UI/UX gates over the exported visual fixtures) -------------------------
# ci/stages/ui.sh exports EVERY manifest route of every surface into
# $RUN_DIR/ui-fixtures (APEX_EXPORT_ALL_UI_ROUTES=1 cargo run -p
# ui-foundation --bin export_visual_fixtures) and runs six stdlib-python
# gates over the fixtures + the Rust sources. ALL SIX ARE REQUIRED BY
# DEFAULT (audit SM14 F13 — this block previously said they "SHIP ADVISORY"
# while every flag below was already :=required; the stale doc is fixed to
# match the live configuration). The advisory→required flip followed the
# fmt/clippy convention: the first runs surfaced real P2 drift (per-form
# CSRF gaps, duplicate control-plane h1s, `tenant` wording in
# customer-facing flash strings, baseline-manifest link drift, 9
# `redirect_error(&error.to_string())` leak sites), the fixes landed, and
# the gates now GATE: a regression fails the stage. `advisory` remains
# available only as a bounded triage-window override.
#   CI_UI_FLASH_COPY_CHECK       gate C — flash copy canon (tools/check_flash_copy.py)
#   CI_UI_FORM_HYGIENE_CHECK     gate D — form action/CSRF/labelling (tools/check_ui_form_hygiene.py)
#   CI_UI_A11Y_CHECK             gate E — a11y rules (tools/check_ui_a11y.py)
#   CI_UI_LINKS_CHECK            gate I — dead links (tools/check_ui_links.py)
#   CI_UI_TERMINOLOGY_CHECK      gate J — product-name/voice register (tools/check_ui_terminology.py)
#   CI_UI_STRINGS_CATALOG_CHECK  gate K — catalog drift (tools/extract_ui_strings.py --check)
#   CI_UI_MARKETING_CONTRAST_CHECK gate M — marketing token contrast + authored-vs-built
#                                  stylesheet drift (tools/check_marketing_contrast.py;
#                                  NEW 2026-10-07 after the gates review showed the old
#                                  constant-only checker could not fail against the
#                                  shipped palette and an authored fix had not been
#                                  regenerated into styles.css)
: "${CI_UI_FLASH_COPY_CHECK:=required}"
: "${CI_UI_FORM_HYGIENE_CHECK:=required}"
: "${CI_UI_A11Y_CHECK:=required}"
: "${CI_UI_LINKS_CHECK:=required}"
: "${CI_UI_TERMINOLOGY_CHECK:=required}"
: "${CI_UI_STRINGS_CATALOG_CHECK:=required}"
: "${CI_UI_MARKETING_CONTRAST_CHECK:=required}"
# Coverage ratchet (NEW 2026-09-10): cargo llvm-cov nextest --workspace →
# $RUN_DIR/coverage.lcov; OVERALL line coverage below ci/coverage-baseline.txt
# FAILS the run. The baseline ships as 0.0 — the FIRST HOST RUN seeds the
# real value (commit it in the same change). Raise the baseline only in the
# same PR as the tests that earned it.
# Flag CI_COVERAGE_CHECK is declared ONCE, in the triage block at the top of
# this file: currently ADVISORY (no host measurement exists yet — see the
# dated reason there). Do not re-declare it here.
# Migration SQL lint (validate stage, NEW 2026-09-10): enterprise
# conventions over the canonical chain; ledger-frozen legacy files are
# grandfathered inside tools/migration_lint.py with justifications.
: "${CI_MIGRATION_LINT_CHECK:=required}"

# --- docs stage (documentation architecture-truth gates, NEW 2026-10-02) ----
# Audit EXT-E #11: production runbooks taught kubectl/helm operations that
# cannot work on the authoritative single-Hetzner-host Docker Compose
# deployment. The K8s commands are rewritten; ci/stages/docs.sh keeps the
# tree honest — any production runbook/operational doc under docs/ containing
# kubectl|helm|k9s|istioctl|argocd|"namespace apexmail" FAILS unless the doc
# carries an ARCHITECTURE-TRUTH: HISTORICAL|ROADMAP|ALTERNATIVE marker in its
# first 15 lines (how genuinely historical/roadmap docs stay, unambiguous).
# `advisory` is a bounded triage-window override only.
: "${CI_DOCS_TRUTH_CHECK:=required}"

# Known-failing TESTS, excluded from nextest LOUDLY (a warning line per
# entry). Every entry must map to a ci/README.md §9 finding and be removed
# once fixed. Empty the list to run the complete suite.
# 2026-10-14: EMPTY — the two entries from the 2026-10-12 load-flake triage
# were fixed at the source (ses webhook provider-timestamp dedup; billing
# startup-sweep poll); see the expired-triage note near the lane knobs.
: "${CI_NEXTEST_EXCLUDE:=}"
# Cap nextest's concurrent test threads: every DB-gated test provisions its
# own canonical-chain clone (~0.5-1GB disk); unbounded concurrency on an
# 8-cpu/19G-disk runner peaks past available space and kills the suite
# mid-run (external audit 2026-10-02 follow-up). Raise on bigger runners.
: "${CI_NEXTEST_JOBS:=4}"

# --- test stage (PHP suites / SDK lanes / satellite crates / static lint) ----------------
# F-wave coverage fix: these lanes used to either silently skip (the PHP
# suites skipped when vendor/bin/phpunit was absent — on the deploy host it
# was absent, so nothing ran) or not exist at all (the five SDKs and the two
# satellite crates outside the mail-server workspace). All are REQUIRED
# now; each flag degrades a lane to an explicitly-logged advisory skip for
# a bounded triage window only. The toolchains are ci_have_tool-gated:
# on the deploy host a missing tool FAILS CLOSED (run ci/install.sh).
: "${CI_PHP_CHECK:=required}"          # phpunit: kiwicaptcha-php, risk-php, symfony
: "${CI_SDK_CHECK:=required}"          # packages/sdk-{python,go,java,ruby,php}
: "${CI_SATELLITE_CHECK:=required}"    # packages/{smtp-auth-proxy,kiwicaptcha-wasm}
: "${CI_STATIC_LINT_CHECK:=required}"  # gate tooling: shellcheck -S warning + hadolint + py_compile
# Developer pre-commit parity lane (audit SM14 F12): the test stage runs the
# exact .pre-commit-config.yaml over ALL files, so the developer-side config
# can no longer be opt-in drift (its gitleaks hook rev is pinned to the CI
# image's gitleaks version). `advisory` is a bounded triage-window override.
: "${CI_PRE_COMMIT_CHECK:=required}"
# WCAG AA contrast + layout-spill gates (test stage): tools/contrast-audit/
# gate.sh (pixel-verified AA text contrast, three themes + marketing top-20)
# and layout-gate.sh (overflow/invisible-text/overlap defects) are REQUIRED
# (F52). Prerequisites are fail-closed and provisioned: node + the workspace
# playwright via `npm ci` from the committed lockfile (provision_contrast_
# node_modules) + the chromium the CI image bakes in at build time
# (PLAYWRIGHT_VERSION pin, ci/ci-image/toolchain-versions.env; the workspace
# lock resolves the SAME version). A missing runtime FAILS the lane with the
# provisioning hint; `advisory` is a bounded triage-window override only.
: "${CI_CONTRAST_GATE_CHECK:=required}"
# Browser suite (BR-1, 2026-10-07): tests/browser/** (KiwiCaptcha Playwright
# specs against the PHP port booted via `php -S`) previously had NO CI lane —
# the "suite used by CI" claim was false. The test stage now runs the
# chromium lane (tests/browser/playwright.config.mjs) with fail-closed
# prerequisites: node, php, and the chromium executable the workspace's
# locked @playwright/test resolves (the CI image bakes in the same version;
# ci/ci-image/toolchain-versions.env PLAYWRIGHT_VERSION). A missing runtime
# FAILS the lane; `advisory` is a bounded triage-window override that logs a
# clear skipped-by-config message (matching the UI-gate convention). The
# cross-engine a11y lane (firefox/webkit) stays a qualification lane — the
# image bakes chromium only.
: "${CI_BROWSER_SUITE_CHECK:=required}"
# Dogfood ledger + harness self-test (test stage, 2026-10-13): the test stage
# runs the whole-repo dogfood harness (tools/dogfood-v2/run.py) — its
# `--ledger-only` lane is the 100%-coverage CI gate (every enumerated surface
# — api routes, SSR pages, tables, env entries, services, tracking links —
# must map to a probe; unprobed surfaces exit 3 and FAIL the lane with the
# unprobed list printed) and `--self-test` runs the whole battery against the
# harness's own fixture server (self-hosted on loopback; ~2.5 min locally,
# 1317 checks) to prove the harness contract. REQUIRED by default; `advisory`
# is a bounded triage-window override only.
: "${CI_DOGFOOD_CHECK:=required}"
# Live dogfood battery knob (default 0 = OFF, and deliberately so): the live
# run drives a RUNNING non-production stack — api-server (+ web console /
# control-plane / marketing hosts). It must never point at production
# (WP A1 / host-load policy); enable it where a built api-server + docker env
# exist (an executor or a dev stack). CI_DOGFOOD_HOST / CI_DOGFOOD_CP_HOST /
# CI_DOGFOOD_MARKETING_HOST override the hosts (defaults
# http://127.0.0.1:8080, admin.localhost, marketing.localhost). The mutation
# battery (--mutation-test: scratch worktree + cargo build) likewise needs
# that stack and stays a manual/qualification run — never wired here.
: "${CI_DOGFOOD_LIVE:=0}"
# Where the sdk-python lane keeps its cached venv (created once, reused;
# never the user site — no dev-machine pollution).
: "${CI_SDK_VENV_DIR:=/tmp/apexmail-ci-sdks}"

# --- verify stage ------------------------------------------------------------------------
# Off-host runs skip live verification unless this is 1 (probes PRODUCTION).
: "${CI_VERIFY_REMOTE:=0}"

# --- notify stage ---------------------------------------------------------------------------
: "${CI_NOTIFY_FROM:=ci@apexmail.ee}"
: "${CI_NOTIFY_TO:=admin@apexmail.ee}"
