# =============================================================================
# ci/pipeline.conf — pipeline defaults (sourced as POSIX sh).
# =============================================================================
# Override precedence (highest wins):
#   1. environment variables already set when ci/pipeline.sh starts
#   2. /etc/apexmail/pipeline.conf            (host-wide, created by install.sh)
#   3. this file                               (repo defaults)
# Every assignment below uses : "${VAR:=value}" so an exported env var always
# wins and the file stays safe to source repeatedly (idempotent).
# =============================================================================

# --- stage order -------------------------------------------------------------
# Comma-separated, executed left to right. Stage scripts live in ci/stages/.
: "${CI_STAGES:=fetch,validate,test,security,images,migrate,deploy,verify,notify}"

# --- per-stage timeouts (seconds) ----------------------------------------------
: "${CI_TIMEOUT_fetch:=180}"
: "${CI_TIMEOUT_validate:=1800}"
: "${CI_TIMEOUT_test:=5400}"        # cargo test --workspace can take ~10 min
: "${CI_TIMEOUT_security:=2700}"
: "${CI_TIMEOUT_images:=10800}"     # full Rust docker build, cold cache
: "${CI_TIMEOUT_migrate:=600}"
: "${CI_TIMEOUT_deploy:=1200}"
: "${CI_TIMEOUT_verify:=900}"
: "${CI_TIMEOUT_notify:=300}"

# --- advisory stages -------------------------------------------------------------
# Comma-separated stage names that may fail without failing the run (their
# failure is recorded as advisory in the manifest and still triggers notify).
# Default: none. Suggested advisory candidates: validate (on a fresh checkout).
: "${CI_ADVISORY_STAGES:=}"

# --- run-artifact retention ---------------------------------------------------------
: "${CI_KEEP_RUNS:=30}"             # newest N run dirs kept under ci/runs/
: "${CI_LOG_MAX_LINES:=200000}"     # per-command output cap written to stage logs

# --- repositories / host ------------------------------------------------------------
: "${CI_DEPLOY_DIR:=/opt/apexmail}" # canonical deploy dir on the Hetzner host
: "${CI_ENV_FILE:=}"                # prod env file for validate stage; default:
                                    #   $CI_DEPLOY_DIR/.env when present, else
                                    #   $REPO_ROOT/.env, else the check is skipped
: "${CI_REF:=main}"                 # branch the pipeline tracks/validates
: "${CI_REPO_URL:=origin}"          # git remote used by the fetch stage

# fetch stage: allow running from a non-git working copy (e.g. rsync'd host
# trees). 0 = require a git checkout with the HEAD pushed to the remote.
: "${CI_ALLOW_NO_GIT:=0}"

# --- test stage ----------------------------------------------------------------------
# GitHub-parity by default: DB/Redis-gated tests self-skip exactly like
# rust-check.yml (no service containers in that workflow). Opt into stronger
# local coverage with ephemeral containers:
#   CI_TEST_DB=ephemeral   spin postgres, apply the canonical SCHEMA, export
#                          TEST_DATABASE_URL (see ci/README.md § known failures)
#   CI_TEST_REDIS=1        spin redis, export TEST_REDIS_URL
: "${CI_TEST_DB:=none}"
: "${CI_TEST_REDIS:=0}"
: "${CI_EPHEM_PG_IMAGE:=postgres:16-alpine}"
: "${CI_EPHEM_REDIS_IMAGE:=redis:7-alpine}"

# --- security stage --------------------------------------------------------------------
# RUSTSEC ignores mirror .github/workflows/security-audit.yml exactly (each has
# a justification TODO there; keep both lists in lockstep).
: "${CI_CARGO_AUDIT_IGNORES:=RUSTSEC-2026-0119 RUSTSEC-2024-0437 RUSTSEC-2023-0071 RUSTSEC-2026-0098 RUSTSEC-2026-0099 RUSTSEC-2026-0104 RUSTSEC-2025-0141 RUSTSEC-2025-0057 RUSTSEC-2024-0384 RUSTSEC-2024-0436 RUSTSEC-2024-0370 RUSTSEC-2025-0134 RUSTSEC-2024-0320 RUSTSEC-2023-0086 RUSTSEC-2026-0002}"
: "${CI_GITLEAKS_CONFIG:=.gitleaks.toml}"
: "${CI_TRIVY_SEVERITY:=CRITICAL,HIGH}"
# Secret scanning + dependency auditing are fail-closed (advisory overrides
# exist only for triage windows — see README §9 F11/F12).
: "${CI_GITLEAKS_CHECK:=required}"
: "${CI_CARGO_AUDIT_CHECK:=required}"
# Fresh-DB migration validation (README §9 F1): the chain currently fails at
# migration 109, so the gate defaults to advisory (reported, non-blocking)
# until the migration is fixed. Set to required to hard-fail again.
: "${CI_MIGRATION_CHECK:=advisory}"

# --- test stage (fmt/clippy/ledger gates) ---------------------------------------------
# All three lanes RUN on every test stage; while the tree carries committed
# drift (README §9 F7/F8/F9) their default is advisory = record the full
# diff/log in the run dir and warn without failing the run. Flip each to
# required after the corresponding cleanup lands on main.
: "${CI_FMT_CHECK:=advisory}"
: "${CI_CLIPPY_CHECK:=advisory}"
: "${CI_AUDIT_COVERAGE_CHECK:=advisory}"

# Known-failing TESTS, excluded from nextest LOUDLY (a warning line per
# entry). Every entry must map to a ci/README.md §9 finding and be removed
# once fixed. Empty the list to run the complete suite.
: "${CI_NEXTEST_EXCLUDE:=random_paths_produce_bounded_distinct_labels}"   # F13

# --- verify stage ------------------------------------------------------------------------
# Off-host runs skip live verification unless this is 1 (probes PRODUCTION).
: "${CI_VERIFY_REMOTE:=0}"

# --- notify stage ---------------------------------------------------------------------------
: "${CI_NOTIFY_FROM:=ci@apexmail.ee}"
: "${CI_NOTIFY_TO:=admin@apexmail.ee}"
