# ci/test-expectations.toml — what every package must prove (T14).
#
# Source of truth: ApexMail-Plan-and-Review.pdf, "Tests & enforcement"
# (pages 3-8 of the section), checked at 61e3db3. Every workspace crate
# and every package outside it appears here exactly once. A package
# missing from this file fails tools/check_invariants.py, and so does a
# declared kind whose evidence cannot be found in the tree.
#
# kinds used here (each has a mechanical evidence rule in
# tools/check_invariants.py):
#   unit     - #[test]-family tests in the package
#   fuzz     - a fuzz target named for the package under fuzz-tests/
#   corpus   - a committed corpus directory named for the package
#   golden   - committed golden fixtures for the package
#   matrix   - covered by the T5 all-routes auth/tenant matrix
#   journey  - covered by a committed browser journey spec (T6)
#   lane     - runs as a required lane in ci/required-lanes.txt
#
# Kind evidence must EXIST today; planned kinds are tracked per work
# package in the [planned] tables at the end, keyed by WP id, and move up
# into required_kinds as their WP lands (plan rule 7).

[package.api-server]
tier = 1
role = "REST API and SSR console"
required_kinds = ["unit", "journey"]
plan_requires = """All-routes matrix (T5); OpenAPI drift (T8); product journeys (T6); diff-mode mutants (T3)"""

