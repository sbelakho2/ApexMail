# ApexMail trivy secret-scan triage (used by ci/stages/security.sh trivy_fs_scan
# via --secret-config; .trivyignore covers vulnerability IDs, this file covers
# SECRET findings — trivy splits the two triage channels).
#
# Every entry must carry a justification and be revisited on feed refreshes.
allow-rules:
  - id: stripe-docs-example-keys-in-dlp-tests
    description: >
      Stripe's PUBLIC documentation example keys (sk_live_/sk_test_
      4eC39HqLyjWDarjtT1zdp7dc, published in Stripe's API docs) used as
      detection-corpus constants in the dlp-engine unit tests — the code
      that FINDS such keys in customer content. Not credentials; the same
      constants are triaged for gitleaks/semgrep in their own configs.
      Any OTHER sk_live_/sk_test_ value still fails the scan.
    regex: 'sk_(live|test)_4eC39HqLyjWDarjtT1zdp7dc'

  - id: dogfood-local-stack-jwt-key
    description: >
      data/dogfood-dns/api.env is the LOCAL dogfood stack's env file (BASE_URL
      http://localhost:8080, dev webhook secret). Its JWT keypair exists only
      so the local stack can boot; it signs local dev sessions and appears in
      no deployment (production keys are Docker secrets on the host). The
      dogfood DNS harness (tools/dogfood-live-console.py + the campaign
      transcript) references the file by path.
    path: data/dogfood-dns/api.env

  - id: mta-inbound-tls-test-keypairs
    description: >
      Two inline RSA keypairs inside the #[cfg(test)] module of
      mta/src/servers/inbound.rs drive the local TLS listener the tests spin
      up. Test-only material, compiled into test builds exclusively; any
      OTHER secret in this file still fails the scan (this rule is scoped to
      the file path, not the rule id).
    path: services/mail-server/crates/mta/src/servers/inbound.rs
