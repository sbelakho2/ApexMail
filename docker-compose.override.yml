# =============================================================================
# Docker Compose Override — Local Development
# =============================================================================
# The main docker-compose.yml uses read_only + apparmor which prevents
# containers from starting in typical dev environments.
# This override provides standalone dev-friendly service definitions.
# By default it starts only Postgres and Redis; opt into application services
# with --profile full-stack, --profile monitoring, or --profile dev.
# =============================================================================

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: apexmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-apexmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # F4 (audit): the host bind is HARDCODED to 127.0.0.1 OUTSIDE the
      # variable (same form as docker-compose.yml, same fix as the
      # GRAFANA_PORT footgun). The old "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
      # default embedded host:port, so a BARE POSTGRES_PORT=5432 (as shipped
      # in .env.example) expanded to "5432:5432" — an all-interfaces bind.
      # The variable now selects ONLY the host port number.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexmail} -d ${POSTGRES_DB:-apexmail}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apexmail_data
    secrets:
      - postgres_password

  redis:
    image: redis:7.4-alpine
    container_name: apexmail-redis
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_MAXMEMORY: "256mb"
      REDIS_MAXMEMORY_POLICY: "noeviction"
    volumes:
      - redis_data:/data
      - ./deploy/redis/entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    ports:
      # F4 (audit): loopback bind hardcoded outside the variable — a bare
      # REDIS_PORT=6379 (.env.example) must stay loopback-only.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=\"$(cat /run/secrets/redis_password 2>/dev/null || echo '')\"; redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apexmail_data
    secrets:
      - redis_password

  api-server:
    environment:
      PORT: "8080"
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-""}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-""}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-dev-api-key-hash-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-32chars-min}
      # CP session HMAC key. Without an explicit value the api-server derives
      # a fresh random dev secret per process (`generated_dev_secret`), so
      # every container restart invalidated every live `apexmail_cp_session`
      # cookie — operators were logged out mid-run with a hard 401 "invalid
      # CP session signature" (dogfood 2026-10-08). The dev stack pins it
      # like SESSION_SECRET; production validation still rejects dev-* values.
      CP_SESSION_SECRET: ${CP_SESSION_SECRET:-local-dev-cp-session-secret-32chars-min}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-dev-webhook-secret-not-for-production}
      CSRF_SECRET: ${CSRF_SECRET:-local-dev-csrf-secret-32chars-min}
      IMPERSONATION_SECRET: ${IMPERSONATION_SECRET:-local-dev-impersonation-secret-32chars}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-local-dev-control-plane-api-key-32chars}
      # Dev Stripe webhook ingest parity (dogfood finding A, 2026-10-05):
      # api-server mounts /webhooks/stripe only when this secret exists.
      # Local-only literal; production supplies the real secret.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-dev-stripe-webhook-secret-local-only-0123456789}
      # Same transport selection as the worker: the REST send gate's domain
      # readiness reads EMAIL_TRANSPORT_TYPE (unset = SES, demanding
      # ses_verified on every sender domain — which rejected every REST send
      # in the SMTP-mode dev stack).
      EMAIL_TRANSPORT_TYPE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      # Dev parity for local webhook listeners (docs dogfood): the api-server
      # refuses loopback webhook URLs unless this explicit override is set.
      # MFA_SECRET_ENCRYPTION_KEY pins the shared secret-at-rest key so
      # webhook signing secrets written here decrypt in the worker.
      APEXMAIL_ALLOW_LOCALHOST_WEBHOOKS: "true"
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY:?at-rest key required}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${API_METRICS_PORT:-9090}:9090"
    profiles:
      - full-stack

  tracking:
    profiles:
      - full-stack

  enterprise:
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-not-for-production-use-change-me-1234567890abcdef}
      # F6 (dogfood): the SSO callback mints the canonical `am_session`
      # cookie with the SHARED signing key. Same pair the api-server gets
      # above; without it every federated login lands with no console
      # session (a server-side warn the user never sees).
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-""}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-""}
      # SSO_ENCRYPTION_KEY pins the at-rest key for tenant OIDC client
      # secrets (config.rs `sso_encryption`). Without it, EVERY
      # POST /sso/configure carrying an oidc_client_secret fails with a raw
      # 500 "Encrypt OIDC client secret: key derivation error" — the same
      # dev-parity rationale as the api-server's MFA_SECRET_ENCRYPTION_KEY
      # pin above (docs/enterprise/sso.md:130-132 declares the requirement).
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY:-local-dev-sso-encryption-key-32chars-min}
      # Dev parity with the router-test loopback OP (routes.rs MockOidcIdp):
      # the federation egress guard demands HTTPS otherwise.
      SSO_FEDERATION_ALLOWLIST: ${SSO_FEDERATION_ALLOWLIST:-127.0.0.1,localhost,host.docker.internal}
    profiles:
      - full-stack

  pdf-renderer:
    profiles:
      - full-stack

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: apexmail-clickhouse
    entrypoint: ["/entrypoint.sh"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-apexmail}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apexmail}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse-password-minimum-32}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./deploy/clickhouse/query-log.xml:/etc/clickhouse-server/config.d/query-log.xml:ro
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/apexmail-users.xml:ro
      - ./deploy/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # F4 (audit): loopback bind hardcoded outside the variable — bare
      # CLICKHOUSE_HTTP_PORT / CLICKHOUSE_NATIVE_PORT values (.env.example)
      # must stay loopback-only.
      #
      # DOGFOOD 2026-10-05: a native host ClickHouse owns 127.0.0.1:8123 on
      # this machine, silently shadowing the compose publish (same landmine
      # class as host postgres on 5432 / host postfix on 25), so host-run
      # tests reached the HOST server's stale store. The compose server is
      # ALSO published on non-conflicting loopback ports for host tooling
      # and tests (CLICKHOUSE_TEST_URL=http://127.0.0.1:8125).
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
      - "127.0.0.1:8125:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apexmail_data
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    read_only: false
    security_opt: []
    tmpfs: []
    profiles:
      - full-stack

  # ── Dogfood/dev parity (SEND/TRACKING dogfood 2026-10-04) ────────────────
  # The dev docs (docs/getting-started/first-smtp-email.md) document port 587
  # STARTTLS submission as REQUIRED, and the compose worker block documents
  # "EMAIL_TRANSPORT_TYPE=smtp (dev: mailpit)" as the local transport. The
  # base compose ships neither TLS material for the MTA nor the smtp/tracking
  # worker env, so 587 advertised STARTTLS and then failed every handshake
  # (454), and all worker mail dead-ended in the unconfigured SES shared pool.
  # These overrides enable the documented dev flow: real STARTTLS on the edge
  # (self-signed dev cert under secrets/dev-mta-tls/, gitignored) and
  # worker delivery through Mailpit with per-domain DKIM signing plus
  # open/click/unsubscribe tracking pointed at the local tracking service.
  mta:
    environment:
      TLS_ENABLED: "true"
      TLS_CERT_PATH: /run/tls/cert.pem
      TLS_KEY_PATH: /run/tls/key.pem
      # Dev transport is SMTP (mailpit sink), matching the worker override
      # below. Without it the MTA's sender-readiness predicate treats the
      # unset EMAIL_TRANSPORT_TYPE as SES and demands ses_verified on every
      # sending domain — submission rejected every tenant message with
      # "sender domain is not verified and ready for delivery".
      EMAIL_TRANSPORT_TYPE: "smtp"
      # Shared dev token for the mailstore gRPC hop (inbound mailbox
      # delivery). Mailstore only exists in the prod overlay otherwise.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me-01}
    volumes:
      - ./secrets/dev-mta-tls/cert.pem:/run/tls/cert.pem:ro
      - ./secrets/dev-mta-tls/key.pem:/run/tls/key.pem:ro
    ports:
      # A native host Postfix ("MacBook-Pro.local ESMTP Postfix") already
      # binds 127.0.0.1:25/465/587 on this machine, so the base compose
      # publications silently lose the bind race and host-side SMTP tests
      # hit the WRONG server. Publish the same listeners on non-conflicting
      # loopback ports for host-side dogfooding.
      - "127.0.0.1:5525:25"
      - "127.0.0.1:5587:587"
      - "127.0.0.1:5465:465"

  # ── Dogfood/dev parity (MAIL-PLANE dogfood 2026-10-04) ───────────────────
  # The base compose points mta + imap-server at MAILSTORE_GRPC_ADDR
  # (http://mailstore:50051 "inbound mailbox delivery"), but the mailstore
  # service was only defined in docker-compose.prod.yml — in dev the mailbox
  # pipeline had nowhere to land and the imap-server had no TLS material, so
  # IMAPS (993, README/ARCHITECTURE.md) never listened and the container sat
  # permanently unhealthy. These overrides give the dev stack the same wiring
  # the prod overlay ships: a local mailstore (loopback-equivalent internal
  # bind + shared dev token), the token on both mail clients, and the dev
  # TLS cert mounted for IMAPS. The token is a dev-only literal; production
  # keeps the Docker-secret form (INTERNAL_SERVICE_TOKEN_FILE).
  mailstore:
    build:
      context: .
      dockerfile: services/mail-server/Dockerfile
      target: mailstore
    container_name: apexmail-mailstore-1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "mailstore"]
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      MAILSTORE_BIND_ADDR: 0.0.0.0:50051
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me-01}
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/50051' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - apexmail_data_internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  imap-server:
    environment:
      # Same dev cert the MTA serves on 465/STARTTLS (self-signed, gitignored).
      INBOUND_CERT_PATH: /run/tls/cert.pem
      INBOUND_KEY_PATH: /run/tls/key.pem
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-me-01}
    volumes:
      - ./secrets/dev-mta-tls/cert.pem:/run/tls/cert.pem:ro
      - ./secrets/dev-mta-tls/key.pem:/run/tls/key.pem:ro
    ports:
      # Host 993 is free on dev machines (25/465/587 are shadowed instead).
      - "127.0.0.1:993:993"

  worker:
    environment:
      RUST_LOG: ${WORKER_RUST_LOG:-info}
      EMAIL_TRANSPORT_TYPE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      DKIM_ENABLED: "true"
      DKIM_PRIVATE_KEY_ENCRYPTION_KEY: ${DKIM_PRIVATE_KEY_ENCRYPTION_KEY:?DKIM key required}
      TRACKING_ENABLED: "true"
      TRACKING_SECRET_KEY: ${TRACKING_SECRET_KEY:-dev-tracking-secret-key-minimum-32-chars-long}
      TRACKING_PUBLIC_HOST: http://127.0.0.1:3001
      # Dev webhook testing (dogfood): admit the loopback listener the same
      # way the api-server's APEXMAIL_ALLOW_LOCALHOST_WEBHOOKS does, and let
      # the at-rest secret key match the api-server's so webhook signing
      # secrets decrypt consistently.
      WEBHOOK_ALLOW_PRIVATE_TARGETS: "true"
      ALLOW_WEBHOOK_HTTP: "true"
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY:?at-rest key required}

networks:
  apexmail_data:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
