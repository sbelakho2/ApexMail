# =============================================================================
# Docker Compose Override — Local Development
# =============================================================================
# The main docker-compose.yml uses read_only + apparmor which prevents
# containers from starting in typical dev environments.
# This override provides standalone dev-friendly service definitions.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: apexmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass123}
      POSTGRES_DB: ${POSTGRES_DB:-apexmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexmail -d apexmail"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apexmail_data
    security_opt: !override []

  redis:
    image: redis:7-alpine
    container_name: apexmail-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis123}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apexmail_data
    security_opt: !override []
