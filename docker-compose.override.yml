# =============================================================================
# Docker Compose Override — Local Development
# =============================================================================
# The main docker-compose.yml uses read_only + apparmor which prevents
# containers from starting in typical dev environments.
# This override provides standalone dev-friendly service definitions.
# By default it starts only Postgres and Redis; opt into application services
# with --profile full-stack, --profile monitoring, or --profile dev.
# =============================================================================

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: apexmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-apexmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexmail} -d ${POSTGRES_DB:-apexmail}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apexmail_data
    secrets:
      - postgres_password

  redis:
    image: redis:7.4-alpine
    container_name: apexmail-redis
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_MAXMEMORY: "256mb"
      REDIS_MAXMEMORY_POLICY: "noeviction"
    volumes:
      - redis_data:/data
      - ./deploy/redis/entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=\"$(cat /run/secrets/redis_password 2>/dev/null || echo '')\"; redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apexmail_data
    secrets:
      - redis_password

  tracking:
    profiles:
      - full-stack

  enterprise:
    profiles:
      - full-stack

  pdf-renderer:
    profiles:
      - full-stack

  clickhouse:
    profiles:
      - full-stack

networks:
  apexmail_data:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
