# =============================================================================
# ApexMail Docker Compose - Production Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides development defaults with production-ready settings:
# - No host port exposure for databases
# - Stricter resource limits
# - Required secrets validation
# - Replicas for stateless services
# =============================================================================

services:
  # ===========================================================================
  # REVERSE PROXY (TLS termination)
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    user: "101:101"
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    depends_on:
      tracking:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - apexmail_frontend
      - apexmail_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - certbot_webroot:/var/www/certbot
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/etc/letsencrypt:rw
    entrypoint: >
      sh -c "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - apexmail_frontend

  postgres:
    # Production: Do NOT expose database port to host
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    # Production: Do NOT expose Redis port to host
    ports: []
    command: >
      sh -c "redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --requirepass \"$REDIS_PASSWORD\""
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tracking:
    environment:
      RUST_LOG: info
    ports: []
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-apexmail}
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      BACKUP_DIR: /backups
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - postgres_backups:/backups
    networks:
      - apexmail_data

  clickhouse:
    ports: []
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-apexmail}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apexmail}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required in production}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G

volumes:
  certbot_webroot:
  postgres_backups:
