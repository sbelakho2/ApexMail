# =============================================================================
# ApexMail Docker Compose - Production Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides development defaults with production-ready settings:
# - No host port exposure for databases
# - Stricter resource limits
# - Required secrets validation
# - Replicas for stateless services
#
# Audit O — shared log rotation anchor: attach `logging: *default-logging` to
# every service defined in this overlay so no container can grow an
# unbounded json-file log on the host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ===========================================================================
  # MARKETING SITE (Zola static site, served by nginx-alpine on 8080)
  # ===========================================================================
  marketing:
    # Canonical image name + tag published by .github/workflows/deploy.yml.
    # The namespace (ghcr.io/sbelakho2/apexmail) must match the CI publisher's
    # `github.repository`-derived registry path. See deploy/DEPLOYMENT.md.
    image: ghcr.io/sbelakho2/apexmail/marketing:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=0777
      - /var/run:mode=0777
    security_opt:
      - no-new-privileges:true
    networks:
      - apexmail_frontend
    healthcheck:
      # Use wget instead of curl — the nginx-alpine base image ships wget, not curl
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M

  # ===========================================================================
  # REVERSE PROXY (TLS termination)
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    user: "101:101"
    environment:
      NGINX_RESOLVER: 127.0.0.11
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/log/nginx:mode=0777
      - /var/cache/nginx:mode=0777
      - /var/run:mode=0777
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    depends_on:
      api-server:
        condition: service_healthy
      enterprise:
        condition: service_healthy
      tracking:
        condition: service_healthy
      marketing:
        condition: service_healthy
      sales-autopilot:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - apexmail_frontend
      - apexmail_backend
    healthcheck:
      # 127.0.0.1:8080 is the internal health server block in nginx.conf —
      # "localhost" resolves to ::1 inside the container where nothing listens.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    # Must run as root: certbot writes /var/log/letsencrypt and chowns
    # /etc/letsencrypt/{accounts,archive,live,renewal}.
    user: "0:0"
    volumes:
      - certbot_webroot:/var/www/certbot
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/etc/letsencrypt:rw
      - ./deploy/scripts/certbot-renew-loop.sh:/usr/local/bin/certbot-renew-loop.sh:ro
      # Audit D — the renewal loop reloads nginx and restarts mta/imap-server
      # after a successful renewal; without the docker socket mounted that
      # logic could never run and renewed certs sat unused until the next
      # deploy. Read-only socket: the container can talk to the engine but
      # cannot modify it. (The script still degrades to a WARN + reload-flag
      # when the socket is unavailable.)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-renew-loop.sh"]
    networks:
      - apexmail_frontend
    logging: *default-logging

  observability:
    image: ghcr.io/sbelakho2/apexmail/observability:latest
    environment:
      NODE_ENV: production
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      # Redis is only reachable on the internal networks; credentials come
      # from the shared Redis secret so eviction monitoring actually works.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - internal_service_token
      - redis_password

  postgres:
    # Production: Do NOT expose database port to host
    ports: !override []  # force-clear dev compose ports (empty list is ignored by merge)
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    # Production: Do NOT expose Redis port to host
    ports: !override []  # force-clear dev compose ports (empty list is ignored by merge)
    # SECURITY: Password from Docker secret, not environment variable
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_MAXMEMORY: "1gb"
      REDIS_MAXMEMORY_POLICY: "volatile-lru"
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tracking:
    image: ghcr.io/sbelakho2/apexmail/tracking-service:latest
    # Use entrypoint wrapper to bridge _FILE env vars to native env vars
    # Full path required — "tracking-service" alone is not in PATH
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "/usr/local/bin/tracking-service"]
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
    environment:
      RUST_LOG: info
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TRACKING_SECRET_KEY_FILE: /run/secrets/tracking_secret_key
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      JWT_PUBLIC_KEY_PEM_FILE: /run/secrets/jwt_public_key_pem
      # ClickHouse OLAP event ingestion
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-apexmail}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apexmail}
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_INSERT_TIMEOUT_SECONDS: ${CLICKHOUSE_INSERT_TIMEOUT_SECONDS:-30}
    secrets:
      - postgres_password
      - clickhouse_password
      - redis_password
      - tracking_secret_key
      - internal_service_token
      - jwt_public_key_pem
    ports: !override []  # force-clear dev compose ports (empty list is ignored by merge)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3001' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  api-server:
    image: ghcr.io/sbelakho2/apexmail/api-server:latest
    restart: unless-stopped
    # Use entrypoint wrapper to bridge _FILE env vars to native env vars
    # "api-server" is passed explicitly so the wrapper doesn't consume CMD args (--listen) as binary name
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "api-server"]
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
    environment:
      RUST_LOG: info
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 3000
      BASE_URL: ${BASE_URL:?BASE_URL is required in production}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:?OAUTH_REDIRECT_BASE_URL is required in production}
      # Audit B — the dev default (`dev-api-key-change-me` in the base file)
      # must NEVER reach production: fail the deployment instead.
      APEXMAIL_API_KEY: ${APEXMAIL_API_KEY:?APEXMAIL_API_KEY must be set in production}
      # Docker bridge subnets (frontend/backend/data). nginx is the TLS
      # terminator and its X-Forwarded-For must be trusted so per-client
      # rate limiting keys on the real client IP instead of the nginx
      # container IP (which would make every user share one global bucket).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16,172.20.0.0/16,172.21.0.0/16}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      API_KEY_HASH_SECRET_FILE: /run/secrets/api_key_hash_secret
      WEBHOOK_SIGNING_SECRET_FILE: /run/secrets/webhook_signing_secret
      TRACKING_SECRET_KEY_FILE: /run/secrets/tracking_secret_key
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      JWT_PRIVATE_KEY_PEM_FILE: /run/secrets/jwt_private_key_pem
      JWT_PUBLIC_KEY_PEM_FILE: /run/secrets/jwt_public_key_pem
      SESSION_SECRET_FILE: /run/secrets/session_secret
      IMPERSONATION_SECRET_FILE: /run/secrets/impersonation_secret
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      DKIM_PRIVATE_KEY_ENCRYPTION_KEY_FILE: /run/secrets/dkim_private_key_encryption_key
      # Set true once to generate encrypted platform-sender DKIM material.
      # It remains pending until the exact returned DNS records are verified.
      SYSTEM_SENDER_BOOTSTRAP_ON_STARTUP: ${SYSTEM_SENDER_BOOTSTRAP_ON_STARTUP:-false}
      # API identity provisioning and the worker must use this exact region
      # and configuration set when SES transport is selected.
      EMAIL_TRANSPORT_TYPE: ${EMAIL_TRANSPORT_TYPE:-ses}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      # Audit G — AWS credentials via Docker secrets (bridged to env by the
      # entrypoint wrapper) instead of plain environment values that leak
      # through `docker inspect` / ps output.
      AWS_ACCESS_KEY_ID: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      PLACEMENT_ENCRYPTION_SECRET: ${PLACEMENT_ENCRYPTION_SECRET:?PLACEMENT_ENCRYPTION_SECRET is required in production}
      BILLING_COMPANY_IBAN: ${BILLING_COMPANY_IBAN:?BILLING_COMPANY_IBAN is required in production}
      BILLING_COMPANY_PHONE: ${BILLING_COMPANY_PHONE:?BILLING_COMPANY_PHONE is required in production}
      # ── KiwiCaptcha (native Rust login CAPTCHA protection) ────────────────
      # The proof-of-work algorithm is explicit (sha256 | argon2id). SHA-256 is
      # the default and needs no further config; Argon2id mode requires
      # KIWI_ALGORITHM=argon2id plus valid memory params (m_kib >= 8 * p).
      KIWI_ENABLED: "${KIWI_ENABLED:-true}"
      KIWI_SECRET_KEY_FILE: /run/secrets/kiwi_secret_key
      KIWI_ALGORITHM: "${KIWI_ALGORITHM:-sha256}"
      KIWI_ARGON_M_KIB: "${KIWI_ARGON_M_KIB:-0}"
      KIWI_ARGON_T: "${KIWI_ARGON_T:-1}"
      KIWI_ARGON_P: "${KIWI_ARGON_P:-1}"
      KIWI_DIFFICULTY_BITS: "${KIWI_DIFFICULTY_BITS:-20}"
      KIWI_ARGON2_DIFFICULTY_BITS: "${KIWI_ARGON2_DIFFICULTY_BITS:-8}"
      KIWI_CHALLENGE_TTL_SECS: "${KIWI_CHALLENGE_TTL_SECS:-120}"
      METRICS_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !override []  # force-clear dev compose ports (empty list is ignored by merge)
    networks:
      - apexmail_backend
      - apexmail_data_internal
    healthcheck:
      # Use /dev/tcp bash built-in instead of nc — distroless/minimal images may not ship netcat
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
    secrets:
      - postgres_password
      - redis_password
      - api_key_hash_secret
      - webhook_signing_secret
      - tracking_secret_key
      - internal_service_token
      - jwt_private_key_pem
      - jwt_public_key_pem
      - session_secret
      - impersonation_secret
      - csrf_secret
      - dkim_private_key_encryption_key
      - kiwi_secret_key
      - aws_access_key_id
      - aws_secret_access_key

  # ===========================================================================
  # SALES AUTOPILOT (internal sales engine: CRM, campaigns, inbox, scheduler)
  # ===========================================================================
  # Internal-only: no host ports. The control plane calls it server-side over
  # apexmail_backend (sales-autopilot:3010). The single public surface is the
  # CAN-SPAM unsubscribe endpoint, routed by nginx at
  # https://api.apexmail.ee/sales-api/u/ — SALES_PUBLIC_BASE_URL must match
  # that exact prefix so the links embedded in campaign mail resolve.
  sales-autopilot:
    image: ghcr.io/sbelakho2/apexmail/sales-autopilot:latest
    restart: unless-stopped
    # Chain: load-secret-env.sh bridges the sales-specific Docker secret to
    # env, then the shared entrypoint wrapper bridges DB/Redis/internal-token
    # secrets and assembles DATABASE_URL / REDIS_URL from the parts.
    entrypoint:
      - /bin/sh
      - /usr/local/bin/load-secret-env.sh
      - SALES_UNSUBSCRIBE_SECRET
      - SALES_UNSUBSCRIBE_SECRET_FILE
      - --
      - /bin/sh
      - /opt/apexmail/entrypoint-wrapper.sh
      - sales-autopilot
    command: []
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
      - ./deploy/load-secret-env.sh:/usr/local/bin/load-secret-env.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: info
      # ── Database / Redis (URLs assembled by the entrypoint wrapper) ───────
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # ── Auth: shared internal service token via Docker secret ────────────
      INTERNAL_SERVICE_TOKEN: ""
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      # ── HTTP bind — MUST stay 3010: it is the nginx upstream and the
      #    healthcheck target. ──────────────────────────────────────────────
      SALES_PORT: "3010"
      # ── Campaign dispatch (production dispatcher; required in prod) ───────
      SALES_CAMPAIGN_FROM_EMAIL: ${SALES_CAMPAIGN_FROM_EMAIL:?SALES_CAMPAIGN_FROM_EMAIL is required in production}
      SALES_CAMPAIGN_FROM_NAME: ${SALES_CAMPAIGN_FROM_NAME:-ApexMail}
      SALES_UNSUBSCRIBE_SECRET: ""
      SALES_UNSUBSCRIBE_SECRET_FILE: /run/secrets/sales_unsubscribe_secret
      SALES_PUBLIC_BASE_URL: ${SALES_PUBLIC_BASE_URL:-https://api.apexmail.ee/sales-api}
      SALES_UNSUBSCRIBE_REDIRECT_URL: ${SALES_UNSUBSCRIBE_REDIRECT_URL:-}
      SALES_ALLOWED_TENANTS: ${SALES_ALLOWED_TENANTS:-}
      SALES_DISPATCH_INTERVAL_SECS: ${SALES_DISPATCH_INTERVAL_SECS:-30}
      SALES_DISPATCH_BATCH_SIZE: ${SALES_DISPATCH_BATCH_SIZE:-100}
      SALES_DISPATCH_CONCURRENCY: ${SALES_DISPATCH_CONCURRENCY:-4}
      SALES_ENRICHMENT_API_URL: ${SALES_ENRICHMENT_API_URL:-https://enrich.apexmail.ee}
      ENRICHMENT_API_KEY: ${ENRICHMENT_API_KEY:-}
    secrets:
      - postgres_password
      - redis_password
      - internal_service_token
      - sales_unsubscribe_secret
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3010' 2>/dev/null || nc -z 127.0.0.1 3010"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      # Backend keeps enrichment egress; data_internal reaches postgres/redis.
      - apexmail_backend
      - apexmail_data_internal
    logging: *default-logging
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # ===========================================================================
  # STATUS SERVER (public status page + status API)
  # ===========================================================================
  # Runs the auth-server binary's /status, /status/api and /status/history
  # routes (the canonical status provider per fixes.md). Exposed only on the
  # internal networks; nginx serves it as status.apexmail.ee and maps
  # apexmail.ee/api/status-data -> /status/api.
  status-server:
    image: ghcr.io/sbelakho2/apexmail/status-server:latest
    restart: unless-stopped
    # Build DATABASE_URL from the mounted secret rather than interpolating a
    # database password into Compose configuration or container metadata.
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "auth-server"]
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apexmail_backend
      - apexmail_data_internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # ===========================================================================
  # MTA (Mail Transfer Agent)
  # ===========================================================================
  mta:
    # Canonical image name is `mta` (matches the CI build target and the
    # docker-compose.yml dev service key). The binary inside the image is still
    # named `mta-server`; the image/tag name is the single source of truth.
    image: ghcr.io/sbelakho2/apexmail/mta:latest
    restart: unless-stopped
    # Read Docker secret files before starting the binary. This keeps the
    # mailstore bearer token out of the container environment declaration.
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "mta-server"]
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      # Bounce (VERP/DSN) and FBL (abuse/complaint) SMTP endpoints. These are
      # intentionally open to the internet: the bounce server only accepts
      # VERP/mailer-daemon recipients with a null sender, and the FBL server
      # requires forward-confirmed rDNS matching a known ISP FBL hostname.
      - "2525:2525"
      - "2526:2526"
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
      # Bind-mount the FULL certbot tree managed by the certbot service
      # (TLS_CERT_DIR — same tree nginx reads), not just live/<domain>/,
      # because live/*.pem are symlinks into ../archive/. Mounting only
      # live/<domain>/ would leave dangling symlinks inside the container.
      # The MTA reads fullchain/privkey via TLS_CERT_PATH / TLS_KEY_PATH below.
      # NOTE: certs are loaded once at startup — restart this container after
      # a renewal to pick up the refreshed cert (see deploy/DEPLOYMENT.md).
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/opt/apexmail/certs:ro
    environment:
      RUST_LOG: info
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      METRICS_ENABLED: "true"
      METRICS_PORT: "9090"
      HOSTNAME: ${MAIL_SERVER_HOSTNAME:-mail.apexmail.ee}
      LOCAL_DOMAINS: ${LOCAL_DOMAINS:-apexmail.ee}
      # ── TLS (certbot-managed certs bind-mounted at /opt/apexmail/certs) ─────
      TLS_ENABLED: "true"
      TLS_CERT_PATH: /opt/apexmail/certs/live/${MAIL_TLS_DOMAIN:-apexmail.ee}/fullchain.pem
      TLS_KEY_PATH: /opt/apexmail/certs/live/${MAIL_TLS_DOMAIN:-apexmail.ee}/privkey.pem
      # Blank the development URL defaults so the wrapper builds both URLs
      # from the mounted Docker secrets below.
      DATABASE_URL: ""
      REDIS_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # gRPC endpoint of the mailstore service (inbound mailbox delivery)
      MAILSTORE_GRPC_ADDR: ${MAILSTORE_GRPC_ADDR:-http://mailstore:50051}
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      # VERP bounce domain — the bounce server only accepts
      # bounces+{message_id}=...@{VERP_DOMAIN} recipients. Kept in lockstep
      # with the worker's VERP_DOMAIN so generated Return-Paths parse here.
      VERP_DOMAIN: ${VERP_DOMAIN:-bounces.apexmail.ee}
    secrets:
      - postgres_password
      - redis_password
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailstore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/25' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      # Audit J — the MTA needs postgres/redis (via apexmail_data_internal)
      # plus real egress for inbound/outbound mail, so it stays on the
      # frontend and backend networks (the old apexmail_data membership was
      # redundant with backend and offered an extra bridge into the data
      # plane).
      - apexmail_frontend
      - apexmail_backend
      - apexmail_data_internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # ===========================================================================
  # IMAP SERVER (Mail access — proxies mailbox ops to mailstore via gRPC)
  # ===========================================================================
  # Binary image built from crates/imap-server. The image name follows the same
  # ghcr.io/sbelakho2/apexmail/<crate> convention as the other production images.
  imap-server:
    image: ghcr.io/sbelakho2/apexmail/imap-server:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "imap-server"]
    ports:
      - "993:993"
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
      # Same certbot-managed bind-mount as the MTA and nginx (TLS_CERT_DIR).
      # live/*.pem are symlinks into ../archive/, so the whole tree is mounted
      # to keep the symlinks resolvable. IMAP reads the certs via
      # INBOUND_CERT_PATH / INBOUND_KEY_PATH (its actual env var names — see
      # crates/imap-server). NOTE: certs load once at startup — restart this
      # container after a renewal to pick up the refreshed cert.
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/opt/apexmail/certs:ro
    environment:
      RUST_LOG: info
      # ── gRPC endpoint of the mailstore service ────────────────────────────
      # The IMAP binary reads MAILSTORE_GRPC_ADDR via clap.
      MAILSTORE_GRPC_ADDR: ${MAILSTORE_GRPC_ADDR:-http://mailstore:50051}
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      # ── TLS (certs bind-mounted at /opt/apexmail/certs) ───────────────────
      # The IMAP binary reads INBOUND_CERT_PATH / INBOUND_KEY_PATH via clap.
      INBOUND_CERT_PATH: /opt/apexmail/certs/live/${MAIL_TLS_DOMAIN:-apexmail.ee}/fullchain.pem
      INBOUND_KEY_PATH: /opt/apexmail/certs/live/${MAIL_TLS_DOMAIN:-apexmail.ee}/privkey.pem
    secrets:
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailstore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/993' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - apexmail_frontend
      - apexmail_data_internal
    logging: *default-logging
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # ===========================================================================
  # MAILSTORE (gRPC mail storage backend for IMAP)
  # ===========================================================================
  mailstore:
    image: ghcr.io/sbelakho2/apexmail/mailstore:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "mailstore"]
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
    environment:
      RUST_LOG: info
      # Blank any inherited development URL and let the wrapper compose the
      # connection URI from DB_* plus the mounted PostgreSQL secret.
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      # Bind all interfaces inside the container; the service is only reachable
      # on the internal apexmail_data_internal network. A shared bearer token is
      # mandatory for this non-loopback bind and supplied via Docker secret.
      MAILSTORE_BIND_ADDR: 0.0.0.0:50051
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
    secrets:
      - postgres_password
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/50051' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      # Audit J — mailstore never needs egress: data-plane only.
      - apexmail_data_internal
    logging: *default-logging
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  enterprise:
    image: ghcr.io/sbelakho2/apexmail/enterprise:latest
    environment:
      RUST_LOG: info
      # Production bind: the dev overlay defaults PORT to 3002 — override it
      # here so the container matches the prod healthcheck (127.0.0.1:3008)
      # and the nginx vhost upstream (enterprise:3008).
      HOST: 0.0.0.0
      PORT: 3008
      NODE_ENV: production
      CORS_ORIGINS: ${ENTERPRISE_CORS_ORIGINS:-https://app.apexmail.ee,https://admin.apexmail.ee,https://enterprise.apexmail.ee,https://api.apexmail.ee}
      # Audit B — the enterprise service still validates its internal HS256
      # tokens with JWT_SECRET. The base file falls back to
      # `dev-enterprise-jwt-secret-change-me`, which must never reach
      # production: fail the deployment instead. (The jwt_secret Docker
      # secret stays declared for deployments that prefer mounting it.)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      JWT_PUBLIC_KEY_PEM_FILE: /run/secrets/jwt_public_key_pem
    secrets:
      - postgres_password
      - redis_password
      - jwt_public_key_pem
    ports: !override []  # force-clear dev compose ports (empty list is ignored by merge)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3008' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # ===========================================================================
  # WORKER (Background job processing)
  # ===========================================================================
  worker:
    image: ghcr.io/sbelakho2/apexmail/worker:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "worker"]
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: info
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      METRICS_PORT: "9093"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: worker
      # Keep the worker's SES region/configuration set identical to api-server
      # identity provisioning. SMTP remains an explicit deployment choice.
      EMAIL_TRANSPORT_TYPE: ${EMAIL_TRANSPORT_TYPE:-ses}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      # Audit G — AWS + SMTP credentials via Docker secrets, bridged to env
      # vars by the entrypoint wrapper (no plain-text secrets in
      # `docker inspect` output).
      AWS_ACCESS_KEY_ID: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SMTP_HOST: ${SMTP_HOST:-mta}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_USERNAME: ""
      SMTP_USERNAME_FILE: /run/secrets/smtp_username
      SMTP_PASSWORD: ""
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # Direct SMTP signs with each verified domain's encrypted database key.
      # There is deliberately no global customer-domain key fallback.
      DKIM_ENABLED: ${DKIM_ENABLED:-true}
      DKIM_PRIVATE_KEY_ENCRYPTION_KEY_FILE: /run/secrets/dkim_private_key_encryption_key
      # ── Open/click tracking (engagement accounting) ────────────────────────
      # The worker's rewrite gate is config.tracking.enabled — previously it
      # defaulted to false everywhere, so no pixel/links were ever rewritten
      # and campaign engagement accounting was dead. Enablement is env-driven
      # (TRACKING_ENABLED) and the shared secret is the SAME Docker secret the
      # tracking-service verifies tokens with (bridged by the wrapper).
      TRACKING_ENABLED: ${TRACKING_ENABLED:-true}
      TRACKING_SECRET_KEY: ""
      TRACKING_SECRET_KEY_FILE: /run/secrets/tracking_secret_key
      # ── VERP bounce routing (SMTP transport) ──────────────────────────────
      # Envelope Return-Path domain for bounces+{message_id}=... addresses.
      # MUST equal the MTA bounce server's VERP_DOMAIN so generated addresses
      # land back on the platform bounce parser.
      VERP_DOMAIN: ${VERP_DOMAIN:-bounces.apexmail.ee}
    secrets:
      - postgres_password
      - redis_password
      - internal_service_token
      - dkim_private_key_encryption_key
      - aws_access_key_id
      - aws_secret_access_key
      - smtp_username
      - smtp_password
      - tracking_secret_key
    ports: !override []  # force-clear dev compose ports (empty list is ignored by merge)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9093' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - apexmail_backend
      - apexmail_data_internal
    logging: *default-logging
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # ===========================================================================
  # BILLING SERVICE (plans, metering, invoices, Stripe webhooks)
  # ===========================================================================
  billing-service:
    image: ghcr.io/sbelakho2/apexmail/billing-service:latest
    restart: unless-stopped
    # Same wrapper pattern as api-server/worker: Docker secrets (_FILE) are
    # bridged to native env vars and DATABASE_URL / REDIS_URL are assembled
    # from the DB_* / REDIS_* parts + secrets.
    entrypoint: ["/bin/sh", "/opt/apexmail/entrypoint-wrapper.sh", "billing-service"]
    volumes:
      - ./deploy/scripts/entrypoint-wrapper.sh:/opt/apexmail/entrypoint-wrapper.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: info
      BILLING_LISTEN_ADDR: 0.0.0.0:4100
      # ── Database / Redis (URLs assembled by the entrypoint wrapper) ───────
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # ── Internal service auth ──────────────────────────────────────────────
      # Override the development default before the wrapper loads the secret.
      SERVICE_AUTH_TOKEN: ""
      SERVICE_AUTH_TOKEN_FILE: /run/secrets/internal_service_token
      # Invoice rendering also authenticates to pdf-renderer with this same
      # shared service token.
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      # ── Stripe (secrets via wrapper-managed _FILE bridging) ────────────────
      STRIPE_SECRET_KEY: ""
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      # Dedicated-IP auto-provisioning calls the api-server internal API
      # (prod api-server binds :3000 per this overlay).
      API_BASE_URL: ${BILLING_API_BASE_URL:-http://api-server:3000}
      PDF_RENDERER_URL: http://pdf-renderer:3004
    secrets:
      - postgres_password
      - redis_password
      - internal_service_token
      - stripe_secret_key
      - stripe_webhook_secret
    healthcheck:
      # netcat-openbsd ships in the runtime-base image (same probe as the
      # Dockerfile HEALTHCHECK).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4100"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Audit E — run deploy/hardening/scripts/postgres-backup-encrypt.sh
    # instead of the stock image entrypoint: AES-256-CBC + PBKDF2
    # encryption (the old `openssl enc -aes-256-gcm` invocation was
    # unsupported and silently produced unusable output), restorability
    # verification (decrypt + pg_restore --list) BEFORE deleting the
    # plaintext, a bounded backup count, and an optional offsite copy
    # (BACKUP_TARGET, rsync over ssh).
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-backup-encrypt.sh"]
    volumes:
      - ./deploy/hardening/scripts/postgres-backup-encrypt.sh:/usr/local/bin/postgres-backup-encrypt.sh:ro
      - postgres_backups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-apexmail}
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      # Count-based retention (newest N kept) on top of the day/week/month
      # pruning done by the script.
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-30}
      # Encryption key from a Docker secret (preferred over the env var).
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      # Optional offsite mirror, e.g. "backup-user@offsite::apexmail" or
      # "backup-user@offsite:/srv/apexmail-backups" (rsync over ssh; the
      # container needs the matching key mounted to /root/.ssh when set).
      BACKUP_TARGET: ${BACKUP_TARGET:-}
    networks:
      - apexmail_data_internal
    secrets:
      - postgres_password
      - backup_encryption_key
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  clickhouse:
    ports: !override []  # force-clear dev compose ports (empty list is ignored by merge)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-apexmail}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apexmail}
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
      # Audit I — separate ADMIN password (blank the dev default; the secret
      # file is bridged to the env var by the load-secret-env.sh entrypoint
      # chain and consumed by deploy/clickhouse/users.xml via from_env).
      CLICKHOUSE_ADMIN_PASSWORD: ""
      CLICKHOUSE_ADMIN_PASSWORD_FILE: /run/secrets/clickhouse_admin_password
    secrets:
      - clickhouse_password
      - clickhouse_admin_password
    networks:
      - apexmail_data_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G

volumes:
  certbot_webroot:
  postgres_backups:

# Audit J — apexmail_data_internal is a plain bridge in the base (dev) file;
# in production it has no egress path (no gateway/NAT), so the data plane
# (postgres, redis, clickhouse, mailstore, postgres-backup) can only be
# reached by containers explicitly attached to it. Services that need
# outbound connectivity (api-server/worker → SES, mta → mail, billing →
# Stripe, certbot → ACME) keep their frontend/backend memberships.
networks:
  apexmail_data_internal:
    driver: bridge
    internal: true

secrets:
  postgres_password:
    file: ${PROD_POSTGRES_PASSWORD_FILE:?PROD_POSTGRES_PASSWORD_FILE is required in production}
  redis_password:
    file: ${PROD_REDIS_PASSWORD_FILE:?PROD_REDIS_PASSWORD_FILE is required in production}
  clickhouse_password:
    file: ${PROD_CLICKHOUSE_PASSWORD_FILE:?PROD_CLICKHOUSE_PASSWORD_FILE is required in production}
  # Audit I — dedicated ClickHouse admin credential (access_management) kept
  # separate from the application password.
  clickhouse_admin_password:
    file: ${PROD_CLICKHOUSE_ADMIN_PASSWORD_FILE:?PROD_CLICKHOUSE_ADMIN_PASSWORD_FILE is required in production}
  api_key_hash_secret:
    file: ${PROD_API_KEY_HASH_SECRET_FILE:?PROD_API_KEY_HASH_SECRET_FILE is required in production}
  webhook_signing_secret:
    file: ${PROD_WEBHOOK_SIGNING_SECRET_FILE:?PROD_WEBHOOK_SIGNING_SECRET_FILE is required in production}
  tracking_secret_key:
    file: ${PROD_TRACKING_SECRET_KEY_FILE:?PROD_TRACKING_SECRET_KEY_FILE is required in production}
  internal_service_token:
    file: ${PROD_INTERNAL_SERVICE_TOKEN_FILE:?PROD_INTERNAL_SERVICE_TOKEN_FILE is required in production}
  jwt_secret:
    file: ${PROD_JWT_SECRET_FILE:?PROD_JWT_SECRET_FILE is required in production}
  jwt_private_key_pem:
    file: ${PROD_JWT_PRIVATE_KEY_FILE:?PROD_JWT_PRIVATE_KEY_FILE is required in production}
  jwt_public_key_pem:
    file: ${PROD_JWT_PUBLIC_KEY_FILE:?PROD_JWT_PUBLIC_KEY_FILE is required in production}
  session_secret:
    file: ${PROD_SESSION_SECRET_FILE:?PROD_SESSION_SECRET_FILE is required in production}
  impersonation_secret:
    file: ${PROD_IMPERSONATION_SECRET_FILE:?PROD_IMPERSONATION_SECRET_FILE is required in production}
  csrf_secret:
    file: ${PROD_CSRF_SECRET_FILE:?PROD_CSRF_SECRET_FILE is required in production}
  dkim_private_key_encryption_key:
    file: ${PROD_DKIM_PRIVATE_KEY_ENCRYPTION_KEY_FILE:?PROD_DKIM_PRIVATE_KEY_ENCRYPTION_KEY_FILE is required in production}
  kiwi_secret_key:
    file: ${PROD_KIWI_SECRET_KEY_FILE:?PROD_KIWI_SECRET_KEY_FILE is required in production}
  stripe_secret_key:
    file: ${PROD_STRIPE_SECRET_KEY_FILE:?PROD_STRIPE_SECRET_KEY_FILE is required in production}
  stripe_webhook_secret:
    file: ${PROD_STRIPE_WEBHOOK_SECRET_FILE:?PROD_STRIPE_WEBHOOK_SECRET_FILE is required in production}
  # Audit G — AWS SES credentials for api-server + worker.
  aws_access_key_id:
    file: ${PROD_AWS_ACCESS_KEY_ID_FILE:?PROD_AWS_ACCESS_KEY_ID_FILE is required in production}
  aws_secret_access_key:
    file: ${PROD_AWS_SECRET_ACCESS_KEY_FILE:?PROD_AWS_SECRET_ACCESS_KEY_FILE is required in production}
  # Audit G — direct-SMTP credentials for the worker (may be empty files
  # when the deployment runs the SES transport).
  smtp_username:
    file: ${PROD_SMTP_USERNAME_FILE:?PROD_SMTP_USERNAME_FILE is required in production}
  smtp_password:
    file: ${PROD_SMTP_PASSWORD_FILE:?PROD_SMTP_PASSWORD_FILE is required in production}
  # HMAC key signing the sales campaign unsubscribe tokens (dispatcher.rs).
  # Reuses the _FILE bridging chain; >= 32 chars.
  sales_unsubscribe_secret:
    file: ${PROD_SALES_UNSUBSCRIBE_SECRET_FILE:?PROD_SALES_UNSUBSCRIBE_SECRET_FILE is required in production}
  # Audit E — backup encryption key for postgres-backup-encrypt.sh.
  backup_encryption_key:
    file: ${PROD_BACKUP_ENCRYPTION_KEY_FILE:?PROD_BACKUP_ENCRYPTION_KEY_FILE is required in production}
