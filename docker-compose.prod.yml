# =============================================================================
# ApexMail Docker Compose - Production Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides development defaults with production-ready settings:
# - No host port exposure for databases
# - Stricter resource limits
# - Required secrets validation
# - Replicas for stateless services
# =============================================================================

services:
  # ===========================================================================
  # REVERSE PROXY (TLS termination)
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    user: "101:101"
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/nginx
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    depends_on:
      api:
        condition: service_healthy
      enterprise:
        condition: service_healthy
      tracking:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - apexmail_frontend
      - apexmail_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - certbot_webroot:/var/www/certbot
      - ${TLS_CERT_DIR:-./deploy/nginx/ssl}:/etc/letsencrypt:rw
    entrypoint: >
      sh -c "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - apexmail_frontend

  postgres:
    # Production: Do NOT expose database port to host
    ports: !override []
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    # Production: Do NOT expose Redis port to host
    ports: !override []
    # SECURITY: Password from Docker secret, not environment variable
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_MAXMEMORY: "1gb"
      REDIS_MAXMEMORY_POLICY: "allkeys-lru"
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tracking:
    environment:
      RUST_LOG: info
    ports: !override []
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  api:
    build:
      context: .
      dockerfile: services/mail-server/Dockerfile
      target: api-server
    entrypoint: ["/bin/sh", "/usr/local/bin/load-secret-env.sh", "DB_PASSWORD", "DB_PASSWORD_FILE", "REDIS_PASSWORD", "REDIS_PASSWORD_FILE", "--", "/usr/bin/tini", "--", "/usr/local/bin/api-server"]
    restart: unless-stopped
    environment:
      RUST_LOG: info
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 3000
      BASE_URL: ${BASE_URL:?BASE_URL is required in production}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:?OAUTH_REDIRECT_BASE_URL is required in production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-apexmail}
      DB_USER: ${POSTGRES_USER:-apexmail}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:?JWT_PRIVATE_KEY_PEM is required in production}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:?JWT_PUBLIC_KEY_PEM is required in production}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:?API_KEY_HASH_SECRET is required in production}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required in production}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required in production}
      IMPERSONATION_SECRET: ${IMPERSONATION_SECRET:?IMPERSONATION_SECRET is required in production}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required in production}
      TRACKING_SECRET_KEY: ${TRACKING_SECRET_KEY:?TRACKING_SECRET_KEY is required in production}
      BILLING_COMPANY_IBAN: ${BILLING_COMPANY_IBAN:?BILLING_COMPANY_IBAN is required in production}
      BILLING_COMPANY_PHONE: ${BILLING_COMPANY_PHONE:?BILLING_COMPANY_PHONE is required in production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required in production}
      METRICS_PORT: 9090
    volumes:
      - ./deploy/load-secret-env.sh:/usr/local/bin/load-secret-env.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !override []
    networks:
      - apexmail_backend
      - apexmail_data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
    secrets:
      - postgres_password
      - redis_password

  enterprise:
    environment:
      RUST_LOG: info
    ports: !override []
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/load-secret-env.sh", "POSTGRES_PASSWORD", "POSTGRES_PASSWORD_FILE"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-apexmail}
      POSTGRES_USER: ${POSTGRES_USER:-apexmail}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - postgres_backups:/backups
      - ./deploy/load-secret-env.sh:/usr/local/bin/load-secret-env.sh:ro
    networks:
      - apexmail_data
    secrets:
      - postgres_password

  clickhouse:
    ports: !override []
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-apexmail}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apexmail}
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G

volumes:
  certbot_webroot:
  postgres_backups:
