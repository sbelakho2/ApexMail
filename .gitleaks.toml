# =============================================================================
# Gitleaks Configuration for ApexMail
# =============================================================================
# This file configures Gitleaks secret scanning behaviour.
# Reference: https://github.com/gitleaks/gitleaks
#
# Audit L — the previous allowlist matched SUBSTRINGS anywhere in the path
# (`(?i)test` also allowlisted "latest", "attest", "*test-output*"…), and a
# regex allowlist whitelisted EVERY eyJ... JWT. Both are gone:
#   * paths are anchored to directory boundaries ((^|/)dir/) and limited to
#     where fixture data genuinely lives (*/tests/fixtures/, benches/,
#     migrations/, generated/). Files outside those directories — including
#     files that merely contain "test"/"sample"/"example" in their name —
#     are scanned with ALL rules (entropy included) again.
#   * the JWT regex allow is removed entirely: no test fixtures in this
#     repository contain eyJ tokens. If one is ever added deliberately,
#     allowlist that exact file path here rather than all JWTs.

title = "ApexMail Gitleaks Configuration"

# Extend the default rules with additional patterns
[extend]
useDefault = true

# Allowlist — patterns that should NOT trigger alerts
[allowlist]
description = "Global allowlist for ApexMail"

# Directory-boundary-anchored paths for deliberately fake credentials.
# `(^|/)tests/fixtures/` matches <anything>/tests/fixtures/<file> at any
# depth but never a file merely named "*test*" or "*fixture*".
paths = [
    # Rust test fixture directories (e.g. crates/mta/tests/fixtures TLS material)
    "(^|/)tests/fixtures/",
    # Benchmark corpora
    "(^|/)benches/",
    # SQL migrations may contain documented example connection strings
    "(^|/)migrations/",
    # Generated code
    "(^|/)generated(/|$)",
]

# Regex allowlist for specific false-positive patterns
regexes = [
    # Allow secrets in pull request templates (they're examples)
    "(?i)pull_request_template",
    # Allow references in markdown documentation
    "(?i)your-.+-here",
    # Allow placeholder values in config maps
    "CHANGEME",
    "changethis",
]
