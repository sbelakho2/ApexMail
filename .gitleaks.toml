# =============================================================================
# Gitleaks Configuration for ApexMail
# =============================================================================
# This file configures Gitleaks secret scanning behaviour.
# Reference: https://github.com/gitleaks/gitleaks
#
# Audit L — the previous allowlist matched SUBSTRINGS anywhere in the path
# (`(?i)test` also allowlisted "latest", "attest", "*test-output*"…), and a
# regex allowlist whitelisted EVERY eyJ... JWT. Both are gone:
#   * paths are anchored to directory boundaries ((^|/)dir/) and limited to
#     where fixture data genuinely lives (*/tests/fixtures/, benches/,
#     migrations/, generated/). Files outside those directories — including
#     files that merely contain "test"/"sample"/"example" in their name —
#     are scanned with ALL rules (entropy included) again.
#   * the JWT regex allow is removed entirely: no test fixtures in this
#     repository contain eyJ tokens. If one is ever added deliberately,
#     allowlist that exact file path here rather than all JWTs.

title = "ApexMail Gitleaks Configuration"

# Extend the default rules with additional patterns
[extend]
useDefault = true

# Allowlist — patterns that should NOT trigger alerts
[allowlist]
description = "Global allowlist for ApexMail"

# Directory-boundary-anchored paths for deliberately fake credentials.
# `(^|/)tests/fixtures/` matches <anything>/tests/fixtures/<file> at any
# depth but never a file merely named "*test*" or "*fixture*".
paths = [
    # Rust test fixture directories (e.g. crates/mta/tests/fixtures TLS material)
    "(^|/)tests/fixtures/",
    # Benchmark corpora
    "(^|/)benches/",
    # SQL migrations may contain documented example connection strings
    "(^|/)migrations/",
    # Generated code
    "(^|/)generated(/|$)",
    #
    # 2026-08-23 triage (241 findings, every hit reviewed line-by-line: all
    # are fixture values, docs examples, template placeholders, generated
    # HTML snapshots, or heuristic noise on ordinary code — no real secrets):
    #
    # SDK + KiwiCaptcha test/example suites use deterministic fake secrets
    # ('0123456789abcdef...', 'am_test_...'); also matched by the value
    # regexes below — the path entries keep historical commits clean.
    "(^|/)packages/kiwicaptcha-php/tests/",
    "(^|/)packages/kiwicaptcha/(tests|examples)/",
    "(^|/)packages/kiwicaptcha/integrations/[^/]+/tests/",
    "(^|/)packages/sdk-[^/]+/(tests?|src/index[.]test[.]ts)",
    # Generated visual-audit HTML snapshots (minified markup trips the
    # tf-password rule) and the committed ui-fixture baselines.
    "(^|/)reports/(visual-parity|dark-mode-audit)/",
    "(^|/)crates/ui-foundation/baselines/",
    # 2026-09-10 triage: tracking-service's OWN #[cfg(test)] module carries a
    # synthetic unsubscribe-token fixture (F39 tests — base64url-shaped
    # string that never was a credential; defused at HEAD and this entry
    # keeps the historical commit that introduced it clean).
    '^services/mail-server/crates/tracking-service/src/templates\.rs$',
    # Example/template files carry placeholders by design; deployment docs
    # show placeholder PEM bodies.
    "(^|/)[.]env[^/]*[.]example$",
    "(^|/)secrets[.]template[.]yaml$",
    "(^|/)docs/deployment/(configuration|PRODUCTION_SETUP|automated-setup-guide)[.]md$",
    # TS test suites (billing app, ai app) + historical ai training scripts.
    "(^|/)__tests__/",
    "(^|/)apps/ai/(training|src)/",
    # Root legacy landing page (generated snapshot markup).
    "^index[.]html$",
    #
    # 2026-09-05 narrowing (audit §2: the old VALUE regexes "CHANGEME",
    # "changethis" and "0123456789abcdef" suppressed ANY secret containing
    # those substrings in ANY file): the deterministic hex fixture
    # '0123456789abcdef…' is now allowlisted by exact reviewed location
    # instead — every file below was re-triaged as in-source test vectors /
    # example constants (none is a credential). A real secret containing the
    # substring anywhere ELSE is caught again.
    "(^|/)crates/ai-service/src/bandits[.]rs$",
    "(^|/)crates/apexmail-lib/src/id[.]rs$",
    "(^|/)crates/api-server/src/routes/(auth|events)[.]rs$",
    "(^|/)crates/compliance/tests/gdpr_compliance_db_tests[.]rs$",
    "(^|/)crates/ddos-protection/src/decision[.]rs$",
    "(^|/)crates/enterprise/src/field_encryption[.]rs$",
    "(^|/)crates/mailstore-core/src/(encryption|main|storage)[.]rs$",
    "(^|/)crates/sales-autopilot/src/dispatcher[.]rs$",
    # KiwiCaptcha canonical example vectors live in the package source and
    # perf tooling (deterministic fake secrets by design).
    "(^|/)packages/kiwicaptcha/src/",
    "(^|/)packages/kiwicaptcha/tools/",
    "(^|/)packages/kiwicaptcha-php/src/ExecutionChallengeGenerator[.]php$",
    "(^|/)packages/kiwicaptcha/integrations/symfony/src/Risk/ClientContextTag[.]php$",
    "(^|/)tests/browser/router[.]php$",
    # Vendored artifacts (tracked binaries / node_modules — see audit §4;
    # moving them out of git is the real fix): the compiled tailwind CLI
    # and the vendored playwright tree contain binary hash-like strings.
    "^apps/marketing-zola/tailwindcss$",
    "(^|/)tools/contrast-audit/node_modules/",
    #
    # Per-file heuristic-noise triage (2026-08-23, all 66 remaining findings
    # reviewed line-by-line — every hit is the generic-api-key/tf-password
    # heuristic firing on ordinary code: env-var NAME literals, `key:` struct
    # fields, the DLP detector's own token-prefix tables, docs example
    # blocks, and SQL/test scaffolding; none is a credential):
    #   api-server config/app/resilience/simulation/billing/sso/auth — env-var
    #     names, router nesting, framework-requirement keys, test fixtures
    "(^|/)crates/api-server/src/(config|app|resilience|simulation)[.]rs$",
    "(^|/)crates/api-server/src/routes/(billing|sso)[.]rs$",
    "(^|/)crates/api-server/src/middleware/auth[.]rs$",
    #   dlp-engine entropy/engine/attachment — the scanner's own detection
    #     tables ("sk_live_", "glpat-", "AKIA…" prefix lists) and their tests
    "(^|/)crates/dlp-engine/(src/(entropy|engine|attachment)[.]rs|tests/adversarial_dlp[.]rs)$",
    #   integration/fuzz/sales test scaffolding — bounded-id helpers, hash
    #     test vectors, HTML bind fragments
    "(^|/)crates/integration-tests/tests/(schema_contract_tests|core_security_tests)[.]rs$",
    "(^|/)crates/fuzz-tests/tests/fuzz_security[.]rs$",
    "(^|/)crates/sales-autopilot/tests/common/mod[.]rs$",
    #   compliance framework tables — requirement `key:` literals
    "(^|/)crates/compliance/src/framework_enforcement[.]rs$",
    #   worker/ha config — selector/env literals
    "(^|/)crates/worker-processors/src/simulation[.]rs$",
    "(^|/)crates/ha/src/config[.]rs$",
    #   docs — example API keys/tokens by design
    "(^|/)docs/api/authentication[.]md$",
    "(^|/)docs/support-playbooks/ip-allowlist-security-controls[.]md$",
    "(^|/)apps/marketing-zola/content/docs/api/index[.]md$",
    #
    # 2026-08-23 curl-auth-header triage (97 hits, every one reviewed: the
    # rule fires on DOCUMENTED curl examples — `-H "Authorization: Bearer
    # <your-key>"` placeholders in docs, README quickstarts, and the
    # marketing/sales-autopilot example consoles; none is a credential):
    "^README[.]md$",
    "(^|/)docs/enterprise/(compliance|support|sub-accounts|qbr|whitelabel|template-approval|private-cloud|sso|log-streaming)[.]md$",
    "(^|/)docs/user-guide/(getting-started|troubleshooting)[.]md$",
    "(^|/)docs/(quickstart|deployment/quickstart|api/streaming)[.]md$",
    "(^|/)apps/marketing/src/components/(api-console/InteractiveConsole|home/LiveAPIConsole)[.]tsx$",
    "(^|/)apps/sales-autopilot/src/campaigns/(error-encyclopedia|activation-path)[.]ts$",
    "(^|/)apps/marketing-zola/public/docs/api/index[.]html$",
]

# NOTE on breadth: the entries above are directory-anchored for suites whose
# entire purpose is fake fixtures, plus generated-output trees. They do NOT
# cover ordinary source files — in-source test constants are allowlisted by
# exact reviewed FILE PATH (see the 2026-09-05 narrowing block above) so a
# real secret pasted into any other src file still fires.
regexes = [
    # Allow secrets in pull request templates (they're examples)
    "(?i)pull_request_template",
    # Allow references in markdown documentation
    "(?i)your-.+-here",
    # 2026-09-05 narrowing (audit §2): the old bare "CHANGEME"/"changethis"
    # value suppressors allowed ANY secret containing those substrings. The
    # replacement only matches COMPOSE DEFAULT INTERPOLATION syntax
    # (${VAR:-changeme}) — the placeholder shape used in the compose files —
    # which a real secret value never has. Bare CHANGEME/changethis strings
    # anywhere else are scanned normally again.
    "\\$\\{[A-Z_][A-Z0-9_]*:-(changeme|changethis)\\}",
    #
    # 2026-08-23 triage: deterministic fixture values used by in-source
    # test modules and docs examples (reviewed — none is a real credential).
    # NOTE: "0123456789abcdef" was REMOVED from this list on 2026-09-05 and
    # replaced by exact reviewed paths above (audit §2: the substring form
    # suppressed genuine hex secrets anywhere in the tree).
    "am_test_[0-9a-z]+",
    "am_live_test_[0-9a-z]+",
    "am_live_x1y2z3abc",
    "am_live_legacy123",
    "am_live_abc123def456",
    "cp-secret-key-12345",
    "tok_abc123def456",
    "integration-test-signing-key-0123456789",
    "unique-key-12345",
    "unique-idempotency-key-12345",
    "0x12345678ABCDEF01",
    "Password1!abc",
    # Truncated example JWTs in API docs.
    "eyJhbGciOiJIUzI1NiIs[.][.][.]",
]

# README.md path note (2026-09-05): the "^README[.]md$" path allowlist in the
# paths list above CANNOT be narrowed to specific documented sections —
# gitleaks allowlist paths are regexes matched against the FILE PATH only;
# there is no line-range or section-anchor primitive in the config format.
# The README's quickstart curl examples (Bearer <your-key> placeholders) span
# multiple sections, so the whole file stays allowlisted. Narrowing further
# would require editing the README content itself (docs owner), not this
# config.
